U-20:
  title: /etc/(x)inetd.conf 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/(x)inetd.conf 파일의 소유자가 root이고, 권한이 600 이하인 경우 양호
  cis: ''
  check: root, 600 이하. 둘 다 없으면 해당없음
  purpose: (x)inetd 설정 파일을 관리자만 제어하게 해 임의 변조를 막는다.
  threat: 소유자 외 쓰기가 가능하면 일반 사용자가 등록된 서비스를 변조하거나 악성 서비스를 등록할 수 있다.
