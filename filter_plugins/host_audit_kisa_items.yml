U-23:
  title: SUID, SGID, Sticky bit 설정 파일 점검
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 주요 실행 파일의 권한에 SUID와 SGID에 대한 설정이 부여되어 있지 않은 경우 양호
  cis: 7.1.13
  check: 점검불가(수동) — SUID/SGID 파일 목록(최대 40개)을 증적으로. 없으면 양호. 같은 증적 줄에 file capability 목록이 덧붙으며 판정은 바꾸지 않는다
  purpose: 불필요하거나 악의적인 파일의 SUID, SGID, Sticky bit 설정을 찾아 제거한다.
  threat: 부적절한 특수 권한이 붙은 파일을 이용해 root 권한을 획득하는 권한 상승이 가능하다.
  guide_page: 50
  remediation:
    summary: 로컬 디스크 마운트 지점마다(/, /home 등) find <마운트> -xdev -type f \( -perm -04000 -o -perm -02000 \) 로 SUID/SGID 파일을 찾아 불필요한 것은 chmod -s 로 권한을 빼거나 파일을 제거한다. 꼭 필요한 파일은 chgrp 로 특정 그룹을 지정하고 chmod 4750 으로 해당 그룹만 쓰게 제한한다.
  remediation_impact:
    level: 2
    reason: 특수 권한을 제거하면 OS와 응용프로그램이 정상 동작하는지 확인이 필요하다고 가이드가 서술한다.
  remediation_effort:
    level: 3
    reason: 찾은 파일 목록마다 필요 여부를 사람이 판단해 하나씩 처리해야 한다.
U-24:
