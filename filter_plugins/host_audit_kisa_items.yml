# KISA-2026 Unix 서버 취약점 점검 항목(U-01~U-67) 카탈로그 (ADR-0009, Spec #488).
# 항목 목록의 유일한 원본이다. filter_plugins/host_audit_kisa.py가 import 시 읽기만 한다.
# title/severity/criteria는 2026판 가이드의 항목 설명을 따르고, cis는 CIS Red Hat Enterprise Linux 9
# Benchmark v2.0.0 규칙 번호(참조 열)이다.
U-01:
  title: root 계정 원격 접속 제한
  severity: 상
  category: 계정 관리
  criteria: 원격터미널 서비스를 사용하지 않거나, 사용 시 root 직접 접속을 차단한 경우 양호
  cis: 5.1.20
U-02:
  title: 비밀번호 관리정책 설정
  severity: 상
  category: 계정 관리
  criteria: 비밀번호 관리 정책(복잡성·최소 길이·최대/최소 사용기간)이 설정된 경우 양호
  cis: 5.3.3.2.2, 5.3.3.2.3, 5.4.1.1, 5.4.1.2
U-03:
  title: 계정 잠금 임계값 설정
  severity: 상
  category: 계정 관리
  criteria: 계정 잠금 임계값이 10회 이하로 설정된 경우 양호
  cis: 5.3.3.1.1
U-04:
  title: 비밀번호 파일 보호
  severity: 상
  category: 계정 관리
  criteria: 쉐도우 비밀번호를 사용하거나 비밀번호를 암호화하여 저장하는 경우 양호
  cis: 7.2.1
U-05:
  title: root 이외의 UID가 '0' 금지
  severity: 상
  category: 계정 관리
  criteria: root 계정과 동일한 UID를 갖는 계정이 존재하지 않는 경우 양호
  cis: 5.4.2.1
U-06:
  title: 사용자 계정 su 기능 제한
  severity: 상
  category: 계정 관리
  criteria: su 명령어를 특정 그룹에 속한 사용자만 사용하도록 제한된 경우 양호
  cis: 5.2.7
U-07:
  title: 불필요한 계정 제거
  severity: 하
  category: 계정 관리
  criteria: 불필요한 계정이 존재하지 않는 경우 양호 (로그인 가능 계정 목록으로 수동 판정)
  cis: ''
U-08:
  title: 관리자 그룹에 최소한의 계정 포함
  severity: 중
  category: 계정 관리
  criteria: 관리자 그룹(root, GID 0)에 불필요한 계정이 없는 경우 양호 (구성원 목록으로 수동 판정)
  cis: 5.4.2.2, 5.4.2.3
U-09:
  title: 계정이 존재하지 않는 GID 금지
  severity: 하
  category: 계정 관리
  criteria: 계정의 기본 GID가 모두 /etc/group에 존재하는 경우 양호
  cis: 7.2.3
U-10:
  title: 동일한 UID 금지
  severity: 중
  category: 계정 관리
  criteria: 동일한 UID로 설정된 사용자 계정이 존재하지 않는 경우 양호
  cis: 7.2.4
U-11:
  title: 사용자 shell 점검
  severity: 하
  category: 계정 관리
  criteria: 로그인이 불필요한 계정에 /bin/false(/sbin/nologin) 쉘이 부여된 경우 양호
  cis: 5.4.2.7
U-12:
  title: 세션 종료 시간 설정
  severity: 하
  category: 계정 관리
  criteria: Session Timeout이 600초(10분) 이하로 설정된 경우 양호
  cis: 5.4.3.2
U-13:
  title: 안전한 비밀번호 암호화 알고리즘 사용
  severity: 중
  category: 계정 관리
  criteria: SHA-2 이상(SHA-256, SHA-512, yescrypt)의 안전한 알고리즘을 사용하는 경우 양호
  cis: 5.3.3.4.3, 5.4.1.4
U-14:
  title: root 홈, 패스 디렉터리 권한 및 패스 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: PATH 환경변수에 "."이 맨 앞이나 중간에 포함되지 않은 경우 양호 (전역·root 프로필)
  cis: ''
U-15:
  title: 파일 및 디렉터리 소유자 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 소유자가 존재하지 않는 파일 및 디렉터리가 없는 경우 양호 (로컬 디스크 파일시스템)
  cis: 7.1.12
U-16:
  title: /etc/passwd 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/passwd 소유자 root, 권한 644 이하인 경우 양호
  cis: 7.1.1
U-17:
  title: 시스템 시작 스크립트 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 시작 스크립트 소유자가 root이고 일반 사용자 쓰기 권한이 없는 경우 양호 (init.d, /etc/systemd/system)
  cis: ''
U-18:
  title: /etc/shadow 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/shadow 소유자 root, 권한 400 이하인 경우 양호
  cis: 7.1.5
U-19:
  title: /etc/hosts 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/hosts 소유자 root, 권한 644 이하인 경우 양호
  cis: ''
U-20:
  title: /etc/(x)inetd.conf 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/(x)inetd.conf 소유자 root, 권한 600 이하인 경우 양호 (없으면 해당없음)
  cis: ''
U-21:
  title: /etc/(r)syslog.conf 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/(r)syslog.conf 소유자 root(bin, sys), 권한 640 이하인 경우 양호
