# KISA-2026 Unix 서버 취약점 점검 항목(U-01~U-67) 카탈로그 (ADR-0009, Spec #488).
# 항목 목록의 유일한 원본이다. filter_plugins/host_audit_kisa.py가 import 시 읽기만 한다.
# title/severity/criteria는 2026판 가이드의 항목 설명을 따르고(원문 대조), cis는 CIS Red Hat Enterprise Linux 9
# Benchmark v2.0.0 규칙 번호(참조 열)이다. check는 우리 probe가 실제로 보는 것이다.
# purpose/threat/remediation은 가이드를 우리 말로 요약한 것이고(guide_page = 가이드 인쇄 쪽), steps는 계열(rhel,
# debian)에 따라 실제로 다른 항목에만 둔다. remediation_impact(조치 영향도)·remediation_effort(조치 난이도)의
# level은 1~3, reason은 그 근거이며 초안이다(PR에서 확정). 위험도·우선순위·시급성은 severity에서 계산하므로 저장하지 않는다.
# remediation은 가이드의 조치 방법을 요약한 것이고 check(우리 probe)와 범위가 겹치지 않는 부분이 있을 수 있다
# (예: 가이드는 xinetd.d·systemd 설정 파일까지 다룬다). 조치 뒤의 판정은 다음 실행에서 probe가 확인한다.
# purpose·threat·check·steps·guide_page는 이어지는 티켓(항목 단위 조치 안내 부록, Remediation Plan xlsx)이 쓴다.
U-01:
  title: root 계정 원격 접속 제한
  severity: 상
  category: 계정 관리
  criteria: 원격터미널 서비스를 사용하지 않거나, 사용 시 root 직접 접속을 차단한 경우 양호
  cis: 5.1.20
  check: sshd -T(실패 시 sshd_config)의 PermitRootLogin이 no이고 telnet(23/tcp) listening이 없으면 양호
  purpose: 외부 비인가자가 root 계정으로 원격 접속을 시도하지 못하게 막아 관리자 계정 탈취로 인한 시스템 장악을 예방한다.
  threat: root는 모든 기능을 바꿀 수 있어서, 원격에서 무차별·사전 대입으로 root를 뚫으면 시스템이 장악되거나 root 계정을 쓸 수 없게 된다.
  guide_page: 12
  remediation:
    summary: /etc/ssh/sshd_config에 PermitRootLogin no를 설정하고 sshd를 재적용한다. telnet(23/tcp)은 쓰지 않는다(켜 둔 채로는 이 항목이 양호가 되지 않으며 U-52도 함께 본다).
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 1
    reason: sshd_config의 PermitRootLogin 한 줄을 바꾸면 끝난다.
U-02:
  title: 비밀번호 관리정책 설정
  severity: 상
  category: 계정 관리
  criteria: 비밀번호 관리 정책이 설정된 경우 양호
  cis: 5.3.3.2.2, 5.3.3.2.3, 5.4.1.1, 5.4.1.2
  check: PASS_MAX_DAYS ≤ 90, PASS_MIN_DAYS ≥ 1, 문자 종류 3종+8자 또는 2종+10자(pwquality·PAM 인자)
  purpose: 비밀번호 복잡성, 길이, 변경 주기, 재사용 제한을 정책으로 강제해 계정 보안을 높인다.
  threat: 비밀번호 정책이 없으면 무차별·사전 대입 공격으로 비밀번호가 노출될 수 있다.
  guide_page: 15
  remediation:
    summary: /etc/login.defs에 PASS_MAX_DAYS 90, PASS_MIN_DAYS 1을, /etc/security/pwquality.conf에 minlen = 8과 dcredit, ucredit, lcredit, ocredit = -1을 설정하고, pwhistory(remember 4 이상)로 이전 비밀번호를 기억시킨다. root에도 적용하려면 enforce_for_root를 쓴다.
    steps:
      rhel: |
        /etc/login.defs: PASS_MAX_DAYS 90, PASS_MIN_DAYS 1
        /etc/security/pwquality.conf: minlen = 8, dcredit/ucredit/lcredit/ocredit = -1, enforce_for_root
        이전 비밀번호 기억: RHEL 9는 /etc/security/pwhistory.conf에 remember=4, enforce_for_root, 그 아래 버전은 pam_pwhistory.so의 remember=4 인자
        PAM 반영: RHEL 8 이상은 /etc/pam.d/system-auth를 직접 고치지 말고 authselect 사용자 정의 프로필이나 with-pwhistory 기능으로 한다(직접 수정은 authselect 적용 때 덮어써진다). CentOS 6/7은 system-auth에서 pam_pwquality.so(pam_cracklib.so), pam_pwhistory.so를 pam_unix.so 위에 둔다
        가이드 안에서 기억 개수가 4(Linux 사례)와 10(다른 OS 권고표)으로 어긋나며 여기서는 4 이상을 따른다
      debian: |
        /etc/security/pwquality.conf: minlen = 8, dcredit/ucredit/lcredit/ocredit = -1, enforce_for_root
        /etc/pam.d/common-password: pam_pwquality.so, pam_pwhistory.so를 pam_unix.so 위에 둔다
        /etc/login.defs: PASS_MAX_DAYS 90, PASS_MIN_DAYS 1
  remediation_impact:
    level: 2
    reason: 비밀번호 변경 시 Web, WAS, DB 연동 구간에 문제가 생길 수 있어 영향을 고려하고 적용해야 한다고 가이드가 서술한다.
  remediation_effort:
    level: 2
    reason: login.defs, pwquality, pwhistory, PAM 파일 등 여러 파일을 순서에 맞게 고쳐야 한다.
U-03:
  title: 계정 잠금 임계값 설정
  severity: 상
  category: 계정 관리
  criteria: 계정 잠금 임계값이 10회 이하의 값으로 설정된 경우 양호
  cis: 5.3.3.1.1
  check: auth 스택 pam_faillock·pam_tally2·pam_tally의 deny(없으면 faillock.conf, 기본 3)가 1~10
  purpose: 로그인 실패가 일정 횟수를 넘으면 계정을 잠가 무차별 대입 공격을 무력화한다.
  threat: 잠금 임계값이 없으면 공격자가 비밀번호가 맞을 때까지 계속 시도할 수 있어 비밀번호가 유출될 위험이 있다.
  guide_page: 21
  remediation:
    summary: PAM의 pam_faillock(구형은 pam_tally2)으로 로그인 실패 deny를 10 이하로 설정하고 unlock_time은 120초 정도로 둔다. RHEL 8 이상은 authselect의 with-faillock을 켜고 /etc/security/faillock.conf에 deny = 10, unlock_time = 120을 쓴다.
    steps:
      rhel: |
        RHEL 8 이상: authselect enable-feature with-faillock, /etc/security/faillock.conf에 deny = 10, unlock_time = 120
        구형(CentOS 6/7): /etc/pam.d/system-auth, password-auth의 auth 줄에 pam_faillock.so(또는 pam_tally2.so) deny=10 unlock_time=120
        PAM 모듈 경로가 실제로 있는지 먼저 확인한다
      debian: |
        /etc/pam.d/common-auth에 pam_faillock.so(또는 pam_tally2.so) deny=10 unlock_time=120
        pam_faillock은 /etc/pam.d/common-account에도 모듈 줄을 추가한다
        PAM 모듈 경로가 실제로 있는지 먼저 확인한다
  remediation_impact:
    level: 3
    reason: 모듈 경로가 틀리거나 PAM 순서를 어기면 모든 계정의 로그인이 안 되는 장애가 생길 수 있다고 가이드가 경고한다.
  remediation_effort:
    level: 2
    reason: 배포판과 버전별로 PAM 또는 authselect 설정을 맞춰 여러 파일을 순서대로 고쳐야 한다.
U-04:
  title: 비밀번호 파일 보호
  severity: 상
  category: 계정 관리
  criteria: 쉐도우 비밀번호를 사용하거나, 비밀번호를 암호화하여 저장하는 경우 양호
  cis: 7.2.1
  check: /etc/passwd 비밀번호 필드가 모두 x(잠금 표시 허용)이고 /etc/shadow 존재
  purpose: 계정 비밀번호가 /etc/passwd에 평문이 아니라 암호화되어 별도 파일에 저장되는지 확인한다.
  threat: 비밀번호 파일이 유출될 때 평문 비밀번호가 그대로 노출될 위험이 있다.
  guide_page: 25
  remediation:
    summary: /etc/passwd의 두 번째 필드가 모두 x인지 확인하고, 아니면 pwconv 명령으로 쉐도우 비밀번호를 적용해 /etc/shadow에 저장되게 한다.
  remediation_impact:
    level: 2
    reason: Linux는 영향이 없으나 가이드가 HP-UX Trusted Mode 전환 시 서비스 문제 가능성을 개별 서술하므로 조건부로 본다.
  remediation_effort:
    level: 1
    reason: pwconv 명령 하나로 적용된다.
U-05:
  title: root 이외의 UID가 ‘0’ 금지
  severity: 상
  category: 계정 관리
  criteria: root 계정과 동일한 UID를 갖는 계정이 존재하지 않는 경우 양호
  cis: 5.4.2.1
  check: UID 0 계정이 root뿐
  purpose: root(UID 0)와 같은 UID를 가진 다른 계정이 없는지 점검해 root 권한이 보호되게 한다.
  threat: UID 0 계정은 root와 같은 모든 작업이 가능하고, 감사 추적에서 root와 구분되지 않는다.
  guide_page: 27
  remediation:
    summary: UID가 0인 root 외 계정을 찾아 usermod -u로 중복되지 않는 다른 UID로 바꾸거나 불필요하면 삭제한다. 사용 중인 계정이라 명령이 안 되면 /etc/passwd를 직접 수정한다.
  remediation_impact:
    level: 1
    reason: 가이드가 해당 계정에 관리자 권한이 필요하지 않으면 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 해당 계정을 찾아 계정별로 UID 변경이나 삭제를 판단해 처리해야 한다.
U-06:
  title: 사용자 계정 su 기능 제한
  severity: 상
  category: 계정 관리
  criteria: su 명령어를 특정 그룹에 속한 사용자만 사용하도록 제한된 경우 양호
  cis: 5.2.7
  check: /etc/pam.d/su의 pam_wheel.so, 또는 su가 root 외 그룹 소유·other 실행 불가. su 없으면 해당없음
  purpose: su 명령을 특정 그룹 구성원만 쓰게 제한해 일반 사용자의 무분별한 계정 전환을 막는다.
  threat: 아무나 su를 쓰면 다른 사용자 파일을 바꾸거나 root 권한을 얻으려는 시도가 가능하다.
  guide_page: 29
  remediation:
    summary: wheel 그룹을 만들고 su 허용 계정만 넣은 뒤 /etc/pam.d/su에 auth required pam_wheel.so use_uid를 켠다. PAM을 쓰지 않으면 chgrp wheel /usr/bin/su, chmod 4750 /usr/bin/su로 제한한다.
  remediation_impact:
    level: 2
    reason: 그룹에 추가한 계정은 모든 세션을 종료하고 다시 로그인해야 su를 쓸 수 있다.
  remediation_effort:
    level: 2
    reason: 그룹 생성, 허용 계정 등록, PAM 또는 su 권한 변경을 함께 해야 한다.
U-07:
  title: 불필요한 계정 제거
  severity: 하
  category: 계정 관리
  criteria: 불필요한 계정이 존재하지 않는 경우 양호
  cis: ''
  check: 점검불가(수동) — 로그인 가능 계정 목록을 증적으로
  purpose: 퇴직·휴직 등으로 쓰지 않는 불필요한 계정이 시스템에 남아 있지 않은지 점검한다.
  threat: 사용하지 않는 계정은 관리가 소홀해 공격자의 목표가 되어 탈취될 수 있다.
  guide_page: 31
  remediation:
    summary: /etc/passwd와 last 기록으로 사용하지 않는 계정을 확인해 userdel 명령으로 제거한다. 주석 처리로는 계정이 막히지 않으므로 반드시 삭제하고, 기본 계정은 업무 영향을 먼저 파악한다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 3
    reason: 어떤 계정이 불필요한지는 담당자 확인이 필요한 판단 작업이라 혼자 바로 끝내기 어렵다.
U-08:
  title: 관리자 그룹에 최소한의 계정 포함
  severity: 중
  category: 계정 관리
  criteria: 관리자 그룹에 불필요한 계정이 등록되어 있지 않은 경우 양호
  cis: 5.4.2.2, 5.4.2.3
  check: 점검불가(수동) — GID 0 그룹·기본 그룹 GID 0 계정·wheel/sudo/admin 구성원을 증적으로
  purpose: 관리자(root) 그룹에 꼭 필요한 계정만 있게 해 권한 남용을 막는다.
  threat: 관리자 그룹 계정이 유출되면 시스템 운영 파일 접근, 계정정보 유출, 설정 변조가 가능하다.
  guide_page: 32
  remediation:
    summary: /etc/group에서 root 그룹 구성원을 확인해 불필요한 계정을 gpasswd -d <사용자> root로 제거한다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 그룹 구성원을 확인해 불필요한 계정을 판단하고 하나씩 제거한다.
U-09:
  title: 계정이 존재하지 않는 GID 금지
  severity: 하
  category: 계정 관리
  criteria: 시스템 관리나 운용에 불필요한 그룹이 제거된 경우 양호
  cis: 7.2.3
  check: 모든 계정의 기본 GID가 /etc/group에 있음
  purpose: 소속 계정이 없거나 불필요한 그룹이 /etc/group에 남아 있지 않은지 점검한다.
  threat: 불필요한 그룹 소유 파일을 통해 권한이 남용되거나 의도치 않게 부여되고 감사와 관리가 어려워진다.
  guide_page: 33
  remediation:
    summary: /etc/passwd의 기본 GID가 /etc/group에 없는 계정은 그룹을 만들거나 GID를 고친다. 계정이 없는 불필요한 그룹은 소유 파일과 용도를 관리자와 확인한 뒤 groupdel <그룹>으로 제거한다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 기본 GID가 없는 계정과 불필요한 그룹을 하나씩 파악하고 소유 파일을 확인해 처리를 판단해야 한다.
U-10:
  title: 동일한 UID 금지
  severity: 중
  category: 계정 관리
  criteria: 동일한 UID로 설정된 사용자 계정이 존재하지 않는 경우 양호
  cis: 7.2.4
  check: 중복 UID 없음
  purpose: 같은 UID를 쓰는 계정이 없게 해 파일 접근 예방과 감사 추적을 명확히 한다.
  threat: UID가 중복되면 시스템이 같은 사용자로 보아 불필요한 권한이 부여되고 로그로 사용자를 구분할 수 없다.
  guide_page: 34
  remediation:
    summary: /etc/passwd에서 중복 UID 계정을 찾아 usermod -u <새 UID> <계정>으로 중복되지 않는 UID로 바꾼다.
  remediation_impact:
    level: 2
    reason: 운영 목적으로 같은 UID를 부여했다면 해당 계정이 쓰는 파일과 디렉터리에 권한이 사라져도 서비스에 영향이 없는지 확인해야 한다.
  remediation_effort:
    level: 2
    reason: 중복 UID 계정마다 새 UID를 정해 바꾸고 소유 파일을 점검해야 한다.
U-11:
  title: 사용자 shell 점검
  severity: 하
  category: 계정 관리
  criteria: 로그인이 필요하지 않은 계정에 /bin/false(/sbin/nologin) 쉘이 부여된 경우 양호
  cis: 5.4.2.7
  check: 가이드가 나열한 시스템 계정(daemon, bin, sys, adm, listen, nobody, nobody4, noaccess, diag, operator, games, gopher)의 셸이 nologin/false
  purpose: 로그인이 필요 없는 시스템 계정에 쉘이 부여되지 않게 한다.
  threat: 로그인 불필요 계정에 쉘이 있으면 비인가자가 그 기본 계정으로 시스템에 접근할 수 있다.
  guide_page: 35
  remediation:
    summary: daemon, bin, sys, adm, listen, nobody, nobody4, noaccess, diag, operator, games, gopher 계정의 쉘을 usermod -s /sbin/nologin(또는 /bin/false) <계정>으로 바꾼다.
  remediation_impact:
    level: 1
