U-12:
  title: 세션 종료 시간 설정
  severity: 하
  category: 계정 관리
  criteria: Session Timeout이 600초(10분) 이하로 설정된 경우 양호
  cis: 5.4.3.2
  check: 전역 sh 프로필의 TMOUT이 1~600초(여러 곳이면 가장 큰 값)
  purpose: 사용자가 접속한 채 방치되지 않도록 일정 시간 입력이 없으면 세션을 끊는다.
  threat: Session timeout이 없으면 방치된 세션으로 비인가자가 접근해 내부 정보를 볼 수 있다.
  guide_page: 36
  remediation:
    summary: /etc/profile에 TMOUT=600과 export TMOUT를 설정한다. /etc/profile.d/*.sh, /etc/bashrc, /etc/bash.bashrc에 더 큰 TMOUT이 있으면 모두 600 이하로 맞추거나 지운다(가장 큰 값 기준). csh 계열은 /etc/csh.cshrc 또는 /etc/csh.login에 set autologout=10을 쓴다.
  remediation_impact:
    level: 2
    reason: 모니터링 용도의 세션은 타임아웃으로 끊겨 모니터링이 안 될 수 있어 예외 처리가 필요하다.
  remediation_effort:
    level: 2
    reason: /etc/profile뿐 아니라 profile.d, bashrc에 흩어진 TMOUT 지정까지 찾아 맞춰야 하지만 설정값은 한 줄이다.
U-13:
  title: 안전한 비밀번호 암호화 알고리즘 사용
  severity: 중
  category: 계정 관리
  criteria: SHA-2 이상의 안전한 비밀번호 암호화 알고리즘을 사용하는 경우 양호
  cis: 5.3.3.4.3, 5.4.1.4
  check: /etc/shadow에 MD5·Blowfish·DES 해시가 없고 ENCRYPT_METHOD·pam_unix 설정이 약한 알고리즘이 아님
  purpose: 비밀번호를 SHA-2 이상의 안전한 알고리즘으로 암호화해 저장하게 한다.
  threat: 약한 알고리즘(MD5 등)은 노출된 해시가 복호화 공격으로 비밀번호를 알아내는 데 쓰일 수 있다.
  guide_page: 37
  remediation:
    summary: /etc/login.defs의 ENCRYPT_METHOD를 SHA512(또는 SHA256)로 설정하고 PAM의 pam_unix.so에도 같은 알고리즘 옵션을 둔다. 설정을 바꿔도 passwd로 재설정해야 새 알고리즘이 적용되므로 약한 해시를 쓰는 계정의 비밀번호를 다시 설정해야 한다.
    steps:
      rhel: |
        /etc/login.defs: ENCRYPT_METHOD SHA512
        pam_unix.so에 sha512 옵션: RHEL 8 이상은 authselect 사용자 정의 프로필로 반영하고(system-auth 직접 수정은 덮어써짐), CentOS 6/7은 /etc/pam.d/system-auth를 고친다
        약한 해시 계정은 passwd로 비밀번호 재설정
      debian: |
        /etc/login.defs: ENCRYPT_METHOD SHA512(또는 yescrypt도 허용)
        /etc/pam.d/common-password: pam_unix.so에 sha512 옵션
        약한 해시 계정은 passwd로 비밀번호 재설정
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: login.defs와 PAM을 고치고 약한 해시를 쓰는 계정의 비밀번호를 하나씩 재설정해야 한다.
U-14:
  title: root 홈, 패스 디렉터리 권한 및 패스 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: PATH 환경변수에 “.” 이 맨 앞이나 중간에 포함되지 않은 경우 양호
  cis: ''
  check: 전역 프로필·/etc/environment·root 시작 파일의 PATH= 값에 . 또는 빈 항목이 맨 뒤가 아닌 위치에 없음
  purpose: root의 PATH에 현재 디렉터리(.)가 앞이나 중간에 있지 않게 한다.
  threat: PATH에서 "."이 정상 명령어 경로보다 앞서면 현재 디렉터리에 심어 둔 변조 명령이 관리자 명령 대신 실행될 수 있다.
  guide_page: 39
  remediation:
    summary: /etc/profile, /etc/environment, /etc/bashrc(Debian은 /etc/bash.bashrc)와 root 시작 파일(.profile, .bashrc, .bash_profile 등)에서 PATH의 "."이나 빈 항목을 삭제하거나 맨 뒤로 옮긴다. echo $PATH로 결과를 확인한다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 전역 프로필과 계정별 시작 파일 여러 곳을 순서대로 검색해 고쳐야 한다.
U-15:
  title: 파일 및 디렉터리 소유자 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 소유자가 존재하지 않는 파일 및 디렉터리가 존재하지 않는 경우 양호
  cis: 7.1.12
  check: -nouser·-nogroup 파일 없음 (로컬 디스크 파일시스템만 탐색)
  purpose: 소유자나 그룹이 없는 파일과 디렉터리가 남아 있지 않게 한다.
  threat: 주인 없는 파일의 UID와 같은 UID로 계정을 바꾸면 그 계정이 파일을 가져 모든 작업을 할 수 있다.
  guide_page: 40
  remediation:
    summary: 로컬 디스크 마운트 지점마다(/, /home 등) find <마운트> -xdev \( -nouser -o -nogroup \) -ls 2>/dev/null로 대상을 찾아 불필요하면 삭제하고, 쓰는 파일이면 chown, chgrp로 소유자와 그룹을 지정한다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 찾은 파일마다 삭제 또는 소유자 지정을 판단해 하나씩 처리해야 한다.
U-16:
  title: /etc/passwd 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/passwd 파일의 소유자가 root이고, 권한이 644 이하인 경우 양호
  cis: 7.1.1
  check: root, 644 이하
  purpose: /etc/passwd를 관리자만 바꿀 수 있게 소유자와 권한을 제한한다.
  threat: 비인가자가 /etc/passwd를 변조해 쉘을 바꾸거나 계정을 추가·삭제해 root를 포함한 권한을 얻을 수 있다.
  guide_page: 41
  remediation:
    summary: chown root /etc/passwd와 chmod 644 /etc/passwd로 소유자를 root, 권한을 644 이하로 맞춘다. 이미 그보다 엄격하면 바꾸지 않는다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 1
    reason: chown과 chmod 명령 두 개로 끝난다.
U-17:
  title: 시스템 시작 스크립트 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 시스템 시작 스크립트 파일의 소유자가 root이고, 일반 사용자의 쓰기 권한이 제거된 경우 양호
  cis: ''
  check: /etc/rc.d/init.d·/etc/init.d·/etc/systemd/system 일반 파일이 root 소유, 그룹·기타 쓰기 없음(755 이하). 파일이 없으면 해당없음
  purpose: 시스템 시작 스크립트의 소유자와 쓰기 권한을 제한해 임의 변조를 막는다.
  threat: 시작 스크립트 권한이 약하면 비인가자가 내용을 바꿔 시스템 침입에 악용할 수 있다.
  guide_page: 42
  remediation:
    summary: /etc/rc.d, /etc/init.d, /etc/systemd/system 아래 시작 스크립트(링크는 readlink -f로 실제 파일)의 소유자를 chown root로, 일반 사용자 쓰기를 chmod o-w(그룹 쓰기도 제거)로 막는다.
  remediation_impact:
    level: 1
    reason: 가이드가 일반적인 경우 영향 없음으로 서술한다.
  remediation_effort:
    level: 2
    reason: 여러 디렉터리의 대상 파일을 찾아 하나씩 소유자와 권한을 고쳐야 한다.
U-18:
