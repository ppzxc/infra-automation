U-22:
  title: /etc/services 파일 소유자 및 권한 설정
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: /etc/services 소유자 root(bin, sys), 권한 644 이하인 경우 양호
  cis: ''
U-23:
  title: SUID, SGID, Sticky bit 설정 파일 점검
  severity: 상
  category: 파일 및 디렉토리 관리
  criteria: 주요 실행 파일에 불필요한 SUID/SGID가 없는 경우 양호 (목록으로 수동 판정, file capability 목록은 증적에 덧붙임)
