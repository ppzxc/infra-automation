# KISA-2026 Unix 서버 취약점 점검 항목(U-01~U-67) 카탈로그 (ADR-0009, Spec #488).
# 항목 목록의 유일한 원본이다. filter_plugins/host_audit_kisa.py가 import 시 읽기만 한다.
# title/severity/criteria는 2026판 가이드의 항목 설명을 따르고, cis는 CIS Red Hat Enterprise Linux 9
# Benchmark v2.0.0 규칙 번호(참조 열)이다.
