---
# FUNA Cluster 환경 파일 (#222, docs/funa_env.md)
# 인벤토리 그룹 funa_cluster 소속 호스트에만 적용한다. Semaphore 인벤토리는 static이라
# group_vars를 쓸 수 없어 그룹 소속에서 파생한다(enable_otelcol, security_firewall_managed와 같은 방식).
funa_env_enabled: "{{ 'funa_cluster' in group_names }}"

# 렌더링 위치와 소유. dockermgmt는 docker_engine 역할(DOC-014)이 만든다.
funa_env_dir: /etc/funa-cluster
funa_env_profile_dir: /etc/profile.d
funa_env_owner: root
funa_env_owner_group: root
funa_env_group: "{{ docker_mgmt_group | default('dockermgmt') }}"

# keepalived 설정 디렉터리(infra-automation#314). enable_script_security가 켜져 있어 이 디렉터리를 root가 아닌 그룹이 쓸 수 있으면
# keepalived가 헬스 체크·알림 스크립트를 조용히 비활성화한다. /opt/services의 SGID·기본 ACL로 새 항목이 dockermgmt 그룹 쓰기로 생기므로
# 있으면 매번 root 전용으로 맞춘다(없으면 건드리지 않는다). 소유는 funa_env_owner/funa_env_owner_group을 쓴다.
funa_env_vrrp_config_dir: /opt/services/vrrp/config

# 재부팅 뒤 keepalived 컨테이너 기동 보장(#443). dockerd가 live-restore로 시작하면서 network_mode: host 컨테이너를
# 다시 띄우지 않는 일이 3대 모두에서 있었다(restart 정책과 무관). docker.service 뒤에 한 번 실행하는 유닛이
# 컨테이너가 있는데 안 떠 있을 때만 docker start 한다(없으면 아무것도 하지 않는다).
funa_env_vrrp_container: vrrp-keepalived-1
funa_env_systemd_dir: /etc/systemd/system
# false이면 유닛 파일만 두고 daemon-reload·enable을 하지 않는다(systemd가 없는 테스트 환경용).
funa_env_systemd_manage: true
