---
# ==============================================================================
# FUNA Cluster 환경 파일 렌더링 (#222)
# ==============================================================================
# OpenBao 값을 Ansible이 읽어 노드에 파일로 렌더링한다. compose는 env_file:로 이 파일을 직접 읽고,
# 로그인 셸은 profile.d 로더를 통한다. 시크릿은 소비자별 파일로 나눠 각 컨테이너가 필요한 것만 받는다.
# 그룹 funa_cluster에 속하지 않은 호스트에는 아무것도 만들지 않는다.
# 시크릿이 든 태스크는 no_log, 시크릿 파일 태스크는 diff: false. 실패 메시지는 경로·키 이름만 말한다.
- name: FUNA Cluster environment files
  when: funa_env_enabled | bool
  block:
    - name: "[FUNA-001] Look up the dockermgmt group"
      ansible.builtin.getent:
        database: group
        key: "{{ funa_env_group }}"
        fail_key: false
      check_mode: false

    - name: "[FUNA-002] Assert the dockermgmt group exists (docker_engine runs first)"
      vars:
        _group_present: "{{ (getent_group | default({})).get(funa_env_group) is not none }}"
      ansible.builtin.assert:
        that: _group_present | bool
        fail_msg: >-
          {{ inventory_hostname }}: 그룹 {{ funa_env_group }}이(가) 없습니다.
          docker_engine 역할(DOC-014)이 먼저 적용되어야 환경 파일을 렌더링할 수 있습니다.
        quiet: true
      when: not (ansible_check_mode | default(false))

    # check 모드에서 그룹이 아직 없는 호스트(docker_engine이 변경만 시뮬레이션)는 파일 렌더링 없이 넘어간다.
    - name: "[FUNA-002-FACT] Record whether the dockermgmt group exists"
      ansible.builtin.set_fact:
        _funa_env_group_present: "{{ (getent_group | default({})).get(funa_env_group) is not none }}"

    # 문서 경로·네임스페이스·인증은 공용 읽기 지점(lookup openbao_doc)이 정한다. 문서가 없거나 접근이 거부되면
    # 대체값 없이 문서 경로와 상태 코드만 대며 실패한다. 읽는 문서는 funa_env_openbao_required 선언이 정한다.
    - name: "[FUNA-003] Read the OpenBao documents declared in funa_env_openbao_required"
      vars:
        _funa_env_paths: "{{ funa_env_openbao_required | map('funa_env_doc_path', inventory_hostname, funa_env_credential) | list }}"
      ansible.builtin.set_fact:
        _funa_env_docs: "{{ dict(funa_env_openbao_required.keys() | list | zip(lookup('openbao_doc', *_funa_env_paths, wantlist=True))) }}"
      check_mode: false
      no_log: true

    # 선언한 필수 키가 문서에 있는지(비어 있지 않은지) 선언을 돌며 확인한다. 실패 메시지에는 패턴과 키 이름만 있다.
    - name: "[FUNA-017] Assert every declared document holds its required keys"
      vars:
        _present: "{{ _funa_env_docs[item.key] | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}"
        _absent: "{{ item.value | difference(_present) }}"
      ansible.builtin.assert:
        that: _absent | length == 0
        fail_msg: "{{ inventory_hostname }}: {{ item.key }} 문서에 필수 키가 없습니다 — {{ _absent | join(', ') }}"
        quiet: true
      loop: "{{ funa_env_openbao_required | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "[FUNA-005] Build the environment files from the OpenBao documents"
      ansible.builtin.set_fact:
        _funa_env: >-
          {{ _funa_env_docs
             | funa_env_resolve(funa_env_key_map, funa_env_node_required, funa_env_credential_env,
                                inventory_hostname, funa_env_credential) }}
      no_log: true

    # 오류 목록에는 경로와 키 이름만 있고 값은 없다.
    - name: "[FUNA-006] Assert the OpenBao values are complete and valid"
      ansible.builtin.assert:
        that: _funa_env.errors | length == 0
        fail_msg: "{{ inventory_hostname }}: FUNA 환경 값 검증 실패 — {{ _funa_env.errors | join('; ') }}"
        quiet: true

    - name: "[FUNA-007] Ensure the environment directory exists"
      ansible.builtin.file:
        path: "{{ funa_env_dir }}"
        state: directory
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: '0755'
      when: _funa_env_group_present | bool

    - name: "[FUNA-008] Render the non-secret environment file (cluster.env)"
      ansible.builtin.copy:
        content: "{{ _funa_env.cluster }}"
        dest: "{{ funa_env_dir }}/cluster.env"
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: '0644'
      when: _funa_env_group_present | bool

    - name: "[FUNA-009] Render the consumer secret environment files (proxy, vrrp)"
      ansible.builtin.copy:
        content: "{{ _funa_env[item] }}"
        dest: "{{ funa_env_dir }}/{{ item }}.secrets.env"
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_group }}"
        mode: '0640'
      loop: [proxy, vrrp]
      loop_control:
        label: "{{ item }}"
      no_log: true
      diff: false
      when: _funa_env_group_present | bool

    - name: "[FUNA-010] Deploy the login shell loader (profile.d)"
      ansible.builtin.template:
        src: funa-cluster.sh.j2
        dest: "{{ funa_env_profile_dir }}/funa-cluster.sh"
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: '0644'

    # keepalived가 start 때만 검사하는 스크립트 보안(enable_script_security)을 지킨다(infra-automation#314).
    # 디렉터리가 SGID·그룹 쓰기이거나 스크립트 소유가 root가 아니면 헬스 체크(check.sh)와 알림(notify.sh)이 비활성화되어
    # funa가 내려가도 VIP 전환·봇 알림이 나가지 않는다. 파일 권한만 고치고 서비스는 재기동하지 않는다.
    - name: "[FUNA-011] Look up the keepalived config directory"
      ansible.builtin.stat:
        path: "{{ funa_env_vrrp_config_dir }}"
      register: _funa_env_vrrp_dir
      check_mode: false

    - name: "[FUNA-012] Keep the keepalived config directory root-only (script security)"
      ansible.builtin.file:
        path: "{{ funa_env_vrrp_config_dir }}"
        state: directory
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: '0755'
      when: _funa_env_vrrp_dir.stat.exists and _funa_env_vrrp_dir.stat.isdir

    - name: "[FUNA-013] Find the keepalived scripts and config files"
      ansible.builtin.find:
        paths: "{{ funa_env_vrrp_config_dir }}"
        patterns: ['*.sh', '*.conf']
        file_type: file
      register: _funa_env_vrrp_files
      check_mode: false
      when: _funa_env_vrrp_dir.stat.exists and _funa_env_vrrp_dir.stat.isdir

    - name: "[FUNA-014] Keep the keepalived scripts and config files root-owned and not writable"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: "{{ '0755' if item.path.endswith('.sh') else '0644' }}"
      loop: "{{ _funa_env_vrrp_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _funa_env_vrrp_files.files is defined

    # 재부팅 뒤 keepalived 컨테이너가 안 올라오는 문제(#443). 유닛은 파일만 두고 컨테이너는 건드리지 않는다.
    - name: "[FUNA-015] Deploy the unit that starts the keepalived container after boot"
      ansible.builtin.template:
        src: funa-vrrp-ensure.service.j2
        dest: "{{ funa_env_systemd_dir }}/funa-vrrp-ensure.service"
        owner: "{{ funa_env_owner }}"
        group: "{{ funa_env_owner_group }}"
        mode: '0644'
      register: _funa_env_ensure_unit

    # 체크 모드에서는 유닛 파일이 아직 만들어지지 않아 systemd 모듈이 서비스를 찾지 못해 실패한다. 그때는 건너뛴다.
    - name: "[FUNA-016] Enable the keepalived start-after-boot unit"
      ansible.builtin.systemd:
        name: funa-vrrp-ensure.service
        enabled: true
        daemon_reload: true
      when:
        - funa_env_systemd_manage | bool
        - not ((ansible_check_mode | default(false)) and _funa_env_ensure_unit is changed)
