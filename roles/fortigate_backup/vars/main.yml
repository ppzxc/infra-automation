---
# 이 역할이 읽는 OpenBao 문서와 필수 키(`index.yml` 패턴: [필수 키]). 입력 검증 assert(FGBK-004·019), 스키마 대조 테스트,
# 요청 기록 단언이 같은 선언을 쓴다(docs/openbao_integration.md).
fortigate_backup_openbao_required:
  "inventory/assets/+/endpoints": []
  "secrets/assets/+/credentials/+": [token]
  "secrets/services/alert/notify": [url]

# 내부 파생값(사용 시점에 계산). 접속 정보는 FGBK-003이 해석한 fortigate_backup_connection에서 온다. 값은 로그에 남기지 않는다(관련 태스크는 no_log).
_fgbk_address: "{{ fortigate_backup_connection.address }}"
_fgbk_port: "{{ fortigate_backup_connection.port }}"
_fgbk_token: "{{ fortigate_backup_connection.login.token }}"
