---
# ==============================================================================
# FortiGate 설정 백업 역할 기본값 (docs/fortigate_backup.md)
# 공개 저장소이므로 장비 상세와 토큰은 두지 않는다.
# ==============================================================================

# 백업 로컬 저장소 (디렉터리 0700, 파일 0600). 파일 구조는 docs/fortigate_backup.md 4절.
fortigate_backup_dir: "{{ playbook_dir }}/../backups/fortigate"

# 보관 일수 (일 단위). 초과 파일은 백업 성공 직후 정리한다.
fortigate_backup_retention_days: 90

# 백업 대상(접속 대상) 이름. 기본은 인벤토리 호스트명(관리번호)이며 파일명의 <장비> 자리에 쓰인다.
# 영문·숫자·하이픈만(밑줄 금지: 파일명 구분자). IDC HA 쌍은 클러스터 주소 하나가 한 대상이다.
# 접속 주소는 인벤토리 ansible_host 또는 OpenBao KV의 ansible_host(fqdn이 있으면 fqdn). HA 관리 인터페이스가 없어 멤버별 직접 접속은 하지 않는다.
fortigate_device: "{{ inventory_hostname }}"

# 파일명의 <멤버> 자리: 같은 접속으로 시스템 상태를 조회해 실제로 응답한 멤버를 쓴다.
# hostname(기본) 또는 serial. 영문·숫자·하이픈 외 문자는 '-'로 바꾼다.
fortigate_backup_member_source: hostname

# 장비 API 접속 (포트는 OpenBao KV의 ansible_port가 있으면 그것이 우선)
fortigate_backup_scheme: https
fortigate_backup_api_port: 443
fortigate_backup_validate_certs: true
fortigate_backup_scope: global
fortigate_backup_timeout: 60

# API 토큰. Semaphore Environment(extra var)로 호스트별 주입하거나
# 비워 두고 OpenBao KV(`<mount>/<prefix><inventory_hostname>`의 `api_token`)에서 읽는다. 같은 KV의 ansible_host·ansible_port·fqdn은 접속 정보다.
fortigate_api_token: ""

# OpenBao 조회 (cisco_backup과 같은 환경변수 계층)
fortigate_backup_openbao_prefix: "{{ lookup('ansible.builtin.env', 'OPENBAO_FORTIGATE_PREFIX') | default('fortigate/', true) }}"
fortigate_backup_openbao_mount: "{{ lookup('ansible.builtin.env', 'VAULT_MOUNT') | default('secret', true) }}"
fortigate_backup_openbao_namespace: "{{ (lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE'), true)) | regex_replace('/+$', '') }}"
fortigate_backup_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true) }}"
fortigate_backup_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
fortigate_backup_vault_role_id: "{{ lookup('ansible.builtin.env', 'VAULT_ROLE_ID') }}"
fortigate_backup_vault_secret_id: "{{ lookup('ansible.builtin.env', 'VAULT_SECRET_ID') }}"

# 설정 변경 알림 (#286). 직전 백업과 달라졌을 때만 네이버웍스 webhook으로 한 번 보낸다.
# webhook URL·토큰은 Semaphore Environment로 주입한다(OpenBao agents/openobserve의 alert_webhook_url과 같은 값). 저장소에 두지 않는다.
fortigate_backup_alert_webhook_url: ""
fortigate_backup_alert_webhook_token: ""
fortigate_backup_alert_webhook_auth_header: X-NANOIT-ACCESS
fortigate_backup_alert_max_items: 20
fortigate_backup_alert_runbook: "https://github.com/ppzxc/infra-automation/blob/main/docs/runbooks/alerts.md#fortigate-config-change"
