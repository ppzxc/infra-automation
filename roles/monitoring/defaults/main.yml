---
# OpenTelemetry Collector Contrib
enable_otelcol: true
otelcol_user: "otelcol"
otelcol_group: "otelcol"
otelcol_config_dir: "/etc/otelcol"
otelcol_config_path: "/etc/otelcol/config.yaml"
otelcol_storage_dir: "/var/lib/otelcol/storage"
otelcol_secrets_dir: "/etc/otelcol-contrib"
otelcol_secrets_path: "/etc/otelcol-contrib/secrets.env"

# 컨트롤러 측 바이너리 캐시 (tarball 다운로드 1회 + 추출본). 버전/아키텍처별로 분리된다.
host_agents_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-agents"

# 호스트 측 설치 위치/소유자 (기본값이 표준. 다른 값은 로컬 테스트에서만 덮어쓴다)
host_agents_bin_dir: /usr/local/bin
host_agents_owner: root
host_agents_group: root

# OpenObserve 연결 (비시크릿 공용값 — inventory/group_vars/servers.yml에서 지정, ADR-0006 §2.7)
# o2_endpoint: "https://<openobserve>:5080"   # 끝 슬래시 금지 (exporter는 <endpoint>/api/<org>로 전송)
o2_endpoint: ""
o2_org: "default"
o2_ca_file: ""   # 사설 CA 사용 시 호스트상의 CA 파일 경로(tls.ca_file)

# OpenTelemetry Hostmetrics Receiver (ADR-0006 §2.3: 60s)
otel_hostmetrics_interval: "60s"
otel_hostmetrics_scrapers:
  cpu: {}
  memory: {}
  disk: {}
  filesystem: {}
  load: {}
  network: {}
  paging: {}
  processes: {}

# Docker 메트릭은 hosts/<host>/agents의 otel_docker_metrics: true인 호스트만 (docker_engine의 docker_metrics_enabled와 별개).
# otelcol 사용자에게 소켓 접근 권한이 필요하다(예: docker 그룹 멤버십은 docker_engine 책임).
otel_docker_endpoint: "unix:///var/run/docker.sock"
# 소켓 읽기용: 이 그룹이 존재하고 otel_docker_metrics인 호스트에서만 otelcol 사용자에 추가한다.
otel_docker_group: "docker"

# 로컬 OTLP 수신기는 기본 비활성 (인증 없는 수집 포트 노출 방지)
otel_otlp_enabled: false
otel_otlp_bind: "127.0.0.1"
otel_otlp_grpc_port: 4317
otel_otlp_http_port: 4318

# 로그 exporter 1개당 영속 큐 크기(bytes, 3개 스트림 합계 ≈ 256MiB). 초과 시 filelog가 역압을 받고 원본 파일이 버퍼가 된다.
otel_log_queue_bytes: 89478485

# OpenTelemetry Collector System Logs to Ingest (ISMS/ISMS-P Baseline)
# 표준 수집 목록. 이 중 vars의 otel_security_log_paths에 속한 경로는 security_logs 스트림으로 라우팅된다.
otel_system_logs:
  - /var/log/messages
  - /var/log/syslog
  - /var/log/secure
  - /var/log/auth.log
  - /var/log/sudo.log
  - /var/log/audit/audit.log
  - /var/log/cron*
  - /var/log/fail2ban.log
  - /var/log/dnf.log
  - /var/log/yum.log
  - /var/log/dpkg.log
  - /var/log/firewalld
  - /var/log/boot.log
  - /var/log/kern.log

# Host Agents 입력 (host_agents.yml 전용)
# OpenBao를 조회하지 않고 아래 값을 그대로 사용한다(molecule 등 테스트 전용 seam).
# 형식: {host: <hosts/<host>/agents 내용>, openobserve: <agents/openobserve>, rustfs: <agents/rustfs>}
# host_agents_kv_fixture: {}

# OpenBao TLS 검증. resolve_connection.yml과 동일하게 기본 false(사설 CA)이며, 신뢰 CA가 있으면 true로 올린다.
host_agents_vault_validate_certs: false

# Legacy node_exporter Cleanup Toggle
cleanup_legacy_node_exporter: true

