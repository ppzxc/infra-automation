---
# OpenTelemetry Collector Contrib
enable_otelcol: true
otelcol_user: "otelcol"
otelcol_group: "otelcol"
otelcol_config_dir: "/etc/otelcol"
otelcol_config_path: "/etc/otelcol/config.yaml"

# 컨트롤러 측 바이너리 캐시 (tarball 다운로드 1회 + 추출본). 버전/아키텍처별로 분리된다.
host_agents_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/host-agents"

# OpenTelemetry Hostmetrics Receiver Configuration
otel_hostmetrics_interval: "15s"
otel_hostmetrics_scrapers:
  cpu: {}
  memory: {}
  disk: {}
  filesystem: {}
  load: {}
  network: {}
  paging: {}
  processes: {}

# Docker Metrics Scrape Toggle (Scrapes dockerd metrics endpoint directly via OTel prometheus receiver)
docker_metrics_enabled: false
docker_metrics_address: "127.0.0.1:9323"

# OTLP Ingestion Endpoints (For Application Metrics, Logs, and Traces)
otel_otlp_grpc_port: 4317
otel_otlp_http_port: 4318
otel_traces_enabled: true

# OpenTelemetry Target Backend Endpoint
otel_target_endpoint: "127.0.0.1:4317"
otel_target_insecure: true
otel_target_headers: {}
otel_auth_header: ""


# OpenTelemetry Collector System Logs to Ingest (ISMS/ISMS-P Baseline)
# 표준 수집 목록. 이 중 vars의 otel_security_log_paths에 속한 경로는 security_logs 스트림으로 라우팅된다.
otel_system_logs:
  - /var/log/messages
  - /var/log/syslog
  - /var/log/secure
  - /var/log/auth.log
  - /var/log/sudo.log
  - /var/log/audit/audit.log
  - /var/log/cron*
  - /var/log/fail2ban.log
  - /var/log/dnf.log
  - /var/log/yum.log
  - /var/log/dpkg.log
  - /var/log/firewalld
  - /var/log/boot.log
  - /var/log/kern.log
  - /var/log/boot.log
  - /var/log/kern.log

# Host Agents 입력 (host_agents.yml 전용)
# OpenBao를 조회하지 않고 아래 값을 그대로 사용한다(molecule 등 테스트 전용 seam).
# 형식: {host: <hosts/<host>/agents 내용>, openobserve: <secret/agents/openobserve>, rustfs: <secret/agents/rustfs>}
# host_agents_kv_fixture: {}

# Host Agents 입력 (host_agents.yml 전용)
# OpenBao를 조회하지 않고 아래 값을 그대로 사용한다(molecule 등 테스트 전용 seam).
# 형식: {host: <hosts/<host>/agents 내용>, openobserve: <agents/openobserve>, rustfs: <agents/rustfs>}
# host_agents_kv_fixture: {}

# OpenBao TLS 검증. resolve_connection.yml과 동일하게 기본 false(사설 CA)이며, 신뢰 CA가 있으면 true로 올린다.
host_agents_vault_validate_certs: false

# Legacy node_exporter Cleanup Toggle
cleanup_legacy_node_exporter: true

