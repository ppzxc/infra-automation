---
# OpenTelemetry Collector Contrib
# Host Agents Backup Only(인벤토리 그룹 host_agents_backup_only) 호스트는 otelcol을 설치·설정하지 않고 백업만 받는다.
# 그룹 소속에서 파생한다 — Semaphore Static 인벤토리에는 저장소 inventory/group_vars가 적용되지 않는다.
enable_otelcol: "{{ 'host_agents_backup_only' not in group_names }}"
otelcol_user: "otelcol"
otelcol_group: "otelcol"
otelcol_config_dir: "/etc/otelcol"
otelcol_config_path: "/etc/otelcol/config.yaml"
otelcol_storage_dir: "/var/lib/otelcol/storage"
otelcol_secrets_dir: "/etc/otelcol-contrib"
otelcol_secrets_path: "/etc/otelcol-contrib/secrets.env"
# legacy_el6/legacy_el7(CentOS 6/7, raw 경로)은 root로 실행한다. 그 외(modern)는 비root otelcol + CAP_DAC_READ_SEARCH.
otelcol_systemd_unit_dir: /etc/systemd/system
otelcol_sysv_init_dir: /etc/init.d
# SysV init(CentOS 6 등)에서 컬렉터 자체 stdout/stderr가 쌓이는 파일. legacy_el6은 logrotate(copytruncate)로 회전한다(MON-122).
otelcol_sysv_log_path: /var/log/otelcol-contrib.log
otelcol_logrotate_path: /etc/logrotate.d/otelcol-contrib
otelcol_logrotate_rotate: 4
# 재시작 생존 확인 튜너블 (MON-119 init 스크립트, MON-216 핸들러). 값의 근거는 여기 한 곳에서만 설명한다.
# - otelcol_sysv_start_grace(3초): init `start` 뒤 PID 생존을 보기 전 대기. 설정 오류·file_storage 잠금 충돌 같은
#   기동 직후 종료는 1~2초 안에 일어나므로 3초면 잡히고, 부팅·수동 start가 길어지지 않는다.
# - otelcol_alive_grace_seconds(5초): 재시작 뒤 MON-216 핸들러가 상태를 읽기 전(그리고 재시도 start 뒤·EL7 activating 재확인 간격)
#   대기. init의 start 유예(3초)보다 길게 두어 유예 직후에 죽는 경우까지 한 번 더 본다.
# - otelcol_sysv_stop_timeout(30초): TERM 후 큐 flush·file_storage 잠금 해제를 기다리는 최대 시간(기존 동작 유지).
#   넘기면 KILL하고 소멸을 최대 10초(고정) 더 확인하며, 그래도 남아 있으면 stop·restart가 실패한다.
# - otelcol_sysv_pid_path: init 스크립트의 pidfile 위치.
otelcol_sysv_pid_path: /var/run/otelcol-contrib.pid
otelcol_sysv_start_grace: 3
otelcol_sysv_stop_timeout: 30
otelcol_alive_grace_seconds: 5
otelcol_run_as_root: "{{ host_agents_is_legacy | default(false) | bool }}"

# 컨트롤러 측 바이너리 캐시 (tarball 다운로드 1회 + 추출본). 버전/아키텍처별로 분리된다.
host_agents_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-agents"

# 호스트 측 설치 위치/소유자 (기본값이 표준. 다른 값은 로컬 테스트에서만 덮어쓴다)
host_agents_bin_dir: /usr/local/bin
host_agents_owner: root
host_agents_group: root

# OpenObserve 연결 (ADR-0006 §2.7). 우선순위: Extra variables/group_vars > OpenBao agents/openobserve의 같은 이름 키 > 아래 기본값.
# 저장소가 공개(PUBLIC)라 내부 도메인을 Git에 두지 않는다 — 평상시에는 OpenBao agents/openobserve에 넣고, 일회성 재정의만 -e로 준다.
# o2_endpoint: "https://<openobserve>:5080"   # 끝 슬래시 금지 (exporter는 <endpoint>/api/<org>로 전송)
o2_endpoint: "{{ ((host_agents_shared_secrets | default({})).openobserve | default({})).o2_endpoint | default('', true) }}"
o2_org: "{{ ((host_agents_shared_secrets | default({})).openobserve | default({})).o2_org | default('default', true) }}"
o2_ca_file: "{{ ((host_agents_shared_secrets | default({})).openobserve | default({})).o2_ca_file | default('', true) }}"   # 사설 CA 사용 시 호스트상의 CA 파일 경로(tls.ca_file)

# OpenTelemetry Hostmetrics Receiver (ADR-0006 §2.3: 60s)
otel_hostmetrics_interval: "60s"
otel_hostmetrics_scrapers:
  cpu: {}
  memory: {}
  disk: {}
  filesystem: {}
  load: {}
  network: {}
  paging: {}
  processes: {}

# Docker 메트릭은 hosts/<host>/agents의 otel_docker_metrics: true인 호스트만 (docker_engine의 docker_metrics_enabled와 별개).
# otelcol 사용자에게 소켓 접근 권한이 필요하다(예: docker 그룹 멤버십은 docker_engine 책임).
otel_docker_endpoint: "unix:///var/run/docker.sock"
# 소켓 읽기용: 이 그룹이 존재하고 otel_docker_metrics인 호스트에서만 otelcol 사용자에 추가한다.
otel_docker_group: "docker"

# 로컬 OTLP 수신기는 기본 비활성 (인증 없는 수집 포트 노출 방지)
otel_otlp_enabled: false
otel_otlp_bind: "127.0.0.1"
otel_otlp_grpc_port: 4317
otel_otlp_http_port: 4318

# 백업 결과 jsonl (backup 역할의 backup_log_path와 같은 값을 유지한다)
otel_backup_log_path: /var/log/host-agents/backup.jsonl

# 로그 exporter 1개당 영속 큐 크기(bytes, 4개 스트림 합계 ≈ 256MiB). 초과 시 filelog가 역압을 받고 원본 파일이 버퍼가 된다.
otel_log_queue_bytes: 67108864
# legacy_el6(v0.119.0)은 sizer: bytes가 없어 queue_size가 배치(요청) 개수다. 배치 ≤ 1024건(batch 프로세서) × 평균 1KiB
# 기준 64개 ≈ 64MiB로 위 bytes 예산과 맞춘다. 큐가 차면 blocking: true로 filelog가 역압을 받는다(ADR-0006 §2.8).
otel_log_queue_batches_legacy_el6: 64

# OpenTelemetry Collector System Logs to Ingest (ISMS/ISMS-P Baseline)
# 표준 수집 목록. 이 중 vars의 otel_security_log_paths에 속한 경로는 security_logs 스트림으로 라우팅된다.
otel_system_logs:
  - /var/log/messages
  - /var/log/syslog
  - /var/log/secure
  - /var/log/auth.log
  - /var/log/sudo.log
  - /var/log/audit/audit.log
  - /var/log/cron*
  - /var/log/fail2ban.log
  - /var/log/dnf.log
  - /var/log/yum.log
  - /var/log/dpkg.log
  - /var/log/firewalld
  - /var/log/boot.log
  - /var/log/kern.log

# Host Agents 입력 (host_agents.yml 전용)
# OpenBao를 조회하지 않고 아래 값을 그대로 사용한다(molecule 등 테스트 전용 seam).
# 형식: {host: <hosts/<host>/agents 내용>, openobserve: <agents/openobserve>, rustfs: <agents/rustfs>}
# host_agents_kv_fixture: {}

# OpenBao TLS 검증. resolve_connection.yml과 동일하게 기본 false(사설 CA)이며, 신뢰 CA가 있으면 true로 올린다.
host_agents_vault_validate_certs: false

# Legacy node_exporter Cleanup Toggle
cleanup_legacy_node_exporter: true

# OpenObserve 생존 타이머 (Spec #184 / Ticket-7): 이 호스트에만 5분 주기 확인 타이머를 배포한다.
# OpenObserve(ns0332)가 죽으면 OpenObserve를 거치지 않고 네이버웍스 webhook(OpenBao agents/openobserve의 alert_webhook_url)으로 직접 P1을 보낸다.
host_agents_o2_health_checker: ns0266
o2_health_config_dir: /etc/openobserve-health
o2_health_state_dir: /var/lib/openobserve-health
o2_health_script_path: /usr/local/sbin/openobserve-health-check
o2_health_interval: 5min
o2_health_renotify_minutes: 60

# 서버 도달성 검사(Spec #184 / Ticket-6, ADR-0010): 같은 검사하는 쪽 호스트의 otelcol에만 tcp_check 수신기를 붙인다.
# tcp_check는 contrib 0.161.0(modern/legacy_el7 행)에 있다. legacy_el6 행(0.119.0)에는 없으므로 검사하는 쪽을 CentOS 6에 두지 않는다.
# 대상 목록은 검사하는 쪽이 실행 때마다 OpenBao hosts/<host>에서 직접 읽어 만든다(주소 public_ip, 비표준 SSH 포트 ansible_port).
# 부분 실행(target_hosts)에서도 같은 목록이 나온다. 호스트를 편입·폐기하면 검사하는 쪽에 Host Agents 설정을 다시 반영해야 한다.
otel_tcpcheck_enabled: "{{ inventory_hostname == host_agents_o2_health_checker }}"
otel_tcpcheck_interval: "60s"
# 검사하는 쪽에서 도달할 수 없는 것이 정상인 서버는 대상에서 빠진다(이름만, 시크릿 아님). 제외 방법 두 가지를 합친다:
#   - Semaphore 인벤토리의 `tcpcheck_excluded` 그룹(host_agents_excluded·host_audit_excluded와 같은 방식, 평상시 방법)
#   - 변수 host_agents_tcpcheck_excluded(Extra variables 재정의용)
# Semaphore 인벤토리는 DB에 저장된 static-yaml이라 저장소 inventory/group_vars는 읽히지 않는다 — 그룹으로 지정한다.
host_agents_tcpcheck_excluded: []
otel_tcpcheck_roster: "{{ groups['servers'] | default([]) | difference(host_agents_tcpcheck_excluded | union(groups['tcpcheck_excluded'] | default([]))) | sort }}"

