---
# ==============================================================================
# 옛 GitHub 조직 웹훅 수신기(Spec #399, #651로 제거)가 만든 docker.service.wants 링크를 정리한다.
# 수신기를 켠 적이 있는 호스트에는 링크가 남아 있으므로 없애고(이미 없으면 변경 없음), 바뀌었으면 systemd를 다시 읽는다.
# ==============================================================================
- name: "[MON-072] Remove the legacy docker.service.wants link of the otelcol unit"
  ansible.builtin.file:
    dest: "{{ otelcol_systemd_unit_dir }}/docker.service.wants/otelcol-contrib.service"
    state: absent
  register: _otelcol_docker_wants
  when:
    - enable_otelcol | default(true) | bool
    - ansible_service_mgr == "systemd"

- name: "[MON-073] Reload systemd units when the docker.service.wants link changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - _otelcol_docker_wants is changed
  changed_when: true
