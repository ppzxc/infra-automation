---
# legacy raw 경로의 symlink 교체 (switch_binary.yml 대응본, ADR-0006 §2.8). 호출 전에 새 바이너리의 스모크 테스트와
# 설정 검증이 끝나 있어야 한다. 일반 파일 바이너리 보존, 원자적 교체, 현재+직전 버전만 보존은 raw_switch_binary_cmd가 처리한다.
- name: "[MON-212] Point the install symlink at the new version (raw)"
  ansible.builtin.raw: "{{ _deliver_link | raw_switch_binary_cmd(_deliver_new_path, _deliver_agent_dir, _deliver_binary) }}"
  register: _legacy_switch
  changed_when: _legacy_switch.stdout | default('') | raw_changed
  notify: "{{ _deliver_handler }}"
