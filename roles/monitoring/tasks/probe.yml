---
# ==============================================================================
# Host Agents 사전 단계: 프로비저닝 확인 → 원격 OS 프로브 → 경로 분기 (ADR-0006 §2.1, §2.9)
# ==============================================================================
# 프로브는 raw 명령만 사용하므로 fact 수집 여부와 무관하게 동일하게 동작한다.
# 모든 태스크는 main.yml에서 tags: [always]로 import되어 --tags agents_config 실행에서도 수행된다.
# 예외(ADR-0006 §2.1 개정): 비밀번호로만 접속되는 레거시 호스트는 OpenBao hosts/<호스트> KV에
# host_agents_allow_password_auth: true를 명시한 경우에만 통과한다(호스트별 증적은 OpenBao KV).
- name: "[MON-020] Assert host was provisioned by site.yml (or opted in to password-auth install)"
  vars:
    _pw_exception: "{{ ((_host_kv_dict | default({}, true)).host_agents_allow_password_auth | default(false, true)) | string | lower in ['true', 'yes', '1'] }}"
  ansible.builtin.assert:
    that:
      - (_is_already_provisioned | default(false) | bool) or (_pw_exception | bool)
    fail_msg: >-
      {{ inventory_hostname }}: 접속 계정으로 SSH 접속할 수 없는 호스트입니다(미프로비저닝으로 판정).
      Host Agents는 OpenBao 접속 계정의 SSH 키로 접속되는 호스트에만 설치합니다 — site.yml을 먼저 실행하거나,
      hosts/<호스트>의 admin_users와 users/<계정>의 ssh_private_key(및 sudo 권한)를 확인하세요.
      비밀번호로만 접속되는 레거시 호스트는 hosts/<호스트> KV에 host_agents_allow_password_auth: true를 명시해야 합니다.
    quiet: true

- name: "[MON-029] Warn that this host is installed through the password-auth exception (ISMS evidence)"
  vars:
    _pw_exception: "{{ ((_host_kv_dict | default({}, true)).host_agents_allow_password_auth | default(false, true)) | string | lower in ['true', 'yes', '1'] }}"
  ansible.builtin.debug:
    msg: >-
      [WARN] PASSWORD-AUTH-EXCEPTION {{ inventory_hostname }}: 하드닝되지 않은 호스트에 비밀번호 접속으로 Host Agents를 설치합니다
      (hosts/{{ inventory_hostname }} KV host_agents_allow_password_auth). site.yml로 하드닝한 뒤에는 이 플래그를 제거하세요.
  when:
    - _pw_exception | bool
    - not (_is_already_provisioned | default(false) | bool)

- name: "[MON-021] Probe OS release and architecture from target host (raw, read-only)"
  ansible.builtin.raw: "{{ '' | host_agents_os_probe_cmd }}"
  register: host_agents_os_probe
  changed_when: false
  failed_when: host_agents_os_probe.rc | default(0) != 0
  check_mode: false
  become: false

- name: "[MON-022] Classify OS path and set host_agents_os facts from probe"
  vars:
    _probe: "{{ host_agents_os_probe.stdout | default('') | host_agents_parse_os_probe }}"
  ansible.builtin.set_fact:
    host_agents_os_path: "{{ _probe.path }}"
    host_agents_os_family: "{{ _probe.family }}"
    host_agents_os_distribution: "{{ _probe.distribution }}"
    host_agents_os_version: "{{ _probe.version }}"
    host_agents_os_major_version: "{{ _probe.major_version }}"
    host_agents_os_arch: "{{ _probe.arch }}"
    host_agents_os_type: "{{ _probe.type }}"
    host_agents_os_description: "{{ _probe.description }}"

# 현대 경로에서만 python3를 요구하고 fact를 수집한다. legacy 경로는 AnsiballZ를 쓸 수 없으므로
# 이 시점 이후 모듈 태스크를 호출하지 않는다.
# 읽기 전용 확인은 check 모드에서도 실행되어, 설치가 스킵되는 dry-run에서 python3 부재를
# setup의 모호한 오류가 아니라 명확한 메시지로 실패시킨다.
- name: "[MON-023] Check /usr/bin/python3 exists on modern path (raw, read-only)"
  ansible.builtin.raw: test -x /usr/bin/python3 && echo PYTHON3_PRESENT || echo PYTHON3_ABSENT
  register: host_agents_python3
  changed_when: false
  failed_when: false
  check_mode: false
  when: host_agents_os_path == 'modern'

- name: "[MON-026] Install python3 on modern path when absent"
  ansible.builtin.raw: >-
    if command -v dnf >/dev/null 2>&1; then dnf install -y python3;
    elif command -v apt-get >/dev/null 2>&1; then apt-get install -y python3; fi;
    test -x /usr/bin/python3
  register: host_agents_python3_install
  changed_when: true
  when:
    - host_agents_os_path == 'modern'
    - "'PYTHON3_ABSENT' in host_agents_python3.stdout"
    - not ansible_check_mode

- name: "[MON-027] Assert python3 is available on modern path"
  ansible.builtin.assert:
    that: "'PYTHON3_PRESENT' in host_agents_python3.stdout or host_agents_python3_install is succeeded"
    fail_msg: "{{ inventory_hostname }}: /usr/bin/python3가 없습니다(check 모드에서는 설치하지 않음). 먼저 --check 없이 실행하세요."
    quiet: true
  when: host_agents_os_path == 'modern'

- name: "[MON-024] Gather facts on modern path"
  ansible.builtin.setup:
  when: host_agents_os_path == 'modern'
