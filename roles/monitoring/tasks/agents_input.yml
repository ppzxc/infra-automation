---
# ==============================================================================
# Host Agents 입력 해석: Asset 문서 agents 절 + secrets/assets/<ns>/agents + 공유 Service 문서 (Spec #511, ADR-0006 §2.2)
# ==============================================================================
# 변경 태스크보다 먼저 실행되며, 필수 시크릿 누락 / OpenBao 오류 / 제외 불가 경로 제외 시
# 해당 호스트를 실패시킨다(check 모드 포함). 조회는 호스트마다 컨트롤러에서 수행한다
# (호스트별 실패 범위를 호스트 단위로 유지하기 위해 run_once를 쓰지 않는다).
# 읽기는 공용 읽기 지점(lookup openbao_doc) 한 곳이다. 읽는 문서 패턴과 필수 키는 vars의 monitoring_openbao_required에 선언한다.
# secrets/ 문서 조회는 no_log라서 실패 메시지가 가려진다 — errors='warn'으로 문서 경로·상태 코드만 경고로 내고, 아래 assert가 중단시킨다.
- name: "[MON-030] Read the agents documents from OpenBao (Asset agents clause, agents secrets, shared services)"
  ansible.builtin.set_fact:
    _host_agents_docs:
      "inventory/assets/+": "{{ lookup('openbao_doc', 'inventory/assets/' ~ inventory_hostname, errors='warn') }}"
      "secrets/assets/+/agents": "{{ lookup('openbao_doc', 'secrets/assets/' ~ inventory_hostname ~ '/agents', errors='warn') }}"
      "inventory/services/openobserve": "{{ lookup('openbao_doc', 'inventory/services/openobserve', errors='warn') }}"
      "inventory/services/rustfs": "{{ lookup('openbao_doc', 'inventory/services/rustfs', errors='warn') }}"
      "secrets/services/openobserve/ingest": "{{ lookup('openbao_doc', 'secrets/services/openobserve/ingest', errors='warn') }}"
  become: false
  check_mode: false
  no_log: true

- name: "[MON-031] Assert every agents document was read and carries its declared required keys"
  vars:
    _gaps: "{{ _host_agents_docs | host_agents_openbao_gaps(monitoring_openbao_required) }}"
  ansible.builtin.assert:
    that: _gaps | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: OpenBao 조회 실패 또는 필수 키 누락 — 변경 없이 중단합니다(check 모드 포함).
      {{ _gaps | join(', ') }} (읽기 실패의 상태 코드는 바로 위 경고에 있습니다)
    quiet: true

- name: "[MON-032] Resolve the agents inputs (Asset clause + secrets + shared services)"
  ansible.builtin.set_fact:
    _host_agents_asset_agents: "{{ _host_agents_docs['inventory/assets/+'].agents | default({}, true) }}"
    _host_agents_secret_doc: "{{ _host_agents_docs['secrets/assets/+/agents'] }}"
    host_agents_services: "{{ {'openobserve': _host_agents_docs['inventory/services/openobserve'], 'rustfs': _host_agents_docs['inventory/services/rustfs']} }}"
    host_agents_ingest_auth: "{{ _host_agents_docs['secrets/services/openobserve/ingest'] }}"
  no_log: true

# 병합 결과에는 시크릿 값이 없다(경로/스트림/플래그와 오류 메시지뿐).
- name: "[MON-033] Merge agents inputs with the Git standard"
  ansible.builtin.set_fact:
    host_agents_inputs: >-
      {{ _host_agents_asset_agents | host_agents_resolve_inputs(
           _host_agents_secret_doc,
           otel_system_logs, otel_security_log_paths, host_agents_backup_mandatory_paths,
           'inventory/assets/' ~ inventory_hostname, host_agents_services,
           otel_log_services, enable_otelcol | default(true) | bool,
           host_agents_os_path | default(none)) }}

- name: "[MON-034] Assert agents inputs are valid before any change"
  ansible.builtin.assert:
    that: host_agents_inputs.errors | length == 0
    fail_msg: "{{ inventory_hostname }}: Host Agents 입력 검증 실패 — {{ host_agents_inputs.errors | join('; ') }}"
    quiet: true

# 환경은 모든 호스트가 같은 값이라 역할 기본값(host_agents_environment)이다. OpenBao에서 읽지 않는다(Spec #511 §3).
- name: "[MON-036] Build and validate the resource attributes of this host"
  vars:
    _env: "{{ host_agents_environment }}"
  ansible.builtin.set_fact:
    host_agents_resource_attrs: >-
      {{ inventory_hostname | host_agents_resource_attributes(_env, {
           'machine_id': host_agents_machine_id | default(''), 'arch': host_agents_os_arch | default(''),
           'type': host_agents_os_type | default(''), 'os_id': host_agents_os_id | default(''),
           'version': host_agents_os_version | default(''), 'description': host_agents_os_description | default('')},
           ip | default('')) }}

- name: "[MON-037] Assert the resource attributes are valid before any change"
  ansible.builtin.assert:
    that: host_agents_resource_attrs.errors | length == 0
    fail_msg: "{{ inventory_hostname }}: 리소스 속성 검증 실패 — {{ host_agents_resource_attrs.errors | join('; ') }}"
    quiet: true

- name: "[MON-038] Warn about resource attributes left out for this host"
  ansible.builtin.debug:
    msg: "{{ ('[WARN] ' ~ inventory_hostname ~ ': 리소스 속성 생략 — ' ~ (host_agents_resource_attrs.omitted | join(', '))) | host_agents_warn }}"
  when: host_agents_resource_attrs.omitted | length > 0

- name: "[MON-035] Set agents secrets as host facts"
  ansible.builtin.set_fact:
    host_agents_secrets: "{{ _host_agents_secret_doc | host_agents_secrets }}"
    host_agents_github_webhook: "{{ _host_agents_asset_agents | host_agents_github_webhook(_host_agents_secret_doc) }}"
  no_log: true

# GitHub 웹훅 수신기(Spec #399): 컨테이너 네트워크는 외부 관리형(서브넷 자동 할당)이라 게이트웨이 주소가 바뀔 수 있다.
# 바인딩 설정과 다르면 수신기가 조용히 끊기므로, 바이너리 전달·규칙 삭제·핸들러 큐잉 등 어떤 변경보다 먼저 이 입력 검증 단계에서 실패시킨다(check 모드 포함). 출력에 주소가 있으므로 no_log이다.
- name: "[MON-069] Read the docker network gateway for the GitHub webhook bind address (read-only)"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - --format
      - "{% raw %}{{(index .IPAM.Config 0).Gateway}}{% endraw %}"
      - "{{ host_agents_github_webhook.network }}"
  register: _github_webhook_gateway
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - host_agents_inputs.otel_github_webhook | default(false) | bool
    - host_agents_os_path | default('modern') == 'modern'

- name: "[MON-070] Assert the docker network gateway equals the GitHub webhook bind address"
  ansible.builtin.assert:
    that:
      - _github_webhook_gateway.rc | default(1) == 0
      - (_github_webhook_gateway.stdout | default('') | host_agents_github_webhook_gateway_errors(host_agents_github_webhook.address)) | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: 도커 네트워크 게이트웨이를 확인하지 못했거나 github_webhook_address와 다릅니다 —
      변경 없이 중단합니다(check 모드 포함). 주소 값은 출력하지 않습니다.
    quiet: true
  when:
    - host_agents_inputs.otel_github_webhook | default(false) | bool
    - host_agents_os_path | default('modern') == 'modern'
