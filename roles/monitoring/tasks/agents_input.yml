---
# ==============================================================================
# Host Agents 입력 해석: OpenBao hosts/<host>/agents + secret/agents/* (ADR-0006 §2.2)
# ==============================================================================
# 변경 태스크보다 먼저 실행되며, 필수 시크릿 누락 / OpenBao 오류 / 제외 불가 경로 제외 시
# 해당 호스트를 실패시킨다(check 모드 포함). 조회는 컨트롤러에서 수행한다.
# 응답 본문에 시크릿이 있으므로 조회 태스크는 no_log이고, 실패 사유는 상태 코드로만 보고한다.
- name: "[MON-030] Fetch per-host agents KV from OpenBao (hosts/<hostname>/agents)"
  vars: &openbao_vars
    _vault_addr_eff: "{{ vault_addr | default(VAULT_ADDR | default(lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true), true), true) }}"
    _vault_token_eff: "{{ _vault_token | default(vault_token | default(VAULT_TOKEN | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true), true), true) }}"
    _vault_ns_eff: "{{ (vault_namespace | default(VAULT_NAMESPACE | default(lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE') | default('infra/prod/host/', true), true), true), true)) | regex_replace('/+$', '') }}"
    _vault_mount_eff: "{{ vault_mount | default(VAULT_MOUNT | default(lookup('ansible.builtin.env', 'VAULT_MOUNT') | default(lookup('ansible.builtin.env', 'OPENBAO_MOUNT') | default('secret', true), true), true), true) }}"
    _vault_hosts_prefix_eff: "{{ (lookup('ansible.builtin.env', 'OPENBAO_HOSTS_PREFIX') | default('hosts/', true)) | regex_replace('^secret/', '') }}"
    _vault_headers_eff: >-
      {{ {'X-Vault-Token': _vault_token_eff} | combine({'X-Vault-Namespace': _vault_ns_eff} if (_vault_ns_eff | length > 0) else {}) }}
  ansible.builtin.uri:
    url: "{{ _vault_addr_eff }}/v1/{{ _vault_mount_eff }}/data/{{ _vault_hosts_prefix_eff }}{{ inventory_hostname }}/agents"
    method: GET
    headers: "{{ _vault_headers_eff }}"
    status_code: [200, 404]
    timeout: 5
    validate_certs: false
  register: host_agents_host_resp
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - host_agents_kv_fixture is not defined
    - _vault_token_eff | length > 0

- name: "[MON-031] Fetch shared OpenObserve secrets from OpenBao (agents/openobserve)"
  vars: *openbao_vars
  ansible.builtin.uri:
    url: "{{ _vault_addr_eff }}/v1/{{ _vault_mount_eff }}/data/agents/openobserve"
    method: GET
    headers: "{{ _vault_headers_eff }}"
    status_code: [200, 404]
    timeout: 5
    validate_certs: false
  register: host_agents_o2_resp
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - host_agents_kv_fixture is not defined
    - _vault_token_eff | length > 0

- name: "[MON-032] Fetch shared RustFS secrets from OpenBao (agents/rustfs)"
  vars: *openbao_vars
  ansible.builtin.uri:
    url: "{{ _vault_addr_eff }}/v1/{{ _vault_mount_eff }}/data/agents/rustfs"
    method: GET
    headers: "{{ _vault_headers_eff }}"
    status_code: [200, 404]
    timeout: 5
    validate_certs: false
  register: host_agents_rustfs_resp
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - host_agents_kv_fixture is not defined
    - _vault_token_eff | length > 0

- name: "[MON-033] Assert OpenBao answered every agents lookup"
  ansible.builtin.assert:
    that:
      - host_agents_kv_fixture is defined or (host_agents_host_resp.status | default(-1)) in [200, 404]
      - host_agents_kv_fixture is defined or (host_agents_o2_resp.status | default(-1)) in [200, 404]
      - host_agents_kv_fixture is defined or (host_agents_rustfs_resp.status | default(-1)) in [200, 404]
    fail_msg: >-
      {{ inventory_hostname }}: OpenBao 조회 실패 — 변경 없이 중단합니다(check 모드 포함).
      hosts/{{ inventory_hostname }}/agents status={{ host_agents_host_resp.status | default('토큰 없음/미조회') }},
      agents/openobserve status={{ host_agents_o2_resp.status | default('토큰 없음/미조회') }},
      agents/rustfs status={{ host_agents_rustfs_resp.status | default('토큰 없음/미조회') }}
      ({{ host_agents_host_resp.msg | default(host_agents_o2_resp.msg | default(host_agents_rustfs_resp.msg | default(''))) }})
    quiet: true

- name: "[MON-034] Resolve agents KV contents (host + shared)"
  ansible.builtin.set_fact:
    _host_agents_kv:
      host: >-
        {{ host_agents_kv_fixture.host | default({})
           if host_agents_kv_fixture is defined
           else ((host_agents_host_resp.json.data.data | default({})) if host_agents_host_resp.status == 200 else {}) }}
      openobserve: >-
        {{ host_agents_kv_fixture.openobserve | default({})
           if host_agents_kv_fixture is defined
           else ((host_agents_o2_resp.json.data.data | default({})) if host_agents_o2_resp.status == 200 else {}) }}
      rustfs: >-
        {{ host_agents_kv_fixture.rustfs | default({})
           if host_agents_kv_fixture is defined
           else ((host_agents_rustfs_resp.json.data.data | default({})) if host_agents_rustfs_resp.status == 200 else {}) }}
  no_log: true

# 병합 결과에는 시크릿 값이 없다(경로/스트림/플래그뿐).
- name: "[MON-035] Merge agents inputs with the Git standard"
  ansible.builtin.set_fact:
    host_agents_inputs: >-
      {{ _host_agents_kv.host | host_agents_resolve_inputs(
           otel_system_logs, otel_security_log_paths, host_agents_backup_mandatory_paths,
           'hosts/' ~ inventory_hostname ~ '/agents') }}

- name: "[MON-036] Assert agents inputs are valid before any change"
  ansible.builtin.assert:
    that: host_agents_inputs.errors | length == 0
    fail_msg: "{{ inventory_hostname }}: Host Agents 입력 검증 실패 — {{ host_agents_inputs.errors | join('; ') }}"
    quiet: true

- name: "[MON-037] Set agents secrets as host facts"
  ansible.builtin.set_fact:
    host_agents_secrets: "{{ _host_agents_kv.host | host_agents_secrets }}"
    host_agents_shared_secrets: "{{ {'openobserve': _host_agents_kv.openobserve, 'rustfs': _host_agents_kv.rustfs} }}"
  no_log: true
