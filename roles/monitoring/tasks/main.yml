---
# ==============================================================================
# 0. Host Agents 사전 단계 (프로비저닝 확인 · OS 프로브 · OpenBao 입력 검증)
# ==============================================================================
# tags: [always] — --tags agents_config / backup 실행에서도 반드시 수행되어야
# host_agents_os_* fact와 host_agents_inputs가 정의된다.
- name: Probe OS path and ensure python3 and facts
  ansible.builtin.import_tasks: probe.yml
  tags: [always]

- name: Resolve and validate Host Agents inputs from OpenBao
  ansible.builtin.import_tasks: agents_input.yml
  tags: [always]

# ==============================================================================
# 1. Legacy Node Exporter Cleanup (Complete Removal)
# ==============================================================================
- name: "Install agents and clean legacy exporter"
  tags: [agents_install, otel]
  when: host_agents_os_path == 'modern'
  block:
  - name: "[MON-011] Stop and disable legacy node_exporter service"
    ansible.builtin.systemd:
      name: node_exporter
      state: stopped
      enabled: false
    when:
      - cleanup_legacy_node_exporter | default(true) | bool
      - ansible_service_mgr == "systemd"
    failed_when: false

  - name: "[MON-012] Remove legacy node_exporter systemd unit file"
    ansible.builtin.file:
      path: /etc/systemd/system/node_exporter.service
      state: absent
    when:
      - cleanup_legacy_node_exporter | default(true) | bool
      - ansible_service_mgr == "systemd"

  - name: "[MON-013] Remove legacy node_exporter binary"
    ansible.builtin.file:
      path: /usr/local/bin/node_exporter
      state: absent
    when: cleanup_legacy_node_exporter | default(true) | bool

  - name: "[MON-014] Remove legacy node_exporter user"
    ansible.builtin.user:
      name: node_exporter
      state: absent
      remove: true
    when: cleanup_legacy_node_exporter | default(true) | bool
    failed_when: false

  - name: "[MON-015] Remove legacy node_exporter group"
    ansible.builtin.group:
      name: node_exporter
      state: absent
    when: cleanup_legacy_node_exporter | default(true) | bool
    failed_when: false

  # ==============================================================================
  # 2. OpenTelemetry Collector Contrib Deployment (OpenObserve Ingestion Pipeline)
  # ==============================================================================
  - name: "[MON-001] Create otelcol system group"
    ansible.builtin.group:
      name: "{{ otelcol_group }}"
      system: true
      state: present
    when: enable_otelcol | default(true) | bool

  - name: "[MON-067] Look up the docker socket group (only when docker metrics are enabled)"
    ansible.builtin.getent:
      database: group
      key: "{{ otel_docker_group }}"
    register: _otelcol_docker_group
    failed_when: false
    check_mode: false
    when:
      - enable_otelcol | default(true) | bool
      - host_agents_inputs.otel_docker_metrics | bool

  - name: "[MON-002] Create otelcol system user"
    ansible.builtin.user:
      name: "{{ otelcol_user }}"
      group: "{{ otelcol_group }}"
      groups: >-
        {{ ['adm' if ansible_os_family == 'Debian' else 'systemd-journal']
           + ([otel_docker_group] if (_otelcol_docker_group.ansible_facts.getent_group | default({})) | length > 0 else []) }}
      append: true
      system: true
      shell: /sbin/nologin
      create_home: false
      state: present
    when: enable_otelcol | default(true) | bool

  - name: "[MON-061] Ensure otelcol persistent storage directory exists (filelog checkpoints and log queue)"
    ansible.builtin.file:
      path: "{{ otelcol_storage_dir }}"
      state: directory
      owner: "{{ otelcol_user }}"
      group: "{{ otelcol_group }}"
      mode: '0750'
    when: enable_otelcol | default(true) | bool

  - name: "[MON-003] Deliver pinned OpenTelemetry Collector Contrib binary"
    ansible.builtin.include_tasks: deliver_binary.yml
    vars:
      _otelcol_version: "{{ host_agents_versions['default'].otelcol_contrib }}"
      _deliver_agent: otelcol-contrib
      _deliver_binary: otelcol-contrib
      _deliver_version: "{{ _otelcol_version }}"
      _deliver_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ _otelcol_version }}/otelcol-contrib_{{ _otelcol_version }}_linux_{{ host_agents_os_arch }}.tar.gz"
      _deliver_sha256: "{{ host_agents_checksums.otelcol_contrib[_otelcol_version][host_agents_os_arch] }}"
    when: enable_otelcol | default(true) | bool


- name: "Apply otelcol configuration"
  tags: [agents_config, otel]
  when: host_agents_os_path == 'modern'
  block:
  - name: "[MON-060] Assert OpenObserve endpoint is configured without a trailing slash"
    ansible.builtin.assert:
      that:
        - o2_endpoint | length > 0
        - not (o2_endpoint is match('.*/$'))
        - o2_endpoint is match('^https?://')
      fail_msg: >-
        {{ inventory_hostname }}: o2_endpoint(inventory/group_vars/servers.yml)가 비어 있거나 형식이 잘못되었습니다
        (http(s)://host:port, 끝 슬래시 금지 — <endpoint>/api/<org> 경로가 404가 됩니다).
      quiet: true
    when: enable_otelcol | default(true) | bool

  - name: "[MON-062] Detect rsyslog (journald is collected only where rsyslog is absent)"
    ansible.builtin.stat:
      path: "{{ item }}"
    loop: [/usr/sbin/rsyslogd, /sbin/rsyslogd]
    register: _otelcol_rsyslog
    check_mode: false
    when: enable_otelcol | default(true) | bool

  - name: "[MON-064] Decide whether the journald receiver is needed"
    ansible.builtin.set_fact:
      host_agents_journald: "{{ _otelcol_rsyslog.results | map(attribute='stat.exists') | select | list | length == 0 }}"
    when: enable_otelcol | default(true) | bool

  - name: "[MON-004] Deploy OpenTelemetry Collector Contrib configuration (Hostmetrics & Log Pipeline)"
    block:
      - name: "[MON-004-DIR] Ensure OpenTelemetry configuration directory exists"
        ansible.builtin.file:
          path: "{{ otelcol_config_dir }}"
          state: directory
          owner: root
          group: "{{ otelcol_group }}"
          mode: '0750'

      - name: "[MON-063] Ensure otelcol secrets directory exists"
        ansible.builtin.file:
          path: "{{ otelcol_secrets_dir }}"
          state: directory
          owner: root
          group: root
          mode: '0700'

      - name: "[MON-065] Deploy otelcol secrets env file (0600, no_log, no diff)"
        ansible.builtin.template:
          src: secrets.env.j2
          dest: "{{ otelcol_secrets_path }}"
          owner: root
          group: root
          mode: '0600'
        no_log: true
        diff: false
        notify: Restart otelcol-contrib

      - name: "[MON-004-CONF] Deploy OpenTelemetry Collector configuration"
        ansible.builtin.template:
          src: otelcol-contrib.yaml.j2
          dest: "{{ otelcol_config_path }}"
          owner: root
          group: "{{ otelcol_group }}"
          mode: '0640'
          validate: "{{ host_agents_install_root }}/otelcol-contrib/{{ host_agents_versions['default'].otelcol_contrib }}/otelcol-contrib validate --config=%s"
        notify: Restart otelcol-contrib

    when: enable_otelcol | default(true) | bool


- name: "Enable otelcol service"
  tags: [agents_install, otel]
  when: host_agents_os_path == 'modern'
  block:
  # 새 설정이 새 바이너리로 검증된 뒤(MON-004-CONF의 template validate)에만 symlink를 교체하고 핸들러가 재시작한다.
  - name: "[MON-054] Switch otelcol-contrib install symlink to the delivered version"
    ansible.builtin.include_tasks: switch_binary.yml
    vars:
      _deliver_binary: otelcol-contrib
      _deliver_handler: Restart otelcol-contrib
    when: enable_otelcol | default(true) | bool

  - name: "[MON-005] Create systemd service for otelcol-contrib"
    ansible.builtin.template:
      src: otelcol-contrib.service.j2
      dest: "{{ otelcol_systemd_unit_dir }}/otelcol-contrib.service"
      owner: root
      group: root
      mode: '0644'
    register: otelcol_unit_created
    when:
      - enable_otelcol | default(true) | bool
      - ansible_service_mgr == "systemd"
    notify: Restart otelcol-contrib

  - name: "[MON-066] Reload systemd units when the otelcol unit changed"
    ansible.builtin.systemd:
      daemon_reload: true
    when:
      - enable_otelcol | default(true) | bool
      - ansible_service_mgr == "systemd"
      - otelcol_unit_created is changed
    changed_when: true

  - name: "[MON-005-SYSV] Create SysVinit service script for otelcol-contrib"
    ansible.builtin.template:
      src: otelcol-contrib.init.j2
      dest: /etc/init.d/otelcol-contrib
      owner: root
      group: root
      mode: '0755'
    when:
      - enable_otelcol | default(true) | bool
      - ansible_service_mgr != "systemd"
    notify: Restart otelcol-contrib

  - name: "[MON-006] Ensure otelcol-contrib service is started and enabled"
    ansible.builtin.service:
      name: otelcol-contrib
      state: started
      enabled: true
    when:
      - enable_otelcol | default(true) | bool
      - not ansible_check_mode or (otelcol_unit_created is defined and not otelcol_unit_created.changed)
    ignore_errors: "{{ ansible_check_mode }}"

# ==============================================================================
# CentOS 7 (legacy_el7): 모듈을 쓸 수 없으므로 raw 경로(파일 전달 헬퍼)로 같은 템플릿을 적용한다.
# static import이므로 when/tags가 가져온 태스크에 그대로 전파된다(tags는 legacy_el7.yml 안의 블록이 지정).
# ==============================================================================
- name: Apply otelcol on CentOS 7 over the raw path
  ansible.builtin.import_tasks: legacy_el7.yml
  when: host_agents_os_path == 'legacy_el7'
