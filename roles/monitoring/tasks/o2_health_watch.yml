---
# ==============================================================================
# OpenObserve 생존 타이머 (Spec #184 / Ticket-7) — 검사하는 쪽 호스트(host_agents_o2_health_checker, ns0266)에만 배포
# ==============================================================================
# OpenObserve 헬스(/healthz)가 실패하면 OpenObserve를 거치지 않고 사내 알림 플랫폼 text/plain webhook으로 직접 P1을 보낸다.
# webhook 주소는 OpenBao secrets/services/alert/notify의 url 하나다(URL 자체가 권한이라 비밀 쪽, 인증 헤더 없음).
- name: "[MON-219] Assert the checker host uses the modern path so the health timer is not silently skipped"
  ansible.builtin.assert:
    that:
      - host_agents_os_path == 'modern'
    fail_msg: >-
      {{ inventory_hostname }}: 검사하는 쪽 호스트(host_agents_o2_health_checker)는 modern 경로여야 합니다
      (현재 {{ host_agents_os_path }}). 건너뛰면 OpenObserve 생존 타이머(OpenObserve 응답 없음 P1 직접 통지)가
      조용히 빠지므로 중단합니다. legacy 호스트는 검사하는 쪽으로 지정할 수 없습니다.
    quiet: true
  when: inventory_hostname == host_agents_o2_health_checker

- name: "Deploy the OpenObserve health timer on the checker host only"
  when:
    - inventory_hostname == host_agents_o2_health_checker
    - host_agents_os_path == 'modern'
  block:
    # 알림 주소 문서는 한 번만 읽고(시크릿이라 no_log) 검증과 env 렌더링이 같은 값을 쓴다. 실패 사유(문서 경로·상태 코드)는 경고로 나온다.
    - name: Read the alert notify document once for the health timer
      ansible.builtin.set_fact:
        _alert_notify: "{{ lookup('openbao_doc', 'secrets/services/alert/notify', errors='warn') }}"
      check_mode: false
      no_log: true

    - name: "[MON-220] Assert the alert webhook URL is available for the health timer"
      ansible.builtin.assert:
        that:
          - _alert_notify is mapping
          - (_alert_notify.url | default('')) is match('^https?://')
        fail_msg: >-
          {{ inventory_hostname }}: OpenBao secrets/services/alert/notify의 url을 읽지 못했거나 형식이 잘못되어
          OpenObserve 생존 타이머를 배포할 수 없습니다(OpenObserve — Config와 같은 값을 쓴다).
        quiet: true

    - name: "[MON-221] Ensure OpenObserve health config and state directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ host_agents_owner }}"
        group: "{{ host_agents_group }}"
        mode: '0700'
      loop:
        - "{{ o2_health_config_dir }}"
        - "{{ o2_health_state_dir }}"

    - name: "[MON-222] Deploy the OpenObserve health check script"
      ansible.builtin.copy:
        src: "{{ role_path }}/files/openobserve-health-check.sh"
        dest: "{{ o2_health_script_path }}"
        owner: "{{ host_agents_owner }}"
        group: "{{ host_agents_group }}"
        mode: '0755'

    - name: "[MON-223] Deploy the OpenObserve health env file (0600, no_log, no diff)"
      ansible.builtin.template:
        src: "{{ role_path }}/templates/openobserve-health.env.j2"
        dest: "{{ o2_health_config_dir }}/env"
        owner: "{{ host_agents_owner }}"
        group: "{{ host_agents_group }}"
        mode: '0600'
      no_log: true
      diff: false

    - name: "[MON-224] Deploy the OpenObserve health service and timer units"
      ansible.builtin.template:
        src: "{{ role_path }}/templates/openobserve-health.{{ item }}.j2"
        dest: "{{ otelcol_systemd_unit_dir }}/openobserve-health.{{ item }}"
        owner: "{{ host_agents_owner }}"
        group: "{{ host_agents_group }}"
        mode: '0644'
      loop: [service, timer]
      register: _o2_health_units

    - name: "[MON-225] Reload systemd units when the OpenObserve health units changed"
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - ansible_service_mgr == "systemd"
        - _o2_health_units is changed
      changed_when: true

    - name: "[MON-226] Ensure the OpenObserve health timer is enabled and running"
      ansible.builtin.systemd:
        name: openobserve-health.timer
        state: started
        enabled: true
      when:
        - ansible_service_mgr == "systemd"
        - not ansible_check_mode or not (_o2_health_units is changed)
