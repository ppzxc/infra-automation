- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart otelcol-contrib
  ansible.builtin.service:
    name: otelcol-contrib
    state: restarted
    enabled: true
  failed_when: false



# legacy 경로(raw): 모듈을 쓸 수 없으므로 서비스 관리자를 raw로 호출한다.
# CentOS 7은 systemctl, CentOS 6(SysV init)에는 systemctl이 없어 service를 쓴다.
- name: Reload systemd daemon (raw)
  ansible.builtin.raw: systemctl daemon-reload
  changed_when: true

- name: Restart otelcol-contrib (raw)
  ansible.builtin.raw: >-
    {{ 'service otelcol-contrib restart' if host_agents_os_path == 'legacy_el6' else 'systemctl restart otelcol-contrib' }}
  changed_when: true
  # restart의 종료코드는 삼킨다: EL6 init은 start 유예 안에 죽으면 rc=1이고, 여기서 실패하면 같은 topic의
  # MON-216 핸들러가 건너뛰어져 재시도 없이 끝난다. 실패 판정은 반드시 MON-216(생존 확인 -> start 재시도 -> 호스트 failed)이 한다.
  failed_when: false

# 재시작 뒤 수집기가 살아 있는지 확인한다(MON-216). 같은 topic을 listen하므로 위 재시작 핸들러 직후에 실행되며,
# 죽어 있으면 그 호스트만 실패한다(나머지 호스트는 계속 진행).
- name: Verify otelcol-contrib is alive after restart (raw)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/legacy_verify_alive.yml"
  listen: Restart otelcol-contrib (raw)
