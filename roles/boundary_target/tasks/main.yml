---
- name: "[BND-001] Skip Boundary Target if disabled"
  ansible.builtin.debug:
    msg: "Boundary Target configuration is disabled (enable_boundary=false). Skipping."
  when: not (enable_boundary | default(false) | bool)

- name: "[BND-002] Create Boundary target metadata directory"
  ansible.builtin.file:
    path: /etc/boundary
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: enable_boundary | default(false) | bool

- name: "[BND-003] Write Boundary Target Node Info"
  ansible.builtin.copy:
    dest: /etc/boundary/node-metadata.json
    content: |
      {
        "hostname": "{{ inventory_hostname }}",
        "ip": "{{ ansible_default_ipv4.address | default(ansible_host) }}",
        "target_type": "{{ boundary_target_type | default('ssh') }}",
        "target_port": {{ boundary_target_port | default(22) }},
        "tags": {{ boundary_worker_tags | default([]) | to_json }},
        "provisioned_at": "{{ '%Y-%m-%d %H:%M:%S' | strftime }}"
      }
    owner: root
    group: root
    mode: '0644'
  when: enable_boundary | default(false) | bool
