    - internal_allowed_subnets | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-017-CLI] Configure internal zone for private VPC subnets (RHEL/Rocky 7+) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=internal
      - --add-source={{ item }}
  register: sec017_cli
  loop: "{{ internal_allowed_subnets | default([]) }}"
