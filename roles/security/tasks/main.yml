---
# 1. SSH Hardening
- name: "[SEC-001-DROPIN] Remove conflicting sshd_config.d drop-in files"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    state: absent
  notify: Restart sshd

- name: "[SEC-001] Configure SSH Hardening parameters"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?Port', line: 'Port {{ ssh_port | default(22) }}' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ ssh_permit_root_login }}' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ ssh_password_authentication }}' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ ssh_pubkey_authentication }}' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ ssh_max_auth_tries }}' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ ssh_client_alive_interval }}' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ ssh_client_alive_count_max }}' }
  notify: Restart sshd

# 2. Firewall configuration (UFW for Debian/Ubuntu)
- name: "[SEC-002] Ensure UFW is installed (Debian)"
  ansible.builtin.apt:
    name: ufw
    state: present
  when: ansible_os_family == "Debian"

- name: "[SEC-003] Allow incoming TCP ports via UFW (Debian)"
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ (firewall_allowed_tcp_ports | default([])) if (ssh_allowed_source_ips is not defined or ssh_allowed_source_ips | length == 0) else (firewall_allowed_tcp_ports | default([]) | reject('equalto', (ssh_port | default(22) | string)) | reject('equalto', (ssh_port | default(22) | int)) | list) }}"
  when: ansible_os_family == "Debian"

- name: "[SEC-004] Enable UFW with default deny incoming (Debian)"
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
  when: ansible_os_family == "Debian"

# 3. Firewall configuration (Firewalld for CentOS 7, 8, Rocky 9, 10)
- name: "[SEC-005] Ensure firewalld is installed and running (RHEL/Rocky 7+)"
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[SEC-006] Ensure firewalld service is started and enabled (RHEL/Rocky 7+)"
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[SEC-006-UNBIND-DROP] Remove physical network interface from drop zone if moving to another zone"
  ansible.posix.firewalld:
    zone: drop
    interface: "{{ item }}"
    permanent: yes
    state: disabled
    immediate: yes
  loop:
    - "{{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}"
    - "bond0"
    - "eno1"
    - "eno2"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface_zone | default('public')) != "drop"
  failed_when: false

- name: "[SEC-006-IFACE] Bind physical network interface to interface zone"
  ansible.posix.firewalld:
    zone: "{{ firewall_interface_zone | default('public') }}"
    interface: "{{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}"
    permanent: yes
    state: enabled
    immediate: yes
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface | default(ansible_default_ipv4.interface | default('bond0'))) | length > 0

- name: "[SEC-006-MASQ] Ensure masquerade is enabled for outbound traffic on interface zone"
  ansible.posix.firewalld:
    zone: "{{ firewall_interface_zone | default('public') }}"
    masquerade: yes
    permanent: yes
    state: enabled
    immediate: yes
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
  failed_when: false

- name: "[SEC-006-POLICY] Ensure egress policy allows forwarding from docker to physical interface zone (RHEL 9+)"
  ansible.builtin.shell: |
    firewall-cmd --permanent --new-policy docker-to-ext 2>/dev/null || true
    firewall-cmd --permanent --policy docker-to-ext --add-ingress-zone docker
    firewall-cmd --permanent --policy docker-to-ext --add-egress-zone {{ firewall_interface_zone | default('public') }}
    firewall-cmd --permanent --policy docker-to-ext --set-target ACCEPT
    firewall-cmd --permanent --policy docker-to-ext --add-masquerade
    firewall-cmd --permanent --zone=docker --add-masquerade 2>/dev/null || true
    firewall-cmd --reload
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 9
  changed_when: false
  failed_when: false

- name: "[SEC-006-CLEAN-PUBLIC] Clean up public zone default open services when restricted"
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: yes
    state: disabled
    immediate: yes
  loop:
    - ssh
    - cockpit
    - dhcpv6-client
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0
  failed_when: false

- name: "[SEC-006-CLEAN-ZONE-DEFAULTS] Clean up default unneeded services from dmz, work, internal zones"
  ansible.posix.firewalld:
    zone: "{{ item.0 }}"
    service: "{{ item.1 }}"
    permanent: yes
    state: disabled
    immediate: yes
  loop:
    - ["dmz", "ssh"]
    - ["work", "dhcpv6-client"]
    - ["work", "cockpit"]
    - ["internal", "mdns"]
    - ["internal", "samba-client"]
    - ["internal", "dhcpv6-client"]
    - ["internal", "cockpit"]
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
  failed_when: false

- name: "[SEC-006-CLEAN-PUBLIC-RICH] Clean up stale rich rules from public zone"
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ ssh_port | default(22) }}" protocol="tcp" accept'
    permanent: yes
    state: disabled
    immediate: yes
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
  failed_when: false

- name: "[SEC-020] Configure custom firewall ingress rules with source IP restrictions (firewalld)"
  ansible.posix.firewalld:
    zone: "{{ firewall_source_zone | default('work') }}"
    source: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0

- name: "[SEC-007-SSH] Ensure SSH service is enabled in source zone"
  ansible.posix.firewalld:
    zone: "{{ firewall_source_zone | default('work') }}"
    service: ssh
    permanent: yes
    state: enabled
    immediate: yes
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0

- name: "[SEC-006-CLEAN-STALE-SOURCES] Clean up stale sources from conflicting zones (trusted, drop)"
  ansible.posix.firewalld:
    zone: "{{ item.0 }}"
    source: "{{ item.1 }}"
    permanent: yes
    state: disabled
    immediate: yes
  loop: "{{ ['trusted', 'drop'] | product((ssh_allowed_source_ips | default([])) + ['59.25.177.53', '39.116.31.0/24']) | list }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - item.0 != (firewall_source_zone | default('work'))
  failed_when: false

- name: "[SEC-007-SERVICES] Allow standard services via firewalld (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: "{{ firewall_interface_zone | default('public') }}"
    service: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_allowed_services | default(['http', 'https']) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_allowed_services is defined
    - firewall_allowed_services | length > 0

- name: "[SEC-007-DMZ] Configure dmz zone for monitoring sources (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: dmz
    source: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ monitoring_allowed_subnets | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - monitoring_allowed_subnets is defined
    - monitoring_allowed_subnets | length > 0

- name: "[SEC-007-DMZ-PORTS] Allow monitoring metric collection ports in dmz zone (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: dmz
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_dmz_ports | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_dmz_ports is defined
    - firewall_dmz_ports | length > 0

- name: "[SEC-007-INTERNAL] Configure internal zone for private VPC subnets (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: internal
    source: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ internal_allowed_subnets | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - internal_allowed_subnets is defined
    - internal_allowed_subnets | length > 0

- name: "[SEC-007-INTERNAL-PORTS] Allow internal backend ports in internal zone (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: internal
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_internal_ports | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_internal_ports is defined
    - firewall_internal_ports | length > 0

- name: "[SEC-007] Allow incoming TCP ports via firewalld (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: "{{ (firewall_source_zone | default('work')) if (ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0) else (firewall_interface_zone | default('public')) }}"
    port: "{{ item }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_allowed_tcp_ports | default([ssh_port | default(22)]) }}"
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

# 4. Firewall configuration (iptables for CentOS 6 legacy)
- name: "[SEC-008] Allow incoming TCP ports via iptables (CentOS 6)"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item | string }}"
    jump: ACCEPT
    action: insert
  loop: "{{ (firewall_allowed_tcp_ports | default([])) if (ssh_allowed_source_ips is not defined or ssh_allowed_source_ips | length == 0) else (firewall_allowed_tcp_ports | default([]) | reject('equalto', (ssh_port | default(22) | string)) | reject('equalto', (ssh_port | default(22) | int)) | list) }}"
  when: ansible_distribution == "CentOS" and (ansible_distribution_major_version | int == 6)

# 5. Fail2ban configuration (Optional / EPEL dependent)
- name: "[SEC-009] Install fail2ban package if available"
  ansible.builtin.package:
    name: fail2ban
    state: present
  register: fail2ban_install_result
  failed_when: false

- name: "[SEC-010] Ensure fail2ban is running and enabled (if installed)"
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_install_result is defined and not fail2ban_install_result.failed | default(false)
  failed_when: false

# 6. SELinux configuration (Permissive mode)
- name: "[SEC-011] Configure SELinux in permissive mode (RHEL/Rocky 7+)"
  ansible.posix.selinux:
    policy: "{{ selinux_policy | default('targeted') }}"
    state: "{{ selinux_mode | default('permissive') }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
  failed_when: false

# 7. Auditd configuration
- name: "[SEC-012] Deploy Auditd security audit rules"
  ansible.builtin.template:
    src: audit.rules.j2
    dest: "{{ '/etc/audit/rules.d/overseer.rules' if ansible_distribution_major_version | int >= 7 else '/etc/audit/audit.rules' }}"
    owner: root
    group: root
    mode: '0600'
  when: ansible_os_family == "RedHat"
  notify: Restart auditd
  failed_when: false

- name: "[SEC-013] Ensure Auditd service is running and enabled"
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"
  failed_when: false

# 8. Sudo Policy & Log segregation
- name: "[SEC-014] Configure Sudo timestamp timeout and log file"
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-security-policy
    content: |
      Defaults timestamp_timeout={{ sudo_timestamp_timeout | default(15) }}
      Defaults logfile="{{ sudo_log_file | default('/var/log/sudo.log') }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

# 9. Fail2ban SSH jail deployment
- name: "[SEC-015] Deploy Fail2ban SSH jail configuration"
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  when: fail2ban_install_result is defined and not fail2ban_install_result.failed | default(false)
  notify: Restart fail2ban
  failed_when: false

# 10. Custom Ingress Rules with Source IP restrictions
- name: "[SEC-019] Configure custom firewall ingress rules with source IP restrictions (UFW)"

  community.general.ufw:
    rule: allow
    port: "{{ item.0.port | string }}"
    proto: "{{ item.0.proto | default('tcp') }}"
    from_ip: "{{ item.1 }}"
  loop: "{{ ((firewall_ingress_rules | default([])) + ([{'port': (ssh_port | default(22)), 'proto': 'tcp', 'sources': ssh_allowed_source_ips}] if (ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0) else [])) | subelements('sources', skip_missing=True) }}"
  when:
    - ansible_os_family == "Debian"
    - (firewall_ingress_rules is defined and firewall_ingress_rules | length > 0) or (ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0)

- name: "[SEC-020-RICH] Configure custom rich rules with source IP restrictions (firewalld)"
  ansible.posix.firewalld:
    zone: "{{ firewall_source_zone | default('work') }}"
    rich_rule: 'rule family="ipv4" source address="{{ item.1 }}" port port="{{ item.0.port }}" protocol="{{ item.0.proto | default("tcp") }}" accept'
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_ingress_rules | default([]) | subelements('sources', skip_missing=True) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_ingress_rules is defined
    - firewall_ingress_rules | length > 0

- name: "[SEC-021] Configure custom firewall ingress rules with source IP restrictions (iptables)"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.0.proto | default('tcp') }}"
    destination_port: "{{ item.0.port | string }}"
    source: "{{ item.1 }}"
    jump: ACCEPT
    action: insert
  loop: "{{ ((firewall_ingress_rules | default([])) + ([{'port': (ssh_port | default(22)), 'proto': 'tcp', 'sources': ssh_allowed_source_ips}] if (ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0) else [])) | subelements('sources', skip_missing=True) }}"
  when:
    - ansible_distribution == "CentOS"
    - ansible_distribution_major_version | int == 6
    - (firewall_ingress_rules is defined and firewall_ingress_rules | length > 0) or (ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0)





