---
# 1. SSH Hardening
- name: "[SEC-001-DROPIN] Remove conflicting sshd_config.d drop-in files"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    state: absent
  notify: Restart sshd

- name: "[SEC-001] Configure SSH Hardening parameters"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?Port', line: 'Port {{ ssh_port | default(22) }}' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ ssh_permit_root_login }}' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ ssh_password_authentication }}' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ ssh_pubkey_authentication }}' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ ssh_max_auth_tries }}' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ ssh_client_alive_interval }}' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ ssh_client_alive_count_max }}' }
  notify: Restart sshd

# 2. Firewall configuration (UFW for Debian/Ubuntu)
- name: "[SEC-002] Ensure UFW is installed (Debian)"
  ansible.builtin.apt:
    name: ufw
    state: present
  when: ansible_os_family == "Debian"

- name: "[SEC-003] Allow incoming TCP ports via UFW (Debian)"
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ (firewall_allowed_tcp_ports | default([])) if (ssh_allowed_source_ips is not defined or ssh_allowed_source_ips | length == 0) else (firewall_allowed_tcp_ports | default([]) | reject('equalto', (ssh_port | default(22) | string)) | reject('equalto', (ssh_port | default(22) | int)) | list) }}"
  when: ansible_os_family == "Debian"

- name: "[SEC-004] Enable UFW with default deny incoming (Debian)"
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
  when: ansible_os_family == "Debian"

# 3. Firewall configuration (Firewalld for CentOS 7, 8, Rocky 9, 10)
- name: "[SEC-005] Ensure firewalld is installed and running (RHEL/Rocky 7+)"
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[SEC-006] Ensure firewalld service is started and enabled (RHEL/Rocky 7+)"
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

# firewalld's Python bindings (firewall.client, backed by PyGObject's _gi.so)
# hard-lock to the CPython minor version they were compiled against (e.g.
# cp36 on RockyLinux 8's stock python3.6.8). When ansible_python_interpreter
# points at a different interpreter for AnsiballZ compatibility (see
# [PREPARE-000-PY311] in molecule/default/prepare.yml for the test-only
# equivalent of this exact scenario), `import firewall.client` under that
# interpreter fails with an ABI mismatch, which ansible.posix.firewalld
# surfaces as an import error rather than a clean skip. ansible-core's
# built-in respawn-into-system-python mechanism cannot rescue this either:
# probe_interpreters_for_module() only accepts a candidate interpreter if it
# can import BOTH the target module's name AND ansible.module_utils.basic in
# the same probe, and the system python on these hosts fails that compound
# check for unrelated reasons (its stdlib predates `from __future__ import
# annotations`, which every AnsiballZ wrapper uses). Confirmed via direct
# probe on test-rockylinux8: `{{ ansible_python_interpreter }} -c "import
# firewall.client"` fails, while firewall-cmd/firewall-offline-cmd (separate
# executables, self-contained via their own platform-python shebang) succeed
# unconditionally. Every ansible.posix.firewalld task below therefore has a
# firewall-cmd CLI sibling gated on this fact being false.
- name: "[SEC-006-PROBE] Probe whether ansible.posix.firewalld's Python bindings import cleanly on the target interpreter"
  # ansible_python_interpreter is only defined here when a play/inventory
  # explicitly overrides it (e.g. this scenario's test-rockylinux8 host_vars,
  # which force python3.11 because the image's stock 3.6 can't parse
  # AnsiballZ's `from __future__ import annotations`). On every other host it
  # is undefined, and referencing it directly crashes command's _raw_params
  # finalization with "'ansible_python_interpreter' is undefined" before this
  # task even runs -- confirmed on test-rockylinux9. gather_facts always
  # populates ansible_facts.python.executable with whatever interpreter
  # actually ran, so fall back to that.
  ansible.builtin.command: "{{ ansible_python_interpreter | default(ansible_facts['python']['executable']) }} -c 'import firewall.client'"
  register: firewalld_module_probe
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[SEC-006-PROBE-FACT] Record firewalld module usability (defaults to usable when the probe did not run, e.g. Debian)"
  ansible.builtin.set_fact:
    firewalld_module_usable: "{{ (firewalld_module_probe.rc | default(0)) == 0 }}"

- name: "[SEC-006-UNBIND-DROP] Remove physical network interface from drop zone if moving to another zone"
  ansible.posix.firewalld:
    zone: drop
    interface: "{{ item }}"
    permanent: true
    state: disabled
    immediate: true
  loop:
    - "{{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}"
    - "bond0"
    - "eno1"
    - "eno2"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface_zone | default('public')) != "drop"
    - firewalld_module_usable | default(true)
  failed_when: false

- name: "[SEC-006-UNBIND-DROP-CLI] Remove physical network interface from drop zone if moving to another zone (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=drop
      - --remove-interface={{ item }}
  register: sec006_unbind_drop_cli
  loop:
    - "{{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}"
    - "bond0"
    - "eno1"
    - "eno2"
  # --remove-interface follows the same add/remove idempotency convention as
  # --remove-service/--remove-source: rc is always 0, but a no-op emits
  # "Warning: NOT_ENABLED: ..." on stderr when the interface was never bound
  # to this zone.
  changed_when: "'NOT_ENABLED' not in sec006_unbind_drop_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface_zone | default('public')) != "drop"
    - not (firewalld_module_usable | default(true))
  failed_when: false
  notify: Reload firewalld

- name: "[SEC-006-IFACE] Bind physical network interface to interface zone"
  ansible.posix.firewalld:
    zone: "{{ firewall_interface_zone | default('public') }}"
    interface: "{{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}"
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface | default(ansible_default_ipv4.interface | default('bond0'))) | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-006-IFACE-CLI-PROBE] Look up the zone the physical network interface is currently bound to (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --get-zone-of-interface={{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}
  register: sec006_iface_current_zone
  changed_when: false
  # Exits 0 with empty stdout when the interface is unbound in the permanent
  # configuration -- not an error condition, so never fail the play here.
  failed_when: false
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface | default(ansible_default_ipv4.interface | default('bond0'))) | length > 0
    - not (firewalld_module_usable | default(true))

- name: "[SEC-006-IFACE-CLI] Bind physical network interface to interface zone (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ firewall_interface_zone | default('public') }}
      - --change-interface={{ firewall_interface | default(ansible_default_ipv4.interface | default('bond0')) }}
  # Unlike --add-*/--remove-* operations, --change-interface never emits an
  # ALREADY_ENABLED-style warning on stderr when the interface is already in
  # the target zone (confirmed empirically) -- it silently reports success
  # either way. changed_when is therefore derived from the preceding probe's
  # output instead of this command's own stderr.
  changed_when: (sec006_iface_current_zone.stdout | default('')) != (firewall_interface_zone | default('public'))
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - (firewall_interface | default(ansible_default_ipv4.interface | default('bond0'))) | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-006-MASQ] Ensure masquerade is disabled on all zones except external"
  ansible.builtin.shell: |
    for z in $(firewall-cmd --get-zones); do
      if [ "$z" != "external" ]; then
        firewall-cmd --permanent --zone="$z" --remove-masquerade 2>/dev/null || true
        firewall-cmd --zone="$z" --remove-masquerade 2>/dev/null || true
      fi
    done
    firewall-cmd --reload
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
  changed_when: false
  failed_when: false

- name: "[SEC-018] Ensure egress policy allows forwarding from docker to physical interface zone (RHEL 9+)"
  ansible.builtin.shell: |
    firewall-cmd --permanent --delete-policy=docker-to-drop 2>/dev/null || true
    firewall-cmd --permanent --new-policy docker-to-ext 2>/dev/null || true
    firewall-cmd --permanent --policy docker-to-ext --add-ingress-zone docker
    firewall-cmd --permanent --policy docker-to-ext --add-egress-zone {{ firewall_interface_zone | default('public') }}
    firewall-cmd --permanent --policy docker-to-ext --set-target ACCEPT
    firewall-cmd --permanent --policy docker-to-ext --add-masquerade
    firewall-cmd --permanent --zone=docker --remove-masquerade 2>/dev/null || true
    firewall-cmd --reload
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 9
  changed_when: false
  failed_when: false

- name: "[SEC-006-CLEAN-PUBLIC] Clean up public zone default open services when restricted"
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: true
    state: disabled
    immediate: true
  loop:
    - ssh
    - cockpit
    - dhcpv6-client
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0
    - firewalld_module_usable | default(true)
  failed_when: false

- name: "[SEC-006-CLEAN-PUBLIC-CLI] Clean up public zone default open services when restricted (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=public
      - --remove-service={{ item }}
  register: sec006_clean_public_cli
  loop:
    - ssh
    - cockpit
    - dhcpv6-client
  changed_when: "'NOT_ENABLED' not in sec006_clean_public_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined and ssh_allowed_source_ips | length > 0
    - not (firewalld_module_usable | default(true))
  failed_when: false
  notify: Reload firewalld

- name: "[SEC-006-CLEAN-ZONE-DEFAULTS] Clean up default unneeded services from dmz, work, internal zones"
  ansible.posix.firewalld:
    zone: "{{ item.0 }}"
    service: "{{ item.1 }}"
    permanent: true
    state: disabled
    immediate: true
  loop:
    - ["dmz", "ssh"]
    - ["work", "dhcpv6-client"]
    - ["work", "cockpit"]
    - ["internal", "mdns"]
    - ["internal", "samba-client"]
    - ["internal", "dhcpv6-client"]
    - ["internal", "cockpit"]
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewalld_module_usable | default(true)
  failed_when: false

- name: "[SEC-006-CLEAN-ZONE-DEFAULTS-CLI] Clean up default unneeded services from dmz, work, internal zones (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ item.0 }}
      - --remove-service={{ item.1 }}
  register: sec006_clean_zone_defaults_cli
  loop:
    - ["dmz", "ssh"]
    - ["work", "dhcpv6-client"]
    - ["work", "cockpit"]
    - ["internal", "mdns"]
    - ["internal", "samba-client"]
    - ["internal", "dhcpv6-client"]
    - ["internal", "cockpit"]
  changed_when: "'NOT_ENABLED' not in sec006_clean_zone_defaults_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - not (firewalld_module_usable | default(true))
  failed_when: false
  notify: Reload firewalld

- name: "[SEC-006-CLEAN-PUBLIC-RICH] Clean up stale rich rules from public zone"
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ ssh_port | default(22) }}" protocol="tcp" accept'
    permanent: true
    state: disabled
    immediate: true
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - firewalld_module_usable | default(true)
  failed_when: false

- name: "[SEC-006-CLEAN-PUBLIC-RICH-CLI] Clean up stale rich rules from public zone (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=public
      - '--remove-rich-rule=rule family="ipv4" source address="{{ item }}" port port="{{ ssh_port | default(22) }}" protocol="tcp" accept'
  register: sec006_clean_public_rich_cli
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  changed_when: "'NOT_ENABLED' not in sec006_clean_public_rich_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - not (firewalld_module_usable | default(true))
  failed_when: false
  notify: Reload firewalld

- name: "[SEC-020] Configure custom firewall ingress rules with source IP restrictions (firewalld)"
  ansible.posix.firewalld:
    zone: "{{ firewall_source_zone | default('work') }}"
    source: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-020-CLI] Configure custom firewall ingress rules with source IP restrictions (firewalld) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ firewall_source_zone | default('work') }}
      - --add-source={{ item }}
  register: sec020_cli
  loop: "{{ ssh_allowed_source_ips | default([]) }}"
  changed_when: "'ALREADY_ENABLED' not in sec020_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-007-SSH] Ensure SSH service is enabled in source zone"
  ansible.posix.firewalld:
    zone: "{{ firewall_source_zone | default('work') }}"
    service: ssh
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-007-SSH-CLI] Ensure SSH service is enabled in source zone (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ firewall_source_zone | default('work') }}
      - --add-service=ssh
  register: sec007_ssh_cli
  changed_when: "'ALREADY_ENABLED' not in sec007_ssh_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - ssh_allowed_source_ips is defined
    - ssh_allowed_source_ips | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-006-CLEAN-STALE-SOURCES] Clean up stale sources from conflicting zones (trusted, drop)"
  ansible.posix.firewalld:
    zone: "{{ item.0 }}"
    source: "{{ item.1 }}"
    permanent: true
    state: disabled
    immediate: true
  loop: "{{ ['trusted', 'drop'] | product(firewall_stale_source_ips | default(ssh_allowed_source_ips | default([]))) | list }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - item.0 != (firewall_source_zone | default('work'))
    - firewalld_module_usable | default(true)
  failed_when: false

- name: "[SEC-006-CLEAN-STALE-SOURCES-CLI] Clean up stale sources from conflicting zones (trusted, drop) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ item.0 }}
      - --remove-source={{ item.1 }}
  register: sec006_clean_stale_sources_cli
  loop: "{{ ['trusted', 'drop'] | product(firewall_stale_source_ips | default(ssh_allowed_source_ips | default([]))) | list }}"
  changed_when: "'NOT_ENABLED' not in sec006_clean_stale_sources_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - item.0 != (firewall_source_zone | default('work'))
    - not (firewalld_module_usable | default(true))
  failed_when: false
  notify: Reload firewalld

- name: "[SEC-007-SERVICES] Allow standard services via firewalld (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: "{{ firewall_interface_zone | default('public') }}"
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ firewall_allowed_services | default(['http', 'https']) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_allowed_services is defined
    - firewall_allowed_services | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-007-SERVICES-CLI] Allow standard services via firewalld (RHEL/Rocky 7+) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone={{ firewall_interface_zone | default('public') }}
      - --add-service={{ item }}
  register: sec007_services_cli
  loop: "{{ firewall_allowed_services | default(['http', 'https']) }}"
  changed_when: "'ALREADY_ENABLED' not in sec007_services_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - firewall_allowed_services is defined
    - firewall_allowed_services | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-016] Configure dmz zone for monitoring sources (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: dmz
    source: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ monitoring_allowed_subnets | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - monitoring_allowed_subnets is defined
    - monitoring_allowed_subnets | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-016-CLI] Configure dmz zone for monitoring sources (RHEL/Rocky 7+) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=dmz
      - --add-source={{ item }}
  register: sec016_cli
  loop: "{{ monitoring_allowed_subnets | default([]) }}"
  changed_when: "'ALREADY_ENABLED' not in sec016_cli.stderr"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - monitoring_allowed_subnets is defined
    - monitoring_allowed_subnets | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-007-DMZ-PORTS] Allow monitoring metric collection ports in dmz zone (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: dmz
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ firewall_dmz_ports | default([]) }}"
  when:
