    - ansible_distribution_major_version | int >= 7
    - firewall_dmz_ports is defined
    - firewall_dmz_ports | length > 0
    - not (firewalld_module_usable | default(true))
  notify: Reload firewalld

- name: "[SEC-017] Configure internal zone for private VPC subnets (RHEL/Rocky 7+)"
  ansible.posix.firewalld:
    zone: internal
    source: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ internal_allowed_subnets | default([]) }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
