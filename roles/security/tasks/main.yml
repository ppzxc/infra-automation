    - firewall_dmz_ports | length > 0
    - firewalld_module_usable | default(true)

- name: "[SEC-007-DMZ-PORTS-CLI] Allow monitoring metric collection ports in dmz zone (RHEL/Rocky 7+) (firewall-cmd fallback)"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=dmz
      - --add-port={{ item }}
  register: sec007_dmz_ports_cli
  loop: "{{ firewall_dmz_ports | default([]) }}"
  changed_when: "'ALREADY_ENABLED' not in sec007_dmz_ports_cli.stderr"
  when:
