---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
  when: not (_raw_path_effective | default(false) | bool)

# Raw Provisioning Path (ADR-0005): the service module needs AnsiballZ, which
# CentOS 6/7 cannot run. `service` works on both SysV and systemd (CentOS 7).
- name: Restart sshd (raw)
  ansible.builtin.raw: service sshd restart
  listen: Restart sshd
  changed_when: true
  failed_when: false
  when: _raw_path_effective | default(false) | bool

- name: Restart ufw
  community.general.ufw:
    state: reloaded

- name: Restart firewalld
  ansible.builtin.service:
    name: firewalld
    state: restarted
  when: not (_raw_path_effective | default(false) | bool)

# firewalld_module_usable is false when ansible.posix.firewalld cannot bind
# to the target's firewalld D-Bus module (PyGObject ABI lock on RHEL8/Rocky8 --
# see roles/security/tasks/main.yml SEC-006-PROBE). The firewall-cmd CLI
# fallback tasks change permanent-only config, so their changes need the same
# runtime reload that ansible.posix.firewalld normally applies via
# `immediate: true`. Restarting the service here would be needlessly
# disruptive (and can race the CLI fallback tasks that already ran
# `--permanent`); a reload is sufficient and matches firewall-cmd's own
# idiom.
- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: not (_raw_path_effective | default(false) | bool)

# Raw Provisioning Path (ADR-0005): the raw firewalld tasks edit the permanent
# config only, so a reload applies it to the running firewall.
- name: Reload firewalld (raw)
  ansible.builtin.raw: firewall-cmd --reload
  listen: Reload firewalld
  register: security_raw_reload_firewalld
  changed_when: true
  failed_when: security_raw_reload_firewalld.rc | default(0) != 0
  when: _raw_path_effective | default(false) | bool

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true
  failed_when: false
  when: not (_raw_path_effective | default(false) | bool)


- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  failed_when: false
  when: not (_raw_path_effective | default(false) | bool)

# auditd.conf의 로테이션 값은 HUP(reload)로 읽는다. 시스템 서비스는 restart를 거부하므로 reload만 쓴다.
- name: Reload auditd
  ansible.builtin.service:
    name: auditd
    state: reloaded
  failed_when: false
  when: not (_raw_path_effective | default(false) | bool)

# Raw Provisioning Path (ADR-0005): `service` works on SysV (CentOS 6) and
# systemd (CentOS 7; auditd only accepts restarts through the service wrapper).
- name: Restart fail2ban (raw)
  ansible.builtin.raw: service fail2ban restart
  listen: Restart fail2ban
  register: security_raw_restart_fail2ban
  changed_when: true
  failed_when: security_raw_restart_fail2ban.rc | default(0) != 0
  when: _raw_path_effective | default(false) | bool

- name: Restart auditd (raw)
  ansible.builtin.raw: service auditd restart
  listen: Restart auditd
  register: security_raw_restart_auditd
  changed_when: true
  failed_when: security_raw_restart_auditd.rc | default(0) != 0
  when: _raw_path_effective | default(false) | bool

# journald 드롭인(Storage=persistent)은 재시작해야 적용된다. systemd 호스트에서만 알림이 오므로(SEC-053/054의 when) 실패를 삼키지 않는다.
- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
  when:
    - not (_raw_path_effective | default(false) | bool)
    - ansible_service_mgr == "systemd"
