---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Restart ufw
  community.general.ufw:
    state: reloaded

- name: Restart firewalld
  ansible.builtin.service:
    name: firewalld
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true
  failed_when: false


- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  failed_when: false
