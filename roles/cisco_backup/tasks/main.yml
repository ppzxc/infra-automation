---
# ==============================================================================
# Cisco IOS Switch Configuration Backup Tasks
# 접속 정보는 OpenBao Endpoint(선호 순서 [ssh, telnet])와 Credential에서 읽는다(Spec #511 / Ticket-18).
# ==============================================================================

- name: "[CISCO-001] Ensure local backup destination directory exists"
  ansible.builtin.file:
    path: "{{ cisco_backup_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

# 결과에 비밀번호가 들어 있어 CISCO-008은 no_log다. no_log는 실패 사유도 가리므로 같은 해석을 비밀 없는 요약으로 먼저
# 돌려 실패 사유(선호 순서 불일치, 없는 문서 등)가 운영자에게 보이게 한다.
- name: "[CISCO-010] Check the connection resolves (secret-free summary)"
  ansible.builtin.set_fact:
    cisco_backup_summary: "{{ lookup('openbao_connection', inventory_hostname, preference=cisco_backup_endpoint_preference) | openbao_connection_summary }}"
  check_mode: false
  delegate_to: localhost
  become: false

- name: "[CISCO-008] Resolve the Endpoint, login Credential, enable and bastion hop from OpenBao"
  ansible.builtin.set_fact:
    cisco_backup_connection: "{{ lookup('openbao_connection', inventory_hostname, preference=cisco_backup_endpoint_preference) }}"
  check_mode: false
  delegate_to: localhost
  become: false
  no_log: true

# 수집기는 비밀번호 로그인만 한다. 경유지는 비밀번호 로그인 한 단(Bastion 점프 세션)만 지원한다.
- name: "[CISCO-009] Assert the resolved connection is supported by the collector"
  ansible.builtin.assert:
    that:
      - cisco_backup_connection.protocol in ['ssh', 'telnet']
      - cisco_backup_connection.login.mode == 'password'
      - cisco_backup_connection.login.username | default('') | length > 0
      - cisco_backup_openbao_required['secrets/assets/+/credentials/+'] | difference(_cisco_login.keys() | list) | length == 0
      - cisco_backup_connection.via | length <= 1
      - cisco_backup_connection.via | length == 0 or cisco_backup_connection.protocol == 'ssh'
      - cisco_backup_connection.via | length == 0 or (_cisco_hop.login.mode == 'password' and _cisco_hop.login.username | default('') | length > 0)
    fail_msg: >-
      [CISCO-VIA] {{ inventory_hostname }}: 수집기가 지원하지 않는 접속이다. 로그인은 계정이 있는 비밀번호 Credential이어야 하고,
      경유(via)는 ssh Endpoint가 비밀번호 로그인 경유지 한 단만 거칠 수 있다(값은 로그에 남기지 않는다).
  delegate_to: localhost
  become: false
  no_log: true

# 1. Direct SSH 수집 (Endpoint ssh, 경유 없음)
- name: "[CISCO-002] Collect running configuration from Cisco IOS switch"
  ansible.builtin.command: >-
    python3 {{ cisco_backup_collector }}
    --mode direct_ssh
    --host {{ cisco_backup_connection.address }}
    --port {{ cisco_backup_connection.port }}
    --user {{ _cisco_login.username }}
    --timeout {{ cisco_backup_timeout | default(30) }}
    {{ _cisco_algorithm_args }}
  args:
    stdin: >-
      {{
        {
          "password": _cisco_login.password,
          "enable_password": _cisco_enable_password
        } | to_json
      }}
  register: cisco_config_direct_output
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: "{{ cisco_backup_no_log }}"
  when:
    - cisco_backup_connection.protocol == 'ssh'
    - cisco_backup_connection.via | length == 0

# 2. Telnet 수집 (Endpoint telnet, 경유 없음)
- name: "[CISCO-006] Collect running configuration via Telnet"
  ansible.builtin.command: >-
    python3 {{ cisco_backup_collector }}
    --mode telnet
    --host {{ cisco_backup_connection.address }}
    --port {{ cisco_backup_connection.port }}
    --user {{ _cisco_login.username }}
    --timeout {{ cisco_backup_timeout | default(30) }}
  args:
    stdin: >-
      {{
        {
          "password": _cisco_login.password,
          "enable_password": _cisco_enable_password
        } | to_json
      }}
  register: cisco_config_telnet_output
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: "{{ cisco_backup_no_log }}"
  when:
    - cisco_backup_connection.protocol == 'telnet'
    - cisco_backup_connection.via | length == 0

# 3. Bastion 경유 Jump SSH 수집 (Endpoint via: 비밀번호 로그인 경유지 한 단)
- name: "[CISCO-007] Collect running configuration via Bastion jump session"
  ansible.builtin.command: >-
    python3 {{ cisco_backup_collector }}
    --mode jump_ssh
    --bastion-host {{ _cisco_hop.address }}
    --bastion-port {{ _cisco_hop.port }}
    --bastion-user {{ _cisco_hop.login.username }}
    --host {{ cisco_backup_connection.address }}
    --port {{ cisco_backup_connection.port }}
    --user {{ _cisco_login.username }}
    --timeout {{ cisco_backup_timeout | default(30) }}
    {{ _cisco_algorithm_args }}
  args:
    stdin: >-
      {{
        {
          "password": _cisco_login.password,
          "enable_password": _cisco_enable_password,
          "bastion_password": _cisco_hop.login.password
        } | to_json
      }}
  register: cisco_config_jump_output
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: "{{ cisco_backup_no_log }}"
  when: cisco_backup_connection.via | length > 0

- name: Set unified collected configuration fact
  ansible.builtin.set_fact:
    cisco_running_config_raw: >-
      {{
        (cisco_config_direct_output.stdout if (cisco_config_direct_output is defined and cisco_config_direct_output.stdout is defined and cisco_config_direct_output.stdout | length > 0) else
        (cisco_config_telnet_output.stdout if (cisco_config_telnet_output is defined and cisco_config_telnet_output.stdout is defined and cisco_config_telnet_output.stdout | length > 0) else
        (cisco_config_jump_output.stdout if (cisco_config_jump_output is defined and cisco_config_jump_output.stdout is defined) else '')))
      }}

# 검증 태스크가 파일 저장보다 먼저 실행되어야 불완전/오류 파일 기록 방지
- name: "[CISCO-004] Verify configuration output validity"
  ansible.builtin.assert:
    that:
      - cisco_running_config_raw is defined
      - cisco_running_config_raw | length > 0
      - "'% Invalid input detected' not in cisco_running_config_raw"
    fail_msg: "Failed to collect valid running-config from Cisco switch {{ inventory_hostname }}"

- name: "[CISCO-003] Save running configuration to backup destination"
  ansible.builtin.copy:
    content: "{{ cisco_running_config_raw }}"
    dest: "{{ cisco_backup_dir }}/{{ cisco_backup_filename_format }}"
    mode: '0600'
  delegate_to: localhost
  become: false

- name: "[CISCO-005] Clean up old backup archives exceeding retention period"
  ansible.builtin.find:
    paths: "{{ cisco_backup_dir }}"
    patterns: "{{ inventory_hostname }}_*.txt"
    age: "{{ cisco_backup_retention_days }}d"
    recurse: false
  register: expired_backups
  delegate_to: localhost
  become: false

- name: "Delete expired backup archive files identified in [CISCO-005]"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ expired_backups.files | default([]) }}"
  delegate_to: localhost
  become: false
