---
# Host Agents 백업 (restic + resticprofile, ADR-0006 §2.4~2.5)
enable_backup: true

# RustFS(S3) 연결. 우선순위: Extra variables/group_vars > OpenBao agents/rustfs의 같은 이름 키 > 아래 기본값.
# 저장소가 공개(PUBLIC)라 내부 도메인을 Git에 두지 않는다 — 평상시에는 OpenBao agents/rustfs에 넣는다.
# 호스트별 repo: s3:<rustfs_endpoint>/<rustfs_bucket> (버킷 루트)
rustfs_endpoint: "{{ ((host_agents_shared_secrets | default({})).rustfs | default({})).rustfs_endpoint | default('', true) }}"        # 예: https://rustfs.example.internal:9000 (끝 슬래시 금지)
# 버킷은 호스트(액세스 키)마다 하나다. 해석 순서: Extra variables/group_vars > hosts/<host>/agents의 rustfs_bucket > 규칙 <rustfs_bucket_prefix>_<inventory_hostname>.
# 공용 agents/rustfs의 rustfs_bucket은 쓰지 않는다(실수로 공용 버킷에 백업이 쌓이는 것을 막는다).
rustfs_bucket_prefix: "backup_prod"
rustfs_bucket: "{{ ((host_agents_host_overrides | default({})).rustfs_bucket | default('', true)) or (rustfs_bucket_prefix ~ '_' ~ inventory_hostname) }}"
rustfs_region: "{{ ((host_agents_shared_secrets | default({})).rustfs | default({})).rustfs_region | default('', true) }}"          # 비우면 AWS_DEFAULT_REGION을 설정하지 않는다
rustfs_ca_file: "{{ ((host_agents_shared_secrets | default({})).rustfs | default({})).rustfs_ca_file | default('', true) }}"         # 사설 CA 사용 시 호스트상의 CA 파일 경로(restic --cacert)

# OpenObserve 연결 — Repo Maintenance(backup 역할만 로드)와 Deploy 등록 이벤트가 쓴다. monitoring defaults와 동일하게 유지한다.
o2_endpoint: "{{ ((host_agents_shared_secrets | default({})).openobserve | default({})).o2_endpoint | default('', true) }}"
o2_org: "{{ ((host_agents_shared_secrets | default({})).openobserve | default({})).o2_org | default('default', true) }}"

# 바이너리 전달 헬퍼(monitoring/tasks/deliver_binary.yml 공용)가 쓰는 값 — monitoring defaults와 동일하게 유지한다.
host_agents_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-agents"
host_agents_bin_dir: /usr/local/bin
host_agents_owner: root
host_agents_group: root

# 호스트 측 위치
backup_config_dir: /etc/restic
backup_env_path: /etc/restic/env
backup_password_path: /etc/restic/password
backup_profile_path: /etc/restic/profiles.yaml
backup_cache_dir: /var/cache/restic
backup_profile_name: default

# 결과 방출 (ADR-0006 §2.6): status-file + run-finally 훅이 append하는 jsonl을 otelcol이 backup_logs로 수집한다.
backup_event_script_path: /usr/local/sbin/host-agents-backup-event
backup_log_dir: /var/log/host-agents
backup_log_path: /var/log/host-agents/backup.jsonl
backup_state_dir: /var/lib/host-agents
backup_status_file: /var/lib/host-agents/restic-status.json
backup_logrotate_path: /etc/logrotate.d/host-agents-backup
backup_logrotate_rotate: 8   # 주 단위 회전 보관 개수 (장기 보존은 OpenObserve backup_logs 1년)

# 스케줄: 02:00~03:59 사이 inventory_hostname 시드 고정 분
backup_schedule_window_minutes: 120
backup_schedule_start_hour: 2
backup_systemd_unit_dir: /etc/systemd/system
backup_cron_path: /etc/cron.d/host-agents-backup

# Deploy(태그 없음) 한정 repo 초기화. RustFS가 없는 테스트(molecule)에서만 false로 끈다.
backup_init_enabled: true

# Deploy 종료 시 컨트롤러가 OpenObserve backup_logs에 job=inventory 이벤트를 보낸다(컨트롤러 전용 토큰).
# OpenObserve가 없는 테스트(molecule)에서만 false로 끈다. 인증 정보를 보내므로 인증서는 기본 검증한다(사설 CA는 컨트롤러 신뢰 저장소에 등록).
backup_inventory_event_enabled: true
backup_inventory_validate_certs: true

# 표준 제외 (ISMS 백업 표준). 필수 경로 제외와는 별개이며 모든 호스트에 적용된다.
backup_standard_excludes:
  - /home/*/.cache
  - "**/node_modules"
  - "*.tmp"
  - "*.swp"
  - /etc/restic/password

# 존재할 때만 포함하는 조건부 표준 경로
backup_conditional_paths:
  - /opt/services

# 서비스 샌드박스(ProtectSystem=strict)에서 backup_pre_hooks(DB 덤프 등)가 쓸 수 있는 추가 경로.
# systemd의 '-' 접두사로 경로가 없어도 유닛이 실패하지 않는다. 호스트별로 group_vars/host_vars에서 확장한다.
backup_hook_write_paths:
  - /var/backups

# Repo Maintenance (Semaphore "Host Agents — Repo Maintenance", 컨트롤러 실행, playbooks/host_agents_maintenance.yml)
# 호스트별 repo에 대해 check → (성공 시) forget --prune. 유지보수 키/컨트롤러 토큰은 OpenBao agents/rustfs, agents/openobserve.
backup_retention_daily: 7
backup_retention_weekly: 4
backup_retention_monthly: 12
backup_maintenance_retry_lock: 30m
# 월간 check --read-data-subset=10%: auto(매월 첫째 일요일) | always | never (수동 실행에서 강제/생략)
backup_maintenance_read_subset: auto
backup_maintenance_timezone: Asia/Seoul   # 스케줄(일요일 05:00)이 기준으로 삼는 달력 시간대
backup_maintenance_read_subset_percent: "10%"
# 컨트롤러에서 RustFS 사설 CA를 신뢰시킬 때의 CA 파일 경로(RESTIC_CACERT). rustfs_ca_file은 호스트 경로이므로 따로 둔다.
backup_maintenance_ca_file: ""
# 테스트 전용 seam: 비워 두면 s3:<rustfs_endpoint>/<rustfs_bucket>를 사용한다(molecule/pytest만 로컬 repo를 지정).
backup_maintenance_repository: ""
