      fires: false
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: SW_MATM-4-MACFLAP_NOTIF, log_syslog_severity_code: 4, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SW_MATM-4-MACFLAP_NOTIF: Host 0011.2233.4455 in vlan 7 is flapping between port Gi0/1 and port Gi0/2"}
