# 업링크 다운: 목록이 비어 있으면 알림이 만들어지지 않으므로 이 픽스처는 목록이 있을 때만 쓰인다. watch_port는 이 케이스의 (가짜) 장비를 목록에 더한다.
infra-switch-uplink-down:
  row_key: device
  host_field: device_id
  cases:
    - name: 감시 포트의 링크 다운 (약어로 적은 포트)
      host: verify-sw-uplink-down
      fires: true
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 감시 포트의 line protocol 다운 (전체 이름으로 적은 포트)
      host: verify-sw-uplink-lineproto
      fires: true
      watch_port: GigabitEthernet1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINEPROTO-5-UPDOWN, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 감시 포트를 관리자가 shutdown
      host: verify-sw-uplink-admin-down
      fires: true
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-5-CHANGED, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-5-CHANGED: Interface GigabitEthernet1/0/49, changed state to administratively down"}
    - name: 감시 포트가 올라온 것은 알리지 않는다
      host: verify-sw-uplink-up
      fires: false
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to up"}
    - name: 같은 장비의 목록에 없는 포트 다운 (미사용 포트)
      host: verify-sw-uplink-other-port
      fires: false
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/48, changed state to down"}
    - name: Gi1/0/4 감시 중 Gi1/0/49 다운은 다른 포트다
      host: verify-sw-uplink-prefix-port
      fires: false
      watch_port: Gi1/0/4
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 목록에 없는 장비의 포트 다운
      host: verify-sw-uplink-other-device
      fires: false
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.6 ns0347-3560X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to down"}
