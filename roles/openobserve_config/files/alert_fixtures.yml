        - {ts: [0, 60, 120, 180], state: used, value: 100, mountpoint: /run, type: tmpfs, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 0, mountpoint: /run, type: tmpfs, device: /dev/vda1}
    - name: inode 구간 중 한 번 낮아지면 지속이 아니다
      host: verify-inode-p1-dip
      fires: false
      records:
        - {ts: [0, 60, 120], state: used, value: 99, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120], state: free, value: 1, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: used, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: free, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
# 메모리: 사용률 = 1 - available / limit. available 레코드는 알림의 기본 스트림(system_linux_memory_available), limit 레코드는 stream: system_memory_limit
infra-memory-usage-p2:
  cases:
    - name: 메모리 92%는 P2 구간 (available 800 / limit 10000)
      host: verify-mem-p2-92
      fires: true
      records:
        - {ts: [0, 60, 120, 180], value: 800}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 89%는 임계 미만
      host: verify-mem-p2-89
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 1100}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 97%는 P1 구간이라 P2에 중복 통지하지 않는다
      host: verify-mem-p2-97
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 300}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: limit 스트림만 있는 호스트(available 결손)는 오탐하지 않는다 — 결손은 Silent Host 몫
      host: verify-mem-p2-noavail
      fires: false
      records:
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: available 스트림만 있는 호스트(limit 결손)는 오탐하지 않는다
      host: verify-mem-p2-nolimit
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 800}
infra-memory-usage-p1:
  cases:
    - name: 메모리 97%는 P1
      host: verify-mem-p1-97
      fires: true
      records:
        - {ts: [0, 60, 120, 180], value: 300}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 94%는 P1 미만
      host: verify-mem-p1-94
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 600}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 구간 중 한 번 낮아지면 지속이 아니다
      host: verify-mem-p1-dip
      fires: false
      records:
        - {ts: [0, 60, 120], value: 300}
        - {ts: [0, 60, 120], stream: system_memory_limit, value: 10000}
        - {ts: 180, value: 5000}
        - {ts: 180, stream: system_memory_limit, value: 10000}
    - name: limit 스트림만 있는 호스트(available 결손)는 오탐하지 않는다 — 결손은 Silent Host 몫
      host: verify-mem-p1-noavail
      fires: false
      records:
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: available 스트림만 있는 호스트(limit 결손)는 오탐하지 않는다
      host: verify-mem-p1-nolimit
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 300}

# --- Silent Host (Spec #184 / Ticket-4) --- 부재형 알림: 모든 케이스의 호스트가 (가짜) 로스터에 들어가고, records가 비면 데이터가 없는 호스트다.
# ts는 검증 실행 시작(약 5분 전) 기준 초다. 음수는 더 과거 — 최근 15분은 ts > -600, 3시간 창은 ts > -10500 부근이다.
infra-silent-host-p2:
  cases:
    - name: 하트비트가 15분 넘게 끊겼지만 3시간 미만이면 P2
      host: verify-silent-p2-gap
      fires: true
      records:
        - {ts: [-3600, -3540, -3480], state: used, value: 1}
    - name: 하트비트가 최근 15분 안에 오면 발화하지 않는다
      host: verify-silent-p2-alive
      fires: false
      records:
        - {ts: [-3600, 0, 60], state: used, value: 1}
    - name: 3시간 넘게 끊겼으면 P1이라 P2에 중복 통지하지 않는다
      host: verify-silent-p2-long
      fires: false
      records:
        - {ts: [-12000], state: used, value: 1}
    - name: 데이터가 한 번도 없는 호스트는 P1 몫이다
      host: verify-silent-p2-never
      fires: false
      records: []
infra-silent-host-p1:
  cases:
    - name: 3시간 넘게 하트비트가 없으면 P1 (마지막 데이터 3시간 25분 전)
      host: verify-silent-p1-long
      fires: true
      records:
        - {ts: [-12000], state: used, value: 1}
    - name: 데이터가 한 번도 없는 호스트도 P1
      host: verify-silent-p1-never
      fires: true
      records: []
    - name: 15분만 끊긴 호스트는 P2라 P1에 통지하지 않는다
      host: verify-silent-p1-gap
      fires: false
      records:
        - {ts: [-3600, -3540], state: used, value: 1}
    - name: 하트비트가 계속 오는 호스트는 발화하지 않는다
      host: verify-silent-p1-alive
      fires: false
      records:
        - {ts: [0, 60, 120], state: used, value: 1}

# --- 앱 텔레메트리 무소식 (Spec #253 / Ticket-8) --- jvm_memory_used는 모든 JVM이 공유하므로 service_name=funa인 레코드만 센다. 조회 구간은 15분이다.
infra-app-telemetry-silent:
  cases:
    - name: 로스터 호스트가 funa JVM 메트릭을 한 번도 보내지 않았다
      host: verify-app-silent-never
      fires: true
      records: []
    - name: 다른 서비스의 JVM 메트릭만 오면 funa는 무소식이다
      host: verify-app-silent-other
      fires: true
      records:
        - {ts: [-60, 0], service_name: other-jvm, value: 1}
    - name: funa JVM 메트릭이 15분 안에 오면 발화하지 않는다
      host: verify-app-silent-alive
      fires: false
      records:
        - {ts: [-60, 0], service_name: funa, value: 1}
# --- 서버 도달성 (Spec #184 / Ticket-6, ADR-0010) --- tcpcheck.status는 60초마다 1(접속 성공)/0(실패). 검사하는 쪽은 host_name, 대상은 tcpcheck_endpoint.
infra-unreachable-host:
  cases:
    - name: status 0이 5분 연속이면 발화
      host: verify-unreach-down
      fires: true
      records:
        - {ts: [-240, -180, -120, -60, 0], tcpcheck_endpoint: "192.0.2.50:22", value: 0}
    - name: 중간에 1이 섞이면 지속이 아니라 발화하지 않는다
      host: verify-unreach-flap
      fires: false
      records:
        - {ts: [-240, -180, -60, 0], tcpcheck_endpoint: "192.0.2.51:22", value: 0}
        - {ts: -120, tcpcheck_endpoint: "192.0.2.51:22", value: 1}
    - name: 접속이 계속 되면 발화하지 않는다
      host: verify-unreach-up
      fires: false
      records:
        - {ts: [-240, -180, -120, -60, 0], tcpcheck_endpoint: "192.0.2.52:22", value: 1}
# --- 백업 알림 (Spec #184 / Ticket-5) --- backup_logs는 호스트가 host 필드다(host_field). 부재형은 케이스 호스트가 (가짜) 로스터에 들어간다.
# ts는 검증 실행 시작 기준 초(음수 = 과거). 백업 누락 창은 26시간, 유지보수 누락 창은 8일이다.
infra-backup-failure:
  row_key: host
  host_field: host
  cases:
    - name: 백업 실패 이벤트
      host: verify-backup-failed
      fires: true
      records:
        - {job: backup, success: false, error: "repository unreachable"}
    - name: 백업 성공은 발화하지 않는다
      host: verify-backup-ok
      fires: false
      records:
        - {job: backup, success: true}
    - name: 유지보수 실패는 백업 실패가 아니다
      host: verify-backup-maint-failed
      fires: false
      records:
        - {job: maintenance, command: check, success: false}
infra-integrity-check-failure:
  row_key: host
  host_field: host
  cases:
    - name: 무결성 검사 실패 이벤트
      host: verify-check-failed
      fires: true
      records:
        - {job: maintenance, command: check, success: false}
    - name: 무결성 검사 성공은 발화하지 않는다
      host: verify-check-ok
      fires: false
      records:
        - {job: maintenance, command: check, success: true}
    - name: 다른 유지보수 명령(forget) 실패는 검사 실패가 아니다
      host: verify-check-forget-failed
      fires: false
      records:
        - {job: maintenance, command: forget, success: false}
    - name: 백업 실패는 무결성 검사 실패가 아니다
      host: verify-check-backup-failed
      fires: false
      records:
        - {job: backup, success: false}
infra-backup-missing:
  row_key: host
  host_field: host
  cases:
    - name: 가짜 로스터 호스트가 백업 이벤트를 한 번도 보내지 않았다
      host: verify-backup-missing-never
      fires: true
      records: []
    - name: 성공 백업이 없고 실패만 있으면 누락이다
      host: verify-backup-missing-only-failed
      fires: true
      records:
        - {ts: -600, job: backup, success: false}
    - name: 최근 성공 백업이 있으면 발화하지 않는다
      host: verify-backup-missing-fresh
      fires: false
      records:
        - {ts: -600, job: backup, success: true}
infra-maintenance-missing:
  row_key: host
  host_field: host
  cases:
    - name: 가짜 로스터 호스트에 check 기록이 한 번도 없다
      host: verify-maint-missing-never
      fires: true
      records: []
    - name: 백업 이벤트만 있고 check가 없으면 누락이다
      host: verify-maint-missing-backup-only
      fires: true
      records:
        - {ts: -600, job: backup, success: true}
    - name: 최근 check가 있으면 발화하지 않는다
      host: verify-maint-missing-fresh
      fires: false
      records:
        - {ts: -600, job: maintenance, command: check, success: true}

# --- 스위치 syslog 알림 (Spec #277) --- 레코드는 switch_syslog_semantics VRL 처리 후의 모양이다(service_name, device_name/device_id, event_name,
# log_syslog_severity_code). 장비 식별자 device_id가 케이스 호스트다(host_field). 송신 주소는 문서용 대역만 쓴다.
# 장비별 집계의 분리는 "장비마다 임계 미만" 케이스가 함께 있으면서 모두 발화하지 않는 것으로 확인한다(합치면 임계를 넘는다).
infra-switch-config-change:
  row_key: device
  host_field: device_id
  cases:
    - name: 설정 변경 메시지 1건
      host: verify-sw-config-change
      fires: true
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: SYS-5-CONFIG_I, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SYS-5-CONFIG_I: Configured from console by admin on vty0 (203.0.113.7)"}
    - name: 같은 심각도의 다른 메시지는 설정 변경이 아니다
      host: verify-sw-config-other
      fires: false
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: SYS-5-RESTART, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SYS-5-RESTART: System restarted"}
    - name: 다른 서비스의 줄은 같은 코드여도 스위치 알림이 아니다
      host: verify-sw-config-other-service
      fires: false
      records:
        - {service_name: syslog, device_name: verify-sw, event_name: SYS-5-CONFIG_I, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 server01 app: %SYS-5-CONFIG_I: quoted by another program"}
infra-switch-login-failures:
  row_key: device
  host_field: device_id
  cases:
    - name: 5분 안에 로그인 실패 5회
      host: verify-sw-login-burst
      fires: true
      records:
        - {repeat: 5, service_name: switch-syslog, device_name: verify-sw, event_name: SEC_LOGIN-4-LOGIN_FAILED, log_syslog_severity_code: 4, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SEC_LOGIN-4-LOGIN_FAILED: Login failed [user: admin] [Source: 203.0.113.7] [localport: 22] [Reason: Login Authentication Failed]"}
    - name: 실패 4회는 임계 미만 (장비 A)
      host: verify-sw-login-below-a
      fires: false
      records:
        - {repeat: 4, service_name: switch-syslog, device_name: verify-sw, event_name: SEC_LOGIN-4-LOGIN_FAILED, log_syslog_severity_code: 4, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SEC_LOGIN-4-LOGIN_FAILED: Login failed [user: admin]"}
    - name: 실패 4회는 임계 미만 (장비 B, 장비마다 따로 센다)
      host: verify-sw-login-below-b
      fires: false
      records:
        - {repeat: 4, service_name: switch-syslog, device_name: verify-sw, event_name: SEC_LOGIN-4-LOGIN_FAILED, log_syslog_severity_code: 4, body: "Oct 20 10:00:00 203.0.113.6 ns0347-3560X: Oct 20 10:00:00.001 KST: %SEC_LOGIN-4-LOGIN_FAILED: Login failed [user: admin]"}
    - name: 로그인 성공은 실패로 세지 않는다
      host: verify-sw-login-success
      fires: false
      records:
        - {repeat: 6, service_name: switch-syslog, device_name: verify-sw, event_name: SEC_LOGIN-5-LOGIN_SUCCESS, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %SEC_LOGIN-5-LOGIN_SUCCESS: Login Success [user: admin]"}
infra-switch-severity-critical:
  row_key: device
  host_field: device_id
  cases:
    - name: 심각도 0 (emergency)
      host: verify-sw-sev-0
      fires: true
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: TEST-0-EMERGENCY, log_syslog_severity_code: 0, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %TEST-0-EMERGENCY: synthetic"}
    - name: 심각도 2 (critical)
      host: verify-sw-sev-2
      fires: true
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: TEST-2-CRITICAL, log_syslog_severity_code: 2, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %TEST-2-CRITICAL: synthetic"}
    - name: 심각도 3 (error)은 이 알림이 아니다
      host: verify-sw-sev-3
      fires: false
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/3, changed state to down"}
    - name: 잡음 목록의 코드는 심각도가 높아도 제외한다
      host: verify-sw-sev-noise
      fires: false
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: ADJ-3-RESOLVE_REQ, log_syslog_severity_code: 2, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %ADJ-3-RESOLVE_REQ: Adj resolve request: Failed to resolve 203.0.113.9 Vlan7"}
    - name: 다른 서비스의 심각도 2 줄은 알리지 않는다
      host: verify-sw-sev-other-service
      fires: false
      records:
        - {service_name: kernel, device_name: verify-sw, event_name: TEST-2-CRITICAL, log_syslog_severity_code: 2, body: "kernel: synthetic"}
# 업링크 다운: 목록이 비어 있으면 알림이 만들어지지 않으므로 이 픽스처는 목록이 있을 때만 쓰인다. watch_port는 이 케이스의 (가짜) 장비를 목록에 더한다.
infra-switch-uplink-down:
  row_key: device
  host_field: device_id
  cases:
    - name: 감시 포트의 링크 다운 (약어로 적은 포트)
      host: verify-sw-uplink-down
      fires: true
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 감시 포트의 line protocol 다운 (전체 이름으로 적은 포트)
      host: verify-sw-uplink-lineproto
      fires: true
      watch_port: GigabitEthernet1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINEPROTO-5-UPDOWN, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 감시 포트를 관리자가 shutdown
      host: verify-sw-uplink-admin-down
      fires: true
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-5-CHANGED, log_syslog_severity_code: 5, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-5-CHANGED: Interface GigabitEthernet1/0/49, changed state to administratively down"}
    - name: 감시 포트가 올라온 것은 알리지 않는다
      host: verify-sw-uplink-up
      fires: false
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to up"}
    - name: 같은 장비의 목록에 없는 포트 다운 (미사용 포트)
      host: verify-sw-uplink-other-port
      fires: false
      watch_port: Gi1/0/49
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/48, changed state to down"}
    - name: Gi1/0/4 감시 중 Gi1/0/49 다운은 다른 포트다
      host: verify-sw-uplink-prefix-port
      fires: false
      watch_port: Gi1/0/4
      records:
        - {service_name: switch-syslog, device_name: verify-sw, event_name: LINK-3-UPDOWN, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %LINK-3-UPDOWN: Interface GigabitEthernet1/0/49, changed state to down"}
    - name: 목록에 없는 장비의 포트 다운
      host: verify-sw-uplink-other-device
      fires: false
      records:
