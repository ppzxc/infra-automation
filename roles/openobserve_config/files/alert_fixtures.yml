# 수신 중단: 케이스 호스트(device_id)가 (가짜) 감시 목록에 들어간다. off_roster는 목록에 넣지 않는다.
infra-switch-syslog-silent:
  row_key: device_id
  host_field: device_id
  cases:
    - name: 감시 목록의 장비에서 로그가 한 줄도 없다
      host: verify-sw-silent-none
      fires: true
      records: []
    - name: 최근 로그가 있는 장비
      host: verify-sw-silent-fresh
      fires: false
      records:
        - {ts: -600, service_name: switch-syslog, device_name: verify-sw, event_name: SW_MATM-4-MACFLAP_NOTIF, log_syslog_severity_code: 4, body: "Oct 20 10:00:00 203.0.113.6 ns0347-3560X: Oct 20 10:00:00.001 KST: %SW_MATM-4-MACFLAP_NOTIF: synthetic"}
    - name: 잡음 메시지만 오는 장비도 수신 중이다
      host: verify-sw-silent-noise-only
      fires: false
      records:
        - {ts: -600, service_name: switch-syslog, device_name: verify-sw, event_name: ADJ-3-RESOLVE_REQ, log_syslog_severity_code: 3, body: "Oct 20 10:00:00 203.0.113.5 ns0250-3750X: Oct 20 10:00:00.001 KST: %ADJ-3-RESOLVE_REQ: synthetic"}
    - name: 변환 전 레코드(device_id 필드 없이 원문만 있음)도 수신 중이다
      host: verify-sw-silent-legacy
      fires: false
      records:
        - {ts: -600, omit_host_field: true, service_name: switch-syslog, body: "Oct 20 10:00:00 203.0.113.7 {host}-3560X: Oct 20 10:00:00.002 KST: %SW_MATM-4-MACFLAP_NOTIF: Host 0000.0000.0001 in vlan 7 is flapping between port Gi0/1 and port Gi0/2"}
    - name: 감시 목록에 없는 장비는 로그가 없어도 알리지 않는다
      host: verify-sw-silent-off-roster
      fires: false
      off_roster: true
      records: []

# --- 방화벽(포티게이트) 알림 (Spec #282 / Ticket-3) ---
# 입력은 Log Message Reference 기준 합성 줄이고 바이러스 케이스는 실제 줄 모양이다(실로그 전체 검증은 tests/fixtures/fortigate_real_lines.tsv). 알림 SQL은 원문 body의 key=value만 읽으므로(변환 전 레코드와 같다)
# 레코드는 omit_host_field로 장비 이름 필드 없이 원문만 넣고, 원문의 devname="{host}"가 케이스 호스트로 바뀐다. service_name은 방화벽 수신 경로의 값이다.
# 승인 시간은 기본 9시~18시(끝 미포함)다: 03시·23시·18시는 밖, 10시·09시는 안, time= 이 없는 줄은 밖으로 본다.
infra-fortigate-admin-login-failures:
  row_key: device
  host_field: device_id
  cases:
    - name: 같은 출발지에서 5분 안에 관리자 로그인 실패 5회
      host: verify-fw-login-burst
      fires: true
      records:
        - {repeat: 5, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.50, body: 'date=2026-10-20 time=10:00:00 devname="{host}" devid="FGT000000000000" logid="0100032002" type="event" subtype="system" level="alert" logdesc="Admin login failed" srcip=203.0.113.50 user="admin" ui="https(203.0.113.50)" action="login" status="failed" reason="name_invalid" msg="Administrator admin login failed from https(203.0.113.50) because of invalid user name"'}
    - name: 실패 4회는 임계 미만
      host: verify-fw-login-below
      fires: false
      records:
        - {repeat: 4, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.51, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="system" logdesc="Admin login failed" user="admin" ui="ssh(203.0.113.51)" action="login" status="failed" reason="passwd_invalid"'}
    - name: 출발지가 달라 각각 임계 미만 (출발지마다 따로 센다)
      host: verify-fw-login-spread
      fires: false
      records:
        - {repeat: 3, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.52, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="system" user="admin" action="login" status="failed"'}
        - {repeat: 3, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.53, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="system" user="admin" action="login" status="failed"'}
    - name: 로그인 성공은 실패로 세지 않는다
      host: verify-fw-login-success
      fires: false
      records:
        - {repeat: 6, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.54, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="system" logdesc="Admin login successful" user="admin" ui="https(203.0.113.54)" action="login" status="success"'}
    - name: VPN 사용자 로그인 실패는 관리자 로그인이 아니다
      host: verify-fw-login-vpn
      fires: false
      records:
        - {repeat: 6, omit_host_field: true, service_name: fortigate-syslog, source_address: 203.0.113.55, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="vpn" logdesc="SSL VPN login fail" user="alice" action="ssl-login-fail" status="failed" remip=203.0.113.55'}
    - name: 다른 서비스의 같은 문구는 세지 않는다
      host: verify-fw-login-other-service
      fires: false
      records:
        - {repeat: 6, omit_host_field: true, service_name: sshd, source_address: 203.0.113.56, body: 'date=2026-10-20 time=10:00:00 devname="{host}" type="event" subtype="system" user="admin" action="login" status="failed"'}
