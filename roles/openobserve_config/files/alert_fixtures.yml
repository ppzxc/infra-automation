        - {ts: [0, 60, 120, 180], state: free, value: 1, mountpoint: /, type: ext4, device: /dev/vda1}
    - name: inode 구간 중 한 번 낮아지면 지속이 아니다
      host: verify-inode-p2-dip
      fires: false
      records:
        - {ts: [0, 60, 120], state: used, value: 99, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120], state: free, value: 1, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: used, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: free, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
infra-inode-usage-p1:
  cases:
    - name: inode ns0334 / 99% (일주일 내내 98~99% 사례)
      host: verify-inode-p1-ns0334
      fires: true
      records:
        - {ts: [0, 60, 120, 180], state: used, value: 99, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 1, mountpoint: /, type: ext4, device: /dev/vda1}
    - name: inode 95%는 P1
      host: verify-inode-p1-95
      fires: true
      records:
        - {ts: [0, 60, 120, 180], state: used, value: 95, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 5, mountpoint: /, type: ext4, device: /dev/vda1}
    - name: inode 94%는 P1 미만
      host: verify-inode-p1-94
      fires: false
      records:
        - {ts: [0, 60, 120, 180], state: used, value: 94, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 6, mountpoint: /, type: ext4, device: /dev/vda1}
    - name: inode squashfs 100%는 제외 유형
      host: verify-inode-p1-squashfs
      fires: false
      records:
        - {ts: [0, 60, 120, 180], state: used, value: 100, mountpoint: /snap/core/1, type: squashfs, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 0, mountpoint: /snap/core/1, type: squashfs, device: /dev/vda1}
    - name: inode tmpfs 100%는 제외 유형
      host: verify-inode-p1-tmpfs
      fires: false
      records:
        - {ts: [0, 60, 120, 180], state: used, value: 100, mountpoint: /run, type: tmpfs, device: /dev/vda1}
        - {ts: [0, 60, 120, 180], state: free, value: 0, mountpoint: /run, type: tmpfs, device: /dev/vda1}
    - name: inode 구간 중 한 번 낮아지면 지속이 아니다
      host: verify-inode-p1-dip
      fires: false
      records:
        - {ts: [0, 60, 120], state: used, value: 99, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: [0, 60, 120], state: free, value: 1, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: used, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
        - {ts: 180, state: free, value: 50, mountpoint: /, type: ext4, device: /dev/vda1}
# 메모리: 사용률 = 1 - available / limit. available 레코드는 알림의 기본 스트림(system_linux_memory_available), limit 레코드는 stream: system_memory_limit
infra-memory-usage-p2:
  cases:
    - name: 메모리 92%는 P2 구간 (available 800 / limit 10000)
      host: verify-mem-p2-92
      fires: true
      records:
        - {ts: [0, 60, 120, 180], value: 800}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 89%는 임계 미만
      host: verify-mem-p2-89
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 1100}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 97%는 P1 구간이라 P2에 중복 통지하지 않는다
      host: verify-mem-p2-97
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 300}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: limit 스트림만 있는 호스트(available 결손)는 오탐하지 않는다 — 결손은 Silent Host 몫
      host: verify-mem-p2-noavail
      fires: false
      records:
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: available 스트림만 있는 호스트(limit 결손)는 오탐하지 않는다
      host: verify-mem-p2-nolimit
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 800}
infra-memory-usage-p1:
  cases:
    - name: 메모리 97%는 P1
      host: verify-mem-p1-97
      fires: true
      records:
        - {ts: [0, 60, 120, 180], value: 300}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 94%는 P1 미만
      host: verify-mem-p1-94
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 600}
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: 메모리 구간 중 한 번 낮아지면 지속이 아니다
      host: verify-mem-p1-dip
      fires: false
      records:
        - {ts: [0, 60, 120], value: 300}
        - {ts: [0, 60, 120], stream: system_memory_limit, value: 10000}
        - {ts: 180, value: 5000}
        - {ts: 180, stream: system_memory_limit, value: 10000}
    - name: limit 스트림만 있는 호스트(available 결손)는 오탐하지 않는다 — 결손은 Silent Host 몫
      host: verify-mem-p1-noavail
      fires: false
      records:
        - {ts: [0, 60, 120, 180], stream: system_memory_limit, value: 10000}
    - name: available 스트림만 있는 호스트(limit 결손)는 오탐하지 않는다
      host: verify-mem-p1-nolimit
      fires: false
      records:
        - {ts: [0, 60, 120, 180], value: 300}

# --- Silent Host (Spec #184 / Ticket-4) --- 부재형 알림: 모든 케이스의 호스트가 (가짜) 로스터에 들어가고, records가 비면 데이터가 없는 호스트다.
# ts는 검증 실행 시작(약 5분 전) 기준 초다. 음수는 더 과거 — 최근 15분은 ts > -600, 3시간 창은 ts > -10500 부근이다.
infra-silent-host-p2:
  cases:
    - name: 하트비트가 15분 넘게 끊겼지만 3시간 미만이면 P2
      host: verify-silent-p2-gap
      fires: true
      records:
        - {ts: [-3600, -3540, -3480], state: used, value: 1}
    - name: 하트비트가 최근 15분 안에 오면 발화하지 않는다
      host: verify-silent-p2-alive
      fires: false
      records:
        - {ts: [-3600, 0, 60], state: used, value: 1}
    - name: 3시간 넘게 끊겼으면 P1이라 P2에 중복 통지하지 않는다
      host: verify-silent-p2-long
      fires: false
      records:
        - {ts: [-12000], state: used, value: 1}
    - name: 데이터가 한 번도 없는 호스트는 P1 몫이다
      host: verify-silent-p2-never
      fires: false
      records: []
infra-silent-host-p1:
  cases:
    - name: 3시간 넘게 하트비트가 없으면 P1 (마지막 데이터 3시간 25분 전)
      host: verify-silent-p1-long
      fires: true
      records:
        - {ts: [-12000], state: used, value: 1}
    - name: 데이터가 한 번도 없는 호스트도 P1
      host: verify-silent-p1-never
      fires: true
      records: []
    - name: 15분만 끊긴 호스트는 P2라 P1에 통지하지 않는다
      host: verify-silent-p1-gap
      fires: false
      records:
        - {ts: [-3600, -3540], state: used, value: 1}
    - name: 하트비트가 계속 오는 호스트는 발화하지 않는다
      host: verify-silent-p1-alive
      fires: false
      records:
        - {ts: [0, 60, 120], state: used, value: 1}

# --- 앱 텔레메트리 무소식 (Spec #253 / Ticket-8) --- jvm_memory_used는 모든 JVM이 공유하므로 service_name=funa인 레코드만 센다. 조회 구간은 15분이다.
infra-app-telemetry-silent:
  cases:
    - name: 로스터 호스트가 funa JVM 메트릭을 한 번도 보내지 않았다
      host: verify-app-silent-never
      fires: true
      records: []
    - name: 다른 서비스의 JVM 메트릭만 오면 funa는 무소식이다
      host: verify-app-silent-other
      fires: true
      records:
        - {ts: [-60, 0], service_name: other-jvm, value: 1}
    - name: funa JVM 메트릭이 15분 안에 오면 발화하지 않는다
      host: verify-app-silent-alive
      fires: false
      records:
        - {ts: [-60, 0], service_name: funa, value: 1}
# --- 서버 도달성 (Spec #184 / Ticket-6, ADR-0010) --- tcpcheck.status는 60초마다 1(접속 성공)/0(실패). 검사하는 쪽은 host_name, 대상은 tcpcheck_endpoint.
infra-unreachable-host:
  cases:
    - name: status 0이 5분 연속이면 발화
      host: verify-unreach-down
      fires: true
      records:
        - {ts: [-240, -180, -120, -60, 0], tcpcheck_endpoint: "192.0.2.50:22", value: 0}
    - name: 중간에 1이 섞이면 지속이 아니라 발화하지 않는다
      host: verify-unreach-flap
      fires: false
      records:
        - {ts: [-240, -180, -60, 0], tcpcheck_endpoint: "192.0.2.51:22", value: 0}
        - {ts: -120, tcpcheck_endpoint: "192.0.2.51:22", value: 1}
    - name: 접속이 계속 되면 발화하지 않는다
      host: verify-unreach-up
      fires: false
      records:
        - {ts: [-240, -180, -120, -60, 0], tcpcheck_endpoint: "192.0.2.52:22", value: 1}
# --- 백업 알림 (Spec #184 / Ticket-5) --- backup_logs는 호스트가 host 필드다(host_field). 부재형은 케이스 호스트가 (가짜) 로스터에 들어간다.
# ts는 검증 실행 시작 기준 초(음수 = 과거). 백업 누락 창은 26시간, 유지보수 누락 창은 8일이다.
infra-backup-failure:
  row_key: host
  host_field: host
  cases:
    - name: 백업 실패 이벤트
      host: verify-backup-failed
      fires: true
      records:
        - {job: backup, success: false, error: "repository unreachable"}
    - name: 백업 성공은 발화하지 않는다
      host: verify-backup-ok
      fires: false
      records:
        - {job: backup, success: true}
    - name: 유지보수 실패는 백업 실패가 아니다
      host: verify-backup-maint-failed
      fires: false
      records:
        - {job: maintenance, command: check, success: false}
infra-integrity-check-failure:
  row_key: host
  host_field: host
  cases:
    - name: 무결성 검사 실패 이벤트
      host: verify-check-failed
      fires: true
      records:
        - {job: maintenance, command: check, success: false}
    - name: 무결성 검사 성공은 발화하지 않는다
      host: verify-check-ok
      fires: false
      records:
        - {job: maintenance, command: check, success: true}
    - name: 다른 유지보수 명령(forget) 실패는 검사 실패가 아니다
      host: verify-check-forget-failed
      fires: false
      records:
        - {job: maintenance, command: forget, success: false}
    - name: 백업 실패는 무결성 검사 실패가 아니다
      host: verify-check-backup-failed
      fires: false
      records:
        - {job: backup, success: false}
infra-backup-missing:
  row_key: host
  host_field: host
  cases:
    - name: 가짜 로스터 호스트가 백업 이벤트를 한 번도 보내지 않았다
      host: verify-backup-missing-never
      fires: true
      records: []
    - name: 성공 백업이 없고 실패만 있으면 누락이다
      host: verify-backup-missing-only-failed
      fires: true
      records:
        - {ts: -600, job: backup, success: false}
    - name: 최근 성공 백업이 있으면 발화하지 않는다
      host: verify-backup-missing-fresh
      fires: false
      records:
        - {ts: -600, job: backup, success: true}
infra-maintenance-missing:
  row_key: host
  host_field: host
  cases:
    - name: 가짜 로스터 호스트에 check 기록이 한 번도 없다
      host: verify-maint-missing-never
      fires: true
      records: []
    - name: 백업 이벤트만 있고 check가 없으면 누락이다
      host: verify-maint-missing-backup-only
      fires: true
      records:
        - {ts: -600, job: backup, success: true}
    - name: 최근 check가 있으면 발화하지 않는다
      host: verify-maint-missing-fresh
      fires: false
      records:
        - {ts: -600, job: maintenance, command: check, success: true}
# --- RAID 상태 알림 (Spec #322 / Ticket-13, #335) --- 레코드는 host-agents-raid-status가 남기는 정규화 JSON 줄의 모양이다.
# 값은 tests/fixtures/raid_ssacli의 실제 출력(2026-10-22)에서 나온 것이다. 수집은 5분마다라 "2회 연속"은 ts [-300, 0]이다.
infra-raid-write-cache-disabled:
  cases:
    - name: 배터리 없음으로 영구 비활성(ns0325 모양)
      host: verify-raid-cache-perm
      fires: true
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440ar in Slot 0 (Embedded)", hw_state: ok, cache_status: permanently_disabled, cache_reason: "Cache disabled; backup power source is not attached", backup_power: none, backup_power_operation: none}
    - name: 배터리 케이블 오류로 일시 비활성(ns0334 모양)
      host: verify-raid-cache-cable
      fires: true
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440ar in Slot 0 (Embedded)", hw_state: ok, cache_status: temporarily_disabled, cache_reason: "cable error to the centralized backup power source", backup_power: battery, backup_power_operation: none}
    - name: 배터리 충전 중의 일시 비활성은 정상 동작이다
      host: verify-raid-cache-charging
      fires: false
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440 in Slot 2", hw_state: ok, cache_status: temporarily_disabled, cache_reason: "", backup_power: battery, backup_power_operation: charging}
    - name: 판독 1회만으로는 울리지 않는다
      host: verify-raid-cache-once
      fires: false
      records:
        - {ts: 0, kind: controller, hw_name: "Smart Array P440 in Slot 2", hw_state: ok, cache_status: permanently_disabled, cache_reason: "Cable Error", backup_power: none, backup_power_operation: none}
    - name: 캐시 정상
      host: verify-raid-cache-ok
      fires: false
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440 in Slot 2", hw_state: ok, cache_status: ok, cache_reason: "", backup_power: battery, backup_power_operation: none}
infra-raid-controller-fault:
  cases:
    - name: 컨트롤러 상태가 OK가 아니다
      host: verify-raid-ctrl-failed
      fires: true
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440 in Slot 2", hw_state: failed, raw_state: "Failed"}
    - name: 컨트롤러 정상(캐시만 꺼짐)은 컨트롤러 이상이 아니다
      host: verify-raid-ctrl-ok
      fires: false
      records:
        - {ts: [-300, 0], kind: controller, hw_name: "Smart Array P440 in Slot 2", hw_state: ok, raw_state: "OK", cache_status: permanently_disabled}
infra-raid-logical-drive-degraded:
  cases:
    - name: 재구축 중(저하)
      host: verify-raid-ld-rebuild
      fires: true
      records:
        - {ts: [-300, 0], kind: logical_drive, hw_name: "logicaldrive 1", hw_state: degraded, raw_state: "Recovering, 41% complete", operation: rebuild}
    - name: 고장
      host: verify-raid-ld-failed
      fires: true
      records:
        - {ts: [-300, 0], kind: logical_drive, hw_name: "logicaldrive 1", hw_state: failed, raw_state: "Failed", operation: none}
    - name: 확장 같은 계획된 작업은 정상이다
      host: verify-raid-ld-expand
      fires: false
      records:
        - {ts: [-300, 0], kind: logical_drive, hw_name: "logicaldrive 1", hw_state: ok, raw_state: "Transforming, 12% complete", operation: expand}
infra-raid-physical-drive-fault:
  cases:
    - name: 디스크 고장
      host: verify-raid-pd-failed
      fires: true
      records:
        - {ts: [-300, 0], kind: physical_drive, hw_name: "physicaldrive 1I:1:2", hw_state: failed, raw_state: "Failed"}
    - name: 디스크 고장 예측
      host: verify-raid-pd-predictive
      fires: true
      records:
        - {ts: [-300, 0], kind: physical_drive, hw_name: "physicaldrive 1I:1:3", hw_state: predicted_failure, raw_state: "Predictive Failure"}
    - name: 정상 디스크
      host: verify-raid-pd-ok
      fires: false
      records:
        - {ts: [-300, 0], kind: physical_drive, hw_name: "physicaldrive 1I:1:1", hw_state: ok, raw_state: "OK"}
infra-raid-cache-battery-fault:
  cases:
    - name: 배터리 고장
      host: verify-raid-bat-failed
      fires: true
      records:
        - {ts: [-300, 0], kind: cache_battery, hw_name: "Smart Array P440 in Slot 2 cache backup power", hw_state: failed, raw_state: "Failed"}
    - name: 충전 중은 고장이 아니다
      host: verify-raid-bat-charging
      fires: false
      records:
        - {ts: [-300, 0], kind: cache_battery, hw_name: "Smart Array P440 in Slot 2 cache backup power", hw_state: degraded, raw_state: "Recharging"}
infra-raid-collection-error:
  cases:
    - name: 도구가 3회 연속 시간 초과
      host: verify-raid-tool-timeout
      fires: true
      records:
        - {ts: [-600, -300, 0], kind: tool_status, status: timeout, message: "no answer within 60s"}
    - name: 오류 2회는 임계 미만
      host: verify-raid-tool-error-twice
      fires: false
      records:
        - {ts: [-300, 0], kind: tool_status, status: error, message: "Error: x"}
    - name: 도구 없음은 수집 실패가 아니다
      host: verify-raid-tool-none
      fires: false
      records:
        - {ts: [-600, -300, 0], kind: tool_status, status: no_tool, message: ""}
infra-host-status-silent:
  cases:
    - name: 가짜 로스터 호스트가 점검 기록을 한 번도 보내지 않았다
      host: verify-host-status-never
      fires: true
      records: []
    - name: 도구가 없어도 실행 기록(no_tool)이 오면 발화하지 않는다
      host: verify-host-status-no-tool
      fires: false
      records:
        - {ts: -300, kind: tool_status, status: no_tool, message: ""}

# --- 스위치 syslog 알림 (Spec #277) --- 레코드는 switch_syslog_semantics VRL 처리 후의 모양이다(service_name, device_name/device_id, event_name,
# log_syslog_severity_code). 장비 식별자 device_id가 케이스 호스트다(host_field). 송신 주소는 문서용 대역만 쓴다.
# 장비별 집계의 분리는 "장비마다 임계 미만" 케이스가 함께 있으면서 모두 발화하지 않는 것으로 확인한다(합치면 임계를 넘는다).
infra-switch-config-change:
  row_key: device
  host_field: device_id
  cases:
    - name: 설정 변경 메시지 1건
      host: verify-sw-config-change
      fires: true
      records:
