    why: "약 {{ o2c_ingest_allowed_hours }}시간이 지나면 이 구간 로그는 OpenObserve로 복구되지 않음 — ISMS 로그 증거가 중앙에서 영구히 빠집니다(호스트에는 원본이 남아 있습니다)."
    action: "① 같은 호스트의 서버 응답 없음 알림이 있으면 그쪽이 원인 — 서버·네트워크부터 복구 ② 서버가 살아 있으면 otelcol-contrib 서비스 상태 확인·재기동 ③ 수집이 재개되면 끊긴 구간 로그가 5시간 한도 안에 들어오는지 확인하고, 넘었다면 호스트 원본 로그를 보존"
    runbook: "{{ o2c_runbook_base }}#silent-host"
    row_template: '• {host_name}'
    description: "수집 로스터 호스트의 system_memory_usage가 3시간 없음 (State Alert, 재통지 60분) — UNION ALL 로스터 가지 방식"
    stream: system_memory_usage
    stream_type: metrics
