    runbook: "{{ o2c_runbook_base }}#app-telemetry-silent"
    row_template: '• {host_name}'
    description: "otel_app_telemetry를 켠 호스트의 funa JVM 메트릭(jvm_memory_used)이 15분 없음 (State Alert, 재통지 1440분) — UNION ALL 로스터 가지 방식"
    stream: jvm_memory_used
    stream_type: metrics
    missing: {roster: app, field: host_name, cond: "service_name = 'funa'"}
    sql: "{{ o2c_roster_app | o2c_missing_sql('jvm_memory_used', 'host_name', \"service_name = 'funa'\") }}"
    period: 15
    frequency: 5
    silence: 1440

  # --- 스위치 syslog (Spec #277) --- 모두 system_logs의 service_name='switch-syslog'. 장비는 coalesce(device_id, device_name)(관리번호, 없으면 정규화된 이름)로 집계한다.
  # SQL은 파싱된 모든 줄이 갖는 필드와 body만 참조한다(일부 메시지에만 생기는 필드는 body에서 뽑는다 — 없는 컬럼은 알림을 unknown field 오류로 만든다).
  - name: infra-switch-config-change
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "스위치 설정 변경 감지"
    what: "스위치에서 설정 변경 메시지({{ o2c_switch_config_change_events | join(', ') }})가 기록됐습니다."
    why: "승인되지 않은 설정 변경이면 네트워크 장애나 침해의 시작일 수 있습니다. 변경 이력은 ISMS 변경 관리 증적입니다."
    action: "① 대상의 변경 주체(사용자·접속 방식·주소)를 작업 일정과 대조 ② 승인된 작업이 아니면 장비 접속 차단과 설정 백업(Cisco Backup) 비교 ③ 승인된 작업이면 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#switch-config-change"
    row_template: '• {device}: 설정 변경 {changes}건 — {detail} · {event_time}'
    description: "스위치 설정 변경 메시지({{ o2c_switch_config_change_events | join(', ') }}) 1건부터 (Event Alert) — 행에 장비와 원문의 변경 주체"
    stream: system_logs
    sql: >-
      SELECT coalesce(device_id, device_name) AS device,
      regexp_replace(body, '^[^%]*%[A-Za-z0-9_]+-[0-7]-[A-Za-z0-9_]+: ', '') AS detail, count(*) AS changes, {{ o2c_event_time_sql }} FROM "system_logs"
      WHERE service_name = 'switch-syslog' AND event_name IN ('{{ o2c_switch_config_change_events | join("', '") }}'){{ o2c_switch_noise_filter }}
      GROUP BY device, detail
      ORDER BY changes DESC
    period: 5
    frequency: 1
    silence: 5
  - name: infra-switch-login-failures
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "스위치 로그인 실패 반복"
    what: "한 스위치에서 {{ o2c_switch_login_fail_window_minutes }}분 동안 로그인 실패({{ o2c_switch_login_fail_events | join(', ') }})가 {{ o2c_switch_login_fail_threshold }}회 이상 발생했습니다."
    why: "스위치 관리 접속에 대한 무차별 대입 시도일 수 있습니다. 스위치는 모든 서버의 통신 경로입니다."
    action: "① 로그 보기에서 실패 줄의 사용자·출발지 확인 ② 외부·미확인 출발지면 해당 접속 경로(ACL·방화벽) 차단 ③ 작업자 오입력이면 계정 확인 후 기록"
    runbook: "{{ o2c_runbook_base }}#switch-login-failures"
    row_template: '• {device}: 로그인 실패 {failures}회 · {event_time}'
    description: "스위치 로그인 실패({{ o2c_switch_login_fail_events | join(', ') }})가 장비별로 {{ o2c_switch_login_fail_window_minutes }}분 동안 {{ o2c_switch_login_fail_threshold }}회 이상 (Event Alert)"
    stream: system_logs
    sql: >-
      SELECT coalesce(device_id, device_name) AS device, count(*) AS failures, {{ o2c_event_time_sql }} FROM "system_logs"
      WHERE service_name = 'switch-syslog' AND event_name IN ('{{ o2c_switch_login_fail_events | join("', '") }}'){{ o2c_switch_noise_filter }}
      GROUP BY device HAVING count(*) >= {{ o2c_switch_login_fail_threshold }}
      ORDER BY failures DESC
    period: "{{ o2c_switch_login_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_switch_login_fail_window_minutes }}"
  - name: infra-switch-severity-critical
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "스위치 중요 장애 메시지 (심각도 {{ o2c_switch_severity_max }} 이하)"
    what: "스위치가 심각도 {{ o2c_switch_severity_max }} 이하(0 emergency, 1 alert, 2 critical)의 메시지를 기록했습니다."
    why: "스위치 하드웨어·전원·스택 같은 중대한 장애를 뜻합니다. 방치하면 그 스위치에 연결된 서버가 함께 끊길 수 있습니다."
    action: "① 행의 메시지 코드와 로그 보기의 원문 확인 ② 장비 콘솔·전원·스택·팬 상태 확인 ③ 하드웨어 문제면 이중화 경로로 서비스 전환 후 교체 일정 수립"
    runbook: "{{ o2c_runbook_base }}#switch-severity-critical"
    row_template: '• {device}: {event_name} (심각도 {severity_code}) {events}건 · {event_time}'
    description: "스위치 syslog 심각도 0~{{ o2c_switch_severity_max }}(Cisco 메시지 코드의 심각도)는 즉시 P1, 잡음 목록은 제외 (Event Alert)"
    stream: system_logs
    sql: >-
      SELECT coalesce(device_id, device_name) AS device, event_name, min(log_syslog_severity_code) AS severity_code, count(*) AS events, {{ o2c_event_time_sql }} FROM "system_logs"
      WHERE service_name = 'switch-syslog' AND log_syslog_severity_code <= {{ o2c_switch_severity_max }}{{ o2c_switch_noise_filter }}
      GROUP BY device, event_name
      ORDER BY events DESC
    period: 5
    frequency: 1
    silence: 5
  - name: infra-switch-uplink-down
    enabled: "{{ o2c_switch_uplinks | length > 0 }}"
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "스위치 업링크 포트 다운"
    what: "감시 목록(o2c_switch_uplinks)에 있는 스위치 포트의 링크가 내려갔습니다."
    why: "스위치 사이나 사이트 밖으로 나가는 핵심 연결이 끊긴 것입니다. 이중화가 없으면 그 아래 서버가 모두 고립됩니다."
    action: "① 행의 장비·포트와 반대편 장비 상태 확인 ② 케이블·광모듈·반대편 포트의 shutdown 여부 확인 ③ 복구되지 않으면 우회 경로 확보와 회선 사업자 연락"
    runbook: "{{ o2c_runbook_base }}#switch-uplink-down"
    row_template: '• {device} {port}: 링크 다운 {downs}건 · {event_time}'
    description: "감시 목록의 (장비, 포트)에 대한 link down / line protocol down / administratively down 메시지 (Event Alert) — 목록이 비면 이 규칙은 만들지 않는다"
    stream: system_logs
    uplinks: "{{ o2c_switch_uplinks }}"
    noise_events: "{{ o2c_switch_noise_events }}"
    extra_columns: "{{ o2c_event_time_sql }}"   # 검증 계획이 감시 목록을 더해 SQL을 다시 만들 때도 같은 컬럼을 쓴다
    sql: "{{ o2c_switch_uplinks | o2c_switch_uplink_sql(o2c_switch_noise_events, o2c_event_time_sql) }}"
    period: 5
    frequency: 1
    silence: 5
  - name: infra-switch-mac-flap
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "스위치 MAC 플랩 감지"
    what: "한 스위치에서 {{ o2c_switch_macflap_window_minutes }}분 동안 MAC 플랩({{ o2c_switch_macflap_events | join(', ') }})이 {{ o2c_switch_macflap_threshold }}회 이상 발생했습니다."
    why: "L2 루프나 같은 MAC을 쓰는 장비의 이동·이중 연결 신호입니다. 방치하면 해당 VLAN 통신이 불안정해지고 브로드캐스트 폭풍으로 번질 수 있습니다."
    action: "① 로그 보기에서 플랩하는 MAC·VLAN·두 포트 확인 ② 두 포트 중 한쪽 끝 장비(서버 이중화 본딩·가상 스위치·루프 케이블)를 점검 ③ 의도한 이중 연결이면 본딩 모드를 확인하고 아니면 포트를 분리"
    runbook: "{{ o2c_runbook_base }}#switch-mac-flap"
    row_template: '• {device}: MAC 플랩 {flaps}회 · {event_time}'
    description: "스위치 MAC 플랩({{ o2c_switch_macflap_events | join(', ') }})이 장비별로 {{ o2c_switch_macflap_window_minutes }}분 동안 {{ o2c_switch_macflap_threshold }}회 이상 (재통지 {{ o2c_switch_macflap_silence_minutes }}분)"
    stream: system_logs
    sql: >-
      SELECT coalesce(device_id, device_name) AS device, count(*) AS flaps, {{ o2c_event_time_sql }} FROM "system_logs"
      WHERE service_name = 'switch-syslog' AND event_name IN ('{{ o2c_switch_macflap_events | join("', '") }}'){{ o2c_switch_noise_filter }}
      GROUP BY device HAVING count(*) >= {{ o2c_switch_macflap_threshold }}
      ORDER BY flaps DESC
    period: "{{ o2c_switch_macflap_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_switch_macflap_silence_minutes }}"
  - name: infra-switch-syslog-silent
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "스위치 syslog 수신 중단: {{ o2c_switch_silent_hours }}시간 넘게 로그 없음"
    what: "수신 중단 감시 목록(o2c_switch_syslog_roster)의 스위치에서 {{ o2c_switch_silent_hours }}시간 넘게 syslog가 도착하지 않았습니다."
    why: "스위치의 전송 설정이 사라졌거나 수신 경로가 막혔을 수 있습니다. 그동안의 설정 변경·로그인 이력이 중앙에 남지 않습니다. 스위치는 이벤트가 있을 때만 보내므로 오래 조용한 정상 장비일 수도 있습니다."
    action: "① 스위치에서 logging host 설정과 logging trap 수준 확인 ② 수신 서버의 방화벽·수신 서비스 상태 확인(#276) ③ 장비가 원래 조용한 것이면 기준 시간(o2c_switch_silent_hours)을 늘리고, 철거·교체했으면 감시 목록에서 뺀다"
    runbook: "{{ o2c_runbook_base }}#switch-syslog-silent"
    row_template: '• {device_id}'
    description: "수신 중단 감시 목록(o2c_switch_syslog_roster)의 스위치별 switch-syslog가 {{ o2c_switch_silent_hours }}시간 없음 (State Alert, 재통지 1440분) — 장비 자체 다운은 SNMP 알림(#175)의 몫"
    stream: system_logs
    # 없다는 사실을 알리는 알림이라 WHERE의 원문(있는 줄)은 대상이 아니다: 원문 링크를 만들지 않는다
    raw_link: false
    missing: {roster: switch, field: device_id, cond: "service_name = 'switch-syslog'", body_match: true}
    sql: "{{ o2c_switch_syslog_roster | o2c_missing_sql('system_logs', 'device_id', \"service_name = 'switch-syslog'\", true) }}"
    period: "{{ o2c_switch_silent_hours * 60 }}"
    frequency: 60
    silence: 1440

  # --- 방화벽 포티게이트 (Spec #282 / Ticket-3) --- 모두 security_logs의 service_name='fortigate-syslog'. 장비는 원문 devname에서 뽑는다.
  - name: infra-fortigate-admin-login-failures
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "방화벽 관리자 로그인 연속 실패"
    what: "한 출발지에서 {{ o2c_fortigate_login_fail_window_minutes }}분 동안 방화벽 관리자 로그인 실패가 {{ o2c_fortigate_login_fail_threshold }}회 이상 발생했습니다."
    why: "방화벽 관리 접속에 대한 무차별 대입 시도일 수 있습니다. 관리자 계정이 뚫리면 모든 통신 정책을 바꿀 수 있습니다(ISMS 2.5 사용자 인증)."
    action: "① 행의 출발지가 사내 작업자·Semaphore인지 확인 ② 외부·미확인 출발지면 관리 접속 허용 주소(trusted host)와 관리 인터페이스 노출 범위를 점검해 차단 ③ 작업자의 오입력이면 계정 확인 후 기록, 같은 출발지의 로그인 성공이 있으면 계정 변경 알림도 확인"
    runbook: "{{ o2c_runbook_base }}#fortigate-admin-login-failures"
    row_template: '• {device}: 출발지 {source_address} 로그인 실패 {failures}회 · {event_time}'
    description: "방화벽 관리자 로그인 실패(subtype=system, action=login, status=failed)가 장비·출발지별로 {{ o2c_fortigate_login_fail_window_minutes }}분 동안 {{ o2c_fortigate_login_fail_threshold }}회 이상 (Event Alert, 재통지 {{ o2c_fortigate_login_fail_silence_minutes }}분)"
    stream: security_logs
    sql: >-
      SELECT {{ o2c_fortigate_device_sql }} AS device, source_address, count(*) AS failures, {{ o2c_event_time_sql }} FROM "security_logs"
      WHERE service_name = 'fortigate-syslog' AND {{ 'subtype' | o2c_fortigate_match(['system']) }}
      AND {{ 'action' | o2c_fortigate_match(['login']) }} AND {{ 'status' | o2c_fortigate_match(['failed']) }}
      GROUP BY device, source_address HAVING count(*) >= {{ o2c_fortigate_login_fail_threshold }}
      ORDER BY failures DESC
    period: "{{ o2c_fortigate_login_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_fortigate_login_fail_silence_minutes }}"
  - name: infra-fortigate-change-unapproved
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "방화벽 정책·계정 변경 (승인 시간 밖)"
    what: "승인 시간({{ o2c_fortigate_approved_start_hour }}시~{{ o2c_fortigate_approved_end_hour }}시, 장비 시계) 밖에 방화벽의 정책 또는 관리자 계정 설정이 변경됐습니다."
    why: "승인되지 않은 정책·계정 변경은 통신 차단 해제나 백도어 계정 생성일 수 있습니다. 변경 이력은 ISMS 변경 관리 증적입니다(ISMS 2.9.1 변경관리)."
    action: "① 행의 관리자와 변경 대상(cfgpath)을 작업 요청·Semaphore 이력과 대조 ② 승인된 긴급 작업이 아니면 해당 관리자 계정 잠금과 직전 설정 백업(FortiGate Backup) 비교 후 되돌리기, 보안 담당 보고 ③ 승인된 작업이면 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#fortigate-change-unapproved"
    row_template: '• {device}: {cfgpath} 변경 {changes}건 (관리자 {admin}) · {event_time}'
    description: "방화벽 정책({{ o2c_fortigate_policy_cfgpaths | join(', ') }})·계정({{ o2c_fortigate_account_cfgpaths | join(', ') }}) 변경이 승인 시간 밖 (Event Alert) — 시각을 읽지 못한 줄도 포함"
    stream: security_logs
    sql: >-
      SELECT {{ o2c_fortigate_device_sql }} AS device,
      CASE WHEN body LIKE '% cfgpath="%' THEN regexp_replace(body, '^.* cfgpath="([^"]*)".*$', '\1') ELSE '-' END AS cfgpath,
      CASE WHEN body LIKE '% user="%' THEN regexp_replace(body, '^.* user="([^"]*)".*$', '\1') ELSE '-' END AS admin,
      count(*) AS changes, {{ o2c_event_time_sql }} FROM "security_logs"
      WHERE service_name = 'fortigate-syslog' AND {{ 'cfgpath' | o2c_fortigate_match(o2c_fortigate_policy_cfgpaths + o2c_fortigate_account_cfgpaths) }}
      AND NOT ({{ o2c_fortigate_in_hours_sql }})
      GROUP BY device, cfgpath, admin
      ORDER BY changes DESC
    period: 5
    frequency: 1
    silence: 5
  - name: infra-fortigate-change-approved
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "방화벽 정책·계정 변경 (승인 시간 안, 하루 요약)"
    what: "승인 시간({{ o2c_fortigate_approved_start_hour }}시~{{ o2c_fortigate_approved_end_hour }}시, 장비 시계) 안에 방화벽의 정책 또는 관리자 계정 설정이 변경됐습니다. 하루에 한 번 요약해 알립니다."
    why: "승인 시간 안의 변경은 대부분 정상 작업이지만 변경 관리 증적으로 매일 대조해야 합니다. 승인된 작업 목록에 없는 변경이면 계정 도용일 수 있습니다."
    action: "① 행의 관리자·변경 대상을 그날의 작업 요청과 대조 ② 대응 작업이 없는 변경은 승인 시간 밖 변경 절차(P1)로 격상 ③ 대조 결과를 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#fortigate-change-approved"
    row_template: '• {device}: {cfgpath} 변경 {changes}건 (관리자 {admin}) · {event_time}'
    description: "방화벽 정책({{ o2c_fortigate_policy_cfgpaths | join(', ') }})·계정({{ o2c_fortigate_account_cfgpaths | join(', ') }}) 변경이 승인 시간 안 — 하루 1번 P3 요약(period·silence 1440)"
    stream: security_logs
    sql: >-
      SELECT {{ o2c_fortigate_device_sql }} AS device,
      CASE WHEN body LIKE '% cfgpath="%' THEN regexp_replace(body, '^.* cfgpath="([^"]*)".*$', '\1') ELSE '-' END AS cfgpath,
      CASE WHEN body LIKE '% user="%' THEN regexp_replace(body, '^.* user="([^"]*)".*$', '\1') ELSE '-' END AS admin,
      count(*) AS changes, {{ o2c_event_time_sql }} FROM "security_logs"
      WHERE service_name = 'fortigate-syslog' AND {{ 'cfgpath' | o2c_fortigate_match(o2c_fortigate_policy_cfgpaths + o2c_fortigate_account_cfgpaths) }}
      AND ({{ o2c_fortigate_in_hours_sql }})
      GROUP BY device, cfgpath, admin
      ORDER BY changes DESC
    period: 1440
    frequency: 1
    silence: 1440
  - name: infra-fortigate-ha-failover
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "방화벽 HA 전환·이상 감지"
    what: "방화벽 HA 로그(subtype=ha)가 기록됐습니다. 주 장비가 바뀌었거나 멤버·하트비트 상태가 변했을 수 있습니다."
    why: "통신은 이어지더라도 이중화가 깨져 다음 장애에서 서비스가 끊길 수 있고, 전환이 반복되면 세션 끊김이 생깁니다."
    action: "① 행의 장비 이름으로 지금 주 장비가 어느 멤버인지 확인 ② 전환 직전 같은 장비의 인터페이스·전원·하트비트 로그 확인 ③ 한쪽 멤버가 복구되지 않으면 교체·점검 일정을 잡고, 계획된 작업이면 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#fortigate-ha-failover"
    row_template: '• {device}: {event} {events}건 · {event_time}'
    description: "방화벽 HA 로그(subtype=ha, 정보성 동기화 로그 등 o2c_fortigate_ha_ignored_logids는 제외) 1건부터 (Event Alert, 재통지 {{ o2c_fortigate_ha_silence_minutes }}분) — 전환 반복 때 알림이 쏟아지지 않도록 재통지 간격을 길게 둔다"
    stream: security_logs
    sql: >-
      SELECT {{ o2c_fortigate_device_sql }} AS device,
      CASE WHEN body LIKE '% logdesc="%' THEN regexp_replace(body, '^.* logdesc="([^"]*)".*$', '\1') ELSE 'HA 이벤트' END AS event,
      count(*) AS events, {{ o2c_event_time_sql }} FROM "security_logs"
      WHERE service_name = 'fortigate-syslog' AND {{ 'subtype' | o2c_fortigate_match(['ha']) }}{{ o2c_fortigate_ha_ignored_logids | o2c_fortigate_exclude_logids }}
      GROUP BY device, event
      ORDER BY events DESC
    period: 5
    frequency: 1
    silence: "{{ o2c_fortigate_ha_silence_minutes }}"
  - name: infra-fortigate-critical-detection
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "방화벽 중대 보안 탐지"
    what: "방화벽 보안 기능(IPS·안티바이러스 등)이 심각도 {{ o2c_fortigate_detection_severities | join('·') }} 탐지를 기록했습니다."
    why: "알려진 취약점 공격이나 악성코드가 방화벽을 지나가려 했습니다. 차단됐더라도 공격 대상 시스템에 이미 닿았는지 확인해야 합니다."
    action: "① 행의 탐지 이름과 로그 보기의 출발지·목적지·조치(차단/통과) 확인 ② 통과(pass·monitor)였거나 내부 호스트가 출발지면 해당 호스트 격리와 점검 ③ 외부 출발지의 반복 공격이면 차단 정책 추가 검토, 결과를 사고 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#fortigate-critical-detection"
    row_template: '• {device}: {attack} {detections}건 · {event_time}'
    description: "방화벽 UTM 탐지(type=utm) 중 severity가 {{ o2c_fortigate_detection_severities | join(', ') }} 인 것 1건부터 (Event Alert, 재통지 {{ o2c_fortigate_detection_silence_minutes }}분)"
    stream: security_logs
    sql: >-
      SELECT {{ o2c_fortigate_device_sql }} AS device,
      CASE WHEN body LIKE '% attack="%' THEN regexp_replace(body, '^.* attack="([^"]*)".*$', '\1')
      WHEN body LIKE '% virus="%' THEN regexp_replace(body, '^.* virus="([^"]*)".*$', '\1') ELSE '-' END AS attack,
      count(*) AS detections, {{ o2c_event_time_sql }} FROM "security_logs"
      WHERE service_name = 'fortigate-syslog' AND {{ 'type' | o2c_fortigate_match(['utm']) }}
      AND ({{ 'severity' | o2c_fortigate_match(o2c_fortigate_detection_severities) }}
      OR ({{ 'subtype' | o2c_fortigate_match(['virus']) }} AND {{ 'eventtype' | o2c_fortigate_match(['infected']) }}))
      GROUP BY device, attack
      ORDER BY detections DESC
    period: 5
    frequency: 1
    silence: "{{ o2c_fortigate_detection_silence_minutes }}"
  - name: infra-fortigate-syslog-silent
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "방화벽 syslog 수신 중단: {{ o2c_fortigate_silent_minutes }}분 넘게 로그 없음"
    what: "수신 중단 감시 목록(o2c_fortigate_syslog_roster)의 방화벽에서 {{ o2c_fortigate_silent_minutes }}분 넘게 syslog가 도착하지 않았습니다(HA 쌍은 두 멤버 모두 조용할 때)."
    why: "장비의 전송 설정이 사라졌거나 수신 경로가 막혔을 수 있습니다. 그동안의 관리자 접속·정책 변경 이력이 중앙에 남지 않습니다(ISMS 2.9.4 로그 및 접속기록 관리)."
    action: "① 장비의 로그 전송 설정(대상·형식·출발지 고정)이 그대로인지 확인 ② 수신 서버의 방화벽 허용 목록·syslog-ng 상태 확인(런북 fortigate-syslog.md 3절) ③ 장비가 철거·교체됐으면 감시 목록에서 빼고, 로그가 원래 적은 장비면 기준 시간(o2c_fortigate_silent_minutes)을 늘리기"
    runbook: "{{ o2c_runbook_base }}#fortigate-syslog-silent"
    row_template: '• {device_id}'
    description: "수신 중단 감시 목록(o2c_fortigate_syslog_roster)의 방화벽별 fortigate-syslog가 {{ o2c_fortigate_silent_minutes }}분 없음 (State Alert, 재통지 1440분) — 목록이 비면 행을 돌려주지 않는다"
    stream: security_logs
    missing: {roster: fortigate, field: device_id, cond: "service_name = 'fortigate-syslog'", body_match: devname, field_column: false}
    sql: "{{ o2c_fortigate_syslog_roster | o2c_missing_sql('security_logs', 'device_id', \"service_name = 'fortigate-syslog'\", 'devname', false) }}"
    period: "{{ o2c_fortigate_silent_minutes }}"
    frequency: 10
    silence: 1440

  # --- PromQL 알림 17개 (#282 복원, #318 업계 기준 정비, metrics 스트림) ---
  # `promql`이 있으면 query_condition.type=promql이다. 값 비교는 promql_operator(기본 >=)·promql_value(결과의 value 열)이고,
  # trigger는 threshold 1행 이상 + align_time이다. 합성 레코드 검증(O2C-030~034) 대상이 아니고 평가 오류는 O2C-036이 본다.
  # OpenObserve PromQL 평가 방식(docs/research/alert-conditions-industry-baseline.md §2): 평가 한 번은 조회 구간(period) 안의 한 점만 넘어도 일치다.
  # 그래서 "N분 지속"은 pending_minutes(알림 최상위 pending_period_sec, Prometheus `for:`)로 만들고 period는 frequency와 같게 둔다(5/5).
  # period를 늘리면 한 점이 걸릴 기회가 늘어 오히려 더 잘 울린다. 서브쿼리([10m:1m])는 지속 조건을 만들지 못하니 쓰지 않는다.
  # OpenObserve PromQL 주의: sum by() 결과를 서브쿼리([6h:5m])로 감싸면 빈 결과가 나온다 — 원본 시리즈에 deriv()/rate()를 건 뒤 sum by() 한다.
  # 레이블 정규식(=~, !~)은 앞뒤가 고정되지 않는다(실측: 'sd[a-z]+'가 sda1에도 맞음). 전체 일치가 필요하면 ^(...)$로 감싼다.
  # Config가 쿼리를 round(...)로 감싸 반올림 값으로 비교하므로, 작은 임계(비율 1%, 코어당 load 2)는 비교를 PromQL 안에 두고 바깥은 >= 0으로 둔다.
  # 장치 필터 ^(sd…|nvme…|vd…|xvd…|dm-…|md…)$는 파티션(sda3 등) 중복을 뺀다. LVM 호스트는 물리 장치(sda)와 dm-0이 따로 잡힐 수 있다.
  # CPU 사용률은 idle·iowait·steal을 뺀 값이다(node-mixin NodeCPUHighUsage, kubernetes-mixin). iowait·steal은 아래 별도 알림이 본다.
  # 이름은 그대로 두고 등급만 내렸다(#318): -p1은 P2, -p2는 P3. 이름을 바꾸면 폐기 + 생성이 필요해진다.
  - name: infra-cpu-usage-p1
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "CPU 사용률 매우 높음 (90% 이상, 15분 지속)"
    what: "호스트의 CPU 사용률(idle·iowait·steal 제외)이 15분 넘게 계속 90% 이상입니다."
    why: "CPU가 포화되어 서비스 응답이 느려지고 관리 접속과 수집기까지 밀릴 수 있습니다. 단일 호스트 리소스 경보라 호출(P1) 대상은 아닙니다."
    action: "① 대상 호스트에서 CPU 상위 프로세스·컨테이너 확인 ② 폭주한 프로세스면 재기동하거나 원인(배포·배치·공격 트래픽) 조치 ③ 지속되면 증설 또는 부하 분산 검토"
    runbook: "{{ o2c_runbook_base }}#cpu-usage-p1"
    row_template: '• {host_name}: CPU {value}%'
    description: "호스트 CPU 사용률(1 − idle − iowait − steal)이 90% 이상, 5분마다 평가해 15분 지속 (PromQL, P2, State Alert, 재통지 60분)"
    stream: system_cpu_utilization
    stream_type: metrics
    promql: "(1 - sum by(host_name)(avg by(host_name,state)(system_cpu_utilization{state=~'^(idle|wait|steal)$'}))) * 100"
    promql_operator: ">="
    promql_value: 90
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 15
  - name: infra-cpu-usage-p2
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "CPU 사용률 높음 (80% 이상 90% 미만, 15분 지속)"
    what: "호스트의 CPU 사용률(idle·iowait·steal 제외)이 15분 넘게 계속 80% 이상 90% 미만입니다."
    why: "방치하면 90%를 넘어 서비스 지연으로 이어집니다. 90% 이상은 P2 알림(infra-cpu-usage-p1)이 따로 갑니다."
    action: "① 대상 호스트에서 CPU 상위 프로세스·컨테이너 확인 ② 일시적인 배치·배포면 종료 시각 확인, 상시 부하면 증설 계획 ③ 원인 서비스의 설정(스레드 수, 배치 주기) 점검"
    runbook: "{{ o2c_runbook_base }}#cpu-usage-p2"
    row_template: '• {host_name}: CPU {value}%'
    description: "호스트 CPU 사용률(1 − idle − iowait − steal)이 80% 이상 90% 미만, 5분마다 평가해 15분 지속 — 범위는 PromQL 안에서 가른다 (PromQL, P3, State Alert, 재통지 1440분)"
    stream: system_cpu_utilization
    stream_type: metrics
    promql: "(((1 - sum by(host_name)(avg by(host_name,state)(system_cpu_utilization{state=~'^(idle|wait|steal)$'}))) * 100) >= 80) < 90"
    promql_operator: ">="
    promql_value: 0
    period: 5
    frequency: 5
    silence: 1440
    pending_minutes: 15
  - name: infra-caddy-5xx-error-rate
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "Caddy 5xx 오류 비율 높음 (5% 이상)"
    what: "Caddy가 10분 동안 처리한 요청 중 5xx 응답이 5% 이상입니다(요청 10건 이상일 때만)."
    why: "업스트림 서비스가 오류를 내고 있어 사용자 요청이 실패하고 있습니다."
    action: "① 대상 호스트의 Caddy 로그에서 5xx가 나는 경로·업스트림 확인 ② 업스트림 컨테이너·서비스 상태 확인 후 재기동 또는 롤백 ③ 배포 직후면 직전 변경 되돌리기"
    runbook: "{{ o2c_runbook_base }}#caddy-5xx-error-rate"
    row_template: '• {host_name}: 5xx 비율 {value}%'
    description: "Caddy 10분간 5xx 응답 비율이 5% 이상, 요청 10건 이상일 때만 (PromQL, State Alert, 재통지 60분)"
    stream: caddy_http_request_duration_seconds_count
    stream_type: metrics
    promql: "(sum by(host_name)(increase(caddy_http_request_duration_seconds_count{code=~'5..'}[10m])) / sum by(host_name)(increase(caddy_http_request_duration_seconds_count[10m])) * 100) and on(host_name) (sum by(host_name)(increase(caddy_http_request_duration_seconds_count[10m])) >= 10)"
    promql_operator: ">="
    promql_value: 5
    period: 10
    frequency: 5
    silence: 60
  - name: infra-caddy-4xx-error-rate
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "Caddy 4xx 오류 비율 높음 (5% 이상)"
    what: "Caddy가 10분 동안 처리한 요청 중 4xx 응답(401·499 제외)이 5% 이상입니다(요청 100건 이상일 때만)."
    why: "잘못된 경로·설정 불일치·스캐너 접근 또는 클라이언트 오류가 늘었다는 신호입니다. 직접 장애는 아니지만 방치하면 원인을 놓칩니다."
    action: "① 대상 호스트의 Caddy 로그에서 4xx가 나는 경로·출발지 확인 ② 정상 경로가 404면 라우팅·배포 상태 확인 ③ 외부 스캐너면 방화벽·접근 제한 검토"
    runbook: "{{ o2c_runbook_base }}#caddy-4xx-error-rate"
    row_template: '• {host_name}: 4xx 비율 {value}%'
    description: "Caddy 10분간 4xx 응답(401·499 제외) 비율이 5% 이상, 요청 100건 이상일 때만 (PromQL, State Alert, 재통지 1440분)"
    stream: caddy_http_request_duration_seconds_count
    stream_type: metrics
    promql: "(sum by(host_name)(increase(caddy_http_request_duration_seconds_count{code=~'4..',code!~'401|499'}[10m])) / sum by(host_name)(increase(caddy_http_request_duration_seconds_count[10m])) * 100) and on(host_name) (sum by(host_name)(increase(caddy_http_request_duration_seconds_count[10m])) >= 100)"
    promql_operator: ">="
    promql_value: 5
    period: 10
    frequency: 5
    silence: 1440
  - name: infra-disk-fill-24h
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "디스크가 24시간 안에 가득 찰 전망"
    what: "최근 6시간의 감소 추세대로면 24시간 안에 여유 공간이 바닥나는 파일시스템이 1시간 넘게 이어지고 있습니다(사용률 60% 이상일 때만)."
    why: "사용률 알림(90%·95%)보다 먼저 급증하는 쓰기를 알려 줍니다. 가득 차면 서비스와 로그 기록이 멈춥니다. 4시간 안에 찰 전망(사용률 80% 이상)은 P1 알림이 따로 갑니다."
    action: "① 대상 호스트·마운트에서 최근 급증한 디렉터리 확인 ② 로그·덤프·Docker 데이터 등 원인 정리 또는 로테이션 조정 ③ 정상 증가면 증설 일정 수립"
    runbook: "{{ o2c_runbook_base }}#disk-fill-24h"
    row_template: '• {host_name} {mountpoint}: 약 {value}시간 뒤 가득 참'
    description: "최근 6시간 추세로 24시간 안에 여유 공간 소진, 사용률 60% 이상, 1시간 지속(node-mixin NodeFilesystemSpaceFillingUp warning) — 4시간 P1 조건에 걸린 파일시스템은 뺀다 (PromQL, State Alert, 재통지 1440분)"
    stream: system_filesystem_usage
    stream_type: metrics
    promql: "((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / (-sum by(host_name,mountpoint,device)(deriv(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h]))) / 3600) < 24) and on(host_name,mountpoint,device) ((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='used',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / sum by(host_name,mountpoint,device)(system_filesystem_usage{state=~'used|free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) * 100) >= 60) and on(host_name,mountpoint,device) (sum by(host_name,mountpoint,device)(deriv(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h])) < 0) unless on(host_name,mountpoint,device) (((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / (-sum by(host_name,mountpoint,device)(deriv(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h]))) / 3600) < 4) and on(host_name,mountpoint,device) ((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='used',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / sum by(host_name,mountpoint,device)(system_filesystem_usage{state=~'used|free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) * 100) >= 80))"
    promql_operator: ">="
    promql_value: 0
    period: 30
    frequency: 30
    silence: 1440
    pending_minutes: 60
  - name: infra-disk-fill-4h
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "디스크가 4시간 안에 가득 찰 전망"
    what: "사용률 80% 이상인 파일시스템이 최근 6시간의 감소 추세대로면 4시간 안에 여유 공간이 바닥나는 상태가 1시간 넘게 이어지고 있습니다."
    why: "몇 시간 안에 디스크가 가득 차 서비스·DB·로그 기록이 멈춥니다. 업무 시간 외라도 지금 조치해야 합니다."
    action: "① 대상 호스트·마운트에서 최근 급증한 디렉터리·파일 확인(du) ② 폭주하는 로그·덤프·Docker 데이터를 정리하거나 원인 프로세스를 멈춤 ③ 정리할 수 없으면 볼륨 증설"
    runbook: "{{ o2c_runbook_base }}#disk-fill-4h"
    row_template: '• {host_name} {mountpoint}: 약 {value}시간 뒤 가득 참'
    description: "최근 6시간 추세로 4시간 안에 여유 공간 소진, 사용률 80% 이상, 1시간 지속(node-mixin NodeFilesystemSpaceFillingUp critical) (PromQL, State Alert, 재통지 60분)"
    stream: system_filesystem_usage
    stream_type: metrics
    promql: "((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / (-sum by(host_name,mountpoint,device)(deriv(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h]))) / 3600) < 4) and on(host_name,mountpoint,device) ((sum by(host_name,mountpoint,device)(system_filesystem_usage{state='used',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / sum by(host_name,mountpoint,device)(system_filesystem_usage{state=~'used|free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) * 100) >= 80) and on(host_name,mountpoint,device) (sum by(host_name,mountpoint,device)(deriv(system_filesystem_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h])) < 0)"
    promql_operator: ">="
    promql_value: 0
    period: 10
    frequency: 10
    silence: 60
    pending_minutes: 60
  - name: infra-network-errors
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "네트워크 인터페이스 오류 발생"
    what: "인터페이스의 수신 또는 송신 오류가 패킷의 1%를 넘는 상태(5분에 오류 10건 이상일 때만)가 1시간 넘게 이어지고 있습니다(가상 인터페이스 제외)."
    why: "케이블·NIC·스위치 포트·드라이버 문제의 신호로, 패킷 손실과 지연으로 이어질 수 있습니다."
    action: "① 행의 호스트·인터페이스·방향 확인 후 ip -s link로 오류 카운터 증가 여부 확인 ② 케이블·SFP·스위치 포트의 오류와 속도·duplex 협상 확인 ③ 반복되면 해당 포트·NIC 교체 검토"
    runbook: "{{ o2c_runbook_base }}#network-errors"
    row_template: '• {host_name} {device}({direction}): 오류 비율 {value}%'
    description: "물리 인터페이스의 5분 오류/패킷 비율이 1% 초과이고 같은 5분 오류가 10건 이상, 1시간 지속(node-mixin NodeNetworkReceiveErrs·TransmitErrs) — 비율 비교는 반올림 전에 PromQL 안에서 한다 (PromQL, State Alert, 재통지 60분)"
    stream: system_network_errors
    extra_streams: [system_network_packets]
    stream_type: metrics
    promql: "((sum by(host_name,device,direction)(rate(system_network_errors{device!~'lo|veth.*|docker.*|br-.*|virbr.*|cni.*|flannel.*|cali.*'}[5m])) / sum by(host_name,device,direction)(rate(system_network_packets{device!~'lo|veth.*|docker.*|br-.*|virbr.*|cni.*|flannel.*|cali.*'}[5m])) * 100) > 1) and on(host_name,device,direction) (sum by(host_name,device,direction)(increase(system_network_errors{device!~'lo|veth.*|docker.*|br-.*|virbr.*|cni.*|flannel.*|cali.*'}[5m])) >= 10)"
    promql_operator: ">="
    promql_value: 0
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 60
  - name: infra-cpu-load-saturation
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "CPU 부하 포화 (코어당 load 2 초과, 15분 지속)"
    what: "1분 load average를 논리 코어 수로 나눈 값이 15분 넘게 계속 2를 넘고 있습니다."
    why: "실행을 기다리는 작업이 코어 수의 2배를 넘어 서비스 응답이 지연되고 있을 수 있습니다."
    action: "① 대상 호스트에서 top·uptime으로 load와 대기 프로세스 확인 ② CPU 사용이 낮은데 load가 높으면 디스크 I/O 대기 확인 ③ 원인 프로세스·배치를 줄이거나 증설 검토"
    runbook: "{{ o2c_runbook_base }}#cpu-load-saturation"
    row_template: '• {host_name}: 코어당 load {value}'
    description: "1분 load average / 논리 코어 수가 2 초과, 5분마다 평가해 15분 지속(node-mixin NodeSystemSaturation) — 비교는 반올림 전에 PromQL 안에서 한다 (PromQL, State Alert, 재통지 60분)"
    stream: system_cpu_load_average_1m
    stream_type: metrics
    promql: "(system_cpu_load_average_1m / on(host_name) system_cpu_logical_count) > 2"
    promql_operator: ">="
    promql_value: 0
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 15
  - name: infra-cpu-iowait
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "CPU iowait 높음 (10% 초과, 15분 지속)"
    what: "CPU가 디스크 I/O를 기다리는 시간(iowait)이 15분 넘게 계속 10%를 넘고 있습니다."
    why: "디스크가 느리거나 포화되어 서비스 지연과 load 상승을 일으킵니다."
    action: "① 대상 호스트에서 iostat·iotop으로 I/O가 많은 장치·프로세스 확인 ② 디스크 지연·큐 깊이 알림이 함께 왔는지 확인 ③ 백업·배치가 원인이면 시간대 조정, 디스크 상태 이상이면 교체 검토"
    runbook: "{{ o2c_runbook_base }}#cpu-iowait"
    row_template: '• {host_name}: iowait {value}%'
    description: "호스트 평균 CPU iowait 비율이 10% 초과, 5분마다 평가해 15분 지속 — 원인 지표라 P3 (PromQL, State Alert, 재통지 1440분)"
    stream: system_cpu_utilization
    stream_type: metrics
    promql: "avg by(host_name)(system_cpu_utilization{state='wait'}) * 100"
    promql_operator: ">"
    promql_value: 10
    period: 5
    frequency: 5
    silence: 1440
    pending_minutes: 15
  - name: infra-cpu-steal
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "CPU steal 높음 (10% 초과, 30분 지속)"
    what: "가상 머신이 하이퍼바이저에 CPU를 빼앗기는 시간(steal)이 30분 넘게 계속 10%를 넘고 있습니다."
    why: "같은 물리 서버를 쓰는 다른 가상 머신(noisy neighbor) 때문에 이 서버의 성능이 떨어집니다."
    action: "① 대상 호스트의 steal이 계속되는지 확인 ② 가상화 관리자에게 물리 서버의 과할당 여부 문의 ③ 반복되면 다른 물리 서버로 이전 또는 자원 예약 검토"
    runbook: "{{ o2c_runbook_base }}#cpu-steal"
    row_template: '• {host_name}: steal {value}%'
    description: "호스트 평균 CPU steal 비율이 10% 초과, 5분마다 평가해 30분 지속 — 조치가 하이퍼바이저 쪽이라 P3 (PromQL, State Alert, 재통지 1440분)"
    stream: system_cpu_utilization
    stream_type: metrics
    promql: "avg by(host_name)(system_cpu_utilization{state='steal'}) * 100"
    promql_operator: ">"
    promql_value: 10
    period: 5
    frequency: 5
    silence: 1440
    pending_minutes: 30
  - name: infra-disk-io-saturation
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "디스크 I/O 포화 (큐 깊이 10 초과, 30분 지속)"
    what: "디스크 장치의 평균 I/O 큐 깊이가 30분 넘게 계속 10을 넘고 있습니다(파티션 제외)."
    why: "디스크가 요청을 처리하는 속도보다 쌓이는 속도가 빨라 읽기·쓰기 지연이 커집니다."
    action: "① 대상 호스트·장치에서 iostat -x로 사용률·대기 시간 확인 ② I/O를 많이 쓰는 프로세스(백업·DB·로그) 확인 ③ 지속되면 디스크 성능 증설 또는 부하 분산 검토"
    runbook: "{{ o2c_runbook_base }}#disk-io-saturation"
    row_template: '• {host_name} {device}: 큐 깊이 {value}'
    description: "디스크 장치(sd·nvme·vd·xvd·dm·md, 파티션 제외) 평균 I/O 큐 깊이(weighted io time 5분 증가율)가 10 초과, 5분마다 평가해 30분 지속(node-mixin NodeDiskIOSaturation) (PromQL, State Alert, 재통지 60분)"
    stream: system_disk_weighted_io_time
    stream_type: metrics
    promql: "sum by(host_name,device)(rate(system_disk_weighted_io_time{device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[5m]))"
    promql_operator: ">"
    promql_value: 10
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 30
  - name: infra-disk-read-latency
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "디스크 읽기 지연 높음 (100ms 초과)"
    what: "디스크 장치의 30분 평균 읽기 지연이 100ms를 넘는 상태(같은 30분 읽기 요청이 초당 {{ o2c_disk_latency_min_iops }}건 이상일 때만)가 30분 넘게 이어지고 있습니다."
    why: "디스크가 느려져 읽기 위주 서비스(DB 조회, 파일 서빙)의 응답이 지연됩니다. 디스크 고장이나 RAID 컨트롤러 캐시 이상의 신호일 수 있습니다."
    action: "① 대상 호스트·장치에서 iostat -x로 읽기 지연과 사용률 확인 ② dmesg·SMART와 RAID 컨트롤러 캐시·배터리 상태 확인 ③ 지속되면 디스크 교체 또는 I/O 부하 분산"
    runbook: "{{ o2c_runbook_base }}#disk-read-latency"
    row_template: '• {host_name} {device}: 읽기 지연 {value}ms'
    description: "디스크 장치(파티션 제외) 30분 평균 읽기 지연(처리 시간 / 요청 수)이 100ms 초과이면서 30분 평균 읽기 IOPS가 o2c_disk_latency_min_iops 이상, 5분마다 평가해 30분 지속 (PromQL, State Alert, 재통지 60분)"
    stream: system_disk_operation_time
    extra_streams: [system_disk_operations]
    stream_type: metrics
    promql: "(sum by(host_name,device)(rate(system_disk_operation_time{direction='read',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) / sum by(host_name,device)(rate(system_disk_operations{direction='read',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) * 1000) and on(host_name,device) (sum by(host_name,device)(rate(system_disk_operations{direction='read',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) >= {{ o2c_disk_latency_min_iops }})"
    promql_operator: ">"
    promql_value: 100
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 30
  - name: infra-disk-write-latency
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "디스크 쓰기 지연 높음 (100ms 초과)"
    what: "디스크 장치의 30분 평균 쓰기 지연이 100ms를 넘는 상태(같은 30분 쓰기 요청이 초당 {{ o2c_disk_latency_min_iops }}건 이상일 때만)가 30분 넘게 이어지고 있습니다."
    why: "디스크가 느려져 쓰기 위주 서비스(DB 커밋, 로그 기록, 백업)가 지연됩니다. RAID 컨트롤러 쓰기 캐시가 꺼졌거나 디스크 고장의 신호일 수 있습니다."
    action: "① 대상 호스트·장치에서 iostat -x로 쓰기 지연과 사용률 확인 ② dmesg·SMART와 RAID 컨트롤러 쓰기 캐시·배터리 상태 확인 ③ 지속되면 디스크·배터리 교체 또는 쓰기 부하 분산"
    runbook: "{{ o2c_runbook_base }}#disk-write-latency"
    row_template: '• {host_name} {device}: 쓰기 지연 {value}ms'
    description: "디스크 장치(파티션 제외) 30분 평균 쓰기 지연(처리 시간 / 요청 수)이 100ms 초과이면서 30분 평균 쓰기 IOPS가 o2c_disk_latency_min_iops 이상, 5분마다 평가해 30분 지속 (PromQL, State Alert, 재통지 60분)"
    stream: system_disk_operation_time
    extra_streams: [system_disk_operations]
    stream_type: metrics
    promql: "(sum by(host_name,device)(rate(system_disk_operation_time{direction='write',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) / sum by(host_name,device)(rate(system_disk_operations{direction='write',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) * 1000) and on(host_name,device) (sum by(host_name,device)(rate(system_disk_operations{direction='write',device=~'^(sd[a-z]+|nvme[0-9]+n[0-9]+|vd[a-z]+|xvd[a-z]+|dm-[0-9]+|md[0-9]+)$'}[30m])) >= {{ o2c_disk_latency_min_iops }})"
    promql_operator: ">"
    promql_value: 100
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 30
  - name: infra-inode-fill-24h
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "inode가 24시간 안에 고갈될 전망"
    what: "여유 inode가 40% 미만인 파일시스템이 최근 6시간의 감소 추세대로면 24시간 안에 inode가 바닥나는 상태가 1시간 넘게 이어지고 있습니다."
    why: "용량이 남아도 inode가 다하면 파일을 만들 수 없어 서비스와 로그 기록이 멈춥니다."
    action: "① 대상 호스트·마운트에서 작은 파일이 급증한 디렉터리 확인 ② 세션·캐시·메일 큐·임시 파일 등 원인 정리 ③ 원인 프로세스가 파일을 지우지 않는 문제면 수정"
    runbook: "{{ o2c_runbook_base }}#inode-fill-24h"
    row_template: '• {host_name} {mountpoint}: 약 {value}시간 뒤 inode 고갈'
    description: "최근 6시간 추세로 24시간 안에 여유 inode 소진, 여유 inode 40% 미만, 1시간 지속(node-mixin NodeFilesystemFilesFillingUp warning) (PromQL, State Alert, 재통지 1440분)"
    stream: system_filesystem_inodes_usage
    stream_type: metrics
    promql: "((system_filesystem_inodes_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'} / (-deriv(system_filesystem_inodes_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h])) / 3600) < 24) and on(host_name,mountpoint,device) (deriv(system_filesystem_inodes_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}[6h]) < 0) and on(host_name,mountpoint,device) ((sum by(host_name,mountpoint,device)(system_filesystem_inodes_usage{state='free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) / sum by(host_name,mountpoint,device)(system_filesystem_inodes_usage{state=~'used|free',mode='rw',type=~'ext4|xfs|ext3|btrfs'}) * 100) < 40)"
    promql_operator: ">="
    promql_value: 0
    period: 30
    frequency: 30
    silence: 1440
    pending_minutes: 60
  - name: infra-conntrack-limit
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "conntrack 테이블 사용률 높음 (80% 초과)"
    what: "연결 추적(conntrack) 테이블 사용률이 80%를 넘었습니다."
    why: "테이블이 가득 차면 새 연결의 패킷이 버려져 간헐적인 접속 실패가 생깁니다."
    action: "① 대상 호스트에서 conntrack -C와 nf_conntrack_max 확인 ② 연결을 많이 만드는 프로세스·출발지(스캔·DDoS) 확인 ③ 정상 트래픽이면 nf_conntrack_max 상향 검토"
    runbook: "{{ o2c_runbook_base }}#conntrack-limit"
    row_template: '• {host_name}: conntrack 사용률 {value}%'
    description: "conntrack 사용 수 / 최대 수가 80% 초과 (PromQL, State Alert, 재통지 60분)"
    stream: system_network_conntrack_count
    stream_type: metrics
    promql: "system_network_conntrack_count / system_network_conntrack_max * 100"
    promql_operator: ">"
    promql_value: 80
    period: 5
    frequency: 5
    silence: 60
  - name: infra-swap-usage
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "스왑 사용률 높음 (80% 초과, 사용 가능 메모리 10% 미만)"
    what: "스왑 사용률이 10분 내내 80%를 넘었고, 그동안 사용 가능 메모리도 전체의 10% 미만이었습니다."
    why: "스왑이 가득 찬 것만으로는 문제가 아닙니다(오래된 페이지가 밀려난 정상 상태가 많음). 사용 가능 메모리까지 부족하면 메모리가 모자라 서비스가 느려지고 OOM kill이 날 수 있습니다."
    action: "① 대상 호스트에서 free -m과 vmstat 1 5로 사용 가능 메모리와 스왑 입출력(si/so) 확인 ② 메모리 누수·한도 초과 프로세스 재기동 또는 한도 조정 ③ 상시 부족이면 메모리 증설"
    runbook: "{{ o2c_runbook_base }}#swap-usage"
    row_template: '• {host_name} {device}: 스왑 사용률 {value}%'
    description: "스왑 사용률이 80% 초과이면서 사용 가능 메모리가 10% 미만 (PromQL, P3, State Alert, 재통지 1440분)"
    stream: system_paging_utilization
    extra_streams: [system_linux_memory_available, system_memory_limit]
    stream_type: metrics
    promql: "(system_paging_utilization{state='used'} * 100) and on(host_name) ((sum by(host_name)(system_linux_memory_available) / sum by(host_name)(system_memory_limit)) < 0.10)"
    promql_operator: ">"
    promql_value: 80
    period: 10
    frequency: 5
    silence: 1440
  - name: infra-memory-pressure
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "메모리 압박: 주요 페이지 폴트 급증, 사용 가능 메모리 10% 미만"
    what: "주요(major) 페이지 폴트가 초당 1000건을 넘고 사용 가능 메모리도 전체의 10% 미만인 상태가 15분 넘게 이어지고 있습니다."
    why: "필요한 메모리 페이지를 디스크에서 읽어 오는데 여유 메모리마저 부족해, 서비스가 크게 느려집니다. 메모리가 충분한 DB 호스트의 정상 디스크 읽기는 이 알림이 아닙니다."
    action: "① 대상 호스트에서 free -m, vmstat으로 메모리·스왑 상태 확인 ② 메모리 상위 프로세스와 한도(JVM 힙, 컨테이너 limit) 점검 ③ 반복되면 메모리 증설·한도 조정"
    runbook: "{{ o2c_runbook_base }}#memory-pressure"
    row_template: '• {host_name}: 주요 페이지 폴트 초당 {value}건'
    description: "주요 페이지 폴트가 초당 1000건 초과이면서 사용 가능 메모리가 10% 미만, 5분마다 평가해 15분 지속(node-mixin NodeMemoryMajorPagesFaults) (PromQL, State Alert, 재통지 60분)"
    stream: system_paging_faults
    extra_streams: [system_linux_memory_available, system_memory_limit]
    stream_type: metrics
    promql: "sum by(host_name)(rate(system_paging_faults{type='major'}[5m])) and on(host_name) ((sum by(host_name)(system_linux_memory_available) / sum by(host_name)(system_memory_limit)) < 0.10)"
    promql_operator: ">"
    promql_value: 1000
    period: 5
    frequency: 5
    silence: 60
    pending_minutes: 15

# 실제로 만드는 알림: `enabled`가 거짓인 알림(업링크 목록이 빈 업링크 다운 규칙)은 만들지 않는다. 서버에 이미 있으면 계획이 지운다.
o2c_alerts_active: "{{ o2c_alerts | o2c_enabled_alerts }}"

# 서버에서 지우는 알림은 이 목록(알림 이름)에 있는 것뿐이다. 접두어(infra-)만 보고 지우지 않는다 — 다른 곳에서 직접 만든 알림까지 지워지는 사고가 있었다.
# 알림을 정의에서 빼거나 이름을 바꿀 때는 옛 이름을 여기에 더한다(서버에 있을 때만 지우고, 없으면 아무 일도 없다).
# 저장소 정의에도 폐기 목록에도 없는 infra- 알림은 건드리지 않고 O2C-013 계획 출력에 이름만 나열한다. 형식(^infra-[a-z0-9-]+$)·중복·현행 정의와의 충돌은 O2C-002가 검증한다.
o2c_retired_alerts:
  - infra-root-login-office-daily

# true이면 OpenObserve를 읽고 계획을 계산해 출력(O2C-013)한 뒤, 쓰기·합성 레코드 주입·시드 전에 정상 종료한다(실패 아님). Semaphore에서는 task environment의 {"o2c_plan_only": true}.
o2c_plan_only: false

# 알림 검증 단계(Spec #184 / Ticket-1): 반영 직후 합성 레코드를 검증 전용 스트림(<운영 스트림><접미사>)에 넣고
# 알림 SQL(스트림명만 교체)을 검색해 기대와 비교한다. 운영 스트림·알림·통지 대상은 건드리지 않는다.
# 수집 인증은 OpenBao agents/openobserve의 controller_ingest_token(컨트롤러 전용, 설정 API 계정과 다름).
o2c_verify_stream_suffix: _alert_verify
o2c_verify_retries: 6       # 수집 직후 검색에 보이기까지 걸리는 시간을 기다린다
o2c_verify_delay: 5
o2c_alert_fixtures: "{{ lookup('ansible.builtin.file', role_path ~ '/files/alert_fixtures.yml') | from_yaml }}"

# 통지 경로 자가 시험(Spec #184 / Ticket-2): 검증 전용 스트림에 거는 상설 알림 1개. 기본 실행에서는 레코드가 없어 울리지 않고,
# o2c_verify_notify=true일 때만 레코드 1건을 넣어 템플릿·destination·webhook까지 실제로 통지한다(통지에 [TEST]가 붙는다).
o2c_verify_notify: false
o2c_selftest_stream: "alert_selftest{{ o2c_verify_stream_suffix }}"
# 빈 스트림을 만드는 시드 레코드의 나이(초, O2C-014). 알림 조회 구간(5분)보다 길고 OpenObserve 수집 허용 범위(기본 5시간)보다 짧아야 한다.
o2c_selftest_seed_age_s: 3600
# 알림 정의 최상위 tz_offset(분 단위 UTC 오프셋). 540 = KST(+09:00). 모든 알림(로그·PromQL·자가 시험)에 같은 값이 들어간다(O2C-012 계획).
# 통지의 ⏱ 발생 표시 시각에는 영향이 없다(alert_trigger_time_str은 UTC 그대로). 값을 바꾸면 알림 전체가 1회 갱신될 뿐이다.
o2c_tz_offset: 540
# 자가 시험 레코드의 JSON 이스케이프 시험 값(따옴표·역슬래시). 통지 행({probe})에 실려 webhook 본문이 깨지지 않는지 배포 뒤 눈으로 확인한다.
o2c_selftest_escape_probe: 'a"b\c'
o2c_selftest_alert:
  name: infra-alert-selftest
  severity: "TEST"
  severity_icon: "🧪"
  title: "알림 통지 경로 시험 (실제 장애 아님)"
  what: "OpenObserve — Config가 o2c_verify_notify=true로 실행되어 통지 경로 시험 레코드를 넣었습니다."
  why: "알림 템플릿·통지 대상·webhook이 끝까지 동작하는지 확인하는 시험이며 실제 장애가 아닙니다."
  action: "이 통지가 도착했으면 통지 경로는 정상입니다. 조치할 것이 없습니다."
  runbook: "{{ o2c_runbook_base }}"
  row_template: '• {host_name}: 시험 레코드 {records}건 · 이스케이프 시험 값 {probe}'
  description: "통지 경로 자가 시험 — 검증 전용 스트림에 o2c_verify_notify=true 실행 때만 레코드가 들어간다"
  stream: "{{ o2c_selftest_stream }}"
  sql: >-
    SELECT host_name, probe, count(*) AS records FROM "{{ o2c_selftest_stream }}"
    GROUP BY host_name, probe
  period: 5
  frequency: 1
  silence: 5
