---
# OpenObserve 설정 as code (ADR-0008, Spec #93 / Ticket-2) — 컨트롤러(connection: local)에서만 실행한다.
# 연결 정보와 시크릿은 Git에 두지 않는다: OpenBao agents/openobserve 키
#   o2_endpoint, o2_org(기본 default), o2_ca_file(선택)  — host_agents와 같은 키
#   api_user, api_password        — OpenObserve 설정 API(알림·함수·파이프라인)를 쓸 수 있는 계정(수집 토큰과 다름)
#   alert_webhook_url             — 통지 대상 webhook URL (네이버웍스 봇 text API)
#   alert_webhook_token           — (선택) webhook 인증 토큰. 헤더 이름은 alert_webhook_auth_header(기본 Authorization,
#                                   네이버웍스 봇은 X-NANOIT-ACCESS)
# Extra variables(-e o2_endpoint=...)가 OpenBao 값보다 우선한다.

o2c_vault_validate_certs: false
o2c_kv: {}
o2c_org: "{{ o2_org | default(o2c_kv.o2_org | default('default', true), true) }}"
o2c_endpoint: "{{ o2_endpoint | default(o2c_kv.o2_endpoint | default('', true), true) }}"
o2c_ca_file: "{{ o2_ca_file | default(o2c_kv.o2_ca_file | default('', true), true) }}"
o2c_validate_certs: "{{ o2c_endpoint is match('^https://') }}"

o2c_function_name: security_semantics
o2c_pipeline_name: security_semantics
o2c_stream: security_logs
o2c_template_name: infra-automation-webhook
o2c_destination_name: infra-automation-webhook
o2c_webhook_auth_header: "{{ o2c_kv.alert_webhook_auth_header | default('Authorization', true) }}"

# 통지 본문: 네이버웍스 봇 text 메시지({"content": {"type": "text", "text": ...}}).
# 행동 가능한 알림(PagerDuty·Google SRE 원칙): 심각도·제목 → 무슨 일 → 왜 중요 → 대상(행) → 조치 → 런북·대시보드 → 발생 구간.
# {severity}·{title}·{what}·{why}·{action}·{runbook}은 알림별 context_attributes, {rows}는 알림별 row_template이다.
o2c_runbook_base: "https://github.com/ppzxc/infra-automation/blob/main/docs/runbooks/alerts.md"
o2c_template_body: '{"content": {"type": "text", "text": "{severity_icon} [{severity}] {title}\n\n■ 무슨 일: {what}\n■ 왜 중요: {why}\n■ 대상:\n{rows}\n■ 조치: {action}\n\n▶ 런북: {runbook}\n▶ 로그 보기: {alert_url}\n⏱ 발생: {alert_start_time} ~ {alert_end_time} (UTC) · 규칙 {alert_name}"}}'

# 임계값
o2c_ssh_fail_per_source_threshold: 10
o2c_ssh_fail_per_host_threshold: 50
o2c_ssh_fail_window_minutes: 5
o2c_parse_error_percent: 10
o2c_parse_error_min_lines: 20
o2c_parse_error_window_minutes: 30

# 알림 규칙. SQL이 행을 돌려주면 발화한다(threshold 1행) — 집계 조건은 HAVING에 둔다.
# 구 레코드(새 필드 없음)는 null이라 조건에서 자연히 빠진다.
o2c_alerts:
  - name: infra-ssh-login-failures-per-source
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "한 출발지에서 SSH 로그인 실패 급증"
    what: "같은 출발지 IP에서 {{ o2c_ssh_fail_window_minutes }}분 동안 SSH 로그인 실패가 {{ o2c_ssh_fail_per_source_threshold }}회 이상 발생했습니다."
    why: "무차별 대입(brute-force) 공격의 전형적인 징후입니다. fail2ban이 막지 못하고 있을 수 있습니다."
    action: "① 출발지가 사내·작업자 IP인지 확인 ② 외부 IP면 방화벽 차단과 fail2ban 동작 확인 ③ 같은 IP의 로그인 성공 기록이 있으면 P1로 격상"
    runbook: "{{ o2c_runbook_base }}#ssh-login-failures-per-source"
    row_template: '• {source_address} → {host_name}: 실패 {failures}회'
    description: "sshd 로그인 실패가 같은 source.address에서 {{ o2c_ssh_fail_window_minutes }}분 동안 {{ o2c_ssh_fail_per_source_threshold }}회 이상 (fail2ban이 막지 못하는 분산 공격 단서)"
    stream: security_logs
    sql: >-
      SELECT source_address, host_name, count(*) AS failures FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'failure'
      GROUP BY source_address, host_name HAVING count(*) >= {{ o2c_ssh_fail_per_source_threshold }}
    period: "{{ o2c_ssh_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_ssh_fail_window_minutes }}"
  - name: infra-ssh-login-failures-per-host
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "한 서버에 SSH 로그인 실패 급증"
    what: "한 서버에서 {{ o2c_ssh_fail_window_minutes }}분 동안 SSH 로그인 실패가 {{ o2c_ssh_fail_per_host_threshold }}회 이상 발생했습니다."
    why: "여러 출발지에서 분산 공격을 받고 있거나 자동화 작업이 잘못된 자격증명으로 반복 접속하는 상황입니다."
    action: "① 로그 보기로 출발지 분포 확인 ② 분산 공격이면 SSH 포트 노출 범위(방화벽) 축소 ③ 내부 자동화면 해당 작업의 자격증명 갱신"
    runbook: "{{ o2c_runbook_base }}#ssh-login-failures-per-host"
    row_template: '• {host_name}: 실패 {failures}회'
    description: "한 호스트에서 sshd 로그인 실패가 {{ o2c_ssh_fail_window_minutes }}분 동안 {{ o2c_ssh_fail_per_host_threshold }}회 이상"
    stream: security_logs
    sql: >-
      SELECT host_name, count(*) AS failures FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'failure'
      GROUP BY host_name HAVING count(*) >= {{ o2c_ssh_fail_per_host_threshold }}
    period: "{{ o2c_ssh_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_ssh_fail_window_minutes }}"
  - name: infra-root-login-success
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "root 계정 원격 로그인 성공"
    what: "root 계정으로 SSH 로그인이 성공했습니다."
    why: "root 직접 접속은 정책상 금지 대상(PermitRootLogin)이며 접속자 식별이 불가능합니다. 침해 또는 설정 우회일 수 있습니다(ISMS 2.5 사용자 인증)."
    action: "① 출발지와 시각을 작업 일정·작업자와 대조 ② 확인되지 않으면 해당 서버 root 비밀번호 변경·세션 종료 후 보안 담당 보고 ③ 승인된 작업이면 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#root-login-success"
    row_template: '• {host_name} ← {source_address} ({logins}회)'
    description: "root SSH 로그인 성공 (1건부터 즉시) — PermitRootLogin 설정이 우회되었는지 확인"
    stream: security_logs
    sql: >-
      SELECT host_name, source_address, count(*) AS logins FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'success' AND user_name = 'root'
      GROUP BY host_name, source_address
    period: 5
    frequency: 1
    silence: 5
  - name: infra-sudo-escalation-failure
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "sudo/su 권한 상승 실패"
    what: "sudo/su 인증 실패 또는 sudoers에 없는 사용자의 권한 상승 시도가 있었습니다."
    why: "계정 탈취 후 권한 상승을 시도하는 단계일 수 있습니다. 단순 비밀번호 오입력일 수도 있습니다."
    action: "① 해당 사용자에게 시도 여부 확인 ② 본인이 아니면 계정 잠금·비밀번호 변경 ③ 반복되면 접속 경로(출발지) 추적"
    runbook: "{{ o2c_runbook_base }}#sudo-escalation-failure"
    row_template: '• {host_name} / 사용자 {user_name}: 실패 {failures}회'
    description: "sudo/su 권한상승 실패(authentication failure, NOT in sudoers) — 성공은 알리지 않고 기록만 한다"
    stream: security_logs
    sql: >-
      SELECT host_name, user_name, count(*) AS failures FROM "security_logs"
      WHERE event_action IN ('sudo','su') AND event_outcome = 'failure'
      GROUP BY host_name, user_name
    period: 5
    frequency: 1
    silence: 5
  - name: infra-oom-kill
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "OOM kill로 프로세스 강제 종료"
    what: "메모리 부족(OOM)으로 커널이 프로세스를 강제 종료했습니다."
    why: "서비스 프로세스가 죽었을 수 있고, 같은 원인이 반복되면 다른 서비스와 서버 전체로 번질 수 있습니다."
    action: "① 행의 종료된 프로세스가 서비스면 재기동 상태 확인 ② 메모리 상위 프로세스와 한도(JVM 힙, 컨테이너 limit) 점검 ③ 반복되면 메모리 증설·한도 조정 계획"
    runbook: "{{ o2c_runbook_base }}#oom-kill"
    row_template: '• {host_name}: 종료된 프로세스 {killed_process} ({kills}건)'
    description: "OOM kill (Killed process / Kill process / invoked oom-killer, 대소문자 무시) — cgroup·CentOS 6/7 형식 포함"
    stream: system_logs
    sql: >-
      SELECT host_name,
      CASE WHEN lower(body) LIKE '%kill%process%'
      THEN regexp_replace(body, '^.*[Kk]ill(?:ed)? process [0-9]+ [(]([^)]*)[)].*$', '\1')
      ELSE 'oom-killer 호출' END AS killed_process,
      count(*) AS kills FROM "system_logs"
      WHERE lower(body) LIKE '%killed process%' OR lower(body) LIKE '%out of memory: kill process%'
      OR lower(body) LIKE '%invoked oom-killer%'
      GROUP BY host_name, killed_process
    period: 5
    frequency: 1
    silence: 5
  - name: infra-disk-fs-errors
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "디스크 I/O·파일시스템 오류 발생"
    what: "디스크 I/O 오류 또는 파일시스템 손상(EXT4/XFS) 오류가 기록됐습니다."
    why: "디스크 고장이나 데이터 손상의 전조로, 데이터 손실로 이어질 수 있어 즉시 확인해야 합니다."
    action: "① 로그 보기에서 오류 원문과 장치 확인 ② 즉시 백업 상태 확인(restic snapshots) ③ 파일시스템이 읽기 전용이면 서비스 영향 판단 후 디스크 교체·fsck 일정"
    runbook: "{{ o2c_runbook_base }}#disk-fs-errors"
    row_template: '• {host_name}: 오류 패턴 {matches}건'
    description: "디스크·파일시스템 오류 (I/O error, EXT4-fs error, XFS Corruption, blk_update_request, Buffer I/O error) — rsyslog 파일에는 severity가 없어 패턴으로 잡는다"
    stream: system_logs
    sql: >-
      SELECT host_name, count(*) AS matches FROM "system_logs"
      WHERE lower(body) LIKE '%i/o error%' OR lower(body) LIKE '%ext4-fs error%'
      OR (lower(body) LIKE '%xfs%' AND lower(body) LIKE '%corruption%')
      OR lower(body) LIKE '%blk_update_request%' OR lower(body) LIKE '%buffer i/o error%'
      GROUP BY host_name
    period: 5
    frequency: 1
    silence: 5
  - name: infra-log-parse-errors-security-logs
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "보안 로그 해석 실패율 상승"
    what: "security_logs에서 형식을 해석하지 못한 로그 비율이 {{ o2c_parse_error_percent }}% 이상입니다."
    why: "해석되지 않은 보안 로그는 위 보안 알림(로그인 실패·root 로그인·sudo)에 잡히지 않아 탐지 공백이 생깁니다."
    action: "① 해당 서버의 sshd·sudo 로그 형식 변경(패키지 업데이트) 여부 확인 ② 수집기(otelcol) 설정과 VRL 함수 수정 필요성 검토 ③ 업무 시간에 처리"
    runbook: "{{ o2c_runbook_base }}#log-parse-errors"
    row_template: '• {host_name}: {total}줄 중 {parse_errors}줄 해석 실패'
    description: "security_logs의 log.parse_error=true 비율이 {{ o2c_parse_error_percent }}% 이상 (수집기 포맷 계약 위반 의심)"
    stream: security_logs
    sql: >-
      SELECT host_name, count(*) AS total,
      sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) AS parse_errors FROM "security_logs"
      GROUP BY host_name HAVING count(*) >= {{ o2c_parse_error_min_lines }}
      AND sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) * 100 >= {{ o2c_parse_error_percent }} * count(*)
    period: "{{ o2c_parse_error_window_minutes }}"
    frequency: 10
    silence: "{{ o2c_parse_error_window_minutes }}"
  - name: infra-log-parse-errors-system-logs
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "시스템 로그 해석 실패율 상승"
    what: "system_logs에서 형식을 해석하지 못한 로그 비율이 {{ o2c_parse_error_percent }}% 이상입니다."
    why: "해석되지 않은 시스템 로그는 커널·디스크 오류 알림에 잡히지 않을 수 있습니다."
    action: "① 해당 서버의 로그 형식 변경 여부 확인 ② 수집기(otelcol) 설정 점검 ③ 업무 시간에 처리"
    runbook: "{{ o2c_runbook_base }}#log-parse-errors"
    row_template: '• {host_name}: {total}줄 중 {parse_errors}줄 해석 실패'
    description: "system_logs의 log.parse_error=true 비율이 {{ o2c_parse_error_percent }}% 이상 (수집기 포맷 계약 위반 의심)"
    stream: system_logs
    sql: >-
      SELECT host_name, count(*) AS total,
      sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) AS parse_errors FROM "system_logs"
      GROUP BY host_name HAVING count(*) >= {{ o2c_parse_error_min_lines }}
      AND sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) * 100 >= {{ o2c_parse_error_percent }} * count(*)
    period: "{{ o2c_parse_error_window_minutes }}"
    frequency: 10
    silence: "{{ o2c_parse_error_window_minutes }}"

# 알림 검증 단계(Spec #184 / Ticket-1): 반영 직후 합성 레코드를 검증 전용 스트림(<운영 스트림><접미사>)에 넣고
# 알림 SQL(스트림명만 교체)을 검색해 기대와 비교한다. 운영 스트림·알림·통지 대상은 건드리지 않는다.
# 수집 인증은 OpenBao agents/openobserve의 controller_ingest_token(컨트롤러 전용, 설정 API 계정과 다름).
o2c_verify_stream_suffix: _alert_verify
o2c_verify_retries: 6       # 수집 직후 검색에 보이기까지 걸리는 시간을 기다린다
o2c_verify_delay: 5
o2c_alert_fixtures: "{{ lookup('ansible.builtin.file', role_path ~ '/files/alert_fixtures.yml') | from_yaml }}"

# 통지 경로 자가 시험(Spec #184 / Ticket-2): 검증 전용 스트림에 거는 상설 알림 1개. 기본 실행에서는 레코드가 없어 울리지 않고,
# o2c_verify_notify=true일 때만 레코드 1건을 넣어 템플릿·destination·webhook까지 실제로 통지한다(통지에 [TEST]가 붙는다).
o2c_verify_notify: false
o2c_selftest_stream: "alert_selftest{{ o2c_verify_stream_suffix }}"
o2c_selftest_alert:
  name: infra-alert-selftest
  severity: "TEST"
  severity_icon: "🧪"
  title: "알림 통지 경로 시험 (실제 장애 아님)"
  what: "OpenObserve — Config가 o2c_verify_notify=true로 실행되어 통지 경로 시험 레코드를 넣었습니다."
  why: "알림 템플릿·통지 대상·webhook이 끝까지 동작하는지 확인하는 시험이며 실제 장애가 아닙니다."
  action: "이 통지가 도착했으면 통지 경로는 정상입니다. 조치할 것이 없습니다."
  runbook: "{{ o2c_runbook_base }}"
  row_template: '• {host_name}: 시험 레코드 {records}건'
  description: "통지 경로 자가 시험 — 검증 전용 스트림에 o2c_verify_notify=true 실행 때만 레코드가 들어간다"
  stream: "{{ o2c_selftest_stream }}"
  sql: >-
    SELECT host_name, count(*) AS records FROM "{{ o2c_selftest_stream }}"
    GROUP BY host_name
  period: 5
  frequency: 1
  silence: 5
