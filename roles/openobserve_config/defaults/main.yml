    action: "① 같은 호스트의 Silent Host 알림이 있으면 수집기 전체가 원인 — 그쪽부터 복구 ② 호스트의 otelcol-contrib 상태와 OTLP 수신기 설정 확인 ③ funa 컨테이너의 OTLP exporter 설정과 컨테이너 상태 확인 ④ 의도적으로 껐다면 OpenBao hosts/<host>/agents의 otel_app_telemetry를 끄고 Config를 다시 실행"
