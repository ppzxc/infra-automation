    stream: backup_logs
    missing: {roster: collect, field: host, cond: "job = 'backup' AND success = true"}
    sql: "{{ o2c_roster_collect | o2c_missing_sql('backup_logs', 'host', \"job = 'backup' AND success = true\") }}"
    period: 1560
    frequency: 60
    silence: 1440
