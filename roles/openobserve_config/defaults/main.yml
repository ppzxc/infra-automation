    runbook: "{{ o2c_runbook_base }}#raid-controller-fault"
    row_template: '• {host_name} {hw_name}: {raw_state} · {event_time}'
    description: "controller 레코드의 hw_state가 ok가 아닌 판독이 15분에 2회 이상 (State Alert, 재통지 1440분)"
    stream: host_status_logs
    sql: >-
      SELECT host_name, hw_name, max(raw_state) AS raw_state, count(*) AS readings, {{ o2c_event_time_sql }} FROM "host_status_logs"
      WHERE kind = 'controller' AND hw_state <> 'ok'
      GROUP BY host_name, hw_name HAVING count(*) >= 2
      ORDER BY readings DESC
    period: 15
    frequency: 5
    silence: 1440
