---
# OpenObserve 설정 as code (ADR-0008, Spec #93 / Ticket-2) — 컨트롤러(connection: local)에서만 실행한다.
# 연결 정보와 시크릿은 Git에 두지 않는다: OpenBao agents/openobserve 키
#   o2_endpoint, o2_org(기본 default), o2_ca_file(선택)  — host_agents와 같은 키
#   api_user, api_password        — OpenObserve 설정 API(알림·함수·파이프라인)를 쓸 수 있는 계정(수집 토큰과 다름)
#   alert_webhook_url             — 통지 대상 webhook URL (네이버웍스 봇 text API)
#   alert_webhook_token           — (선택) webhook 인증 토큰. 헤더 이름은 alert_webhook_auth_header(기본 Authorization,
#                                   네이버웍스 봇은 X-NANOIT-ACCESS)
#   normal_sources                — (선택) root 로그인 정상 출발지 목록 [{address: <IP>, kind: semaphore|office}, ...] (Spec #184 / Ticket-8).
#                                   저장소에는 주소를 두지 않는다. kind(semaphore·office)는 구분용 표시일 뿐 판정은 같다:
#                                   목록에 있는 출발지는 P1(외부 출발지)에서 빠지고 P2(알고 있는 출발지)로 간다.
#                                   목록에 없어도 사설 대역(10/8·172.16/12·192.168/16·127/8·169.254/16)은 P2, 그 밖(공인)은 P1이다.
#   silent_host_exceptions        — (선택) Silent Host 계획 정지 예외 [{host: <인벤토리 호스트명>, expires: YYYY-MM-DD, reason: ...}] (Spec #184 / Ticket-4).
#                                   만료일(expires)은 필수이며 형식이 틀리면 요청 전에 실패한다. 만료일이 지난 항목은 로스터 생성 때 무시되어
#                                   해제를 잊어도 감시가 돌아온다.
# Extra variables(-e o2_endpoint=...)가 OpenBao 값보다 우선한다.

o2c_vault_validate_certs: false
# OpenBao AppRole 입력(O2C-000). 로그인해 받은 토큰이 VAULT_TOKEN보다 먼저다(O2C-001).
o2c_vault_role_id: "{{ vault_role_id | default(VAULT_ROLE_ID | default(lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | default('', true), true), true) }}"
o2c_vault_secret_id: "{{ vault_secret_id | default(VAULT_SECRET_ID | default(lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | default('', true), true), true) }}"
o2c_kv: {}
o2c_org: "{{ o2_org | default(o2c_kv.o2_org | default('default', true), true) }}"
o2c_endpoint: "{{ o2_endpoint | default(o2c_kv.o2_endpoint | default('', true), true) }}"
o2c_ca_file: "{{ o2_ca_file | default(o2c_kv.o2_ca_file | default('', true), true) }}"
o2c_validate_certs: "{{ o2c_endpoint is match('^https://') }}"

o2c_function_name: security_semantics
o2c_pipeline_name: security_semantics
o2c_stream: security_logs
# 스위치 syslog 의미 해석(Spec #277): system_logs의 service_name=switch-syslog 레코드에만 필드를 더한다(서버 로그는 그대로 통과).
o2c_switch_function_name: switch_syslog_semantics
o2c_switch_pipeline_name: switch_syslog_semantics
o2c_switch_stream: system_logs
# 방화벽(포티게이트) 로그 필드 추출(Spec #282 / Ticket-2): security_logs의 service_name=fortigate-syslog 레코드에만 필드를 더한다.
# 소스 스트림당 파이프라인이 하나라 별도 파이프라인 없이 보안 로그 파이프라인(o2c_pipeline_name)에서 security_semantics 다음 함수로 잇는다.
o2c_fortigate_function_name: fortigate_semantics
o2c_template_name: infra-automation-webhook
o2c_destination_name: infra-automation-webhook
o2c_webhook_auth_header: "{{ o2c_kv.alert_webhook_auth_header | default('Authorization', true) }}"

# 통지 본문: 네이버웍스 봇 text 메시지({"content": {"type": "text", "text": ...}}).
# 행동 가능한 알림(PagerDuty·Google SRE 원칙): 심각도·제목 → 현상 → 영향 → 대상(행) → 조치(항목마다 한 줄, o2c_action_lines가 ①②③을 줄로 나눈다) → 런북·대시보드 → 발생 구간.
# {severity}·{title}·{what}·{why}·{action}·{runbook}은 알림별 context_attributes, {rows}는 알림별 row_template이다.
o2c_runbook_base: "https://github.com/ppzxc/infra-automation/blob/main/docs/runbooks/alerts.md"
o2c_template_body: '{"content": {"type": "text", "text": "{severity_icon} [{severity}] {title}\n\n■ 현상: {what}\n■ 영향: {why}\n■ 대상:\n{rows}\n■ 조치:{action}\n\n▶ 런북: {runbook}\n▶ 로그 보기: {alert_url}\n⏱ 발생: {alert_start_time} ~ {alert_end_time} (UTC) · 규칙 {alert_name}"}}'

# 임계값
o2c_ssh_fail_per_source_threshold: 10
o2c_ssh_fail_per_host_threshold: 50
o2c_ssh_fail_window_minutes: 5
o2c_parse_error_percent: 10
o2c_parse_error_min_lines: 20
o2c_parse_error_window_minutes: 30

# 스위치 syslog 알림(Spec #277). 값은 모두 역할 기본 변수이며 Semaphore Environment(-e)로 덮어쓴다 — 저장소에는 IP·포트·계정을 두지 않는다.
# 메시지 코드는 Cisco가 찍는 그대로 `%`를 뺀 형태(FACILITY-SEVERITY-MNEMONIC)다. 형식은 O2C-002에서 검증한다(SQL에 들어간다).
# 잡음 억제: 이 코드의 줄은 스위치 알림에서 빠진다(검색은 그대로 된다). ARP 해소 실패(ADJ-3-RESOLVE_REQ)는 최근 샘플의 75%를 차지한 반복 메시지다.
o2c_switch_noise_events: [ADJ-3-RESOLVE_REQ]
o2c_switch_config_change_events: [SYS-5-CONFIG_I]
o2c_switch_login_fail_events: [SEC_LOGIN-4-LOGIN_FAILED]
o2c_switch_login_fail_threshold: 5
o2c_switch_login_fail_window_minutes: 5
# 심각도 0(emergency)부터 이 값(2, critical)까지가 즉시 P1이다. 링크 다운은 심각도 3이라 여기에 걸리지 않는다.
o2c_switch_severity_max: 2
o2c_switch_macflap_events: [SW_MATM-4-MACFLAP_NOTIF]
# 최근 관찰: 한 장비에서 3시간에 25건(10분에 평균 1.4건). 기본 2회는 그 장비의 지금 상태에서도 울린다.
o2c_switch_macflap_threshold: 2
o2c_switch_macflap_window_minutes: 10
# 플랩이 계속되는 동안의 재통지 간격(분). 같은 사건으로 구간마다 울리지 않도록 조회 구간보다 길게 둔다.
o2c_switch_macflap_silence_minutes: 60
# 업링크 포트 다운: 감시할 (장비 관리번호, 포트) 목록. 비어 있으면(기본) 알림 규칙을 만들지 않는다 — 링크 다운은 심각도 3이라 목록 없이 알리면
# 미사용 포트 다운이 전부 알림이 된다. 포트는 약어(Gi1/0/49)나 전체 이름(GigabitEthernet1/0/49) 어느 쪽이든 쓴다. 예: [{device: ns0250, port: Gi1/0/49}]
o2c_switch_uplinks: []
# 수신 중단 감시 대상 스위치(관리번호). 명시한 장비만 본다 — 아직 전송을 설정하지 않은 장비가 허위 알림을 만들지 않는다.
# 기본값은 스펙을 쓸 때 전송이 확인된 장비다(미확인: 목록의 장비가 기준 시간 동안 아무것도 보내지 않으면 발화한다). 전송을 설정한 장비는 여기에 더한다.
o2c_switch_syslog_roster: [ns0250, ns0347]
# 스위치 syslog는 이벤트가 있을 때만 전송되므로 조용한 것과 고장을 구분하지 못한다. 기준 시간은 길게 두고 2주 관찰 뒤 조정한다.
o2c_switch_silent_hours: 24
o2c_switch_noise_filter: "{{ o2c_switch_noise_events | o2c_switch_noise_filter }}"

# 방화벽(포티게이트) 로그 알림(Spec #282 / Ticket-3): security_logs의 service_name=fortigate-syslog. 값은 모두 역할 기본 변수이며 Semaphore Environment(-e)로 덮어쓴다.
# 실로그 샘플로 검증됨(검증 범위: 관리자 로그인 실패/성공, 정책·로그 설정 변경, 트래픽, UTM ips·virus·dlp·anomaly, HA 인터페이스 실패 줄).
# 검증되지 않은 것: HA 전환(상태 변경) 실제 줄, 실제 장비가 만든 웹필터·앱제어 줄, SSL VPN 로그인 실패 줄. 해당 줄이 들어오면 키 이름을 다시 확인한다.
# 로그 전송 설정 자체의 변경(log.syslogd.*, log.setting)은 기본 감시 대상이 아니다. 필요하면 o2c_fortigate_policy_cfgpaths에 더한다.
# 알림 SQL은 service_name과 원문 body의 key=value만 읽는다: 첫 방화벽 줄이 들어오기 전에는 security_logs에 방화벽 컬럼(device_id 등)이 없어서
# 그 컬럼을 참조하면 알림 평가가 매번 오류가 나고 O2C-036이 Config 실행을 막는다(장비가 전송을 시작하기 전에도 규칙이 유효해야 한다).
# 관리자 로그인 연속 실패: 한 출발지에서 구간 안에 이 횟수 이상. 같은 공격이 이어져도 재통지는 silence 간격으로만 온다.
o2c_fortigate_login_fail_threshold: 5
o2c_fortigate_login_fail_window_minutes: 5
o2c_fortigate_login_fail_silence_minutes: 30
# 정책·계정 변경: 변경 로그의 cfgpath 값(따옴표 안 전체 경로). 이 경로의 변경만 알린다.
o2c_fortigate_policy_cfgpaths: [firewall.policy, firewall.policy6, firewall.proxy-policy]
o2c_fortigate_account_cfgpaths: [system.admin, system.accprofile, system.api-user, user.local, user.group]
# 승인 시간(장비 시계 기준 시, 시작 포함·끝 미포함, 0~24). 변경 로그 원문의 time=HH:MM:SS를 읽으므로 장비 시간대가 운영 시간대(KST)여야 한다.
# 시각이 없거나 읽을 수 없는 줄은 승인 시간 밖으로 본다. 요일은 구분하지 않는다(주말 변경도 이 시간대면 승인 시간 안).
o2c_fortigate_approved_start_hour: 9
o2c_fortigate_approved_end_hour: 18
# HA 전환: subtype=ha 로그. 전환이 반복(플래핑)되어도 이 간격으로만 다시 알린다.
o2c_fortigate_ha_silence_minutes: 30
# HA 알림에서 뺄 logid(숫자 문자열). 0108037903은 secondary가 주기적으로 남기는 동기화 상태 정보 로그(전환이 아님)다.
# 목록이 비면 subtype=ha 로그 전부를 센다. 값은 SQL에 들어가므로 O2C-002에서 숫자만 허용한다.
o2c_fortigate_ha_ignored_logids: ["0108037903"]
# 중대 보안 탐지: type=utm 로그 중 severity가 이 값인 것(IPS·이상 징후 등). 실제 안티바이러스 로그에는 severity 키가 없으므로
# 바이러스 감염 탐지(subtype=virus, eventtype=infected)는 심각도와 무관하게 중대 탐지로 센다. 같은 탐지의 재통지 간격은 아래 분이다.
o2c_fortigate_detection_severities: [critical]
o2c_fortigate_detection_silence_minutes: 60
# 수신 중단 감시 대상 장비(관리번호). 명시한 장비만 본다. HA 쌍은 `ns0380+ns0381`처럼 `+`로 묶어 쓰며 어느 한 멤버라도 보내면 수신 중이다.
# 기본값은 비어 있다(opt in). 장비가 전송을 시작하고 로그가 들어오는 것을 확인한 장비를 그때 더한다
# (사무실이 먼저). 미리 넣으면 전송 설정 전까지 허위 알림이 계속 온다. 목록이 비어도 알림 규칙은 있지만 절대 행을 돌려주지 않는다.
# 항목은 관리번호이거나, hostname을 관리번호로 바꾸지 못한 장비의 원래 이름(devname 그대로, 대소문자 무관)이다.
o2c_fortigate_syslog_roster: []
# 장비 이름 → 관리번호 별칭표. hostname을 관리번호로 못 바꾼 장비의 device_id를 채운다(키는 소문자 정규화한 devname, 도메인 제외).
# 표에 없는 이름은 `ns`+숫자 추출을 쓴다. 공개 저장소라 실제 이름은 여기 쓰지 않고 Semaphore Environment/Extra variables로 넣는다.
# 예: {example_branch_fw: ns0000}. 값이 바뀌면 다음 Config 실행에서 fortigate_semantics 함수가 갱신된다.
o2c_fortigate_device_aliases: {}
# 방화벽은 로그가 계속 나오므로 기준 시간은 스위치(o2c_switch_silent_hours, 24시간)보다 짧다. 전송 로그를 정책별로 줄인 장비가 오탐을 내면 관찰 뒤 늘린다.
o2c_fortigate_silent_minutes: 120
# 장비 이름은 원문의 devname(소문자, 도메인 제외). 시각은 원문의 time=(장비 시계)에서 시를 읽고 못 읽으면 -1이다.
o2c_fortigate_device_sql: >-
  CASE WHEN body LIKE '% devname=%' THEN lower(regexp_replace(body, '^.* devname="?([^" .]*).*$', '\1')) ELSE 'unknown' END
o2c_fortigate_hour_sql: >-
  CASE WHEN body LIKE '% time=__:__:__%' THEN CAST(regexp_replace(body, '^.* time=([0-9][0-9]):.*$', '\1') AS INT) ELSE -1 END
o2c_fortigate_in_hours_sql: "{{ o2c_fortigate_hour_sql }} >= {{ o2c_fortigate_approved_start_hour }} AND {{ o2c_fortigate_hour_sql }} < {{ o2c_fortigate_approved_end_hour }}"

# 정상 출발지(OpenBao normal_sources). 주소는 O2C-002에서 IP 문자 형식을 검증하므로 SQL에 그대로 넣는다.
o2c_normal_sources: "{{ o2c_kv.normal_sources | default([], true) }}"
o2c_normal_addresses: "{{ o2c_normal_sources | map(attribute='address') | list }}"
o2c_office_addresses: "{{ o2c_normal_sources | selectattr('kind', 'equalto', 'office') | map(attribute='address') | list }}"
# 사설 대역(RFC1918·루프백·링크로컬)은 단순 LIKE 패턴으로 판별한다 — 테스트 하네스(sqlite)와 OpenObserve(DataFusion) 둘 다에서 같게 동작한다.
# 172.16~31은 172.16.% … 172.31.%로 전개한다(172.15·172.32는 공인이다).
o2c_private_source_patterns: >-
  {{ ['10.%', '192.168.%', '127.%', '169.254.%'] + (range(16, 32) | map('string') | map('regex_replace', '^', '172.') | map('regex_replace', '$', '.%') | list) }}
o2c_root_private_like: >-
  {{ "source_address LIKE '" ~ (o2c_private_source_patterns | join("' OR source_address LIKE '")) ~ "'" }}
o2c_root_private_not_like: >-
  {{ "source_address NOT LIKE '" ~ (o2c_private_source_patterns | join("' AND source_address NOT LIKE '")) ~ "'" }}
# 외부 출발지 P1: 등록 출발지(kind 무관)도 사설 대역도 아닌 출발지만. 출발지 값이 없으면 알 수 없는 출발지라 P1이다.
# 목록이 비어 있으면 등록 조건만 빠진다(공인 출발지는 모두 P1).
o2c_root_external_filter: >-
  {{ " AND (source_address IS NULL OR (" ~ (("source_address NOT IN ('" ~ (o2c_normal_addresses | join("', '")) ~ "') AND ") if o2c_normal_addresses | length > 0 else '') ~ o2c_root_private_not_like ~ "))" }}
# 알고 있는 호스트 P2: 등록 출발지(kind 무관) 또는 등록되지 않은 사설 대역. 목록이 비어 있으면 사설 대역만.
o2c_root_known_filter: >-
  {{ "(" ~ (("source_address IN ('" ~ (o2c_normal_addresses | join("', '")) ~ "') OR ") if o2c_normal_addresses | length > 0 else '') ~ o2c_root_private_like ~ ")" }}
# 알고 있는 호스트 P2의 재통지 간격(분). 조회 구간은 5분이다.
o2c_root_known_silence_minutes: 60

# 리소스 알림(Spec #184 / Ticket-3). 제외 파일시스템 유형은 Git 기본값, /boot·/boot/efi는 감시한다.
# 호스트·마운트 예외와 임계값 덮어쓰기는 OpenBao agents/openobserve(비어 있어도 동작):
#   alert_resource_exclusions: [{host: ns0297, mount: /data, metric: disk(선택: disk|inode|memory)}]
#   alert_resource_thresholds: [{host: ns0300, mount: /var(선택), metric(선택), p2: 97, p1: 99}]
o2c_resource_p2_threshold: 90
o2c_resource_p1_threshold: 95
o2c_resource_excluded_fstypes: [squashfs, iso9660, tmpfs, devtmpfs, overlay]
o2c_resource_cfg:
  p2: "{{ o2c_resource_p2_threshold }}"
  p1: "{{ o2c_resource_p1_threshold }}"
  fstypes: "{{ o2c_resource_excluded_fstypes }}"
  exclusions: "{{ o2c_kv.alert_resource_exclusions | default([], true) }}"
  thresholds: "{{ o2c_kv.alert_resource_thresholds | default([], true) }}"

# 로스터(Spec #184 / Ticket-4): 실행 시 인벤토리 그룹에서 만든다(OpenObserve — Config 템플릿은 servers 인벤토리를 읽는다).
#   수집 로스터   = servers - host_agents_excluded - host_agents_backup_only (ns0266·ns0332 포함) — Silent Host·백업 누락
#   유지보수 로스터 = servers - host_agents_excluded — 유지보수 누락
# 호스트 이름은 인벤토리 호스트명(관리번호)이며 수집기가 보내는 host_name과 같다. 편입·폐기 후 Config를 다시 실행하면 따라온다.
o2c_today: "{{ now(utc=true).strftime('%Y-%m-%d') }}"
o2c_silent_exceptions: "{{ o2c_kv.silent_host_exceptions | default([], true) }}"
o2c_roster_collect: "{{ groups | o2c_roster('collect') }}"
o2c_roster_maintenance: "{{ groups | o2c_roster('maintenance') }}"
# Silent Host는 계획 정지 예외 중 만료되지 않은 호스트를 뺀 수집 로스터를 쓴다.
o2c_roster_silent: "{{ o2c_roster_collect | o2c_without_exceptions(o2c_silent_exceptions, o2c_today) }}"
# 앱 텔레메트리 무소식(Spec #253 / Ticket-8): 수집 로스터 중 OpenBao hosts/<host>/agents의 otel_app_telemetry가 true인 호스트(O2C-004·005)에서
# Silent Host와 같은 계획 정지 예외를 뺀다. 스위치가 꺼진 호스트는 들어가지 않는다.
o2c_app_switch_on: []
o2c_roster_app: "{{ o2c_app_switch_on | o2c_without_exceptions(o2c_silent_exceptions, o2c_today) }}"
o2c_rosters:
  collect: "{{ o2c_roster_collect }}"
  maintenance: "{{ o2c_roster_maintenance }}"
  silent: "{{ o2c_roster_silent }}"
  app: "{{ o2c_roster_app }}"
  switch: "{{ o2c_switch_syslog_roster }}"
  fortigate: "{{ o2c_fortigate_syslog_roster }}"

# 트레이스 스트림 보존 기간(Spec #253 / Ticket-8, ADR-0012): 스트림이 이미 있을 때만 맞춘다(없으면 건너뜀 — 첫 span이 들어와야 생긴다).
# 운영 규칙: org당 트레이스 스트림은 o2c_traces_stream 하나만 둔다(View Trace가 이름순 첫 트레이스 스트림을 기본으로 고르므로, #251).
o2c_traces_stream: app_traces
o2c_traces_retention_days: 30

# OpenObserve가 수신하는 가장 오래된 이벤트(ZO_INGEST_ALLOWED_UPTO, 기본 5시간 — 공식 문서). 2026-10 수집기 중단 사고(#161)에서 5시간보다
# 오래된 로그가 거부된 것으로도 확인됐다. 서버 값을 바꿨다면 Silent Host P1 문구와 이 값이 어긋나므로 함께 고친다.
# 주의: 서버(ns0332) 실제 값은 미확인 — 운영 반영 때 ZO_INGEST_ALLOWED_UPTO를 확인하고 다르면 이 값을 맞춘다.
o2c_ingest_allowed_hours: 5

# 알림 규칙. SQL이 행을 돌려주면 발화한다(threshold 1행) — 집계 조건은 HAVING에 둔다.
# 구 레코드(새 필드 없음)는 null이라 조건에서 자연히 빠진다.
o2c_alerts:
  - name: infra-ssh-login-failures-per-source
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "한 출발지에서 SSH 로그인 실패 급증"
    what: "같은 출발지 IP에서 {{ o2c_ssh_fail_window_minutes }}분 동안 SSH 로그인 실패가 {{ o2c_ssh_fail_per_source_threshold }}회 이상 발생했습니다."
    why: "무차별 대입(brute-force) 공격의 전형적인 징후입니다. fail2ban이 막지 못하고 있을 수 있습니다."
    action: "① 출발지가 사내·작업자 IP인지 확인 ② 외부 IP면 방화벽 차단과 fail2ban 동작 확인 ③ 같은 IP의 로그인 성공 기록이 있으면 P1로 격상"
    runbook: "{{ o2c_runbook_base }}#ssh-login-failures-per-source"
    row_template: '• {source_address} → {host_name}: 실패 {failures}회'
    description: "sshd 로그인 실패가 같은 source.address에서 {{ o2c_ssh_fail_window_minutes }}분 동안 {{ o2c_ssh_fail_per_source_threshold }}회 이상 (fail2ban이 막지 못하는 분산 공격 단서)"
    stream: security_logs
    sql: >-
      SELECT source_address, host_name, count(*) AS failures FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'failure'
      GROUP BY source_address, host_name HAVING count(*) >= {{ o2c_ssh_fail_per_source_threshold }}
    period: "{{ o2c_ssh_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_ssh_fail_window_minutes }}"
  - name: infra-ssh-login-failures-per-host
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "한 서버에 SSH 로그인 실패 급증"
    what: "한 서버에서 {{ o2c_ssh_fail_window_minutes }}분 동안 SSH 로그인 실패가 {{ o2c_ssh_fail_per_host_threshold }}회 이상 발생했습니다."
    why: "여러 출발지에서 분산 공격을 받고 있거나 자동화 작업이 잘못된 자격증명으로 반복 접속하는 상황입니다."
    action: "① 로그 보기로 출발지 분포 확인 ② 분산 공격이면 SSH 포트 노출 범위(방화벽) 축소 ③ 내부 자동화면 해당 작업의 자격증명 갱신"
    runbook: "{{ o2c_runbook_base }}#ssh-login-failures-per-host"
    row_template: '• {host_name}: 실패 {failures}회'
    description: "한 호스트에서 sshd 로그인 실패가 {{ o2c_ssh_fail_window_minutes }}분 동안 {{ o2c_ssh_fail_per_host_threshold }}회 이상"
    stream: security_logs
    sql: >-
      SELECT host_name, count(*) AS failures FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'failure'
      GROUP BY host_name HAVING count(*) >= {{ o2c_ssh_fail_per_host_threshold }}
    period: "{{ o2c_ssh_fail_window_minutes }}"
    frequency: 1
    silence: "{{ o2c_ssh_fail_window_minutes }}"
  - name: infra-root-login-success
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "root 계정 원격 로그인 성공 (외부 출발지)"
    what: "등록되지 않은 외부(공인) 출발지에서 root 계정으로 SSH 로그인이 성공했습니다."
    why: "root 직접 접속은 정책상 금지 대상(PermitRootLogin)이며 접속자 식별이 불가능합니다. 외부 출발지라 침해 또는 설정 우회일 수 있습니다(ISMS 2.5 사용자 인증)."
    action: "① 출발지와 시각을 작업 일정·작업자와 대조 ② 확인되지 않으면 해당 서버 root 비밀번호 변경·세션 종료 후 보안 담당 보고 ③ 승인된 작업이면 작업 기록에 남기기"
    runbook: "{{ o2c_runbook_base }}#root-login-success"
    row_template: '• {host_name} ← {source_address} ({logins}회)'
    description: "정상 출발지(OpenBao normal_sources)에도 사설 대역에도 없는 진짜 외부 출발지의 root SSH 로그인 성공 (1건부터 즉시) — PermitRootLogin 설정이 우회되었는지 확인"
    stream: security_logs
    sql: >-
      SELECT host_name, source_address, count(*) AS logins FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'success' AND user_name = 'root'{{ o2c_root_external_filter }}
      GROUP BY host_name, source_address
    period: 5
    frequency: 1
    silence: 5
  - name: infra-root-login-known
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "root 계정 원격 로그인 성공 (알고 있는 출발지)"
    what: "등록된 출발지(Semaphore·사무실) 또는 등록되지 않은 사설 대역 출발지에서 root 계정으로 SSH 로그인이 성공했습니다."
    why: "정책상 금지된 root 직접 접속이 일어났습니다. 등록된 출발지면 작업·배포일 가능성이 높고, 미등록 사설 출발지면 내부 이동(횡적 이동) 가능성을 확인해야 합니다."
    action: "① 출발지가 등록된 곳이면 작업·배포 일정과 대조하고 일반 계정 + sudo로 전환하도록 안내 ② 미등록 사설 출발지면 그 장비의 소유자와 접속 경위를 확인 ③ 확인되지 않으면 root 비밀번호 변경·세션 종료 후 P1 절차(root 로그인 성공)로 격상"
    runbook: "{{ o2c_runbook_base }}#root-login-known"
    row_template: '• {host_name} ← {source_address} ({logins}회)'
    description: "등록 출발지(OpenBao normal_sources, kind 무관) 또는 미등록 사설 대역 출발지의 root SSH 로그인 성공 — P2 (Event Alert, 재통지 {{ o2c_root_known_silence_minutes }}분)"
    stream: security_logs
    sql: >-
      SELECT host_name, source_address, count(*) AS logins FROM "security_logs"
      WHERE event_action = 'ssh_login' AND event_outcome = 'success' AND user_name = 'root' AND {{ o2c_root_known_filter }}
      GROUP BY host_name, source_address
    period: 5
    frequency: 1
    silence: "{{ o2c_root_known_silence_minutes }}"
  - name: infra-sudo-escalation-failure
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "sudo/su 권한 상승 실패"
    what: "sudo/su 인증 실패 또는 sudoers에 없는 사용자의 권한 상승 시도가 있었습니다."
    why: "계정 탈취 후 권한 상승을 시도하는 단계일 수 있습니다. 단순 비밀번호 오입력일 수도 있습니다."
    action: "① 해당 사용자에게 시도 여부 확인 ② 본인이 아니면 계정 잠금·비밀번호 변경 ③ 반복되면 접속 경로(출발지) 추적"
    runbook: "{{ o2c_runbook_base }}#sudo-escalation-failure"
    row_template: '• {host_name} / 사용자 {user_name}: 실패 {failures}회'
    description: "sudo/su 권한상승 실패(authentication failure, NOT in sudoers) — 성공은 알리지 않고 기록만 한다"
    stream: security_logs
    sql: >-
      SELECT host_name, user_name, count(*) AS failures FROM "security_logs"
      WHERE event_action IN ('sudo','su') AND event_outcome = 'failure'
      GROUP BY host_name, user_name
    period: 5
    frequency: 1
    silence: 5
  - name: infra-oom-kill
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "OOM kill로 프로세스 강제 종료"
    what: "메모리 부족(OOM)으로 커널이 프로세스를 강제 종료했습니다."
    why: "서비스 프로세스가 죽었을 수 있고, 같은 원인이 반복되면 다른 서비스와 서버 전체로 번질 수 있습니다."
    action: "① 행의 종료된 프로세스가 서비스면 재기동 상태 확인 ② 메모리 상위 프로세스와 한도(JVM 힙, 컨테이너 limit) 점검 ③ 반복되면 메모리 증설·한도 조정 계획"
    runbook: "{{ o2c_runbook_base }}#oom-kill"
    row_template: '• {host_name}: 종료된 프로세스 {killed_process} ({kills}건)'
    description: "OOM kill (Killed process / Kill process / invoked oom-killer, 대소문자 무시) — cgroup·CentOS 6/7 형식 포함"
    stream: system_logs
    sql: >-
      SELECT host_name,
      CASE WHEN lower(body) LIKE '%kill%process%'
      THEN regexp_replace(body, '^.*[Kk]ill(?:ed)? process [0-9]+ [(]([^)]*)[)].*$', '\1')
      ELSE 'oom-killer 호출' END AS killed_process,
      count(*) AS kills FROM "system_logs"
      WHERE lower(body) LIKE '%killed process%' OR lower(body) LIKE '%out of memory: kill process%'
      OR lower(body) LIKE '%invoked oom-killer%'
      GROUP BY host_name, killed_process
    period: 5
    frequency: 1
    silence: 5
  - name: infra-disk-fs-errors
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "디스크 I/O·파일시스템 오류 발생"
    what: "디스크 I/O 오류 또는 파일시스템 손상(EXT4/XFS) 오류가 기록됐습니다."
    why: "디스크 고장이나 데이터 손상의 전조로, 데이터 손실로 이어질 수 있어 즉시 확인해야 합니다."
    action: "① 로그 보기에서 오류 원문과 장치 확인 ② 즉시 백업 상태 확인(restic snapshots) ③ 파일시스템이 읽기 전용이면 서비스 영향 판단 후 디스크 교체·fsck 일정"
    runbook: "{{ o2c_runbook_base }}#disk-fs-errors"
    row_template: '• {host_name}: 오류 패턴 {matches}건'
    description: "디스크·파일시스템 오류 (I/O error, EXT4-fs error, XFS Corruption, blk_update_request, Buffer I/O error) — rsyslog 파일에는 severity가 없어 패턴으로 잡는다"
    stream: system_logs
    sql: >-
      SELECT host_name, count(*) AS matches FROM "system_logs"
      WHERE lower(body) LIKE '%i/o error%' OR lower(body) LIKE '%ext4-fs error%'
      OR (lower(body) LIKE '%xfs%' AND lower(body) LIKE '%corruption%')
      OR lower(body) LIKE '%blk_update_request%' OR lower(body) LIKE '%buffer i/o error%'
      GROUP BY host_name
    period: 5
    frequency: 1
    silence: 5
  - name: infra-app-log-errors
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "컨테이너 로그에 ERROR 이상 기록"
    what: "컨테이너(앱·Caddy·valkey 등) 로그에 ERROR 이상 레벨의 줄이 기록됐습니다."
    why: "앱 장애나 요청 실패, 의존 서비스(DB·큐·캐시) 연결 문제의 첫 신호일 수 있습니다. WARN은 알리지 않으므로 이 알림이 오면 서비스 영향이 시작됐을 수 있습니다."
    action: "① 행의 호스트·컨테이너 로그에서 ERROR 원문과 직전 줄 확인 ② 같은 시각의 다른 알림(VIP 전환, valkey, Silent Host)과 대조 ③ 서비스 영향이 있으면 해당 노드를 서비스에서 빼고 원인 조치"
    runbook: "{{ o2c_runbook_base }}#app-log-errors"
    row_template: '• {host_name} / {container_name}: ERROR 이상 {errors}건'
    description: "app_logs의 severity가 error 이상(error·err·severe·fatal·critical·panic·dpanic, 대소문자 무시)인 줄 — 수집기가 JSON level·log.level·valkey 레벨 문자로 올린 값만 본다(키워드 추정 없음). WARN 이하와 레벨이 없는 줄은 알리지 않는다"
    stream: app_logs
    sql: >-
      SELECT host_name, container_name, count(*) AS errors FROM "app_logs"
      WHERE lower(severity) IN ('error','err','severe','fatal','critical','panic','dpanic')
      GROUP BY host_name, container_name
    period: 5
    frequency: 1
    silence: 5
  - name: infra-log-parse-errors-security-logs
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "보안 로그 해석 실패율 상승"
    what: "security_logs에서 형식을 해석하지 못한 로그 비율이 {{ o2c_parse_error_percent }}% 이상입니다."
    why: "해석되지 않은 보안 로그는 위 보안 알림(로그인 실패·root 로그인·sudo)에 잡히지 않아 탐지 공백이 생깁니다."
    action: "① 해당 서버의 sshd·sudo 로그 형식 변경(패키지 업데이트) 여부 확인 ② 수집기(otelcol) 설정과 VRL 함수 수정 필요성 검토 ③ 업무 시간에 처리"
    runbook: "{{ o2c_runbook_base }}#log-parse-errors"
    row_template: '• {host_name}: {total}줄 중 {parse_errors}줄 해석 실패'
    description: "security_logs의 log.parse_error=true 비율이 {{ o2c_parse_error_percent }}% 이상 (수집기 포맷 계약 위반 의심)"
    stream: security_logs
    sql: >-
      SELECT host_name, count(*) AS total,
      sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) AS parse_errors FROM "security_logs"
      GROUP BY host_name HAVING count(*) >= {{ o2c_parse_error_min_lines }}
      AND sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) * 100 >= {{ o2c_parse_error_percent }} * count(*)
    period: "{{ o2c_parse_error_window_minutes }}"
    frequency: 10
    silence: "{{ o2c_parse_error_window_minutes }}"
  - name: infra-log-parse-errors-system-logs
    severity: "P3 주의"
    severity_icon: "🟡"
    title: "시스템 로그 해석 실패율 상승"
    what: "system_logs에서 형식을 해석하지 못한 로그 비율이 {{ o2c_parse_error_percent }}% 이상입니다."
    why: "해석되지 않은 시스템 로그는 커널·디스크 오류 알림에 잡히지 않을 수 있습니다."
    action: "① 해당 서버의 로그 형식 변경 여부 확인 ② 수집기(otelcol) 설정 점검 ③ 업무 시간에 처리"
    runbook: "{{ o2c_runbook_base }}#log-parse-errors"
    row_template: '• {host_name}: {total}줄 중 {parse_errors}줄 해석 실패'
    description: "system_logs의 log.parse_error=true 비율이 {{ o2c_parse_error_percent }}% 이상 (수집기 포맷 계약 위반 의심)"
    stream: system_logs
    sql: >-
      SELECT host_name, count(*) AS total,
      sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) AS parse_errors FROM "system_logs"
      GROUP BY host_name HAVING count(*) >= {{ o2c_parse_error_min_lines }}
      AND sum(CASE WHEN log_parse_error = true THEN 1 ELSE 0 END) * 100 >= {{ o2c_parse_error_percent }} * count(*)
    period: "{{ o2c_parse_error_window_minutes }}"
    frequency: 10
    silence: "{{ o2c_parse_error_window_minutes }}"
