    frequency: 5
    silence: 60

  - name: infra-unreachable-host
    severity: "P1 긴급"
    severity_icon: "🔴"
    title: "서버 응답 없음 (Unreachable Host)"
    what: "검사하는 쪽(ns0266)에서 이 서버의 SSH 포트에 5분 연속 접속하지 못했습니다."
    why: "서버나 네트워크가 내려갔을 가능성이 큽니다. 접속이 된다고 OS가 건강하다는 뜻은 아니며, 이 알림은 도달성만 봅니다(ADR-0010)."
    action: "① 서버 전원·콘솔·네트워크 경로 확인 ② 같은 호스트의 Silent Host 알림이 함께 오면 같은 사건이다 — 서버가 복구되면 수집기도 돌아온다 ③ 서버가 살아 있는데 이 알림만 오면 ns0266에서 해당 포트로의 경로(방화벽)와 SSH 포트 설정 확인"
    runbook: "{{ o2c_runbook_base }}#unreachable-host"
    row_template: '• {tcpcheck_endpoint} (검사: {host_name})'
    description: "tcpcheck.status가 5분 구간 최댓값 0 — 검사하는 쪽이 servers 전체의 SSH 포트를 60초마다 확인 (State Alert, 재통지 60분)"
    stream: tcpcheck_status
    stream_type: metrics
    sql: >-
      SELECT host_name, tcpcheck_endpoint, max(value) AS status FROM "tcpcheck_status"
      GROUP BY host_name, tcpcheck_endpoint HAVING max(value) = 0
    period: 5
    frequency: 1
    silence: 60
  - name: infra-backup-failure
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "백업 실패"
    what: "restic 백업이 실패했습니다(job=backup, success=false)."
    why: "다음 백업 전에 고치지 않으면 복구 지점이 늘어나지 않고, 반복되면 백업 누락 알림으로 이어집니다."
    action: "① 행의 호스트에서 /var/log/host-agents/backup.jsonl 마지막 줄의 error 확인 ② 저장소(RustFS) 접속·자격증명·디스크 여유 점검 ③ 원인을 고친 뒤 호스트에서 백업을 수동 실행해 성공 확인"
    runbook: "{{ o2c_runbook_base }}#backup-failure"
    row_template: '• {host}: 실패 {failures}건'
    description: "백업 실패 (job=backup, success=false) — Event Alert, backup_logs의 호스트는 host 필드"
    stream: backup_logs
    sql: >-
      SELECT host, count(*) AS failures FROM "backup_logs"
      WHERE job = 'backup' AND success = false
      GROUP BY host
    period: 5
    frequency: 1
    silence: 5
  - name: infra-integrity-check-failure
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "백업 저장소 무결성 검사 실패"
    what: "Repo Maintenance의 restic check가 실패했습니다(job=maintenance, command=check, success=false)."
    why: "저장소가 손상됐을 수 있습니다. 실패한 호스트는 prune이 차단되어 저장소가 계속 커집니다."
    action: "① Semaphore Repo Maintenance 실행 로그에서 해당 호스트의 check 오류 확인 ② restic check로 손상 범위 확인 ③ 손상이면 저장소 복구·재초기화와 백업 재실행 계획"
    runbook: "{{ o2c_runbook_base }}#integrity-check-failure"
    row_template: '• {host}: 실패 {failures}건'
    description: "무결성 검사 실패 (job=maintenance, command=check, success=false) — Event Alert, 호스트는 host 필드"
    stream: backup_logs
    sql: >-
      SELECT host, count(*) AS failures FROM "backup_logs"
      WHERE job = 'maintenance' AND command = 'check' AND success = false
      GROUP BY host
    period: 5
    frequency: 1
    silence: 5
  - name: infra-backup-missing
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "백업 누락: 마지막 성공 백업이 26시간 넘음"
    what: "수집 로스터의 호스트에서 성공한 백업(job=backup)이 26시간 넘게 없습니다(한 번도 백업하지 않은 호스트 포함)."
    why: "복구 지점이 하루 넘게 갱신되지 않고 있습니다. 놓친 실행은 보정되지 않습니다."
    action: "① 같은 호스트의 Silent Host 알림이 있는지 먼저 확인 — 수집기 중단으로 이벤트만 빠진 것일 수 있음 ② 호스트의 /etc/cron.d/host-agents-backup(또는 systemd timer)과 /var/log/host-agents/backup.jsonl 확인 ③ 신규 편입이면 Host Agents Deploy 실행 여부 확인"
    runbook: "{{ o2c_runbook_base }}#backup-missing"
    row_template: '• {host}'
