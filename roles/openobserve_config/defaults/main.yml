  - name: infra-silent-host-p2
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "Silent Host: 메트릭이 15분 넘게 끊김"
    what: "수집 로스터의 호스트에서 메트릭 하트비트(system_memory_usage)가 15분 넘게 오지 않습니다(3시간 미만)."
    why: "수집기가 멈췄거나 서버가 내려갔을 수 있습니다. 방치하면 3시간 뒤 P1이 되고, 약 {{ o2c_ingest_allowed_hours }}시간이 지나면 이 구간 로그는 OpenObserve로 복구되지 않습니다."
    action: "① 같은 호스트의 서버 응답 없음 알림이 있으면 그쪽이 원인 — 서버·네트워크부터 복구 ② 서버가 살아 있으면 otelcol-contrib 서비스 상태 확인·재기동 ③ 며칠 이상 계획 정지하는 호스트면 OpenBao silent_host_exceptions에 만료일과 함께 등록"
    runbook: "{{ o2c_runbook_base }}#silent-host"
    row_template: '• {host_name}'
    description: "수집 로스터 호스트의 system_memory_usage가 15분 없음, 3시간 미만 (State Alert, 재통지 1440분) — UNION ALL 로스터 가지 방식"
    stream: system_memory_usage
    stream_type: metrics
    absence: {level: p2, roster: silent}
    sql: "{{ o2c_roster_silent | o2c_absence_sql('system_memory_usage', 'p2') }}"
    period: 180
    frequency: 5
    silence: 1440
