  # --- RAID 상태 알림 (Spec #322 / Ticket-13, #335) ---------------------------------------------------------------------
  # host_status_logs는 수집기(host-agents-raid-status)가 5분마다 남기는 정규화 레코드다(docs/research/hardware-raid-metrics-industry-standard.md §6·§8).
  # 한 번의 판독으로 울리지 않도록 15분 구간에 같은 대상의 이상 레코드가 2건 이상(= 연속 2회 수집)일 때만 울린다.
  # 등급은 모두 P2다(#322 결정). 업계 도구가 나누는 HIGH/WARNING 차이는 재통지 간격과 문구로만 둔다.
  - name: infra-raid-write-cache-disabled
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "RAID 컨트롤러 쓰기 캐시 꺼짐"
    what: "RAID 컨트롤러가 쓰기 캐시를 끄고 디스크에 바로 쓰고 있습니다(Permanently Disabled, 또는 충전 중이 아닌 Temporarily Disabled)."
    why: "데이터 손실 위험은 없지만 쓰기가 디스크 속도로 떨어져 DB 커밋·로그 기록이 계속 느려집니다. 백업 전원(배터리)이 없거나 케이블이 빠진 하드웨어 문제라 저절로 풀리지 않습니다."
    action: "① 행의 원인(cache_reason) 확인: Cable Error는 배터리 케이블 재장착·교체, not attached는 배터리 모듈 장착 ② 서버에서 ssacli ctrl all show config detail로 Cache Status 재확인 ③ No-Battery Write Cache를 켜서 해결하지 않는다(정전 시 데이터 손실)"
    runbook: "{{ o2c_runbook_base }}#raid-write-cache-disabled"
    row_template: '• {host_name} {hw_name}: {cache_status} ({cache_reason}) · {event_time}'
    description: "controller 레코드의 cache_status가 permanently_disabled·failed, 또는 배터리 충전 중이 아닌 temporarily_disabled인 판독이 15분에 2회 이상 (State Alert, 재통지 1440분)"
    stream: host_status_logs
    sql: >-
      SELECT host_name, hw_name, max(cache_status) AS cache_status, max(cache_reason) AS cache_reason, count(*) AS readings, {{ o2c_event_time_sql }}
      FROM "host_status_logs"
      WHERE kind = 'controller'
      AND (cache_status IN ('permanently_disabled', 'failed') OR (cache_status = 'temporarily_disabled' AND backup_power_operation <> 'charging'))
      GROUP BY host_name, hw_name HAVING count(*) >= 2
      ORDER BY readings DESC
    period: 15
    frequency: 5
    silence: 1440
  - name: infra-raid-controller-fault
    severity: "P2 경고"
    severity_icon: "🟠"
    title: "RAID 컨트롤러 상태 이상"
    what: "RAID 컨트롤러가 자기 상태를 OK가 아닌 값으로 보고하고 있습니다."
    why: "컨트롤러 이상은 그 아래 모든 논리 드라이브의 I/O 오류나 정지로 이어질 수 있습니다."
