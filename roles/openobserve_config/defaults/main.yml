    stream: system_logs
    # HAVING으로만 거르는 집계라 WHERE에서 파생할 수 없다: 원문 링크는 해석 실패 줄을 직접 연다(o2c_raw_log_sql 대신 raw_sql)
    raw_sql: 'SELECT * FROM "system_logs" WHERE log_parse_error = true ORDER BY _timestamp DESC LIMIT 200'
    sql: >-
      SELECT host_name, count(*) AS total,
