---
# ==============================================================================
# OpenObserve 설정 as code (ADR-0008, Spec #93 / Ticket-2) — 컨트롤러 전용
# ==============================================================================
# 순서: 입력 해석(OpenBao) → 원하는 상태 도출 → GET으로 현재 상태 조회 → 차이만 계획 → (check 모드가 아니면) POST/PUT.
# 모든 API 호출 태스크는 no_log다 — 통지 대상(destination)에 webhook URL/토큰이 들어 있다.
# check 모드: GET과 계획 출력만 한다(쓰기 요청 0건).
# OpenBao 인증: AppRole(VAULT_ROLE_ID/VAULT_SECRET_ID)이 있으면 로그인해 받은 토큰을 먼저 쓰고, 없거나 실패하면 VAULT_TOKEN을 쓴다.
# Semaphore의 다른 템플릿과 같은 순서다 — 만료된 VAULT_TOKEN 때문에 KV가 비어 입력 누락으로 실패하던 문제를 막는다.
# OpenBao 접속 값은 여기서 한 번만 해석하고 아래 태스크가 함께 쓴다(태스크마다 같은 해석을 되풀이하지 않는다).
# 토큰은 AppRole 로그인(O2C-000) 뒤에 해석하므로 따로 둔다. 시크릿이 들어 있어 no_log이고 팩트 캐시에 두지 않는다.
- name: Resolve the OpenBao address, namespace and mount used by the tasks below
  ansible.builtin.set_fact:
    o2c_vault_addr: "{{ vault_addr | default(VAULT_ADDR | default(lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true), true), true) }}"
    o2c_vault_ns: "{{ (vault_namespace | default(VAULT_NAMESPACE | default(lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE') | default('infra/prod/host/', true), true), true), true)) | regex_replace('/+$', '') }}"
    o2c_vault_mount: "{{ vault_mount | default(VAULT_MOUNT | default(lookup('ansible.builtin.env', 'VAULT_MOUNT') | default(lookup('ansible.builtin.env', 'OPENBAO_MOUNT') | default('secret', true), true), true), true) }}"
    cacheable: false
  no_log: true

- name: "[O2C-000] Log in to OpenBao with AppRole for the OpenObserve configuration KV"
  ansible.builtin.uri:
    url: "{{ o2c_vault_addr }}/v1/auth/approle/login"
    method: POST
    headers: "{{ {'X-Vault-Namespace': o2c_vault_ns} if (o2c_vault_ns | length > 0) else {} }}"
    body_format: json
    body:
      role_id: "{{ o2c_vault_role_id }}"
      secret_id: "{{ o2c_vault_secret_id }}"
    status_code: [-1, 200, 400, 401, 403, 404, 500]
    timeout: 5
    validate_certs: "{{ o2c_vault_validate_certs }}"
  register: _o2c_approle_login
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - o2c_kv_fixture is not defined
    - o2c_vault_role_id | length > 0
    - o2c_vault_secret_id | length > 0

- name: Resolve the OpenBao token (the AppRole login token first, then VAULT_TOKEN)
  ansible.builtin.set_fact:
    o2c_vault_token: "{{ (_o2c_approle_login.json.auth.client_token | default('')) or (vault_token | default(VAULT_TOKEN | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true), true)) }}"
    cacheable: false   # the token never goes to the fact cache (ansible.cfg fact_caching = jsonfile)
  no_log: true

- name: "[O2C-001] Fetch OpenObserve configuration KV from OpenBao (agents/openobserve)"
  ansible.builtin.uri:
    url: "{{ o2c_vault_addr }}/v1/{{ o2c_vault_mount }}/data/agents/openobserve"
    method: GET
    headers: >-
      {{ {'X-Vault-Token': o2c_vault_token} | combine({'X-Vault-Namespace': o2c_vault_ns} if (o2c_vault_ns | length > 0) else {}) }}
    status_code: [200, 404]
    timeout: 5
    validate_certs: "{{ o2c_vault_validate_certs }}"
  register: _o2c_kv_resp
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - o2c_kv_fixture is not defined
    - o2c_vault_token | length > 0

- name: "[O2C-002] Resolve and assert the OpenObserve inputs (endpoint, API account, webhook URL)"
  vars:
    _kv: "{{ o2c_kv_fixture if o2c_kv_fixture is defined else (_o2c_kv_resp.json.data.data | default({})) }}"
  block:
    - name: Keep the resolved KV as a fact
      ansible.builtin.set_fact:
        o2c_kv: "{{ _kv }}"
        cacheable: false   # credentials never go to the fact cache (ansible.cfg fact_caching = jsonfile)
      no_log: true

    - name: Assert the required inputs exist
      ansible.builtin.assert:
        that:
          - o2c_endpoint | length > 0
          - o2c_endpoint is match('^https?://[^/]+(/.*[^/])?$')
          - (o2c_kv.api_user | default('')) | length > 0
          - (o2c_kv.api_password | default('')) | length > 0
          - (o2c_kv.alert_webhook_url | default('')) is match('^https?://')
          # 정상 출발지는 SQL에 들어가므로 IP 문자와 알려진 종류만 허용한다
          - (o2c_normal_sources | selectattr('address', 'match', '^[0-9A-Fa-f.:]+$') | selectattr('kind', 'in', ['semaphore', 'office']) | list | length) == (o2c_normal_sources | length)
          # Silent Host 계획 정지 예외는 SQL에 들어가므로 호스트 이름 문자와 만료일(YYYY-MM-DD)이 필수다
          - o2c_silent_exceptions | o2c_valid_exceptions
          # 스위치 syslog 알림의 목록도 SQL에 들어간다(Spec #277): 메시지 코드는 FACILITY-SEVERITY(0~7)-MNEMONIC, 장비는 관리번호(ns+숫자), 포트는 인터페이스 이름 문자만
          - (o2c_switch_noise_events + o2c_switch_config_change_events + o2c_switch_login_fail_events + o2c_switch_macflap_events) | o2c_valid_switch_events
          - o2c_switch_syslog_roster | o2c_valid_switch_roster
          - o2c_switch_uplinks | o2c_valid_switch_uplinks
          # 방화벽 알림의 목록·승인 시간도 SQL에 들어간다(Spec #282 / Ticket-3): 장비는 관리번호 또는 HA 쌍(ns0380+ns0381), 경로·심각도는 key=value 문자만, 시는 0~24 정수(시작 < 끝)
          - o2c_fortigate_syslog_roster | o2c_valid_fortigate_roster
          # 장비 이름 → 관리번호 별칭표는 VRL 소스에 들어간다: 키는 소문자 정규화한 devname, 값은 관리번호(ns+숫자)
          - o2c_fortigate_device_aliases | o2c_valid_fortigate_aliases
          - (o2c_fortigate_policy_cfgpaths + o2c_fortigate_account_cfgpaths + o2c_fortigate_detection_severities) | o2c_valid_fortigate_values
          - o2c_fortigate_ha_ignored_logids | o2c_valid_fortigate_logids
          - (o2c_fortigate_approved_start_hour | string) is match('^[0-9]+$')
          - (o2c_fortigate_approved_end_hour | string) is match('^[0-9]+$')
          - (o2c_fortigate_approved_start_hour | int) < (o2c_fortigate_approved_end_hour | int)
          - (o2c_fortigate_approved_end_hour | int) <= 24
          - (o2c_fortigate_silent_minutes | string) is match('^[0-9]+$')
          # root 로그인 P2 재통지 간격은 알림 정의(silence)에 들어간다
          - (o2c_root_known_silence_minutes | string) is match('^[0-9]+$')
          # 삭제는 폐기 목록에 있는 알림 이름뿐이다: 형식·중복을 요청 전에 검증하고, 현행 알림 정의와 겹치면 실패시킨다(현행 알림 삭제 방지)
          - o2c_retired_alerts | o2c_valid_retired_alerts
          # P1 전용 destination은 이름일 뿐이다(비면 기본 대상). 서버에 있는지는 O2C-012 계획이 쓰기 전에 확인한다
          - (o2c_p1_destination | string) is match('^[A-Za-z0-9._-]*$')
          - (o2c_retired_alerts | o2c_retired_conflicts((o2c_alerts_active | map(attribute='name') | list) + [o2c_selftest_alert.name])) | length == 0
        fail_msg: >-
          agents/openobserve에 o2_endpoint(끝 슬래시 금지), api_user, api_password, alert_webhook_url이 필요하고 normal_sources는 [{address: IP, kind: semaphore|office}], silent_host_exceptions는 [{host: 호스트명, expires: YYYY-MM-DD}](만료일 필수) 형식이어야 합니다
          (스위치 syslog 알림 변수는 o2c_switch_*_events가 FACILITY-SEVERITY-MNEMONIC 코드 목록, o2c_switch_syslog_roster가 [ns0250, ...], o2c_switch_uplinks가 [{device: ns0250, port: Gi1/0/49}] 형식이어야 합니다)
          (방화벽 알림 변수는 o2c_fortigate_syslog_roster가 [ns0399, 장비 이름, ns0380+ns0381], o2c_fortigate_device_aliases가 {소문자 장비 이름: ns관리번호}, 승인 시간이 0~24 정수(시작 < 끝), o2c_fortigate_ha_ignored_logids가 숫자 문자열 목록 형식이어야 합니다)
          (o2c_p1_destination은 비워 두거나 destination 이름(영문·숫자·._-)이어야 합니다)
          (폐기 목록 o2c_retired_alerts는 ^infra-[a-z0-9-]+$ 형식의 중복 없는 이름 목록이어야 하고 현행 알림 정의의 이름을 담으면 안 됩니다)
          (OpenBao 인증은 Semaphore Environment의 VAULT_ROLE_ID/VAULT_SECRET_ID 또는 VAULT_TOKEN). 값은 출력하지 않습니다.
          OpenBao 응답: AppRole 로그인 {{ _o2c_approle_login.status | default('시도 안 함') }}, KV 조회 {{ _o2c_kv_resp.status | default('시도 안 함') }}.
        quiet: true
      no_log: true

# 무소식 알림(infra-app-telemetry-silent)의 로스터는 스위치가 켜진 호스트만이다(Spec #253 / Ticket-8). 스위치(otel_app_telemetry)는 인벤토리가 아니라
# OpenBao hosts/<host>/agents에만 있으므로 수집 로스터 호스트마다 읽는다. 200·404 외로 답하면 짐작하지 않고 실패한다(호스트가 감시에서 조용히 빠지지 않도록).
# 응답 본문에 시크릿이 있으므로 no_log이고, 스위치 값(true)만 O2C-005에서 골라 쓴다.
- name: Assert an OpenBao token is available to read the app telemetry switches
  ansible.builtin.assert:
    that:
      - o2c_vault_token | length > 0
    fail_msg: >-
      수집 로스터 호스트의 앱 텔레메트리 스위치를 OpenBao에서 읽을 토큰이 없습니다(AppRole 로그인 실패이거나 VAULT_TOKEN이 비어 있음).
      비어 있는 채로 진행하면 무소식 알림 로스터가 조용히 비므로 실패합니다.
    quiet: true
  no_log: true
  when:
    - o2c_app_telemetry_kv_fixture is not defined
    - o2c_roster_collect | length > 0

- name: "[O2C-004] Read the otel_app_telemetry switch of every collect-roster host from OpenBao (hosts/<host>/agents)"
  vars:
    _vault_hosts_prefix_eff: "{{ (lookup('ansible.builtin.env', 'OPENBAO_HOSTS_PREFIX') | default('hosts/', true)) | regex_replace('^secret/', '') }}"
  o2c_http:
    base_url: "{{ o2c_vault_addr }}"
    headers: >-
      {{ {'X-Vault-Token': o2c_vault_token} | combine({'X-Vault-Namespace': o2c_vault_ns} if (o2c_vault_ns | length > 0) else {}) }}
    requests: >-
      {{ o2c_roster_collect | o2c_host_items
         | o2c_as_requests(path='/v1/' ~ o2c_vault_mount ~ '/data/' ~ _vault_hosts_prefix_eff ~ '{host}/agents', label='{host}') }}
    status_code: [200, 404]
    timeout: 10
    parallel: true
    validate_certs: "{{ o2c_vault_validate_certs }}"
  register: _o2c_app_kv_resp
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - o2c_app_telemetry_kv_fixture is not defined
    - o2c_vault_token | length > 0

- name: "[O2C-005] Keep the hosts with the otel_app_telemetry switch on (the roster of the app telemetry silent alert)"
  vars:
    _kv_by_host: >-
      {{ o2c_app_telemetry_kv_fixture if o2c_app_telemetry_kv_fixture is defined
         else dict(_o2c_app_kv_resp.results | default([]) | map(attribute='item.host')
                   | zip(_o2c_app_kv_resp.results | default([]) | map(attribute='json.data.data', default={}))) }}
  ansible.builtin.set_fact:
    o2c_app_switch_on: "{{ o2c_roster_collect | o2c_app_telemetry_roster(_kv_by_host) }}"   # 호스트 이름만 남긴다(KV 본문은 팩트로 두지 않는다)
    cacheable: false
  no_log: true

- name: "[O2C-003] Derive the desired OpenObserve objects from the repository definitions"
  ansible.builtin.set_fact:
    o2c_desired_objects: >-
      {{ {'org': o2c_org, 'stream': o2c_stream, 'function_name': o2c_function_name, 'pipeline_name': o2c_pipeline_name,
          'template_name': o2c_template_name, 'template_body': o2c_template_body, 'destination_name': o2c_destination_name,
          'webhook_url': o2c_kv.alert_webhook_url, 'p1_destination': o2c_p1_destination,
          'webhook_headers': {'Content-Type': 'application/json'} | combine({o2c_webhook_auth_header: o2c_kv.alert_webhook_token} if (o2c_kv.alert_webhook_token | default('')) | length > 0 else {}),
          'vrl': lookup('ansible.builtin.file', role_path ~ '/files/vrl/security_semantics.vrl'),
          'fortigate': {'function_name': o2c_fortigate_function_name, 'vrl': lookup('ansible.builtin.file', role_path ~ '/files/vrl/fortigate_semantics.vrl'),
                        'aliases': o2c_fortigate_device_aliases},
          'switch_syslog': {'stream': o2c_switch_stream, 'function_name': o2c_switch_function_name, 'pipeline_name': o2c_switch_pipeline_name,
                            'vrl': lookup('ansible.builtin.file', role_path ~ '/files/vrl/switch_syslog_semantics.vrl')},
          'alerts': o2c_alerts_active, 'selftest_alert': o2c_selftest_alert,
          'traces_stream': o2c_traces_stream, 'traces_retention_days': o2c_traces_retention_days} | o2c_desired }}
    o2c_auth_headers:
      Authorization: "Basic {{ (o2c_kv.api_user ~ ':' ~ o2c_kv.api_password) | b64encode }}"
    cacheable: false   # credentials never go to the fact cache (ansible.cfg fact_caching = jsonfile)
  no_log: true

# 아래 API 호출 태스크는 role 안의 o2c_http 모듈(library/o2c_http.py)을 쓴다 — ansible.builtin.uri를 loop로 돌리면
# 항목마다 모듈 프로세스를 새로 띄워(약 0.4초) 알림 수에 비례해 느리다. 결과는 uri loop의 results(item/status/json)와 같은 모양이다.
- name: "[O2C-010] Read the current OpenObserve state (templates, destinations, functions, pipelines, alerts)"
  o2c_http:
    base_url: "{{ o2c_endpoint }}"
    headers: "{{ o2c_auth_headers }}"
    requests: "{{ o2c_org | o2c_read_requests | o2c_as_requests(label='{kind}') }}"
    timeout: 15
    parallel: true
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  register: _o2c_current
  changed_when: false
  check_mode: false
  no_log: true

- name: "[O2C-011] Read each existing alert (the list view carries no query or trigger settings)"
  vars:
    _alert_list: >-
      {{ (_o2c_current.results | selectattr('item.kind', 'equalto', 'alert') | map(attribute='json') | first).list | default([])
         | selectattr('alert_id', 'defined') | list }}
  o2c_http:
    base_url: "{{ o2c_endpoint }}"
    headers: "{{ o2c_auth_headers }}"
    requests: "{{ _alert_list | o2c_as_requests(path='/api/v2/' ~ o2c_org ~ '/alerts/{alert_id}', label='{name}') }}"
    timeout: 15
    parallel: true
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  register: _o2c_alert_details
  changed_when: false
  check_mode: false
  no_log: true

- name: "[O2C-012] Plan the writes needed (only objects that differ)"
  vars:
    _by_kind: >-
      {{ dict(_o2c_current.results | map(attribute='item.kind') | zip(_o2c_current.results | map(attribute='json'))) }}
    _alert_full: "{{ _o2c_alert_details.results | default([]) | o2c_alert_state }}"
  ansible.builtin.set_fact:
    o2c_plan_actions: "{{ o2c_desired_objects | o2c_plan(_by_kind | combine({'alert': _alert_full}), o2c_org, o2c_retired_alerts) }}"
    o2c_unmanaged_alerts: "{{ o2c_desired_objects | o2c_unmanaged_alerts(_by_kind | combine({'alert': _alert_full}), o2c_retired_alerts) }}"
  no_log: true

- name: "[O2C-013] Show the planned changes (names only, never bodies)"
  ansible.builtin.debug:
    msg: >-
      {{ ((o2c_plan_actions | o2c_plan_summary) if (o2c_plan_actions | length > 0) else ['OpenObserve가 이미 정의와 일치합니다 (변경 0건)'])
         + (['unmanaged infra- alert on server (kept): ' ~ (o2c_unmanaged_alerts | join(', '))] if o2c_unmanaged_alerts | length > 0 else []) }}

# 스트림이 바뀐 알림은 계획에 recreate(DELETE)→create(POST)가 짝으로 들어간다. 반영은 순서대로 하나씩 보내고 앞 요청이 실패하면 멈추므로,
# DELETE 뒤 POST가 실패하면 그 알림이 서버에 없는 채로 끝난다(복구: 원인 해소 뒤 Config 재실행 — 없는 알림은 create로 계획된다).
# 계획 전용(o2c_plan_only=true): 위 계획 출력까지만 하고, 아래의 모든 쓰기(시드 O2C-014, 반영 O2C-020)·합성 레코드 주입(O2C-032, O2C-037)·검증 단계보다 먼저 정상 종료한다.
- name: "[O2C-015] Report that this is a plan-only run (no changes will be made)"
  ansible.builtin.debug:
    msg: "plan only: no changes were made"
  when: o2c_plan_only | bool

- name: "[O2C-016] End the play after the plan when o2c_plan_only is true (before any write or injection)"
  ansible.builtin.meta: end_play
  when: o2c_plan_only | bool

# 시드(O2C-014)와 합성 레코드(O2C-032)는 둘 다 수집 토큰이 필요하므로, 토큰 검사(O2C-031)를 어떤 쓰기보다 먼저 한다.
- name: "[O2C-031] Assert the controller ingest token exists (needed to inject the synthetic records)"
  ansible.builtin.assert:
    that:
      - (o2c_kv.controller_ingest_token | default('')) | length > 0
    fail_msg: "알림 검증에 agents/openobserve의 controller_ingest_token이 필요합니다. 값은 출력하지 않습니다."
    quiet: true
  no_log: true
  when: not ansible_check_mode

# OpenObserve는 레코드가 한 번도 들어오지 않은 스트림에는 알림을 만들지 못한다(404). 자가 시험 알림의 검증 전용 스트림은
# 처음에 비어 있으므로, 그 알림을 만들 때만 조회 구간(5분)보다 오래된 시드 레코드 1건으로 스트림을 먼저 만든다 — 통지는 나가지 않는다.
# 수집기가 만드는 운영 스트림(tcpcheck_status 등)은 여기서 만들지 않는다: 수집기가 배포되어야 생긴다.
- name: "[O2C-014] Seed the empty self-test stream with one past record before its alert is created"
  ansible.builtin.uri:
    url: "{{ o2c_endpoint }}/api/{{ o2c_org }}/{{ o2c_selftest_stream }}/_json"
    method: POST
    headers:
      Authorization: "Basic {{ (o2c_org ~ ':' ~ (o2c_kv.controller_ingest_token | default(''))) | b64encode }}"
    body_format: json
    body:
      - _timestamp: "{{ ((now().timestamp() - o2c_selftest_seed_age_s) * 1000000) | int }}"   # now(utc=true)는 naive라 .timestamp()가 현지 시각으로 해석한다
        host_name: "selftest-seed"
        message: "stream seed (not a notification test)"
    status_code: [200, 201]
    timeout: 30
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  changed_when: false   # 검증 전용 스트림에만 쓰며 운영 상태를 바꾸지 않는다
  no_log: true
  when:
    - not ansible_check_mode
    - o2c_plan_actions | selectattr('op', 'equalto', 'create') | selectattr('kind', 'equalto', 'alert') | selectattr('name', 'equalto', o2c_selftest_alert.name) | list | length > 0

- name: "[O2C-020] Apply the planned changes to OpenObserve (POST create / PUT update / DELETE retired alerts / recreate alerts whose stream changed)"
  o2c_http:
    base_url: "{{ o2c_endpoint }}"
    headers: "{{ o2c_auth_headers }}"
    requests: "{{ o2c_plan_actions | o2c_as_requests(method_key='method', body_key='body', label='{op} {kind} {name}') }}"
    status_code: [200, 201]
    timeout: 30
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  changed_when: o2c_plan_actions | length > 0   # 쓰기는 계획된 순서대로 하나씩 보내고 앞 요청이 실패하면 멈춘다
  no_log: true
  when: not ansible_check_mode

# ------------------------------------------------------------------------------
# 알림 검증 단계 (Spec #184 / Ticket-1) — 반영 직후 매번. check 모드에서는 요청을 보내지 않는다.
# ① SQL 논리: 합성 레코드 주입 → 스트림명만 바꾼 알림 SQL 검색 → 기대 행과 비교
# ② 평가 오류: alerts/history 최근 평가가 error인 알림이 있으면 실패
# ------------------------------------------------------------------------------
- name: "[O2C-030] Plan the alert verification (synthetic records and rewritten searches)"
  vars:
    _start_us: "{{ ((now().timestamp() - 300) * 1000000) | int }}"   # now(utc=true)는 naive라 .timestamp()가 현지 시각으로 해석한다
    _run_id: "{{ now(utc=true).timestamp() | int }}"
  ansible.builtin.set_fact:
    o2c_verify: >-
      {{ o2c_alerts_active | o2c_verify_plan(o2c_alert_fixtures, o2c_org, o2c_verify_stream_suffix, _run_id, _start_us | int, sources=o2c_normal_sources, rosters=o2c_rosters) }}
    o2c_verify_auth_headers:
      Authorization: "Basic {{ (o2c_org ~ ':' ~ (o2c_kv.controller_ingest_token | default(''))) | b64encode }}"
    cacheable: false   # credentials never go to the fact cache
  no_log: true
  when: not ansible_check_mode

- name: "[O2C-032] Inject the synthetic records into the verification streams"
  o2c_http:
    base_url: "{{ o2c_endpoint }}"
    headers: "{{ o2c_verify_auth_headers }}"
    requests: "{{ o2c_verify.ingest | o2c_as_requests(default_method='POST', body_key='records', label='{stream}') }}"
    status_code: [200, 201]
    timeout: 30
    parallel: true   # 서로 다른 검증 스트림이라 순서가 의미 없다
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  changed_when: false   # 검증 전용 스트림에만 쓰며 운영 상태를 바꾸지 않는다
  no_log: true
  when: not ansible_check_mode

- name: "[O2C-033] Run each alert SQL against its verification stream and compare with the expected rows"
  o2c_http:
    base_url: "{{ o2c_endpoint }}"
    headers: "{{ o2c_auth_headers }}"
    requests: "{{ o2c_verify.searches | o2c_as_requests(default_method='POST', body_key='body', label='{alert}') }}"
    status_code: [200]
    fail_on_status: false   # 상태 코드는 아래에서 알림 이름과 함께 한 번에 보고한다
    timeout: 30
    parallel: true
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  register: _o2c_verify_search
  # 수집 직후에는 검색에 안 보일 수 있어 전체를 다시 보낸다(검색은 빠르다). 일치하지 않는 알림이 없을 때까지 기다린다.
  until: (_o2c_verify_search.results | o2c_verify_pending) | length == 0
  retries: "{{ o2c_verify_retries }}"
  delay: "{{ o2c_verify_delay }}"
  failed_when: false   # 불일치는 아래에서 알림·케이스 이름과 함께 한 번에 보고한다
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: "[O2C-034] Fail when an alert did not fire (or fired) as the fixtures expect"
  vars:
    _hits: "{{ item.json.hits | default([]) if (item.json is defined and item.status | default(0) == 200) else [] }}"
    _failed: "{{ _hits | o2c_verify_failures(item.item) }}"
    _known: "{{ _hits | o2c_verify_known(item.item) }}"
    _error: "{{ ['알림 %s: 검증 검색 요청이 실패했습니다 (HTTP %s)' % (item.item.alert, item.status | default('연결 실패'))] if item.status | default(0) != 200 else [] }}"
  ansible.builtin.debug:
    msg: "{{ (_error + _failed + _known) if (_error + _failed + _known) | length > 0 else ['알림 ' ~ item.item.alert ~ ': 검증 통과'] }}"
  loop: "{{ _o2c_verify_search.results }}"
  loop_control:
    label: "{{ item.item.alert }}"
  failed_when: (_error + _failed) | length > 0
  changed_when: false
  when: not ansible_check_mode

- name: "[O2C-035] Read the recent alert evaluation history"
  ansible.builtin.uri:
    url: "{{ o2c_endpoint }}/api/v2/{{ o2c_org }}/alerts/history"
    method: GET
    headers: "{{ o2c_auth_headers }}"
    status_code: 200
    timeout: 15
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  register: _o2c_history
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: "[O2C-036] Fail when the latest evaluation of a managed alert ended in error"
  vars:
    _errored: "{{ _o2c_history.json | o2c_alert_history_errors(o2c_alerts_active | map(attribute='name') | list) }}"
  ansible.builtin.assert:
    that: _errored | length == 0
    fail_msg: "최근 평가가 오류인 알림이 있습니다(필드 없음 등): {{ _errored | join(', ') }}"
    quiet: true
  when: not ansible_check_mode

# ------------------------------------------------------------------------------
# 통지 경로 자가 시험 (Spec #184 / Ticket-2) — o2c_verify_notify=true일 때만, check 모드에서는 하지 않는다.
# 상설 자가 시험 알림(infra-alert-selftest)이 보는 검증 전용 스트림에 레코드 1건을 넣어 네이버웍스 [TEST] 통지를 일으킨다.
# ------------------------------------------------------------------------------
- name: "[O2C-037] Inject one self-test record so the standing self-test alert notifies (only with o2c_verify_notify=true)"
  ansible.builtin.uri:
    url: "{{ o2c_endpoint }}/api/{{ o2c_org }}/{{ o2c_selftest_stream }}/_json"
    method: POST
    headers: "{{ o2c_verify_auth_headers }}"
    body_format: json
    body:
      - host_name: "selftest-{{ now(utc=true).timestamp() | int }}"
        message: "[TEST] notification path self-test"
    status_code: [200, 201]
    timeout: 30
    validate_certs: "{{ o2c_validate_certs | bool }}"
    ca_path: "{{ o2c_ca_file if o2c_ca_file | length > 0 else omit }}"
  changed_when: false   # 검증 전용 스트림에만 쓰며 운영 상태를 바꾸지 않는다
  no_log: true
  when:
    - not ansible_check_mode
    - o2c_verify_notify | bool
