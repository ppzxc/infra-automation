---
# Host Audit (ADR-0009) — 사용자가 덮어쓸 수 있는 기본값.

# 실행 종류: scheduled(Host Audit — Monthly, Audit Baseline이 됨) | on_demand(수시).
# Semaphore 템플릿에 고정한다.
host_audit_run_kind: on_demand

# 호스트별 원본 JSON과 보고서 HTML을 남길 러너 로컬 디렉터리의 상위 경로.
# 실행마다 <root>/<run_id>/ 아래에 hosts/<Inventory Hostname>.json, run.json, report.html을 만든다.
host_audit_output_root: "{{ lookup('ansible.builtin.env', 'HOST_AUDIT_OUTPUT_ROOT') | default('/tmp/host_audit', true) }}"

# 점검 대상 그룹. target_hosts를 주면 이 집합과의 교집합만 점검한다.
host_audit_scope_pattern: "servers:loadbalancers:overseer"

# 보고서 시각 표기 시간대.
host_audit_timezone: Asia/Seoul

# Asset Inventory 선언 값 (#120). 호스트에서 수집할 수 없는 값은 host_vars/<Inventory Hostname>.yml에
# 선언한다. 사람 이름이 아니라 직책을 적는다. 비어 있는 키는 보고서에 '미지정'으로 나온다.
#   host_audit_asset:
#     purpose: "웹 서비스"            # 용도
#     department: "인프라팀"          # 관리 부서
#     owner_role: "인프라팀장"        # 책임자(직책)
#     admin_role: "시스템 관리자"     # 관리자(직책)
#     security_grade: "2등급"         # 보안등급
host_audit_asset: {}

# 특수권한(uid 0, wheel·sudo·admin 그룹, sudoers 규칙) 선언 허용 목록에 더할 이름.
# 기본 허용 목록은 common의 accounts 중 sudo 권한 계정(sudo: true, 또는 sudo 미지정 + tier admin,
# state absent 제외)과 access_security의 openbao_ssh_allowed_principals이며 root는 항상 허용한다.
# 허용 목록에 없는 특수권한자는 보고서에 '선언 외'로 나온다.
host_audit_privileged_extra: []

# --- Package Vulnerability (#123) -------------------------------------------------------------
# 설치 패키지 목록을 읽어 러너에서 Trivy(SBOM 입력)로 판정한다. false면 수집·판정을 모두 건너뛴다.
host_audit_packages_enabled: true

# 러너의 Trivy 바이너리·취약점 DB 캐시. 실행 사이에 남아 있어야 DB 갱신 실패 시 캐시(7일)로 진행할 수 있다.
host_audit_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-audit"

# DB 갱신이 실패했을 때 허용하는 캐시 DB의 최대 나이(일, DB UpdatedAt 기준). 넘으면 섹션 전체가 점검불가.
host_audit_trivy_db_max_age_days: 7

# 취약점 DB 저장소. 비우면 Trivy 기본값(mirror.gcr.io/aquasec/trivy-db:2). 사내 미러를 쓸 때만 지정한다.
host_audit_trivy_db_repository: ""

# 보고서 '긴급·높음 상세' 표의 최대 행 수. 나머지는 러너의 package_vulnerability.json에만 남는다.
host_audit_package_detail_limit: 300

# DB 갱신 최대 시간(초). 넘으면 갱신 실패로 보고 캐시 규칙을 적용한다(저장소에 닿지 않을 때 Trivy가 오래 재시도함).
host_audit_trivy_db_timeout: 300
