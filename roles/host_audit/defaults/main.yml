---
# Host Audit (ADR-0009) — 사용자가 덮어쓸 수 있는 기본값.

# 실행 종류: scheduled(Host Audit — Monthly, Audit Baseline이 됨) | on_demand(수시).
# Semaphore 템플릿에 고정한다.
host_audit_run_kind: on_demand

# 호스트별 원본 JSON과 보고서 HTML을 남길 러너 로컬 디렉터리의 상위 경로.
# 실행마다 <root>/<run_id>/ 아래에 hosts/<Inventory Hostname>.json, run.json, report.html을 만든다.
host_audit_output_root: "{{ lookup('ansible.builtin.env', 'HOST_AUDIT_OUTPUT_ROOT') | default('/tmp/host_audit', true) }}"

# 점검 대상 그룹. target_hosts를 주면 이 집합과의 교집합만 점검한다.
host_audit_scope_pattern: "servers:loadbalancers:overseer"

# 보고서 시각 표기 시간대.
host_audit_timezone: Asia/Seoul

# Asset Inventory 선언 값 (#120). 호스트에서 수집할 수 없는 값은 host_vars/<Inventory Hostname>.yml에
# 선언한다. 사람 이름이 아니라 직책을 적는다. 비어 있는 키는 보고서에 '미지정'으로 나온다.
#   host_audit_asset:
#     purpose: "웹 서비스"            # 용도
#     department: "인프라팀"          # 관리 부서
#     owner_role: "인프라팀장"        # 책임자(직책)
#     admin_role: "시스템 관리자"     # 관리자(직책)
#     security_grade: "2등급"         # 보안등급
host_audit_asset: {}

# 특수권한(uid 0, wheel·sudo·admin 그룹, sudoers 규칙) 선언 허용 목록에 더할 이름.
# 기본 허용 목록은 common의 accounts 중 sudo 권한 계정(sudo: true, 또는 sudo 미지정 + tier admin,
# state absent 제외)과 access_security의 openbao_ssh_allowed_principals이며 root는 항상 허용한다.
# 허용 목록에 없는 특수권한자는 보고서에 '선언 외'로 나온다.
host_audit_privileged_extra: []

# --- Package Vulnerability (#123) -------------------------------------------------------------
# 설치 패키지 목록을 읽어 러너에서 Trivy(SBOM 입력)로 판정한다. false면 수집·판정을 모두 건너뛴다.
host_audit_packages_enabled: true

# 러너의 Trivy 바이너리·취약점 DB 캐시. 실행 사이에 남아 있어야 DB 갱신 실패 시 캐시(7일)로 진행할 수 있다.
host_audit_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-audit"

# DB 갱신이 실패했을 때 허용하는 캐시 DB의 최대 나이(일, DB UpdatedAt 기준). 넘으면 섹션 전체가 점검불가.
host_audit_trivy_db_max_age_days: 7

# 취약점 DB 저장소. 비우면 Trivy 기본값(mirror.gcr.io/aquasec/trivy-db:2). 사내 미러를 쓸 때만 지정한다.
host_audit_trivy_db_repository: ""

# 보고서 '긴급·높음 상세' 표의 최대 행 수. 나머지는 러너의 package_vulnerability.json에만 남는다.
host_audit_package_detail_limit: 300

# DB 갱신 최대 시간(초). 넘으면 갱신 실패로 보고 캐시 규칙을 적용한다(저장소에 닿지 않을 때 Trivy가 오래 재시도함).
host_audit_trivy_db_timeout: 300

# Configuration Vulnerability 예외 레지스터 (KISA-2026, ADR-0009 §3, #121).
# 조치할 수 없는 취약 항목의 사유·위험성·보완대책·승인 이력(ISMS 2.11.2)을 Git에 남긴다.
# 승인자(approver)와 승인일(approved_on)이 있고 만료일(expires_on)이 실행일 이후인 항목만
# 적용되어 판정이 '예외(승인)'가 된다. 만료되면 '취약'으로 되돌아오고, 승인 전 항목은
# 판정을 바꾸지 않고 보고서에 '승인 대기'로만 나온다. 승인자는 이름이 아니라 직책으로 적는다.
#   code: KISA-2026:U-NN (판 포함)   hosts / groups: 적용 범위(둘 다 비우면 전체)
#   reason · risk · mitigation: 사유 · 위험성 · 보완대책   approved_on / expires_on: YYYY-MM-DD
host_audit_kisa_exceptions:
  - code: "KISA-2026:U-28"
    groups: [servers, loadbalancers]
    reason: >-
      Docker(docker_engine)가 컨테이너 게시 포트를 위해 iptables/nftables 규칙(DOCKER 체인)을
      직접 관리하므로, 그 구간은 firewalld의 접속 IP 제한만으로 판정할 수 없다.
    risk: >-
      컨테이너가 게시한 포트가 firewalld 허용 IP 제한 밖에서 접근될 수 있다.
    mitigation: >-
      컨테이너 포트는 필요한 것만 게시하고, Docker 구간의 허용 규칙은 정기 점검 때 수동으로 확인한다.
    approver: ""
    approved_on: ""
    expires_on: ""

# --- 보관과 Audit Baseline (#125, ADR-0009 §5) -----------------------------------------------------
# 실행마다 보고서·호스트별 JSON·실행 메타를 RustFS Host Audit 전용 버킷의 <YYYY-MM>/<run_id>/에 올리고,
# 직전 정기 실행(Audit Baseline)과 비교해 발견을 신규·지속·재발·해소로 표시한다.
# false면 러너 로컬에만 남기고 비교도 하지 않는다(로컬 시험용). 운영 템플릿은 true로 둔다.
host_audit_storage_enabled: true

# 버킷 이름 기본값. OpenBao agents/host_audit.storage_bucket이 있으면 그 값이 우선한다.
host_audit_storage_bucket: host-audit

# 보관 대상을 직접 지정할 때만 쓴다(OpenBao 조회를 건너뜀). 키를 Git에 넣지 말고 Extra variables로 준다.
#   {"endpoint": "https://rustfs.example:9000", "bucket": "host-audit", "access_key": "...", "secret_key": "...", "region": "us-east-1"}
host_audit_storage: {}

# RustFS TLS 검증과 사설 CA 파일(러너 경로). 비우면 시스템 CA를 쓴다.
host_audit_storage_validate_certs: true
host_audit_storage_ca_file: ""

# S3 요청 하나의 최대 시간(초).
host_audit_storage_timeout: 60
# --- Configuration Drift (#124) ---------------------------------------------------------------
# 러너가 site.yml과 host_agents.yml(--tags agents_config)을 --check --diff로 하위 실행해, Git 선언과
# 다른(바뀔) 태스크를 호스트별 SPEC-ID 행으로 싣는다. false면 하위 실행을 건너뛴다.
host_audit_drift_enabled: true

# 하위 실행이 선언 상태를 갖는 대상(감사 대상과의 교집합). site.yml은 servers·loadbalancers,
# Host Agents는 servers에서 Host Agents Exclusion을 뺀 집합이다(각 플레이북의 기본 대상과 같다).
host_audit_drift_site_pattern: "servers:loadbalancers"
host_audit_drift_agents_pattern: "servers:!host_agents_excluded"

# 하위 실행 하나의 최대 시간(초). 넘으면 그 하위 실행 부분만 점검불가로 표시하고 실행은 계속한다.
host_audit_drift_timeout: 3600

# 하위 실행에 그대로 넘길 실행 변수(site.yml을 평소 실행할 때 템플릿에 주는 비밀 아닌 값).
# 아래 이름은 이번 실행에 정의돼 있으면 자동으로 넘긴다. 비밀값은 여기 두지 않는다
# (OpenBao 자격증명은 하위 프로세스 환경 변수로만 넘긴다).
host_audit_drift_forward_vars:
  - bootstrap_user
  - target_admin_users
host_audit_drift_extra_vars: {}

# check 모드 노이즈 제외 표식. 정상(수렴된) 호스트에서도 --check에서 매번 changed로 나오는 태스크는
# 고치는 것이 원칙이고, 고칠 수 없을 때만 여기에 사유와 함께 올린다. 일치하는 행은 Drift에서 빠지고
# 보고서에 '제외'로 사유와 건수가 남는다.   spec_id: "COMMON-001"  또는  task: "<SPEC-ID 없는 태스크 이름>"
host_audit_drift_ignore: []

# --- 메일 발송 (#126, ADR-0009 §6) ------------------------------------------------------------------
# 보관이 끝난 보고서를 Google Workspace SMTP relay로 보낸다(IP 인증, 자격증명 없음, STARTTLS 필수).
# false면 보내지 않는다(로컬 시험용). 운영 템플릿은 true로 둔다.
host_audit_mail_enabled: true

# 수신자·발신자는 개인정보다 — Git에 넣지 않는다. 기본은 OpenBao agents/host_audit의
# mail_to(목록 또는 쉼표 구분 문자열)·mail_from이고, 아래 Extra variables가 있으면 그 값이 우선한다.
# 수신자마다 따로 보낸다 — 받는 사람은 다른 수신자의 주소를 보지 않는다.
host_audit_mail_to: []
host_audit_mail_from: ""

# SMTP relay. 운영값은 바꾸지 않는다 — 시험용 SMTP(mailpit 등)를 쓸 때만 Extra variables로 덮어쓴다.
host_audit_mail_host: smtp-relay.gmail.com
host_audit_mail_port: 587
# community.general.mail secure: starttls(운영 — STARTTLS를 못 하면 보내지 않음) | never(시험용 평문)
host_audit_mail_secure: starttls
# EHLO 이름. Workspace relay 설정이 HELO 도메인을 요구하면 그 이름을 넣는다. 비우면 러너 호스트명.
host_audit_mail_ehlohost: ""
host_audit_mail_timeout: 30

# 재발송 (playbooks/host_audit_resend.yml): 보관된 실행 ID. 기본 실행 ID(ha-<UTC 시작 시각>)가 아니면
# host_audit_resend_month(YYYY-MM, 보고서 시간대 기준 실행 시작 월)를 함께 준다.
host_audit_resend_run_id: ""
host_audit_resend_month: ""
