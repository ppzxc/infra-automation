---
# Host Audit (ADR-0009) — 사용자가 덮어쓸 수 있는 기본값.

# 실행 종류: scheduled(Host Audit — Monthly, Audit Baseline이 됨) | on_demand(수시).
# Semaphore 템플릿에 고정한다.
host_audit_run_kind: on_demand

# 호스트별 원본 JSON과 보고서 HTML을 남길 러너 로컬 디렉터리의 상위 경로.
# 실행마다 <root>/<run_id>/ 아래에 hosts/<Inventory Hostname>.json, run.json, report.html을 만든다.
host_audit_output_root: "{{ lookup('ansible.builtin.env', 'HOST_AUDIT_OUTPUT_ROOT') | default('/tmp/host_audit', true) }}"

# 점검 대상 그룹. target_hosts를 주면 이 집합과의 교집합만 점검한다.
# Semaphore 인벤토리의 host_audit_excluded 그룹(러너에서 접속할 수 없는 호스트 등)은 뺀다.
host_audit_scope_pattern: "servers:loadbalancers:overseer:!host_audit_excluded"

# 스위치 단계(Spec #568): cisco_switches 전체를 KISA-2026 N 항목으로 점검한다. 서버 선택(host_audit_scope_pattern)과 별도로 고르며,
# target_hosts를 주면 그 패턴과의 교집합만 점검한다. false면 스위치 단계를 건너뛴다(롤백).
host_audit_switch_enabled: true
host_audit_switch_scope_pattern: cisco_switches

# 보고서 시각 표기 시간대.
host_audit_timezone: Asia/Seoul

# 점검 기록의 환경(declared.environment, 리소스 속성 deployment.environment.name과 같은 값). 모든 호스트가 같은 값이라
# 인벤토리 변수가 아니라 역할 기본값이다(Spec #511 §3). production|staging|development|test.
# 값은 한 곳, playbooks/group_vars/all.yml의 deployment_environment다(Host Agents와 같은 환경을 말해야 한다).
host_audit_environment: "{{ deployment_environment }}"

# 특수권한(uid 0, wheel·sudo·admin 그룹, sudoers 규칙) 선언 허용 목록에 더할 이름.
# 기본 허용 목록은 common의 accounts 중 sudo 권한 계정(sudo: true, 또는 sudo 미지정 + tier admin,
# state absent 제외)과 access_security의 openbao_ssh_allowed_principals이며 root는 항상 허용한다.
# 허용 목록에 없는 특수권한자는 보고서에 '선언 외'로 나온다.
host_audit_privileged_extra: []

# --- Package Vulnerability (#123) -------------------------------------------------------------
# 설치 패키지 목록을 읽어 러너에서 Trivy(SBOM 입력)로 판정한다. false면 수집·판정을 모두 건너뛴다.
host_audit_packages_enabled: true

# 러너의 Trivy 바이너리·취약점 DB 캐시. 실행 사이에 남아 있어야 DB 갱신 실패 시 캐시(7일)로 진행할 수 있다.
host_audit_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.cache/host-audit"

# DB 갱신이 실패했을 때 허용하는 캐시 DB의 최대 나이(일, DB UpdatedAt 기준). 넘으면 섹션 전체가 점검불가.
host_audit_trivy_db_max_age_days: 7

# 취약점 DB 저장소. 비우면 Trivy 기본값(mirror.gcr.io/aquasec/trivy-db:2). 사내 미러를 쓸 때만 지정한다.
host_audit_trivy_db_repository: ""

# 보고서 '긴급·높음 상세' 표의 최대 행 수. 나머지는 러너의 package_vulnerability.json에만 남는다.
host_audit_package_detail_limit: 300

# DB 갱신 최대 시간(초). 넘으면 갱신 실패로 보고 캐시 규칙을 적용한다(저장소에 닿지 않을 때 Trivy가 오래 재시도함).
host_audit_trivy_db_timeout: 300

# Configuration Vulnerability 예외 레지스터 (KISA-2026, ADR-0009 §3, #121).
# 조치할 수 없는 취약 항목의 사유·위험성·보완대책·승인 이력(ISMS 2.11.2)을 Git에 남긴다.
# 승인자(approver)와 승인일(approved_on)이 있고 만료일(expires_on)이 실행일 이후인 항목만
# 적용되어 판정이 '예외(승인)'가 된다. 만료되면 '취약'으로 되돌아오고, 승인 전 항목은
# 판정을 바꾸지 않고 보고서에 '승인 대기'로만 나온다. 승인자는 이름이 아니라 직책으로 적는다.
#   code: KISA-2026:U-NN (판 포함)   hosts / groups: 적용 범위(둘 다 비우면 전체)
#   reason · risk · mitigation: 사유 · 위험성 · 보완대책   approved_on / expires_on: YYYY-MM-DD
host_audit_kisa_exceptions:
  - code: "KISA-2026:U-28"
    groups: [servers, loadbalancers]
    reason: >-
      Docker(docker_engine)가 컨테이너 게시 포트를 위해 iptables/nftables 규칙(DOCKER 체인)을
      직접 관리하므로, 그 구간은 firewalld의 접속 IP 제한만으로 판정할 수 없다.
    risk: >-
      컨테이너가 게시한 포트가 firewalld 허용 IP 제한 밖에서 접근될 수 있다.
    mitigation: >-
      컨테이너 포트는 필요한 것만 게시하고, Docker 구간의 허용 규칙은 정기 점검 때 수동으로 확인한다.
    approver: ""
    approved_on: ""
    expires_on: ""

# file capability 배포판 기본 목록 (#432, KISA-2026:U-23 옆의 증적). 항목은 "<경로> <capability 이름>" 한 줄이다.
# getcap 결과 중 이 목록과 경로·capability 이름 집합이 같은 파일은 '기본'이고, 그 밖의 파일만 '검토'로 표시된다.
# - capability 이름은 쉼표로 잇고 순서는 상관없다(cap_net_admin,cap_net_raw 와 cap_net_raw,cap_net_admin 은 같다).
# - 배포판마다 같은 경로의 capability 조합이 다를 수 있으면 같은 경로 줄을 여러 개 둔다(아래 ping).
# - 플래그(=ep, +p)와 옛 libcap의 ' = ' 표기는 비교하지 않는다. 경로에 공백이 있어도 되지만 " cap_"은 안 된다.
# - 호스트에 없는 파일의 항목은 getcap에 나오지 않으므로 목록에 남아 있어도 영향이 없다.
# 한계: 이 목록은 배포판 패키지 지식으로 적었고 실제 호스트에서 실측하지 않았다. 처음 돌린 보고서에서 기본인데도
# '검토'로 나온 항목은 호스트에서 확인한 뒤 여기에 줄을 더한다.
host_audit_kisa_capability_defaults:
  - "/usr/bin/ping cap_net_raw"
  - "/usr/bin/ping cap_net_admin,cap_net_raw"
  - "/bin/ping cap_net_raw"
  - "/usr/bin/ping6 cap_net_raw"
  - "/usr/bin/arping cap_net_raw"
  - "/usr/sbin/arping cap_net_raw"
  - "/usr/sbin/clockdiff cap_net_raw"
  - "/usr/bin/clockdiff cap_net_raw"
  - "/usr/bin/tracepath cap_net_raw"
  - "/usr/bin/traceroute6.iputils cap_net_raw"
  - "/usr/bin/mtr-packet cap_net_raw"
  - "/usr/sbin/mtr-packet cap_net_raw"
  - "/usr/bin/newuidmap cap_setuid"
  - "/usr/bin/newgidmap cap_setgid"
  - "/usr/sbin/newuidmap cap_setuid"
  - "/usr/sbin/newgidmap cap_setgid"
  - "/usr/bin/gnome-keyring-daemon cap_ipc_lock"
  - "/usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-ptp-helper cap_net_bind_service,cap_net_admin,cap_sys_nice"
  - "/usr/lib64/gstreamer-1.0/gst-ptp-helper cap_net_bind_service,cap_net_admin,cap_sys_nice"
  - "/usr/libexec/gstreamer-1.0/gst-ptp-helper cap_net_bind_service,cap_net_admin,cap_sys_nice"

# --- 보관과 Audit Baseline (#125, ADR-0009 §5) -----------------------------------------------------
# 실행마다 보고서·호스트별 JSON·실행 메타를 RustFS Host Audit 전용 버킷의 <YYYY-MM>/<run_id>/에 올리고,
# 직전 정기 실행(Audit Baseline)과 비교해 발견을 신규·지속·재발·해소로 표시한다.
# false면 러너 로컬에만 남기고 비교도 하지 않는다(로컬 시험용). 운영 템플릿은 true로 둔다.
host_audit_storage_enabled: true

# 버킷 이름(공개해도 되는 값). 주소·리전은 inventory/services/rustfs, 쓰기 키는 secrets/services/rustfs/audit_reports에서 읽는다.
# 주소·키를 실행 변수로 덮어쓰는 길은 없다(버킷 이름만 이 기본값이고, 키 정책이 host-audit 버킷으로 범위가 정해져 있다).
host_audit_storage_bucket: host-audit

# RustFS TLS 검증과 사설 CA 파일(러너 경로). 비우면 시스템 CA를 쓴다.
host_audit_storage_validate_certs: true
host_audit_storage_ca_file: ""

# S3 요청 하나의 최대 시간(초).
host_audit_storage_timeout: 60
# --- KISA 월간 악화 알림 (Spec #322 / Ticket-9, #331) -----------------------------------------------
# 정기 실행에서 지난 정기 점검(Audit Baseline)에 취약이 아니던 KISA 항목이 이번에 취약이면 사내 알림 webhook(text/plain)으로 한 번 알린다.
# 비교는 항목 단위이고 지난 결과가 없는 호스트는 알리지 않는다. 수시 실행·check 모드는 알리지 않는다. false면 알리지 않는다.
host_audit_kisa_alert_enabled: true

# webhook 주소는 secrets/services/alert/notify의 url(text/plain)이고 인증은 선택 token·auth_header다. 실행 변수로 덮어쓰는 길은 없다.
host_audit_alert_validate_certs: true
# --- Configuration Drift (#124) ---------------------------------------------------------------
# 러너가 site.yml과 host_agents.yml(--tags agents_config)을 --check --diff로 하위 실행해, Git 선언과
# 다른(바뀔) 태스크를 호스트별 SPEC-ID 행으로 싣는다. false면 하위 실행을 건너뛴다.
host_audit_drift_enabled: true

# 하위 실행이 선언 상태를 갖는 대상(감사 대상과의 교집합). site.yml은 servers·loadbalancers,
# Host Agents는 servers에서 Host Agents Exclusion을 뺀 집합이다(각 플레이북의 기본 대상과 같다).
host_audit_drift_site_pattern: "servers:loadbalancers"
host_audit_drift_agents_pattern: "servers:!host_agents_excluded"

# 하위 실행 하나의 최대 시간(초). 넘으면 그 하위 실행 부분만 점검불가로 표시하고 실행은 계속한다.
host_audit_drift_timeout: 3600

# 하위 실행에 그대로 넘길 실행 변수(site.yml을 평소 실행할 때 템플릿에 주는 비밀 아닌 값).
# 아래 이름은 이번 실행에 정의돼 있으면 자동으로 넘긴다. 비밀값은 여기 두지 않는다
# (OpenBao 자격증명은 하위 프로세스 환경 변수로만 넘긴다). 계정 입력은 저장된 사실(Asset 문서의 access 절)이 되었고,
# 실행 변수로 남은 것은 이번 실행에서만 지울 계정(target_removed_users)뿐이다.
host_audit_drift_forward_vars:
  - target_removed_users
host_audit_drift_extra_vars: {}

# check 모드 노이즈 제외 표식. 정상(수렴된) 호스트에서도 --check에서 매번 changed로 나오는 태스크는
# 고치는 것이 원칙이고, 고칠 수 없을 때만 여기에 사유와 함께 올린다. 일치하는 행은 Drift에서 빠지고
# 보고서에 '제외'로 사유와 건수가 남는다.   spec_id: "COMMON-001"  또는  task: "<SPEC-ID 없는 태스크 이름>"
host_audit_drift_ignore: []

# --- 메일 발송 (#126, ADR-0009 §6) ------------------------------------------------------------------
# 보관이 끝난 보고서를 Google Workspace SMTP relay로 보낸다(IP 인증, 자격증명 없음, STARTTLS 필수).
# false면 보내지 않는다(로컬 시험용). 운영 템플릿은 true로 둔다.
host_audit_mail_enabled: true

# 수신자·발신자·표시 이름은 개인정보다 — Git에 넣지 않고 OpenBao inventory/config/host_audit의
# mail_recipients·mail_sender·mail_sender_display_name에서 읽는다. 실행 변수(Extra variables)로 덮어쓰는 길은 없다.
# 수신자마다 따로 보낸다 — 받는 사람은 다른 수신자의 주소를 보지 않는다.
# 표시 이름은 선택이다(없으면 주소만 보낸다). 헤더에만 반영하며 릴레이가 보는 봉투 발신자는 주소 그대로다.

# SMTP relay. 운영값은 바꾸지 않는다 — 시험용 SMTP(mailpit 등)를 쓸 때만 Extra variables로 덮어쓴다.
host_audit_mail_host: smtp-relay.gmail.com
host_audit_mail_port: 587
# community.general.mail secure: starttls(운영 — STARTTLS를 못 하면 보내지 않음) | never(시험용 평문)
host_audit_mail_secure: starttls
# EHLO 이름. Workspace relay 설정이 HELO 도메인을 요구하면 그 이름을 넣는다. 비우면 러너 호스트명.
host_audit_mail_ehlohost: ""
host_audit_mail_timeout: 30

# 재발송 (playbooks/host_audit_resend.yml): 보관된 실행 ID. 기본 실행 ID(ha-<UTC 시작 시각>)가 아니면
# host_audit_resend_month(YYYY-MM, 보고서 시간대 기준 실행 시작 월)를 함께 준다.
host_audit_resend_run_id: ""
host_audit_resend_month: ""

# Log Review Report 서명본 등록 (playbooks/host_audit_log_review_sign.yml, Spec #544 / Ticket-9 #564).
# Semaphore는 파일을 받지 못하므로(#556) 운영자가 러너의 접수 폴더에 <실행 ID>.pdf를 두고, 템플릿에는 실행 ID와 SHA-256만 준다.
# 접수 폴더는 러너 컨테이너에서 보여야 한다(바인드 마운트는 운영자 작업, docs/host_audit.md §18.3).
# 기본값은 출력 상위 경로 아래 '_signed_intake'다: '_'로 시작해 오래된 실행 디렉터리 정리(AUD-006)의 이름 규칙에 걸리지 않는다.
host_audit_signed_run_id: ""
host_audit_signed_sha256: ""
host_audit_signed_intake_dir: "{{ lookup('ansible.builtin.env', 'HOST_AUDIT_SIGNED_INTAKE_DIR') | default(host_audit_output_root ~ '/_signed_intake', true) }}"
# 받는 서명본 크기 상한(바이트). 스캔본은 보통 수백 KB~수 MB다. 잠금 버킷이라 올린 뒤에는 지울 수 없다.
host_audit_signed_max_bytes: 20971520

# 러너 출력 상위 경로 아래에서 이 일수가 지난 실행 디렉터리는 다음 실행 초기에 지운다(#157).
# 정상 종료한 실행은 끝에서 정책대로 지우므로(cleanup.yml) 이 값은 중간에 죽은 실행의 찌꺼기를 위한 것이다.
host_audit_output_retention_days: 7

# --- Log Review Report (Spec #544 / Ticket-3 #558, ADR-0015) ----------------------------------------
# 정기 실행은 항상 전월 Log Review Report 초안을 만들어 메일 세 번째 첨부로 보내고 같은 보관 경로(log_review/)에 남긴다.
# 수시 실행은 이 값이 true일 때만 만든다(같은 달 결재본이 여러 부 생기지 않게). 운영 수시 템플릿은 false로 둔다.
host_audit_log_review_enabled: false

# OpenObserve 주소·조직은 inventory/services/openobserve, 조회 계정은 secrets/services/openobserve/readonly(조회 전용 용도)에서 읽는다.
# 실행 변수로 덮어쓰는 길은 없다. 오픈소스 빌드는 서버가 조회 전용을 강제하지 못하므로 이 역할은 POST _search만 부른다(#556).
host_audit_log_review_timeout: 120
host_audit_log_review_validate_certs: true

# 3부 수집 공백의 수집 대상. 호스트는 OpenObserve Silent Host와 같은 수집 로스터(servers - host_agents_excluded -
# host_agents_backup_only, filter o2c_roster)이고, 장비는 FortiGate 인벤토리 그룹과 syslog 전송이 확인된 스위치의 관리번호(로그의 device_id)다.
# 스위치 목록은 OpenObserve Config의 수신 중단 감시 대상(o2c_switch_syslog_roster)과 같아야 한다: cisco_switches 그룹 전체를 쓰면
# syslog를 보내지 않는 스위치가 매달 '전월 로그 없음'으로 나온다. 두 값이 같은지는 tests/test_host_audit_log_review_tasks.py가 본다.
host_audit_log_review_collect_hosts: "{{ groups | o2c_roster('collect') }}"
host_audit_log_review_switch_syslog_devices: [ns0250, ns0347]
host_audit_log_review_devices: "{{ (groups['fortigate_firewalls'] | default([])) + host_audit_log_review_switch_syslog_devices }}"

# 1부 계정·시간 항목 1~5(#559)의 판정 기준. 보고서의 판정 기준 칸에 그 달 값이 그대로 찍힌다.
# 업무시간은 평일 start시~end시(정시, 끝 미포함) KST다: 19:59는 업무시간, 20:00은 업무시간 밖.
host_audit_log_review_business_hours: {start: 8, end: 20}
# 2번: 같은 계정·같은 호스트에서 window분 안에 threshold회 이상 실패(분 단위 집계).
host_audit_log_review_failure_threshold: 5
host_audit_log_review_failure_window_minutes: 10
# 연도별 공휴일(대체공휴일·선거일 포함). 점검하는 달의 연도가 없으면 보고서가 '공휴일 목록 없음'이라고 적고 공휴일 없이 판정한다
# (빈 목록 []은 '공휴일 없음'으로 읽는다). 날짜는 따옴표로 둔다(YAML이 date로 읽지 않게). 매년 12월에 다음 해를 더한다.
# 노동절(5/1, 옛 근로자의 날)과 제헌절(7/17)은 2026년부터 공휴일이다(공휴일에 관한 법률 개정, 관공서의 공휴일에 관한 규정 개정;
# 인사혁신처 보도자료 '올해부터 노동절, 제헌절 공휴일로' 2026-04-28, korea.kr). 대체공휴일도 적용된다.
# 2026: 한국천문연구원 월력 자료(astro.kasi.re.kr, 2026-11-18 확인)에 위 두 날(2026-05-01 노동절은 그 자료가 2024년 생성본이라 빠져 있음)을 더했다.
# 2027: 우주항공청 2027년 월력요항(2026-06-29 공표, 관공서 공휴일 24일)과 한국천문연구원 달력자료(astro.kasi.re.kr, 2026-11-19 확인).
#   2027-05-01(토)·07-17(토)의 대체공휴일 05-03·07-19를 포함한다.
host_audit_log_review_holidays:
  "2026": ["2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-03-01", "2026-03-02", "2026-05-01",
           "2026-05-05", "2026-05-24", "2026-05-25", "2026-06-03", "2026-06-06", "2026-07-17", "2026-08-15",
           "2026-08-17", "2026-09-24", "2026-09-25", "2026-09-26", "2026-10-03", "2026-10-05", "2026-10-09",
           "2026-12-25"]
  "2027": ["2027-01-01", "2027-02-06", "2027-02-07", "2027-02-08", "2027-02-09", "2027-03-01", "2027-05-01",
           "2027-05-03", "2027-05-05", "2027-05-13", "2027-06-06", "2027-07-17", "2027-07-19", "2027-08-15",
           "2027-08-16", "2027-09-14", "2027-09-15", "2027-09-16", "2027-10-03", "2027-10-04", "2027-10-09",
           "2027-10-11", "2027-12-25", "2027-12-27"]

# 1부 12번(#560): 같은 계정이 이 시간(초, 경계 포함) 안에 이 개수 이상의 출발지에서 로그인 성공하면 '확인 필요'.
# 정상 출발지·내부 주소 대응·개인정보처리시스템 표시는 OpenBao inventory/config/log_review에서 읽는다(공개 저장소에 두지 않는다).
host_audit_log_review_multi_source_window_seconds: 120
host_audit_log_review_multi_source_min_sources: 2

# 1부 13번(#562): 같은 계정(호스트 무관)이 이 시간(분, 분 단위 집계) 안에 sudo를 이 횟수 이상 실행하면 '확인 필요'.
# sudo 명령만 본다(root 셸 안의 명령·su 뒤 명령은 보지 않는다). Ansible become(BECOME-SUCCESS)은 세지 않는다.
host_audit_log_review_command_burst_threshold: 30
host_audit_log_review_command_burst_window_minutes: 2

# 장비 관리자 로그인(#562)을 1·2·3·4·7·12번에 적용하는 표: {장비 종류: {항목 key: auto|partial}}. 없는 칸은 보고서에
# '점검 불가(파싱 없음)'로 나온다. 근거는 #556 사전 확인(VRL이 무엇을 구조화하는지):
# - FortiGate: 관리자 로그인 계정·출발지·결과(event_outcome, VRL에 없던 기간은 원문 status로 가름)와 설정 변경(cfgpath)이 있다.
# - 스위치: 로그인 실패(SEC_LOGIN-4-LOGIN_FAILED)와 설정 변경(SYS-5-CONFIG_I)의 장비·시각만 있다. 계정·출발지는 원문에만 있고
#   로그인 성공 줄은 수신 사례가 없다. VRL이 계정·출발지를 구조화하면 해당 칸을 더하고 판정 함수를 더한다.
# 장비 관리자 허용 계정은 OpenBao inventory/config/log_review의 device_admin_accounts에서 읽는다(공개 저장소에 두지 않는다).
host_audit_log_review_device_parsing:
  fortigate:
    part1.unauthorized_account: auto
    part1.login_failures: auto
    part1.off_hours_login: auto
    part1.off_hours_privilege: auto
    part1.unauthorized_source: auto
    part1.multi_source_login: auto
  switch:
    part1.login_failures: partial
    part1.off_hours_privilege: partial

# 3부 로그 관리 상태 나머지(#563)의 기준 설정. 시각 동기·백업 대상은 위 수집 로스터(백업 누락 알림과 같은 대상)다.
# - retention_days: 로그 종류(스트림)별 OpenObserve 보존 일수의 저장소 선언(ADR-0006 스트림 표, 서버 전역 365일). 서버의 실제 값은
#   POST _search로 읽을 수 없어 보고서가 '일부 자동'으로 두고 점검자가 화면에서 대조한다. 서버 값을 바꾸면 여기도 바꾼다.
# - personal_info_system: 수집 대상에 개인정보처리시스템이 들어오면 true(접속기록 2년 기준, ADR-0006 security_logs 주석).
# - time_sync_max_offset_ms: 시각 오차 기준(알림 infra-time-offset-exceeded와 같은 1초).
host_audit_log_review_log_management:
  retention_days: {security_logs: 365, system_logs: 365, backup_logs: 365}
  personal_info_system: false
  time_sync_max_offset_ms: 1000

# --- Security Regression (Spec #364 / Ticket-10, #377) ---------------------------------------
# 스펙 #364 기대치의 퇴행 점검. 호스트별 선언 host_audit_regression_expect가 비어 있으면 그 호스트는 대상이 아니다.
# 선언 값(포트·경로·허용 출발지)은 공개 저장소에 두지 않고 Semaphore 인벤토리·Environment로 준다(docs/host_audit.md §16).
host_audit_regression_enabled: true
host_audit_regression_expect: {}
# 백업 호스트 키 정책 항목(EXP-BAK-*, 러너 쪽). true일 때만 판정한다. 스냅샷은 scripts/collect-rustfs-policy.py의 출력 파일(러너 경로).
host_audit_regression_backup_enabled: false
host_audit_backup_policy_file: "{{ role_path }}/../backup/files/host-key-policy.json"
host_audit_rustfs_policy_snapshot_file: "{{ lookup('ansible.builtin.env', 'HOST_AUDIT_RUSTFS_POLICY_SNAPSHOT') | default('', true) }}"
host_audit_backup_policy_prefix: "backup-prod-"

# file capability 탐색에서 들어가지 않을 경로 (#432 최종 리뷰, Spec #433). 컨테이너 이미지 레이어(/var/lib/docker/overlay2 등)는
# 호스트 파일이 아니라 이미지 내용이라, 걸으면 같은 이미지가 호스트마다 검토 항목으로 쏟아져 노이즈가 된다.
# - 항목은 `find -path` 글롭이다(앞은 `/`로 시작). 이 경로 아래는 통째로 건너뛴다(-prune).
# - docker(/var/lib/docker), containerd(/var/lib/containerd), podman·buildah(/var/lib/containers)와 rootless podman(홈 아래 .local/share/containers).
# - capability 목록에만 걸린다. SUID/SGID 판정(U-23 양호·수동)은 이 경로도 그대로 걷는다 — 판정의 의미를 바꾸지 않는다.
# 한계: 컨테이너 안의 capability는 호스트에서 보지 않는다(이미지 점검은 이 점검 범위 밖). 비우면 전부 탐색한다.
host_audit_kisa_capability_exclude_paths:
  - "/var/lib/docker"
  - "/var/lib/containerd"
  - "/var/lib/containers"
  - "/home/*/.local/share/containers"
  - "/root/.local/share/containers"
