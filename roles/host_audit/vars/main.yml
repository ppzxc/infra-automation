# Host Audit (ADR-0009) — 내부 고정 상수.

# OS 지원 종료일(EOL) 정적 표 (#120). 키는 '<os-release ID>-<주 버전>'(Ubuntu는 '<ID>-<VERSION_ID>').
# os-release가 없는 CentOS 6은 /etc/redhat-release에서 'centos-6'을 만든다.
# eol은 무상 표준 지원(보안 업데이트) 종료일이다 — 유상 연장 지원(ELS·ESM)은 반영하지 않는다.
# reviewed_on(기준일)은 보고서 표지에 찍힌다. 표를 고칠 때 함께 갱신한다.
host_audit_eol_table:
  reviewed_on: "2026-10-08"
  source: "Red Hat·Rocky·AlmaLinux 수명주기, CentOS EOL 공지, Ubuntu·Debian 릴리스 주기"
