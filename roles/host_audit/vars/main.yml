---
# Host Audit (ADR-0009) — 내부 고정 상수.

# 보관과 Audit Baseline (#125). 러너 localhost의 보고서 단계에서만 쓰인다.
# check 모드에서는 RustFS 조회·업로드를 하지 않는다.
_host_audit_storage_active: "{{ (host_audit_storage_enabled | bool) and not ansible_check_mode }}"
# 이번 실행의 버킷 내 위치 <YYYY-MM>/<run_id>/ (월은 보고서 시간대 기준 실행 시작 월).
_host_audit_storage_prefix: "{{ host_audit_run | host_audit_storage_prefix(host_audit_run.timezone) }}"

# 호스트별 Remediation Plan xlsx를 묶은 zip (#495). 이름·경로·보관 위치를 한 곳에서 정한다(AUD-026·615·612·614가 같이 쓴다).
_host_audit_xlsx_zip_name: "{{ host_audit_run.run_id | host_audit_remediation_zip_name }}"
_host_audit_xlsx_zip_path: "{{ host_audit_run.output_dir }}/xlsx/{{ _host_audit_xlsx_zip_name }}"
_host_audit_xlsx_zip_archive: >-
  {{ ('RustFS ' ~ (_host_audit_storage_target.bucket | default(host_audit_storage_bucket)) ~ '/' ~ _host_audit_storage_prefix
      ~ 'xlsx/' ~ _host_audit_xlsx_zip_name ~ ' (3년 보관)') if _host_audit_storage_active | bool
     else ('러너 ' ~ _host_audit_xlsx_zip_path ~ ' (보관 안 함)') }}

# Log Review Report (Spec #544 / Ticket-3 #558). 이름·경로·보관 위치를 한 곳에서 정한다(AUD-805·806·612·614와 재발송이 같이 쓴다).
# 이름은 실행 ID에서만 만든다(재발송도 요약의 값이 아니라 이 규칙으로 받는다).
_host_audit_log_review_name: "{{ host_audit_run.run_id | host_audit_log_review_file_name }}"
_host_audit_log_review_path: "{{ host_audit_run.output_dir }}/log_review/{{ _host_audit_log_review_name }}"
_host_audit_log_review_archive: >-
  {{ ('RustFS ' ~ (_host_audit_storage_target.bucket | default(host_audit_storage_bucket)) ~ '/' ~ _host_audit_storage_prefix
      ~ 'log_review/' ~ _host_audit_log_review_name ~ ' (3년 보관)') if _host_audit_storage_active | bool
     else ('러너 ' ~ _host_audit_log_review_path ~ ' (보관 안 함)') }}

# 이 역할이 읽는 OpenBao 문서 패턴과 필수 키(Spec #511 / Ticket-17). 입력 검증(AUD-502·603), 스키마 `required` 대조 테스트,
# 요청 기록 단언이 같은 선언을 쓴다. 읽기는 공용 읽기 지점(lookup 'openbao_doc')뿐이다(docs/openbao_integration.md).
# 접속·Asset 문서(inventory/assets/<호스트>의 description·isms 절)는 resolve_connection이 읽어 `_asset_doc`으로 넘기므로 여기에 없다.
# `inventory/config/host_audit`은 필수 키가 없다: 수신자·발신자가 없으면 읽기 실패가 아니라 메일 문제(AUD-603)로 남는다.
host_audit_openbao_required:
  "inventory/services/rustfs": [url]
  "secrets/services/rustfs/audit_reports": [access_key, secret_key]
  "secrets/services/alert/notify": [url]
  "inventory/config/host_audit": []
  # Log Review Report의 OpenObserve 조회(#558): 주소·조직과 조회 전용 계정. 못 읽으면 항목이 '조회 실패'다(실행은 계속).
  "inventory/services/openobserve": [url]
  "secrets/services/openobserve/readonly": [username, password]

# 읽는 단계별 문서(위 선언의 키를 나눈 것, 합집합이 선언과 같다). 보관 입력은 못 읽으면 보관 문제, 알림은 못 읽어도 보관을 막지 않고,
# 메일 설정은 못 읽으면 메일 문제, Log Review 조회 입력은 못 읽으면 그 보고서의 '조회 실패'다.
host_audit_openbao_storage_docs:
  - inventory/services/rustfs
  - secrets/services/rustfs/audit_reports
host_audit_openbao_alert_doc: secrets/services/alert/notify
host_audit_openbao_mail_doc: inventory/config/host_audit
host_audit_openbao_log_review_docs:
  - inventory/services/openobserve
  - secrets/services/openobserve/readonly

# OS 지원 종료일(EOL) 정적 표 (#120). 키는 '<os-release ID>-<주 버전>'(Ubuntu는 '<ID>-<VERSION_ID>').
# os-release가 없는 CentOS 6은 /etc/redhat-release에서 'centos-6'을 만든다.
# eol은 무상 표준 지원(보안 업데이트) 종료일이다 — 유상 연장 지원(ELS·ESM)은 반영하지 않는다.
# reviewed_on(기준일)은 보고서 표지에 찍힌다. 표를 고칠 때 함께 갱신한다.
host_audit_eol_table:
  reviewed_on: "2026-10-08"
  source: "Red Hat·Rocky·AlmaLinux 수명주기, CentOS EOL 공지, Ubuntu·Debian 릴리스 주기"
  entries:
    - { match: centos-6, name: "CentOS 6", eol: "2020-11-30" }
    - { match: centos-7, name: "CentOS 7", eol: "2024-06-30" }
    - { match: centos-8, name: "CentOS Linux 8", eol: "2021-12-31" }
    - { match: rhel-7, name: "RHEL 7", eol: "2024-06-30" }
    - { match: rhel-8, name: "RHEL 8", eol: "2029-05-31" }
    - { match: rhel-9, name: "RHEL 9", eol: "2032-05-31" }
    - { match: rhel-10, name: "RHEL 10", eol: "2035-05-31" }
    - { match: rocky-8, name: "Rocky Linux 8", eol: "2029-05-31" }
    - { match: rocky-9, name: "Rocky Linux 9", eol: "2032-05-31" }
    - { match: rocky-10, name: "Rocky Linux 10", eol: "2035-05-31" }
    - { match: almalinux-8, name: "AlmaLinux 8", eol: "2029-03-01" }
    - { match: almalinux-9, name: "AlmaLinux 9", eol: "2032-05-31" }
    - { match: almalinux-10, name: "AlmaLinux 10", eol: "2035-05-31" }
    - { match: ubuntu-18.04, name: "Ubuntu 18.04 LTS", eol: "2023-05-31" }
    - { match: ubuntu-20.04, name: "Ubuntu 20.04 LTS", eol: "2025-05-31" }
    - { match: ubuntu-22.04, name: "Ubuntu 22.04 LTS", eol: "2027-06-01" }
    - { match: ubuntu-24.04, name: "Ubuntu 24.04 LTS", eol: "2029-05-31" }
    - { match: debian-10, name: "Debian 10", eol: "2024-06-30" }
    - { match: debian-11, name: "Debian 11", eol: "2026-08-31" }
    - { match: debian-12, name: "Debian 12", eol: "2028-06-30" }
