---
# ==============================================================================
# Host Audit — Log Review Report 전월 서명본 확인 (러너 localhost 전용, Spec #544 / Ticket-9 #564, ADR-0015 §4)
# ==============================================================================
# '전월 서명본'은 직전 정기 실행(Audit Baseline과 같은 고르기, host_audit_baseline_pick)의 보관 경로 signed/에 등록된 서명 스캔본이다.
# 등록 기록 signed/registration.json(등록 템플릿이 PDF를 올린 뒤에 쓰는 완료 표시) 하나만 GET한다. 목록·삭제·쓰기는 없다.
# 포인터 목록은 보관 조회(storage_lookup.yml, AUD-503~504)가 이미 읽은 host_audit_baseline_history를 그대로 쓴다.
# 결과는 _host_audit_log_review_signed(AUD-804 settings.previous_signed_copy)이고 판정은 filter_plugins/host_audit_log_review_signed.py다.
# 조회 실패는 보고서 항목의 '조회 실패'로 남고 실행을 멈추지 않는다.
# ------------------------------------------------------------------------------
- name: "[AUD-850] Pick the previous scheduled run whose signed copy this report checks"
  vars:
    _history: "{{ host_audit_baseline_history | default({}) }}"
  ansible.builtin.set_fact:
    _host_audit_signed_previous: >-
      {{ (_history.pointers | default([]) | host_audit_baseline_pick(host_audit_run))
         if (_history.state | default('')) == 'ok' else none }}

- name: "[AUD-851] Get the signed copy record of the previous scheduled run"
  vars:
    _keys: "{{ _host_audit_signed_previous | host_audit_log_review_signed_keys(host_audit_run.timezone) }}"
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', _keys.record_key) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_signed_record_get
  changed_when: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | default('보관 비활성') | length == 0
    - _host_audit_signed_previous is not none

- name: "[AUD-852] Decide the previous signed copy state of this report"
  vars:
    _response: "{{ _host_audit_signed_record_get if (_host_audit_signed_record_get is not skipped) else none }}"
  ansible.builtin.set_fact:
    _host_audit_log_review_signed: >-
      {{ host_audit_baseline_history | default({}) | host_audit_log_review_signed_lookup(host_audit_run, _response, host_audit_run.timezone) }}
