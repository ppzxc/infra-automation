---
# ==============================================================================
# Host Audit — Log Review Report 서명본 등록 (러너 localhost 전용, Spec #544 / Ticket-9 #564, ADR-0015 §4)
# ==============================================================================
# 결재가 끝난 서명 스캔본(PDF)을 그 보고서를 만든 정기 실행의 보관 경로 <YYYY-MM>/<run_id>/signed/에 올린다.
# Semaphore는 작업 실행 때 파일을 받지 못한다(#556). 운영자가 러너의 접수 폴더(host_audit_signed_intake_dir)에 <실행 ID>.pdf를 두고
# 템플릿에는 실행 ID(host_audit_signed_run_id)와 SHA-256(host_audit_signed_sha256)만 준다. 운영자에게 보관소 키를 주지 않는다:
# 올리는 키는 이 역할이 이미 쓰는 Host Audit 보관 키(Put·Get·List, Delete 없음)다.
#
# 버킷은 GOVERNANCE 3년 잠금이고 키에 Delete가 없어 **잘못 올리면 지울 수 없다.** 그래서 올리기 전에 모두 확인한다:
#   입력 형식(AUD-860) → 파일(AUD-861~863: 일반 파일, 크기, %PDF- 머리, 입력 해시와 일치) → 버킷(AUD-865~868: 정기 실행 포인터,
#   그 실행이 Log Review Report를 보냈음, 아직 등록 기록 없음). 하나라도 어긋나면 아무것도 올리지 않고 멈춘다.
# 올리는 순서: 서명본 PDF(AUD-869, 서버가 x-amz-content-sha256으로 본문 해시를 다시 확인) → 등록 기록 registration.json(AUD-871,
# 등록 완료 표시이고 다음 달 보고서가 이것만 읽는다). 둘 다 성공한 뒤에만 접수 폴더의 파일을 지운다(AUD-872).
# 잠금은 객체마다 헤더로 걸지 않는다: 버킷 기본 보존(GOVERNANCE 1095일)이 다른 보관 파일과 같이 걸린다(docs/host_audit.md §11.5).
# 기록을 쓰지 못하고 끝난 등록은 다시 돌리면 된다: 기록이 없으므로 같은 키로 PDF를 다시 올리고(이전 버전은 잠금으로 남는다) 기록을 쓴다.
# ------------------------------------------------------------------------------
- name: "[AUD-860] Validate the signed copy request (run ID and SHA-256 only)"
  ansible.builtin.set_fact:
    _host_audit_signed_request: >-
      {{ host_audit_signed_run_id | host_audit_log_review_signed_request(host_audit_signed_sha256, host_audit_signed_intake_dir) }}

- name: "[AUD-861] Inspect the signed copy in the intake folder"
  ansible.builtin.stat:
    path: "{{ _host_audit_signed_request.src }}"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
  register: _host_audit_signed_stat

# 러너 로컬 파일의 머리 5바이트만 읽는다(PDF 전체를 변수로 올리지 않는다). check 모드에서도 읽어야 검증 문장이 맞다.
- name: "[AUD-862] Read the first bytes of the signed copy (head, read-only)"
  ansible.builtin.command:
    argv: [head, -c, "5", --, "{{ _host_audit_signed_request.src }}"]
  register: _host_audit_signed_head
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _host_audit_signed_stat.stat.exists | default(false)
    - _host_audit_signed_stat.stat.isreg | default(false)
    - not (_host_audit_signed_stat.stat.islnk | default(false))

- name: "[AUD-863] Assert the signed copy is the PDF the operator named"
  vars:
    _problems: >-
      {{ _host_audit_signed_stat.stat | host_audit_log_review_signed_file_problems(
           _host_audit_signed_head.stdout | default(''), _host_audit_signed_request.sha256, host_audit_signed_max_bytes) }}
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: "서명본 등록 중단(아무것도 올리지 않음, {{ _host_audit_signed_request.src }}): {{ _problems | join('; ') }}"
    quiet: true

- name: Resolve the Host Audit storage key
  ansible.builtin.include_tasks: storage_credentials.yml

- name: "[AUD-864] Assert the Host Audit storage key is available for the signed copy"
  ansible.builtin.assert:
    that:
      - _host_audit_storage_active | bool
      - _host_audit_storage_problem | default('보관 비활성') | length == 0
    fail_msg: >-
      서명본 등록은 Host Audit 버킷에 올려야 한다 —
      {{ ('check 모드 또는 보관 비활성(host_audit_storage_enabled=false)') if not (_host_audit_storage_active | bool)
         else _host_audit_storage_problem }}
    quiet: true

- name: "[AUD-865] Get the scheduled run pointer of the signed report"
  vars:
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', _host_audit_signed_request.pointer_key) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_signed_pointer
  changed_when: false
  no_log: true

# 포인터에서 보관 경로(<YYYY-MM>/<run_id>/)를 정한다. 포인터가 맞지 않으면 prefix가 비어 뒤의 조회를 하지 않는다.
- name: Locate the archived run of the signed report
  ansible.builtin.set_fact:
    _host_audit_signed_where: >-
      {{ _host_audit_signed_request | host_audit_log_review_signed_target(_host_audit_signed_pointer, none, none, host_audit_timezone) }}

- name: "[AUD-866] Get the archived mail summary of the signed report"
  vars:
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', _host_audit_signed_where.prefix ~ 'mail_summary.json') }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_signed_summary
  changed_when: false
  no_log: true
  when: _host_audit_signed_where.prefix | length > 0

- name: "[AUD-867] Get the signed copy record of the run (must not exist yet)"
  vars:
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', _host_audit_signed_where.record_key) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_signed_existing
  changed_when: false
  no_log: true
  when: _host_audit_signed_where.prefix | length > 0

- name: Decide whether the run takes this signed copy
  vars:
    _summary: "{{ _host_audit_signed_summary if _host_audit_signed_summary is not skipped else none }}"
    _existing: "{{ _host_audit_signed_existing if _host_audit_signed_existing is not skipped else none }}"
  ansible.builtin.set_fact:
    _host_audit_signed_target: >-
      {{ _host_audit_signed_request | host_audit_log_review_signed_target(_host_audit_signed_pointer, _summary, _existing, host_audit_timezone) }}

- name: "[AUD-868] Assert the run takes this signed copy"
  ansible.builtin.assert:
    that: _host_audit_signed_target.problems | length == 0
    fail_msg: "서명본 등록 중단(아무것도 올리지 않음, 실행 {{ _host_audit_signed_request.run_id }}): {{ _host_audit_signed_target.problems | join('; ') }}"
    quiet: true

- name: Upload the signed copy and its record
  block:
    - name: "[AUD-869] Upload the signed copy to the run's signed/ (Object Lock bucket)"
      vars:
        _req: >-
          {{ _host_audit_storage_target | host_audit_s3_request('PUT', _host_audit_signed_target.pdf_key, none, _host_audit_signed_request.sha256) }}
      ansible.builtin.uri:
        url: "{{ _req.url }}"
        method: PUT
        src: "{{ _host_audit_signed_request.src }}"
        remote_src: true
        headers: "{{ _req.headers | combine({'Content-Type': 'application/pdf'}) }}"
        status_code: [-1, 200, 400, 403, 404, 409, 500, 503]
        timeout: "{{ host_audit_storage_timeout }}"
        validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
        ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
      register: _host_audit_signed_put
      changed_when: _host_audit_signed_put.status == 200
      no_log: true

    # 기록은 파일로 써서 그 해시로 올린다(서명한 SHA-256과 보낸 바이트가 같아야 한다, AUD-515 포인터와 같은 이유).
    - name: Make a runner-local directory for the signed copy record
      ansible.builtin.tempfile:
        state: directory
        suffix: signed
      register: _host_audit_signed_tmp
      when: _host_audit_signed_put.status == 200

    - name: "[AUD-870] Write the signed copy record on the runner"
      vars:
        _record: >-
          {{ _host_audit_signed_request | host_audit_log_review_signed_record(
               _host_audit_signed_target, _host_audit_signed_stat.stat.size, now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')) }}
      ansible.builtin.copy:
        content: "{{ _record | to_json }}\n"
        dest: "{{ _host_audit_signed_tmp.path }}/registration.json"
        mode: '0600'
      when: _host_audit_signed_put.status == 200

    - name: Compute the SHA-256 of the signed copy record
      ansible.builtin.stat:
        path: "{{ _host_audit_signed_tmp.path }}/registration.json"
        checksum_algorithm: sha256
        get_mime: false
      register: _host_audit_signed_record_stat
      when: _host_audit_signed_put.status == 200

    - name: "[AUD-871] Upload the signed copy record (registration complete)"
      vars:
        _req: >-
          {{ _host_audit_storage_target | host_audit_s3_request('PUT', _host_audit_signed_target.record_key, none,
                                                                  _host_audit_signed_record_stat.stat.checksum) }}
      ansible.builtin.uri:
        url: "{{ _req.url }}"
        method: PUT
        src: "{{ _host_audit_signed_tmp.path }}/registration.json"
        remote_src: true
        headers: "{{ _req.headers | combine({'Content-Type': 'application/json'}) }}"
        status_code: [-1, 200, 400, 403, 404, 409, 500, 503]
        timeout: "{{ host_audit_storage_timeout }}"
        validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
        ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
      register: _host_audit_signed_record_put
      changed_when: _host_audit_signed_record_put.status == 200
      no_log: true
      when: _host_audit_signed_put.status == 200

    - name: "[AUD-872] Remove the registered signed copy from the intake folder"
      ansible.builtin.file:
        path: "{{ _host_audit_signed_request.src }}"
        state: absent
      when:
        - _host_audit_signed_put.status == 200
        - (_host_audit_signed_record_put.status | default(-1)) == 200

    - name: "[AUD-873] Assert the signed copy and its record were kept"
      vars:
        _pdf: "{{ _host_audit_signed_put.status | default(-1) }}"
        _rec: "{{ _host_audit_signed_record_put.status | default(-1) }}"
      ansible.builtin.assert:
        that:
          - _pdf | int == 200
          - _rec | int == 200
        fail_msg: >-
          서명본 등록 실패 — {{ ('서명본 업로드 status=' ~ _pdf ~ '(아무 기록도 남기지 않음, 접수 폴더의 파일은 그대로)') if _pdf | int != 200
             else ('등록 기록 업로드 status=' ~ _rec ~ '(서명본은 올라갔지만 기록이 없어 다음 달 보고서가 "없음"으로 본다. 같은 입력으로 다시 실행한다)') }}
        success_msg: >-
          서명본 등록 완료 — {{ _host_audit_signed_target.pdf_key }} · SHA-256 {{ _host_audit_signed_request.sha256 }}
          · {{ _host_audit_signed_stat.stat.size }}바이트 · 기록 {{ _host_audit_signed_target.record_key }}
  always:
    - name: Remove the runner-local signed copy record
      ansible.builtin.file:
        path: "{{ _host_audit_signed_tmp.path }}"
        state: absent
      when: _host_audit_signed_tmp.path is defined
