---
# ==============================================================================
# Host Audit — 메일 발송 (러너 localhost 전용, ADR-0009 §6, #126)
# ==============================================================================
# 보관이 끝난 보고서를 Google Workspace SMTP relay(smtp-relay.gmail.com:587, STARTTLS 필수,
# IP 인증 — 자격증명 없음)로 보낸다. 본문은 inline CSS 요약(이미지·SVG 없음) + 첨부 SHA-256 +
# 보관 경로, 첨부는 ASCII 파일명의 자체 완결 .html 1개와 합계·호스트별 Remediation Plan xlsx를 묶은 zip 1개다
# (요약에 xlsx_zip이 없는 옛 실행의 재발송은 .html만).
# 수신자·발신자는 OpenBao inventory/config/host_audit(mail_recipients·mail_sender)에서만 읽는다(Extra variables 대체 없음).
# 표시 이름(mail_sender_display_name)은 선택이며 헤더에만 넣는다. 주소는 개인정보라 이 파일의 모든 관련
# 태스크가 no_log이고, 보고서·JSON·실행 메타·로그에 남지 않는다. 수신자마다 따로 보낸다(AUD-606):
# 한 번에 여러 명에게 보내면 일부 거부 시 모듈 경고가 no_log를 무시하고 주소를 찍고, 수신자끼리
# 서로의 주소를 보게 된다.
# 입력(호출자가 정함): host_audit_mail_doc(요약), _host_audit_mail_report_path(첨부할 보고서),
#   _host_audit_mail_xlsx_path(첨부할 xlsx zip, 비우면 보고서만),
#   _host_audit_archive_ok(보관 성공 여부 — false면 보내지 않음).
# 이 파일은 실행을 실패로 끝내지 않는다. 판정은 mail_result.yml(AUD-610)이 보관 판정 뒤에 한다.
# ------------------------------------------------------------------------------
- name: "[AUD-600] Decide whether this run sends the report mail"
  ansible.builtin.set_fact:
    _host_audit_mail_plan:
      send: "{{ _skip | length == 0 }}"
      reason: "{{ _skip }}"
  vars:
    _skip: >-
      {{ '메일 비활성(host_audit_mail_enabled=false)' if not (host_audit_mail_enabled | bool)
         else ('check 모드 실행 — 보내지 않음' if ansible_check_mode
         else ('' if _host_audit_archive_ok | default(false) | bool
         else '원본 보관 실패 — 메일 보내지 않음')) }}

# 공용 읽기 지점으로 토큰을 한 번 받는다(이미 AUD-500이 받아 뒀으면 그 토큰을 쓴다). 못 받아도 여기서 멈추지 않는다: 아래 AUD-603이 문제로 남긴다.
- name: "[AUD-601] Log in to OpenBao once through the shared read point (token for the mail settings)"
  ansible.builtin.set_fact:
    _vault_token: "{{ lookup('openbao_doc', '@token', errors='ignore') | default('', true) }}"
  check_mode: false
  no_log: true
  when:
    - _host_audit_mail_plan.send | bool
    - _vault_token is not defined

# 문서가 없으면(404) {}이고(수신자 없음 문제로 남는다), 403이나 연결 불가는 읽기 실패다(errors='ignore'가 값 없음으로 돌려준다).
- name: "[AUD-602] Read the Host Audit mail settings from OpenBao (inventory/config/host_audit)"
  ansible.builtin.set_fact:
    _host_audit_mail_config: "{{ lookup('openbao_doc', 'inventory/config/host_audit', required=false, errors='ignore') }}"
  check_mode: false
  no_log: true
  when:
    - _host_audit_mail_plan.send | bool
    - _vault_token is defined

# 수신자·발신자·표시 이름은 문서 값뿐이다(mail_recipients·mail_sender·mail_sender_display_name).
# 문제는 키 이름과 건수로만 남긴다 — 주소 값은 어디에도 쓰지 않는다.
- name: "[AUD-603] Resolve the mail recipients and sender"
  vars:
    _config_ok: "{{ _host_audit_mail_config is defined and _host_audit_mail_config is mapping }}"
    _kv: "{{ _host_audit_mail_config if _config_ok | bool else {} }}"
    _to: "{{ _kv.mail_recipients | default([]) | host_audit_mail_recipients }}"
    _from: "{{ _kv.mail_sender | default('') | host_audit_mail_recipients }}"
    _from_addr: "{{ _from.addresses | first | default('') }}"
    _from_name: "{{ _kv.mail_sender_display_name | default('') }}"
    _problems: >-
      {{ (['OpenBao 문서(inventory/config/host_audit)를 읽지 못함(문서 읽기 권한 403, 연결 불가, 인증 정보 없음. 원인은 가려진다)'] if not (_config_ok | bool) else [])
         + (['메일 수신자 없음 — OpenBao inventory/config/host_audit.mail_recipients에 넣는다'] if _to.addresses | length == 0 else [])
         + (['요약에 xlsx zip이 있는데 첨부할 경로가 없음(본문과 첨부가 어긋남)'] if (host_audit_mail_doc.xlsx_zip is defined and host_audit_mail_doc.xlsx_zip
                                                                    and (_host_audit_mail_xlsx_path | default('')) | length == 0) else [])
         + (['첨부할 파일이 없음(보고서 또는 xlsx zip)'] if (not (_host_audit_mail_report_path is file)
                                                  or ((host_audit_mail_doc.xlsx_zip is defined and host_audit_mail_doc.xlsx_zip)
                                                      and not ((_host_audit_mail_xlsx_path | default('')) is file))) else [])
         + (['수신자(mail_recipients) 주소 형식 오류 ' ~ _to.invalid ~ '건'] if _to.invalid > 0 else [])
         + (['발신자 없음 또는 형식 오류 — inventory/config/host_audit.mail_sender(주소 1개)'] if (_from.addresses | length != 1 or _from.invalid > 0) else []) }}
  ansible.builtin.set_fact:
    _host_audit_mail_rcpt:
      to: "{{ _to.addresses }}"
      sender: "{{ _from_addr }}"
      sender_name: "{{ _from_name }}"
      from_header: "{{ _from_addr | host_audit_mail_sender(_from_name) }}"
    _host_audit_mail_problem: "{{ _problems | join('; ') }}"
  no_log: true
  when: _host_audit_mail_plan.send | bool

- name: Send the report mail through the SMTP relay
  when:
    - _host_audit_mail_plan.send | bool
    - _host_audit_mail_problem | length == 0
  vars:
    # 첨부는 보고서 1개 + (요약에 xlsx_zip이 있고 호출자가 경로를 준) xlsx zip 1개. 이름은 요약의 ASCII 이름이다.
    _host_audit_mail_attachments: >-
      {{ [{'src': _host_audit_mail_report_path, 'name': host_audit_mail_doc.report.file_name}]
         + ([{'src': _host_audit_mail_xlsx_path, 'name': host_audit_mail_doc.xlsx_zip.file_name}]
            if (host_audit_mail_doc.xlsx_zip is defined and host_audit_mail_doc.xlsx_zip
                and (_host_audit_mail_xlsx_path | default('')) | length > 0) else []) }}
  block:
    - name: "[AUD-604] Create a private temporary directory for the attachment"
      ansible.builtin.tempfile:
        state: directory
        prefix: host-audit-mail.
      register: _host_audit_mail_tmp

    - name: "[AUD-605] Copy the report and the xlsx zip under their ASCII attachment names"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ _host_audit_mail_tmp.path }}/{{ item.name }}"
        mode: '0600'
      loop: "{{ _host_audit_mail_attachments }}"
      loop_control:
        label: "{{ item.name }}"
      register: _host_audit_mail_copied

    - name: "[AUD-606] Send the summary, the A4 report and the xlsx zip (community.general.mail)"
      community.general.mail:
        host: "{{ host_audit_mail_host }}"
        port: "{{ host_audit_mail_port | int }}"
        secure: "{{ host_audit_mail_secure }}"
        ehlohost: "{{ host_audit_mail_ehlohost | default(omit, true) }}"
        timeout: "{{ host_audit_mail_timeout | int }}"
        sender: "{{ _host_audit_mail_rcpt.from_header }}"
        to: ["{{ item }}"]
        subject: "{{ host_audit_mail_doc.subject }}"
        body: "{{ lookup('ansible.builtin.template', 'mail_body.html.j2') }}"
        subtype: html
        charset: utf-8
        attach: "{{ _host_audit_mail_copied.results | map(attribute='dest') | list }}"
        headers: >-
          {{ ['X-Host-Audit-Run-Id=' ~ host_audit_mail_doc.run_id,
              'X-Host-Audit-Report-SHA256=' ~ host_audit_mail_doc.report.sha256]
             + (['X-Host-Audit-Xlsx-Zip-SHA256=' ~ host_audit_mail_doc.xlsx_zip.sha256] if _host_audit_mail_attachments | length > 1 else []) }}
      loop: "{{ _host_audit_mail_rcpt.to }}"
      loop_control:
        index_var: _host_audit_mail_idx
        label: "수신자 {{ _host_audit_mail_idx + 1 }}"
      register: _host_audit_mail_send
      # failed_when: false, not ignore_errors — ansible-core prints an ignored module error's message
      # ("Failed to send mail to '<주소>'") even under no_log. failed_when rewrites 'failed' to false,
      # so AUD-608 judges by rc and the module's success message instead. AUD-610 fails the run.
      failed_when: false
      no_log: true

  always:
    - name: "[AUD-607] Remove the temporary attachment directory"
      ansible.builtin.file:
        path: "{{ _host_audit_mail_tmp.path }}"
        state: absent
      when: _host_audit_mail_tmp.path is defined

- name: "[AUD-608] Judge the mail outcome without any address"
  vars:
    _send: "{{ _host_audit_mail_plan.send | bool }}"
    _problem: "{{ _host_audit_mail_problem | default('') }}"
    _judged: >-
      {{ _host_audit_mail_send | default({'skipped': true})
         | host_audit_mail_outcome((_host_audit_mail_rcpt.to | default([])) + [_host_audit_mail_rcpt.sender | default(''), _host_audit_mail_rcpt.sender_name | default('')]) }}
  ansible.builtin.set_fact:
    host_audit_mail_outcome:
      attempted: "{{ _send and _problem | length == 0 }}"
      sent: "{{ _send and _problem | length == 0 and _judged.sent }}"
      skipped_reason: "{{ _host_audit_mail_plan.reason }}"
      error: "{{ _problem if _problem | length > 0 else _judged.error }}"
      recipients: "{{ _host_audit_mail_rcpt.to | default([]) | length }}"
  no_log: true

- name: "[AUD-609] Show the mail outcome (counts only)"
  ansible.builtin.debug:
    msg: >-
      {{ ('메일 보냄 — 수신 ' ~ host_audit_mail_outcome.recipients ~ '명, 첨부 ' ~ host_audit_mail_doc.report.file_name
          ~ ', SHA-256 ' ~ host_audit_mail_doc.report.sha256
          ~ (', xlsx zip ' ~ host_audit_mail_doc.xlsx_zip.file_name ~ ', SHA-256 ' ~ host_audit_mail_doc.xlsx_zip.sha256
             if host_audit_mail_doc.xlsx_zip is defined and host_audit_mail_doc.xlsx_zip else '')) if host_audit_mail_outcome.sent | bool
         else ('메일 안 보냄 — ' ~ host_audit_mail_outcome.skipped_reason) if not (_host_audit_mail_plan.send | bool)
         else ('메일 실패 — ' ~ host_audit_mail_outcome.error) }}
