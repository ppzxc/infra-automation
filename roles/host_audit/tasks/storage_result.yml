---
# ==============================================================================
# Host Audit — 보관 결과 판정 (러너 localhost 전용, ADR-0009 §5, #125)
# ==============================================================================
# 업로드(storage_upload.yml)와 메일 발송(mail.yml, #126) 뒤에 둔다: Audit Baseline 조회만 실패하고
# 원본은 다 올라간 경우에도 메일은 나가고, 실행은 여기서 실패로 끝난다.
# ------------------------------------------------------------------------------
# 결과는 파일 이름과 상태 코드만 보여 준다(서명 헤더·키는 no_log로 가린다).
- name: "[AUD-516] Fail the run when the Audit Baseline lookup or keeping the originals failed"
  vars:
    _problem: "{{ _host_audit_storage_problem | default('') }}"
    _failed_uploads: >-
      {{ _host_audit_uploads.results | default([]) | rejectattr('status', 'equalto', 200)
         | map(attribute='item.stat.path', default='?') | map('basename') | list }}
    _pointer_failed: >-
      {{ host_audit_run.run_kind == 'scheduled' and _problem | length == 0
         and (_host_audit_pointer_put.status | default(-1)) != 200 }}
  ansible.builtin.assert:
    that:
      - _problem | length == 0
      - host_audit_baseline_history.state != 'failed'
      - _failed_uploads | length == 0
      - not (_pointer_failed | bool)
    fail_msg: >-
      Host Audit 원본 보관 실패 — 보고서는 러너 {{ host_audit_run.output_dir }}에 있다.
      {{ ('보관 입력: ' ~ _problem ~ ' (업로드하지 않음). ') if _problem | length > 0 else '' }}{{
         ('Audit Baseline 조회 실패: ' ~ host_audit_baseline_history.reason ~ '. ')
         if host_audit_baseline_history.state == 'failed' and _problem | length == 0 else '' }}{{
         ('업로드 실패 파일: ' ~ (_failed_uploads | join(', ')) ~ '. ') if _failed_uploads | length > 0 else '' }}{{
         'Audit Baseline 포인터 업로드 실패(이번 실행은 다음 정기 실행의 비교 기준이 되지 않음). ' if _pointer_failed | bool else '' }}
    success_msg: "Host Audit 원본 보관: {{ _host_audit_storage_target.bucket | default('') }}/{{ _host_audit_storage_prefix }}"
    quiet: true
  when: _host_audit_storage_active | bool
