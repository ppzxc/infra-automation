---
# ==============================================================================
# Host Audit — 보고서 (러너 localhost 전용, ADR-0009)
# ==============================================================================
# 러너에 저장된 호스트별 JSON만 입력으로 보고서 모델을 만들고(host_audit_report_model),
# 템플릿은 모델을 그리기만 한다. 수집 전에 실패한 대상(접속 정보 해석 실패 등)은
# 기록이 없어도 대상 목록(host_audit_targets)으로 보고서에 '점검불가'로 남는다.
# ------------------------------------------------------------------------------
- name: "[AUD-020] Find the per-host records of this run"
  ansible.builtin.find:
    paths: "{{ host_audit_run.output_dir }}/hosts"
    patterns: "*.json"
  register: _host_audit_record_files

- name: Judge Package Vulnerability with Trivy
  ansible.builtin.include_tasks: packages_scan.yml
  when: host_audit_packages_enabled | bool

- name: Check Configuration Drift with --check sub-runs
  ansible.builtin.include_tasks: drift.yml
  when: host_audit_drift_enabled | bool

- name: Judge the backup host key policy items of Security Regression
  ansible.builtin.include_tasks: regression_backup.yml

- name: Look up the Host Audit storage and the Audit Baseline
  ansible.builtin.include_tasks: storage_lookup.yml

# 스위치 기록(device_type: SWITCH, 스위치 단계가 같은 hosts/ 디렉터리에 쓴다)은 서버 보고서 모델에 섞지 않는다. 보고서의 스위치 부분이
# 읽을 수 있게 따로 남기고(_host_audit_switch_records) 아래 AUD-021이 모델의 meta로 넘긴다(host_audit_switch_section).
- name: "[AUD-027] Read the per-switch records of this run"
  ansible.builtin.set_fact:
    _host_audit_switch_records: "{{ _switch_records }}"
  vars:
    _switch_records: >-
      {%- set r = [] -%}
      {%- for p in _host_audit_record_files.files | map(attribute='path') | sort -%}
      {%- set rec = lookup('ansible.builtin.file', p) | from_json -%}
      {%- if rec.device_type | default('') == 'SWITCH' -%}{%- set _ = r.append(rec) -%}{%- endif -%}
      {%- endfor -%}
      {{ r }}

# 호스트 기록은 여기서 한 번만 읽어 _host_audit_records에 남긴다. Log Review(log_review.yml)가 관리 호스트 주소를 계산할 때 같은 값을
# 쓴다(파일을 다시 읽으며 누락·깨짐을 조용히 넘기지 않게, #573).
- name: "[AUD-021] Build the report model from the per-host records"
  ansible.builtin.set_fact:
    _host_audit_records: "{{ _records }}"
    host_audit_model: "{{ _records | host_audit_report_model(_meta) }}"
  vars:
    _records: >-
      {%- set r = [] -%}
      {%- for p in _host_audit_record_files.files | map(attribute='path') | sort -%}
      {%- set rec = lookup('ansible.builtin.file', p) | from_json -%}
      {%- if rec.device_type | default('') != 'SWITCH' -%}{%- set _ = r.append(rec) -%}{%- endif -%}
      {%- endfor -%}
      {{ r }}
    _meta:
      run_id: "{{ host_audit_run.run_id }}"
      run_kind: "{{ host_audit_run.run_kind }}"
      started_at: "{{ host_audit_run.started_at }}"
      generated_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      targets: "{{ groups['host_audit_targets'] | default([]) }}"
      switch_records: "{{ _host_audit_switch_records | default([]) }}"
      switch_targets: "{{ groups['host_audit_switch_targets'] | default([]) }}"
      target_hosts: "{{ host_audit_run.target_hosts }}"
      archive: >-
        {{ ('RustFS ' ~ (_host_audit_storage_target.bucket | default(host_audit_storage_bucket)) ~ '/' ~ _host_audit_storage_prefix
            ~ ' (3년 보관) · 러너 ' ~ host_audit_run.output_dir) if _host_audit_storage_active | bool
           else (host_audit_run.output_dir ~ ' (러너 로컬, 보관 안 함)') }}
      timezone: "{{ host_audit_run.timezone }}"
      eol_table: "{{ host_audit_eol_table }}"
      package_vulnerability: "{{ host_audit_package_section | default({}) }}"
      kisa_exceptions: "{{ host_audit_kisa_exceptions }}"
      baseline_history: "{{ host_audit_baseline_history }}"
      package_findings_dir: "{{ host_audit_run.output_dir }}/package_findings"
      configuration_drift: "{{ host_audit_drift_section | default({}) }}"
      regression_backup: "{{ host_audit_regression_backup_items | default([]) }}"

- name: "[AUD-022] Save the run metadata on the runner"
  ansible.builtin.copy:
    content: "{{ host_audit_run | combine({'targets': groups['host_audit_targets'] | default([])}) | to_nice_json(indent=2) }}\n"
    dest: "{{ host_audit_run.output_dir }}/run.json"
    mode: '0600'

- name: "[AUD-023] Render the A4 report HTML"
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ host_audit_run.output_dir }}/report.html"
    mode: '0600'

- name: "[AUD-024] Show where the report was written"
  ansible.builtin.debug:
    msg:
      report: "{{ host_audit_run.output_dir }}/report.html"
      hosts: "{{ host_audit_model.summary }}"

# 보관·메일·두 판정(AUD-516·AUD-610은 assert로 실행을 끝낸다)이 어디서 끝나든 always에서 이번 실행
# 디렉터리를 정책대로 정리한다(cleanup.yml, #157).
- name: Keep the originals, mail the report, judge both, and clean up the run directory
  block:
    # 호스트마다 Remediation Plan xlsx 1개(양호 외 항목이 없는 호스트도 "양호 외 항목 없음" 한 줄 파일)와 모든 호스트의
    # 행을 한 시트에 모은 합계 xlsx 1개(host-audit-<run_id>-total.xlsx, 호스트가 없으면 만들지 않는다). 행은 보고서 모델과
    # 항목 카탈로그에서만 만든다(필터 host_audit_remediation_plans, docs/host_audit.md §17). 실행 디렉터리 xlsx/ 아래에 쓰면
    # 보관(AUD-512~514)이 <YYYY-MM>/<run_id>/xlsx/로 올린다. 정기·수시 실행 모두 만든다.
    # 쓰기에 실패해도 보관·메일·KISA 악화 알림·Audit Baseline 포인터는 계속한다(그것들은 xlsx에 기대지 않는다). 실패는
    # 보관·메일 판정처럼 맨 끝에서 실행을 실패로 끝내고(Judge ... xlsx), 그때 정리가 디렉터리를 남긴다(cleanup.yml).
    # 계획(행에 호스트 증적과 예외 사유가 있다)은 한 번만 만들어 set_fact에 두고, 반복문은 호스트 이름만 돈다:
    # 반복문의 item은 실패 결과에 그대로 찍히기 때문이다. set_fact는 no_log가 아니다: 필터가 예외를 내면 원인이
    # 보여야 하고(no_log면 가려진다), 성공 때의 fact는 -v에서만 찍히며 내용은 report.html과 같다.
    # _host_audit_remediation_by_file은 이번 실행이 쓸 xlsx 전부({파일명: 계획})다: 호스트별 계획과 합계. 쓰기·정리·묶기·
    # 생성 실패 판정이 모두 이 하나를 읽는다(합계는 error가 없다).
    - name: Build the Remediation Plan of every host
      ansible.builtin.set_fact:
        _host_audit_remediation_by_file: "{{ host_audit_model | host_audit_remediation_files }}"

    # 계획을 못 만든 호스트는 그 호스트만 한 줄 파일이 되고 실행은 계속된다. 로그에 호스트와 원인을 남긴다.
    - name: Name the hosts whose Remediation Plan could not be built
      ansible.builtin.debug:
        msg: "Remediation Plan 생성 실패 {{ item.value.label }}: {{ item.value.error.split(':')[0] }} (메시지는 xlsx의 한 줄 파일에 있다)"
      loop: "{{ _host_audit_remediation_by_file | dict2items | selectattr('value.error', 'defined') | list }}"
      loop_control:
        label: "{{ item.value.label }}"

    # 모든 호스트가 실패했다면 필터나 카탈로그 자체가 깨진 것이라 빈 증적을 보관하지 않고 멈춘다.
    - name: Stop when the Remediation Plan could not be built for any host
      ansible.builtin.assert:
        that: _host_audit_remediation_by_file | dict2items | selectattr('value.error', 'defined') | list | length
              < _host_audit_remediation_by_file | dict2items | rejectattr('value.kind', 'equalto', 'total') | list | length
        fail_msg: "모든 호스트의 Remediation Plan 생성이 실패했다(필터·카탈로그 오류, 위 로그 참고)"
      when: host_audit_model.hosts | length > 0

    # 반복문의 item은 파일 이름(ASCII)이다: 실패 결과에 찍혀도 증적이 새지 않는다.
    - name: "[AUD-025] Write the Remediation Plan xlsx of every host"
      vars:
        _plan: "{{ _host_audit_remediation_by_file[item] }}"
      host_audit_xlsx_write:
        dest: "{{ host_audit_run.output_dir }}/xlsx/{{ _plan.file_name }}"
        sheet: "{{ _plan.sheet }}"
        headers: "{{ _plan.headers }}"
        rows: "{{ _plan.rows }}"
        footer: "{{ _plan.footer }}"
        widths: "{{ _plan.widths }}"
      loop: "{{ _host_audit_remediation_by_file | list }}"
      register: _host_audit_xlsx_write
      ignore_errors: true

    # 실패한 호스트를 한 번만 모아 두고, 묶을 수 있는지(_host_audit_xlsx_pack)도 같은 자리에서 한 번만 정한다.
    # 아래 zip 지우기·묶기 조건이 같은 식을 따로 쓰지 않는다.
    # 실패한 파일은 호스트 이름(합계는 total)으로 모아 판정 메시지에 쓴다.
    - name: Collect the hosts whose Remediation Plan xlsx could not be written
      vars:
        _failed: >-
          {{ _host_audit_xlsx_write.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | list }}
      ansible.builtin.set_fact:
        _host_audit_xlsx_failed_files: "{{ _failed }}"
        _host_audit_xlsx_failed_hosts: "{{ _failed | map('extract', _host_audit_remediation_by_file) | map(attribute='label') | list }}"
        _host_audit_xlsx_pack: "{{ (host_audit_model.hosts | length > 0) and (_failed | length == 0) }}"

    # 같은 실행 ID로 다시 돌린 실행이 이전 시도의 xlsx를 남겼으면(쓰기에 실패한 호스트의 옛 파일, 이번 대상에 없는 호스트의
    # 파일, 옛 합계 파일) 보관(AUD-512)이 xlsx/를 통째로 올리므로 이번 실행의 증적으로 오른다. 이번 시도가 쓴 파일(실패하지
    # 않은 호스트의 계획 파일명과 합계 파일명)만 남기고 나머지 *.xlsx는 지운다. 범위는 xlsx다: xlsx/ 아래에는 이 역할의 모듈만 쓰고
    # 이름은 모두 host-audit-<run_id>-<host 또는 total>.xlsx라서 그 밖의 파일이 생길 길이 없다(zip은 아래 zip 단계가, 숨김 임시 파일은 AUD-512의
    # find가 따로 다룬다). 찾기·지우기 실패는 보관·메일을 막지 않고(AUD-025와 같은 원칙) 아래 요약으로 모여 맨 끝에서
    # 실행을 실패로 끝낸다.
    - name: Check whether the xlsx directory exists
      ansible.builtin.stat:
        path: "{{ host_audit_run.output_dir }}/xlsx"
        get_checksum: false
        get_mime: false
      register: _host_audit_xlsx_dir
      failed_when: false  # a stat that errors leaves .stat undefined: the find below then still runs and reports

    - name: Find the xlsx files that this attempt did not write
      ansible.builtin.find:
        paths: "{{ host_audit_run.output_dir }}/xlsx"
        patterns: '*.xlsx'
        file_type: any  # an entry of another type named *.xlsx would be uploaded by AUD-512 too
      register: _host_audit_xlsx_present
      ignore_errors: true
      when:
        - not ansible_check_mode
        - _host_audit_xlsx_dir.stat.exists | default(true)  # skipped only when stat positively says absent

    - name: Remove the xlsx files that this attempt did not write
      vars:
        _written: "{{ _host_audit_remediation_by_file | list | difference(_host_audit_xlsx_failed_files) }}"
        _present: "{{ _host_audit_xlsx_present.files | default([]) | map(attribute='path') | map('basename') | list }}"
      ansible.builtin.file:
        path: "{{ host_audit_run.output_dir }}/xlsx/{{ item }}"
        state: absent
      loop: "{{ _present | difference(_written) }}"
      register: _host_audit_xlsx_stale
      ignore_errors: true
      when: not ansible_check_mode

    # 쓰기·묶기·옛 파일 정리 실패를 하나의 사실로 모은다: 소비자(맨 끝 판정, 그 메시지, 정리 cleanup.yml)가 같은 값을 읽는다.
    # 묶기가 실패하면 'Remember that the xlsx zip could not be written'이 같은 사실에 더한다. targets가 실패한 것을 전부 담아 정리의
    # 이유 문구와 맨 끝 판정 메시지가 그대로 쓴다.
    - name: Summarize the Remediation Plan xlsx problem of this run
      vars:
        _hosts: "{{ _host_audit_xlsx_failed_hosts | default([]) }}"
        _stale: "{{ (_host_audit_xlsx_present.failed | default(false) | bool) or (_host_audit_xlsx_stale.failed | default(false) | bool) }}"
      ansible.builtin.set_fact:
        _host_audit_xlsx_problem:
          failed: "{{ (_hosts | length > 0) or _stale }}"
          targets: "{{ _hosts + (['이전 시도 xlsx 삭제'] if _stale else []) }}"

    # 호스트별 xlsx와 합계 xlsx 전부를 zip 하나로 묶는다. 압축 안의 이름만 폴더를 가진다(total.xlsx, hosts/<호스트>.xlsx). 메일의 두 번째 첨부이자 보고서와 함께 보관되는 파일이다(xlsx/ 아래, 보관은
    # AUD-512~514가 한다). 같은 xlsx면 같은 바이트다(표준 라이브러리 writer). xlsx 쓰기에 실패한 호스트가 있으면 빠진 채
    # 완성본처럼 해시를 붙여 보내고 3년 보관하지 않도록 묶지 않는다(메일은 보고서만, 실패는 맨 끝 판정이 호스트 이름과 함께
    # 실행을 실패로 끝낸다). 호스트가 하나도 없으면 묶을 것이 없다. 묶기 자체의 실패도 xlsx 쓰기 실패처럼 모아 맨 끝에서
    # 판정한다 — 보조 첨부 때문에 보관·메일이 막히지 않는다(AUD-025와 같은 원칙).
    # 같은 실행 ID로 다시 돌린 실행이 이전 시도의 zip을 남겼으면, 이번에 묶지 못한 경우 그 옛 zip이 해시·첨부·보관에
    # 오르지 않도록 먼저 지운다.
    # 묶는 경우에는 모듈이 같은 바이트면 그대로 두고(멱등) 아니면 원자적으로 바꾼다. 묶지 않는 경우(호스트 없음·xlsx 실패)에만 지운다.
    - name: Remove a leftover xlsx zip of an earlier attempt
      ansible.builtin.file:
        path: "{{ _host_audit_xlsx_zip_path }}"
        state: absent
      when: not (_host_audit_xlsx_pack | bool)

    - name: "[AUD-026] Pack every Remediation Plan xlsx into one zip"
      host_audit_zip_write:
        src_dir: "{{ host_audit_run.output_dir }}/xlsx"
        dest: "{{ _host_audit_xlsx_zip_path }}"
        members: "{{ _host_audit_remediation_by_file | host_audit_remediation_zip_members }}"
      register: _host_audit_xlsx_zip_write
      ignore_errors: true
      when:
        - not ansible_check_mode  # check 모드의 xlsx 쓰기는 파일을 만들지 않으므로 묶을 것이 없다
        - _host_audit_xlsx_pack | bool

    # 소비자 셋(맨 끝 판정, 그 메시지, 정리 cleanup.yml)은 _host_audit_xlsx_problem 하나만 읽는다. 묶기 실패 자체는 모듈
    # 결과(_host_audit_xlsx_zip_write.failed)가 이미 담고 있어 별도 표지를 두지 않는다.
    - name: Remember that the xlsx zip could not be written
      ansible.builtin.set_fact:
        _host_audit_xlsx_problem: "{{ _host_audit_xlsx_problem | combine({'failed': true, 'targets': _host_audit_xlsx_problem.targets + ['xlsx zip']}) }}"
      when: _host_audit_xlsx_zip_write.failed | default(false)

    # 묶기가 실패했으면 이전 시도의 zip이 남아 있어도 해시·첨부·보관에 오르지 않게 지운다.
    - name: Remove the xlsx zip when packing it failed
      ansible.builtin.file:
        path: "{{ _host_audit_xlsx_zip_path }}"
        state: absent
      when: _host_audit_xlsx_zip_write.failed | default(false)

    # Log Review Report(Spec #544, #558): 정기 실행(수시는 플래그)만 전월 초안을 log_review/에 쓴다. 해시·요약·보관보다 먼저 있어야
    # 같은 실행의 보관(AUD-512)이 함께 올리고 메일이 세 번째 첨부로 보낸다. 조회 실패는 보고서 안의 '조회 실패'이고, 모델·렌더링
    # 오류만 맨 끝에서 실행을 실패로 끝낸다(첨부 없이 메일은 나간다).
    - name: Draft the Log Review Report of the previous month
      ansible.builtin.include_tasks: log_review.yml

    - name: "[AUD-611] Compute the SHA-256 of the report to attach"
      ansible.builtin.stat:
        path: "{{ host_audit_run.output_dir }}/report.html"
        checksum_algorithm: sha256
        get_mime: false
      register: _host_audit_report_stat

    - name: "[AUD-615] Compute the SHA-256 of the xlsx zip to attach"
      ansible.builtin.stat:
        path: "{{ _host_audit_xlsx_zip_path }}"
        checksum_algorithm: sha256
        get_mime: false
      register: _host_audit_xlsx_zip_stat

    - name: "[AUD-806] Compute the SHA-256 of the Log Review Report to attach"
      ansible.builtin.stat:
        path: "{{ _host_audit_log_review_path }}"
        checksum_algorithm: sha256
        get_mime: false
      register: _host_audit_log_review_stat
      when: _host_audit_log_review_made | default(false) | bool

    # 메일 요약은 실행과 함께 보관해 재발송(resend.yml)이 같은 본문·같은 첨부(보고서·xlsx zip·Log Review Report)를 다시 보내게 한다. 주소는 넣지 않는다.
    - name: "[AUD-612] Build the mail summary of this run"
      ansible.builtin.set_fact:
        host_audit_mail_doc: >-
          {{ host_audit_model | host_audit_mail_summary({
               'sha256': _host_audit_report_stat.stat.checksum,
               'size': _host_audit_report_stat.stat.size,
               'file_name': host_audit_run.run_id | host_audit_mail_attachment_name,
               'archive': ('RustFS ' ~ (_host_audit_storage_target.bucket | default(host_audit_storage_bucket)) ~ '/'
                           ~ _host_audit_storage_prefix ~ 'report.html (3년 보관)') if _host_audit_storage_active | bool
                          else ('러너 ' ~ host_audit_run.output_dir ~ '/report.html (보관 안 함)')},
               ({'sha256': _host_audit_xlsx_zip_stat.stat.checksum,
                 'size': _host_audit_xlsx_zip_stat.stat.size,
                 'file_name': _host_audit_xlsx_zip_name,
                 'archive': _host_audit_xlsx_zip_archive} if _host_audit_xlsx_zip_stat.stat.exists else none),
               ({'sha256': _host_audit_log_review_stat.stat.checksum,
                 'size': _host_audit_log_review_stat.stat.size,
                 'file_name': _host_audit_log_review_name,
                 'archive': _host_audit_log_review_archive,
                 'period': _host_audit_log_review_period.month}
                if (_host_audit_log_review_stat.stat is defined and _host_audit_log_review_stat.stat.exists) else none)) }}

    - name: "[AUD-613] Save the mail summary on the runner"
      ansible.builtin.copy:
        content: "{{ host_audit_mail_doc | to_nice_json(indent=2) }}\n"
        dest: "{{ host_audit_run.output_dir }}/mail_summary.json"
        mode: '0600'

    - name: Keep the originals in the Host Audit bucket
      ansible.builtin.include_tasks: storage_upload.yml

    # 업로드가 하나라도 실패하면 메일을 보내지 않는다. Audit Baseline 조회만 실패한 경우는 원본이 다 올라갔으므로
    # 보낸다(보고서 표지에 '조회 실패'가 찍힘). 보관을 끈 실행(host_audit_storage_enabled=false)은 러너 원본으로 보낸다.
    - name: "[AUD-614] Decide whether the originals were kept"
      vars:
        _uploaded: "{{ _host_audit_uploads.results | default([]) | map(attribute='status', default=-1) | list }}"
      ansible.builtin.set_fact:
        _host_audit_archive_ok: >-
          {{ (not (host_audit_storage_enabled | bool))
             or ((_host_audit_storage_active | bool) and (_host_audit_storage_problem | default('보관 비활성') | length == 0)
                 and _uploaded | length > 0 and _uploaded | reject('equalto', 200) | list | length == 0) }}
        _host_audit_mail_report_path: "{{ host_audit_run.output_dir }}/report.html"
        _host_audit_mail_xlsx_path: "{{ _host_audit_xlsx_zip_path }}"
        _host_audit_mail_log_review_path: "{{ _host_audit_log_review_path if host_audit_mail_doc.log_review is defined else '' }}"

    - name: Mail the report
      ansible.builtin.include_tasks: mail.yml

    - name: Notify KISA items that got worse since the Audit Baseline
      ansible.builtin.include_tasks: kisa_alert.yml

    - name: Judge keeping the originals
      ansible.builtin.include_tasks: storage_result.yml

    - name: Judge the report mail
      ansible.builtin.include_tasks: mail_result.yml

    - name: Judge the KISA worsening notification
      ansible.builtin.include_tasks: kisa_alert_result.yml

    # AUD-025의 실패를 모아 맨 끝에서 실행을 실패로 끝낸다. 호스트 이름만 밝힌다(오류 메시지는 모듈 출력에 이미 있다).
    # 이 assert가 실행을 끝내면 뒤의 AUD-807은 돌지 않으므로, Log Review Report 작성 실패가 함께 있으면 그 사유를 이 메시지에 붙인다.
    - name: Fail the run when a Remediation Plan xlsx could not be written
      vars:
        _log_review_problem: "{{ _host_audit_log_review_problem | default('') }}"
      ansible.builtin.assert:
        that: not (_host_audit_xlsx_problem.failed | bool)
        fail_msg: >-
          Remediation Plan xlsx 쓰기·묶기·이전 시도 파일 정리에 실패한 대상: {{ _host_audit_xlsx_problem.targets | join(', ') }}{{
          (' · Log Review Report 작성 실패 — ' ~ _log_review_problem) if _log_review_problem | length > 0 else '' }} (실행 디렉터리는 남김)

    # 모델·렌더링·판정 오류(필터 버그)와 모델 이전 단계의 중단만 여기서 실행을 실패로 끝낸다. 조회 실패는 보고서 안의 '조회 실패'라
    # 실패가 아니다. 실행 디렉터리는 xlsx 실패와 같이 남긴다(cleanup.yml).
    - name: "[AUD-807] Fail the run when the Log Review Report could not be drafted"
      ansible.builtin.assert:
        that: (_host_audit_log_review_problem | default('')) | length == 0
        fail_msg: "Log Review Report 작성 실패 — {{ _host_audit_log_review_problem | default('') }} (위 로그 참고. 메일은 보고서 첨부 없이 또는 오류 항목을 '조회 실패'로 표시해 나갔다. 실행 디렉터리는 남김)"
        quiet: true
  always:
    - name: Clean up this run's output directory by policy
      ansible.builtin.include_tasks: cleanup.yml
