---
# ==============================================================================
# Host Audit — KISA 월간 악화 알림 보내기 (러너 localhost 전용, Spec #322 / Ticket-9, #331)
# ==============================================================================
# 정기 실행에서 지난 정기 점검(Audit Baseline)에 취약이 아니던 KISA 항목이 이번에 취약이면, 악화된 항목 목록을 사내 알림
# webhook(text/plain, 본문 5000자 한도)으로 한 번 보낸다. 판단과 본문은 필터 host_audit_kisa_alert가 한다(항목 단위 비교,
# 지난 결과가 없는 호스트는 제외). 수시 실행·check 모드·host_audit_kisa_alert_enabled=false는 보내지 않는다.
# webhook 주소·토큰은 storage_credentials.yml(AUD-502)이 해석한 _host_audit_alert_target이고 모든 관련 태스크가 no_log다.
# 이 파일은 실행을 실패로 끝내지 않는다. 전달 실패 판정은 kisa_alert_result.yml(AUD-642)이 다른 판정 뒤에 한다.
# ------------------------------------------------------------------------------
- name: "[AUD-640] Decide whether this run notifies KISA worsening"
  ansible.builtin.set_fact:
    _host_audit_kisa_alert_plan: >-
      {{ (host_audit_model | host_audit_kisa_alert(host_audit_run, host_audit_baseline_history))
         if ((host_audit_kisa_alert_enabled | bool) and not ansible_check_mode)
         else {'send': false, 'reason': 'KISA 악화 알림 비활성 또는 check 모드', 'count': 0, 'hosts': 0, 'text': ''} }}
  no_log: true

- name: "[AUD-641] Send the KISA worsening notification to the alert webhook"
  ansible.builtin.uri:
    url: "{{ _host_audit_alert_target.url }}"
    method: POST
    headers: >-
      {{ {'Content-Type': 'text/plain; charset=utf-8'}
         | combine({(_host_audit_alert_target.header | default('Authorization', true)): _host_audit_alert_target.token}
                   if (_host_audit_alert_target.token | default('') | length > 0) else {}) }}
    body: "{{ _host_audit_kisa_alert_plan.text }}"
    body_format: raw
    status_code: [-1, 200, 201, 202, 204, 301, 302, 400, 401, 403, 404, 500, 502, 503]
    timeout: 15
    validate_certs: "{{ host_audit_alert_validate_certs | bool }}"
  register: _host_audit_kisa_alert_post
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - _host_audit_kisa_alert_plan.send | bool
    - (_host_audit_alert_target | default({})).url | default('') is match('^https?://')
