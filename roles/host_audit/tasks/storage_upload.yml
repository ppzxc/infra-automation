---
# ==============================================================================
# Host Audit — 원본 보관 (러너 localhost 전용, ADR-0009 §5, #125)
# ==============================================================================
# 보고서가 러너에 만들어진 뒤, 이번 실행 디렉터리 전체(report.html, run.json, findings.json,
# hosts/·packages/·sbom/·trivy/ 원본)를 RustFS Host Audit 버킷의 <YYYY-MM>/<run_id>/에 올린다.
# 정기 실행은 모든 업로드가 성공한 뒤에만 포인터 baseline/<run_id>.json을 올린다 — 반쯤 올라간
# 실행이 다음 달의 Audit Baseline이 되지 않게 한다. 수시 실행은 포인터를 남기지 않는다.
# Audit Baseline 조회가 실패해도 원본은 올린다(비교만 빠진 보고서). 업로드 실패 또는 조회 실패는
# 보고서를 만든 뒤 storage_result.yml(AUD-516)이 실행을 실패로 끝낸다(메일 발송 뒤). 포인터는 파일로 써서 올린다 — 서명한 SHA-256과 보낸
# 바이트가 같아야 하기 때문이다.
# ------------------------------------------------------------------------------
- name: "[AUD-510] Save the findings index of this run on the runner"
  ansible.builtin.copy:
    content: "{{ host_audit_model.baseline.document | to_json }}\n"
    dest: "{{ host_audit_run.output_dir }}/findings.json"
    mode: '0600'

- name: "[AUD-511] Save the Audit Baseline pointer of a scheduled run on the runner"
  ansible.builtin.copy:
    content: "{{ host_audit_model.baseline.pointer | combine({'findings_key': _host_audit_storage_prefix ~ 'findings.json'}) | to_json }}\n"
    dest: "{{ host_audit_run.output_dir }}/pointer.json"
    mode: '0600'
  when: host_audit_run.run_kind == 'scheduled'

# 큰 원본(Trivy 결과 호스트당 약 200~250 MB, SBOM)은 내용 그대로 gzip해서 <파일>.gz로 올린다(#151).
# 원본은 지운다 — 두 벌 올라가지 않게. 보고서·run.json·mail_summary.json·findings.json·포인터는 압축하지 않는다
# (재발송·Audit Baseline 조회가 그대로 읽는다). 압축 실패는 실행을 멈추지 않는다: 그 원본은 압축 없이 올라간다.
- name: "[AUD-517] Find the Trivy and SBOM originals of this run to compress"
  ansible.builtin.find:
    paths:
      - "{{ host_audit_run.output_dir }}/trivy"
      - "{{ host_audit_run.output_dir }}/sbom"
    patterns: ["*.json"]
    file_type: file
  register: _host_audit_compress_files
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | default('보관 비활성') | length == 0

- name: "[AUD-518] Compress the Trivy and SBOM originals losslessly (gzip)"
  community.general.archive:
    path: "{{ item }}"
    dest: "{{ item }}.gz"
    format: gz
    remove: true
    mode: '0600'
  loop: "{{ _host_audit_compress_files.files | default([]) | map(attribute='path') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  register: _host_audit_compressed
  failed_when: false

- name: "[AUD-512] Find every file of this run to keep"
  ansible.builtin.find:
    paths: "{{ host_audit_run.output_dir }}"
    recurse: true
    file_type: file
  register: _host_audit_keep_files
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | default('보관 비활성') | length == 0

- name: "[AUD-513] Compute the SHA-256 of every file to keep"
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ _host_audit_keep_files.files | default([]) | map(attribute='path') | sort }}"
  register: _host_audit_keep_stats

- name: "[AUD-514] Upload this run to the Host Audit bucket (<YYYY-MM>/<run_id>/)"
  vars:
    _rel: "{{ item.stat.path | regex_replace('^' ~ (host_audit_run.output_dir | regex_escape) ~ '/', '') }}"
    _req: >-
      {{ _host_audit_storage_target | host_audit_s3_request('PUT', _host_audit_storage_prefix ~ _rel, none, item.stat.checksum) }}
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: PUT
    src: "{{ item.stat.path }}"
    remote_src: true
    headers: >-
      {{ _req.headers | combine({'Content-Type': 'text/html; charset=utf-8' if _rel is match('.*\.html$')
         else ('application/gzip' if _rel is match('.*\.gz$') else 'application/json')}) }}
    status_code: [-1, 200, 400, 403, 404, 409, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  loop: "{{ _host_audit_keep_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.stat.path | basename }}"
  register: _host_audit_uploads
  changed_when: true
  no_log: true

- name: "[AUD-515] Upload the Audit Baseline pointer of a scheduled run"
  vars:
    _uploaded: "{{ _host_audit_uploads.results | default([]) | map(attribute='status', default=-1) | list }}"
    _stat: >-
      {{ _host_audit_keep_stats.results | default([]) | selectattr('item', 'equalto', host_audit_run.output_dir ~ '/pointer.json') | first }}
    _req: >-
      {{ _host_audit_storage_target | host_audit_s3_request('PUT', 'baseline/' ~ host_audit_run.run_id ~ '.json', none, _stat.stat.checksum) }}
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: PUT
    src: "{{ host_audit_run.output_dir }}/pointer.json"
    remote_src: true
    headers: "{{ _req.headers | combine({'Content-Type': 'application/json'}) }}"
    status_code: [-1, 200, 400, 403, 404, 409, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_pointer_put
  changed_when: true
  no_log: true
  when:
    - host_audit_run.run_kind == 'scheduled'
    - _uploaded | length > 0
    - _uploaded | reject('equalto', 200) | list | length == 0
