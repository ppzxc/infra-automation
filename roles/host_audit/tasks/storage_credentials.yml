---
# ==============================================================================
# Host Audit — 보관 자격증명 해석 (러너 localhost 전용, ADR-0009 §5, #125·#126, Spec #511 / Ticket-17)
# ==============================================================================
# RustFS Host Audit 전용 버킷의 전용 키(Put·Get·List, Delete 없음)를 공용 읽기 지점(lookup openbao_doc)으로 읽는다:
# 주소·리전은 inventory/services/rustfs, 키는 secrets/services/rustfs/audit_reports. 백업·유지보수 키는 쓰지 않는다.
# 읽는 문서와 필수 키는 vars/main.yml의 host_audit_openbao_required가 선언한다. 대체값도 실행 변수 덮어쓰기도 없다.
# 보관 조회(storage_lookup.yml)와 재발송(resend.yml)이 함께 쓴다.
# 결과: _host_audit_storage_target(no_log 값), _host_audit_storage_problem(빈 문자열 = 사용 가능), _host_audit_alert_target.
# 읽기 실패는 실행을 여기서 멈추지 않고 '보관 문제'로 남긴다(errors='ignore'). 판정은 뒤의 AUD-516·622가 한다.
# 로그인에 실패하면 토큰 변수는 빈 값이 되고 아래 읽기도 같은 이유로 실패해 보관 문제가 된다(우회 fixture는 토큰이 늘 빈 값이다).
# ------------------------------------------------------------------------------
- name: "[AUD-500] Log in to OpenBao once through the shared read point (token for the storage reads)"
  ansible.builtin.set_fact:
    _vault_token: "{{ lookup('openbao_doc', '@token', errors='ignore') | default('', true) }}"
  check_mode: false
  no_log: true
  when: _host_audit_storage_active | bool

- name: "[AUD-501] Read the Host Audit storage documents and the alert document (host_audit_openbao_required)"
  vars:
    _storage_patterns: "{{ ['inventory/services/rustfs', 'secrets/services/rustfs/audit_reports'] }}"
    _storage_read: "{{ query('openbao_doc', *_storage_patterns, errors='ignore') }}"
  ansible.builtin.set_fact:
    # 둘 중 하나라도 못 읽으면 문서 모음 전체가 비어 있다(= 보관 문제). 알림 문서는 따로 읽는다: 그것을 못 읽어도 보관은 막지 않는다.
    _host_audit_storage_docs: "{{ dict(_storage_patterns | zip(_storage_read)) if (_storage_read | length) == (_storage_patterns | length) else {} }}"
    _host_audit_alert_doc: "{{ lookup('openbao_doc', 'secrets/services/alert/notify', errors='ignore') | default({}, true) }}"
  check_mode: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - _vault_token is defined

# 빠진 항목은 이름만(값은 절대 아님) 모은다 — 조회 실패도 '실패 상태'로 남기고 실행을 여기서 멈추지 않는다.
# 보관 경로(inventory/services/rustfs, secrets/services/rustfs/audit_reports)의 조회만 보관 문제로 판정한다. 알림 webhook(#331)을 못 읽어도
# 월간 보관·보고서 메일은 막지 않는다: 그 비용은 악화 알림 하나뿐이고 AUD-642가 그때만 실행을 실패시킨다.
- name: "[AUD-502] Resolve the Host Audit storage target and dedicated key"
  vars:
    _docs: "{{ _host_audit_storage_docs | default({}, true) }}"
    _service: "{{ _docs['inventory/services/rustfs'] | default({}, true) }}"
    _key: "{{ _docs['secrets/services/rustfs/audit_reports'] | default({}, true) }}"
    _resolved:
      endpoint: "{{ _service.url | default('', true) }}"
      bucket: "{{ host_audit_storage_bucket }}"
      access_key: "{{ _key.access_key | default('', true) }}"
      secret_key: "{{ _key.secret_key | default('', true) }}"
      region: "{{ _service.region | default('us-east-1', true) }}"
    _missing: >-
      {%- set found = namespace(names=[]) -%}
      {%- for pattern, keys in host_audit_openbao_required.items() if pattern in _docs -%}
      {%- for k in keys if (_docs[pattern][k] | default('')) | string | length == 0 -%}
      {%- set found.names = found.names + [pattern ~ '.' ~ k] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ (found.names + ([] if _resolved.bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') else ['host_audit_storage_bucket(S3 이름 규칙 위반)'])) | to_json }}
    _lookup_failed: "{{ (_docs | length) == 0 }}"
  ansible.builtin.set_fact:
    # KISA 악화 알림의 webhook(#331): secrets/services/alert/notify의 url(text/plain). 값은 로그에 남기지 않는다.
    _host_audit_alert_target:
      url: "{{ (_host_audit_alert_doc | default({}, true)).url | default('', true) if (_host_audit_alert_doc | default({}, true)) is mapping else '' }}"
    _host_audit_storage_target: "{{ _resolved }}"
    _host_audit_storage_problem: >-
      {{ ('OpenBao 문서를 읽지 못함(문서 없음, 권한 403, 연결 불가, 인증 정보 없음. 원인은 가려진다). 읽는 문서: '
          ~ (['inventory/services/rustfs', 'secrets/services/rustfs/audit_reports'] | join(', ')))
         if _lookup_failed | bool else ('보관 입력 누락: ' ~ ((_missing | from_json) | join(', ')) if (_missing | from_json) | length > 0 else '') }}
  no_log: true
  when: _host_audit_storage_active | bool
