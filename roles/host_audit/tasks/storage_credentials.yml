---
# ==============================================================================
# Host Audit — 보관 자격증명 해석 (러너 localhost 전용, ADR-0009 §5, #125·#126)
# ==============================================================================
# RustFS Host Audit 전용 버킷의 전용 키(Put·Get·List, Delete 없음)를 OpenBao agents/host_audit에서
# 읽는다. 백업·유지보수 키는 쓰지 않는다. 보관 조회(storage_lookup.yml)와 재발송(resend.yml)이 함께 쓴다.
# 결과: _host_audit_storage_target(no_log 값), _host_audit_storage_problem(빈 문자열 = 사용 가능).
# ------------------------------------------------------------------------------
- name: "[AUD-500] Log in to OpenBao with AppRole for the Host Audit storage key"
  vars:
    _vault_addr_eff: "{{ vault_addr | default(VAULT_ADDR | default(lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true), true), true) }}"
    _vault_ns_eff: "{{ (vault_namespace | default(VAULT_NAMESPACE | default(lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE') | default('infra/prod/host/', true), true), true), true)) | regex_replace('/+$', '') }}"
    _vault_role_id: "{{ vault_role_id | default(VAULT_ROLE_ID | default(lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | default('', true), true), true) }}"
    _vault_secret_id: "{{ vault_secret_id | default(VAULT_SECRET_ID | default(lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | default('', true), true), true) }}"
    _vault_token_given: "{{ vault_token | default(VAULT_TOKEN | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true), true) }}"
  ansible.builtin.uri:
    url: "{{ _vault_addr_eff }}/v1/auth/approle/login"
    method: POST
    headers: "{{ {'X-Vault-Namespace': _vault_ns_eff} if (_vault_ns_eff | length > 0) else {} }}"
    body_format: json
    body:
      role_id: "{{ _vault_role_id }}"
      secret_id: "{{ _vault_secret_id }}"
    status_code: [-1, 200, 400, 401, 403, 404, 500]
    timeout: 5
    validate_certs: "{{ host_agents_vault_validate_certs | default(false) }}"
  register: _host_audit_approle_login
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - host_audit_storage | length == 0
    - _vault_token_given | length == 0
    - _vault_role_id | length > 0
    - _vault_secret_id | length > 0

- name: "[AUD-501] Fetch the Host Audit storage KV from OpenBao (agents/host_audit, agents/rustfs)"
  vars:
    _vault_addr_eff: "{{ vault_addr | default(VAULT_ADDR | default(lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true), true), true) }}"
    _vault_token_eff: "{{ (_host_audit_approle_login.json.auth.client_token | default('')) or (vault_token | default(VAULT_TOKEN | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true), true)) }}"
    _vault_ns_eff: "{{ (vault_namespace | default(VAULT_NAMESPACE | default(lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE') | default('infra/prod/host/', true), true), true), true)) | regex_replace('/+$', '') }}"
    _vault_mount_eff: "{{ vault_mount | default(VAULT_MOUNT | default(lookup('ansible.builtin.env', 'VAULT_MOUNT') | default(lookup('ansible.builtin.env', 'OPENBAO_MOUNT') | default('secret', true), true), true), true) }}"
  ansible.builtin.uri:
    url: "{{ _vault_addr_eff }}/v1/{{ _vault_mount_eff }}/data/{{ item }}"
    method: GET
    headers: >-
      {{ {'X-Vault-Token': _vault_token_eff} | combine({'X-Vault-Namespace': _vault_ns_eff} if (_vault_ns_eff | length > 0) else {}) }}
    status_code: [200, 404]
    timeout: 5
    validate_certs: "{{ host_agents_vault_validate_certs | default(false) }}"
  loop:
    - agents/host_audit
    - agents/rustfs
  register: _host_audit_storage_kv
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - host_audit_storage | length == 0
    - _vault_token_eff | length > 0

# 우선순위: Extra variables host_audit_storage > OpenBao agents/host_audit(storage_*) > 엔드포인트만 agents/rustfs.rustfs_endpoint.
# 빠진 항목은 이름만(값은 절대 아님) 모은다 — 조회 실패도 '실패 상태'로 남기고 실행을 여기서 멈추지 않는다.
- name: "[AUD-502] Resolve the Host Audit storage target and dedicated key"
  vars:
    _kv: >-
      {{ dict(_host_audit_storage_kv.results | default([]) | rejectattr('skipped', 'defined')
              | map(attribute='item') | zip(_host_audit_storage_kv.results | default([]) | rejectattr('skipped', 'defined')
              | map(attribute='json.data.data', default={}))) }}
    _ha: "{{ _kv['agents/host_audit'] | default({}) }}"
    _rf: "{{ _kv['agents/rustfs'] | default({}) }}"
    _resolved: >-
      {{ host_audit_storage if host_audit_storage | length > 0 else {
           'endpoint': (_ha.storage_endpoint | default('', true)) or (_rf.rustfs_endpoint | default('', true)),
           'bucket': _ha.storage_bucket | default(host_audit_storage_bucket, true),
           'access_key': _ha.storage_access_key | default('', true),
           'secret_key': _ha.storage_secret_key | default('', true),
           'region': _ha.storage_region | default('us-east-1', true)} }}
    _missing: >-
      {{ ([] if (_resolved.endpoint | default('')) | length > 0 else ['agents/host_audit.storage_endpoint(또는 agents/rustfs.rustfs_endpoint)'])
         + ([] if (_resolved.access_key | default('')) | length > 0 else ['agents/host_audit.storage_access_key'])
         + ([] if (_resolved.secret_key | default('')) | length > 0 else ['agents/host_audit.storage_secret_key'])
         + ([] if (_resolved.bucket | default('')) is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') else ['storage_bucket(S3 이름 규칙 위반)']) }}
    _lookup_failed: >-
      {{ host_audit_storage | length == 0 and
         (_host_audit_storage_kv.results | default([]) | rejectattr('skipped', 'defined') | list | length == 0
          or _host_audit_storage_kv.results | rejectattr('skipped', 'defined') | map(attribute='status', default=-1) | reject('in', [200, 404]) | list | length > 0) }}
  ansible.builtin.set_fact:
    _host_audit_storage_target: "{{ _resolved | combine({'region': _resolved.region | default('us-east-1', true)}) }}"
    _host_audit_storage_problem: >-
      {{ ('OpenBao 조회 실패 또는 자격증명 없음(VAULT_ROLE_ID/VAULT_SECRET_ID 또는 VAULT_TOKEN, 정책에 agents/host_audit 경로)'
          if _lookup_failed else ('보관 입력 누락: ' ~ (_missing | join(', ')) if _missing | length > 0 else '')) }}
  no_log: true
  when: _host_audit_storage_active | bool
