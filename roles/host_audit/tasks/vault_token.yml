---
# ==============================================================================
# Host Audit — 공용 읽기 지점 로그인 (러너 localhost 전용, 보관 자격증명 해석과 메일 설정 읽기가 함께 쓴다)
# ==============================================================================
# 읽기 직전마다 새로 로그인한다. 토큰 TTL(30분)보다 오래 걸릴 수 있는 앞 단계(드리프트 하위 실행, S3 조회·업로드)가
# 끝난 뒤에 메일 설정을 읽어도 만료된 토큰을 쓰지 않기 위해서다(`_vault_token`을 다시 정한다).
# 로그인에 실패해도 여기서 멈추지 않는다: 토큰은 빈 값이 되고 이어지는 읽기도 같은 이유로 실패해 문제(보관·메일)로 남는다.
# 우회 fixture(`openbao_fixture`)에서는 토큰이 늘 빈 값이다.
# ------------------------------------------------------------------------------
- name: "[AUD-500] Log in to OpenBao through the shared read point (fresh token before each read)"
  ansible.builtin.set_fact:
    _vault_token: "{{ lookup('openbao_doc', '@token', errors='ignore') | default('', true) }}"
  check_mode: false
  no_log: true
