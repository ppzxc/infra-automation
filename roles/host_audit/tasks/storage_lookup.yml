---
# ==============================================================================
# Host Audit — 보관 자격증명과 Audit Baseline 조회 (러너 localhost 전용, ADR-0009 §5, #125)
# ==============================================================================
# RustFS Host Audit 전용 버킷의 전용 키(Put·Get·List, Delete 없음)를 OpenBao agents/host_audit에서
# 읽고, 정기 실행이 남긴 포인터(baseline/<run_id>.json)로 직전 정기 실행(Audit Baseline)과
# 지난 12개월 정기 실행의 '해소' 기록을 가져온다. 백업·유지보수 키는 쓰지 않는다.
# 조회 실패는 보고서를 막지 않는다: 비교 없이 보고서를 만들고 storage_result.yml이 실행을 실패로 끝낸다.
# S3 요청은 ansible.builtin.uri + AWS SigV4 헤더(host_audit_s3_request)로 보낸다 — 러너에 boto3·aws-cli가 없다.
# ------------------------------------------------------------------------------
- name: Resolve the Host Audit storage key
  ansible.builtin.include_tasks: storage_credentials.yml

- name: "[AUD-503] List the Audit Baseline pointers of scheduled runs"
  vars:
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', '', {'list-type': '2', 'prefix': 'baseline/'}) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 301, 307, 400, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_pointer_list
  changed_when: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | length == 0

- name: "[AUD-504] Get the pointers of scheduled runs within the 12-month window"
  vars:
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', item) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  # loop is templated before when: an empty list when the listing did not succeed.
  loop: >-
    {{ ((_host_audit_pointer_list.content | host_audit_s3_list) | host_audit_pointer_keys(host_audit_run.started_at))
       if (_host_audit_pointer_list.status | default(-1)) == 200 else [] }}
  register: _host_audit_pointer_docs
  changed_when: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | length == 0
    - (_host_audit_pointer_list.status | default(-1)) == 200

- name: "[AUD-505] Get the findings of the Audit Baseline run"
  vars:
    _pointers: "{{ _host_audit_pointer_docs.results | default([]) | map(attribute='content', default='') | map('host_audit_json_loads') | select | list }}"
    _pick: "{{ _pointers | host_audit_baseline_pick(host_audit_run) }}"
    _req: "{{ _host_audit_storage_target | host_audit_s3_request('GET', _pick.findings_key) }}"
  ansible.builtin.uri:
    url: "{{ _req.url }}"
    method: GET
    headers: "{{ _req.headers }}"
    return_content: true
    status_code: [-1, 200, 403, 404, 500, 503]
    timeout: "{{ host_audit_storage_timeout }}"
    validate_certs: "{{ host_audit_storage_validate_certs | bool }}"
    ca_path: "{{ host_audit_storage_ca_file | default(omit, true) }}"
  register: _host_audit_baseline_get
  changed_when: false
  no_log: true
  when:
    - _host_audit_storage_active | bool
    - _host_audit_storage_problem | length == 0
    - (_host_audit_pointer_list.status | default(-1)) == 200
    - _pick is not none

- name: "[AUD-506] Decide the Audit Baseline state of this run"
  vars:
    _list_status: "{{ _host_audit_pointer_list.status | default(-1) }}"
    _doc_statuses: "{{ _host_audit_pointer_docs.results | default([]) | map(attribute='status', default=-1) | list }}"
    _pointers: "{{ _host_audit_pointer_docs.results | default([]) | map(attribute='content', default='') | map('host_audit_json_loads') | select | list }}"
    _baseline_wanted: "{{ _host_audit_baseline_get is defined and _host_audit_baseline_get is not skipped }}"
    _baseline_doc: "{{ (_host_audit_baseline_get.content | default('')) | host_audit_json_loads if _baseline_wanted else none }}"
    _failure: >-
      {{ _host_audit_storage_problem if _host_audit_storage_problem | length > 0
         else ('baseline/ 목록 조회 실패(status=' ~ _list_status ~ ')' if _list_status | int != 200
         else ('포인터 조회 실패(status=' ~ (_doc_statuses | reject('equalto', 200) | list | string) ~ ')'
               if _doc_statuses | reject('equalto', 200) | list | length > 0
         else ('Audit Baseline findings.json 조회 실패(status=' ~ (_host_audit_baseline_get.status | default(-1)) ~ ')'
               if _baseline_wanted and _baseline_doc is none else ''))) }}
    _disabled_reason: "{{ 'check 모드 실행' if ansible_check_mode else '보관 비활성(host_audit_storage_enabled=false)' }}"
  ansible.builtin.set_fact:
    host_audit_baseline_history: >-
      {{ {'state': 'disabled', 'reason': _disabled_reason}
         if not (_host_audit_storage_active | bool)
         else ({'state': 'failed', 'reason': _failure} if _failure | length > 0
         else {'state': 'ok', 'reason': '', 'baseline': _baseline_doc, 'pointers': _pointers}) }}
