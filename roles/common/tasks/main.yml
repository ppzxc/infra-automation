---
- name: "[COMMON-021] Ensure tzdata package is installed before timezone configuration (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: tzdata
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: "[COMMON-001] Set timezone"
  community.general.timezone:
    name: "{{ timezone | default('Asia/Seoul') }}"
  when:
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-002] Fix EOL CentOS 6 / 7 Vault Repositories"
  ansible.builtin.shell: |
    sed -i -e 's/^mirrorlist/#mirrorlist/g' -e 's|^#baseurl=http://mirror.centos.org/centos/$releasever|baseurl=https://vault.centos.org/{{ ansible_distribution_version }}|g' /etc/yum.repos.d/CentOS-*.repo
  when:
    - ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 7
    - not (_raw_path_effective | default(false) | bool)
  changed_when: false
  failed_when: false

- name: "[COMMON-003] Install common packages (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: "{{ common_packages + ['curl', 'iproute2', 'lsb-release', 'gnupg', 'htop', 'iotop', 'sudo', 'netcat-openbsd'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: "[COMMON-004] Install EPEL repository (RedHat/CentOS 7, Rocky 8, 9)"
  ansible.builtin.package:
    name: epel-release
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 7
    - not (_raw_path_effective | default(false) | bool)
  failed_when: false

- name: "[COMMON-005] Install common packages (RedHat/CentOS 6, 7 via YUM)"
  ansible.builtin.yum:
    name: "{{ common_packages + ['curl', 'iproute', 'sudo', 'nc'] }}"
    state: present
  when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version | int <= 7
    - not (_raw_path_effective | default(false) | bool)

# curl is intentionally omitted here: RHEL/Rocky 8+ ship `curl-minimal` by
# default, which already provides /usr/bin/curl and conflicts with the full
# `curl` package (Depsolve Error). Rely on the pre-installed curl-minimal
# instead of forcing a swap.
- name: "[COMMON-006] Install common packages (RHEL/Rocky 8, 9, 10 via DNF)"
  ansible.builtin.dnf:
    name: "{{ common_packages + ['iproute', 'sudo', 'nc'] }}"
    state: present
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version | int >= 8

- name: "[COMMON-007] Install optional diagnostic tools (htop, iotop, bat, ripgrep)"
  ansible.builtin.package:
    name:
      - htop
      - iotop
      - bat
      - ripgrep
    state: present
  failed_when: false
  when: not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-007-BAT] Ensure bat symlink exists for Debian/Ubuntu (batcat -> bat)"
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
    force: true
  when: ansible_os_family == "Debian"
  failed_when: false

# NTP 동기화 (CentOS 7+, Rocky Linux, Debian 계열: chrony / CentOS 6: ntp)
- name: "[COMMON-008] Configure Chrony NTP servers (Modern OS)"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    mode: '0644'
  when:
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
    - not (_raw_path_effective | default(false) | bool)
  notify: Restart chrony

- name: "[COMMON-009] Ensure Chrony service is running (Modern OS)"
  ansible.builtin.service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true
  when:
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-010] Ensure NTP service is running (CentOS 6 legacy)"
  ansible.builtin.service:
    name: ntpd
    state: started
    enabled: true
  when:
    - ansible_distribution == "CentOS" and ansible_distribution_major_version | int == 6
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-011] Apply sysctl kernel tuning"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_set: true
  loop: "{{ sysctl_settings | dict2items }}"
  when: not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-011-IPV6] Disable IPv6 via sysctl"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_set: true
  loop: "{{ sysctl_ipv6_settings | dict2items }}"
  when:
    - disable_ipv6 | default(false) | bool
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-011-EXTRA] Apply extra sysctl kernel tuning"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_set: true
  loop: "{{ sysctl_extra_settings | default({}) | dict2items }}"
  when:
    - sysctl_extra_settings is defined
    - sysctl_extra_settings | length > 0
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-012] Ensure account primary groups exist"
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - item.state | default('present') != 'absent'
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-013] Ensure accounts exist with tier-specific permissions"
  vars:
    # Supplementary groups: sudo/wheel for admin-tier accounts (or item.sudo
    # overridden explicitly), plus any explicit item.groups. When this
    # resolves empty (e.g. a non-admin account with no extra groups), `append`
    # must follow it to `false` — `ansible.builtin.user` hard-fails with
    # "append is True but all of the following are missing: groups" if
    # `append: true` is kept while `groups` is omitted.
    _account_groups: "{{ ( (['sudo' if ansible_os_family == 'Debian' else 'wheel'] if (item.sudo | default(item.tier | default('user') == 'admin')) else []) + (item.groups | default([])) ) | unique }}"
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    groups: "{{ _account_groups | join(',') if _account_groups | length > 0 else omit }}"
    append: "{{ _account_groups | length > 0 }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    comment: "{{ item.comment | default(omit) }}"
    uid: "{{ item.uid | default(omit) }}"
    create_home: true
    state: "{{ item.state | default('present') }}"
    remove: "{{ true if item.state | default('present') == 'absent' else false }}"
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-014] Configure passwordless sudoers for admin accounts"
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - item.state | default('present') != 'absent'
    - item.sudo | default(item.tier | default('user') == 'admin') | bool
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-015] Deploy SSH public keys for accounts"
  # A key listed in both accounts[].keys and accounts[].revoked_keys (e.g. rotation lag,
  # or a static inventory definition that hasn't dropped the old key yet) must never be
  # deployed here -- otherwise this task re-adds it and COMMON-022 removes it again every
  # single run, flip-flopping `changed` forever. Compared by type+blob (first two
  # whitespace-separated tokens) so a different comment or trailing newline still matches.
  vars:
    _key_fp: "{{ (item.1.split()[:2] | join(' ')) if (item.1 | trim | length > 0) else '' }}"
    _revoked_fps: >-
      {%- set fps = [] -%}
      {%- for rk in (item.0.revoked_keys | default([])) -%}
        {%- set _ = fps.append(rk.split()[:2] | join(' ')) -%}
      {%- endfor -%}
      {{ fps }}
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ accounts | default([]) | subelements('keys', skip_missing=True) }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.0.name is defined
    - item.0.state | default('present') != 'absent'
    - item.1 | trim | length > 0
    - _key_fp not in _revoked_fps
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-022] Revoke SSH public keys listed in accounts[].revoked_keys"
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: absent
  loop: "{{ accounts | default([]) | subelements('revoked_keys', skip_missing=True) }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.0.name is defined
    - item.0.state | default('present') != 'absent'
    - item.1 | trim | length > 0
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-023] Remove passwordless sudoers drop-in for removed accounts"
  # COMMON-014 only writes /etc/sudoers.d/90-<user> for present admin accounts and never
  # cleans it up, so a removed (state: absent) account's drop-in would otherwise survive
  # deletion. If the same username is ever recreated it would inherit instant NOPASSWD sudo.
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-{{ item.name }}"
    state: absent
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - item.state | default('present') == 'absent'
    - not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-016] Configure system security limits (nofile/nproc)"
  community.general.pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
    dest: /etc/security/limits.d/99-limits.conf
  loop: "{{ system_limits }}"
  when: not (_raw_path_effective | default(false) | bool)

- name: "[COMMON-017] Configure Systemd Journald retention limits"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-retention.conf
    content: |
      [Journal]
      SystemMaxUse={{ journald_max_use | default('2G') }}
      MaxRetentionSec={{ journald_max_retention | default('1month') }}
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_service_mgr == "systemd"
    - not (_raw_path_effective | default(false) | bool)
  failed_when: false

- name: "[COMMON-018] Deploy system-wide custom shell aliases"
  ansible.builtin.template:
    src: aliases.sh.j2
    dest: /etc/profile.d/99-aliases.sh
    owner: root
    group: root
    mode: '0644'
  when:
    - custom_shell_aliases is defined
    - custom_shell_aliases | length > 0

- name: "[COMMON-019] Deploy node environment variables drop-in (/etc/profile.d/98-node-env.sh)"
  ansible.builtin.template:
    src: node-env.sh.j2
    dest: /etc/profile.d/98-node-env.sh
    owner: root
    group: root
    mode: '0644'

- name: "[COMMON-020] Deploy system-wide environment variables (/etc/environment)"
  ansible.builtin.template:
    src: environment.j2
    dest: /etc/environment
    owner: root
    group: root
    mode: '0644'

# ==============================================================================
# Raw Provisioning Path (ADR-0005): CentOS 6/7 targets cannot run AnsiballZ
# modules, so the module-based tasks above (sysctl, accounts, sudoers, SSH keys,
# pam_limits) are replaced by ansible.builtin.raw equivalents. Enabled with
# _raw_path_effective=true; raw is skipped under --check (ADR-0005 Option A).
# Content-push tasks use the probe (sha256+mode) sentinel and the
# write-temp/validate/move helper; state-check tasks echo a changed marker.
# ==============================================================================
- name: Common raw provisioning path (CentOS 6/7)
  when: _raw_path_effective | default(false) | bool
  block:
    - name: "[COMMON-037] Fix EOL CentOS 6 / 7 Vault Repositories (raw)"
      ansible.builtin.raw: >-
        sed -i -e 's/^mirrorlist/#mirrorlist/g'
        -e 's|^#baseurl=http://mirror.centos.org/centos/$releasever|baseurl=https://vault.centos.org/{{ ansible_distribution_version }}|g'
        /etc/yum.repos.d/CentOS-*.repo
      changed_when: false
      failed_when: false

    - name: "[COMMON-038] Install common packages (CentOS 6, 7 via YUM, raw)"
      ansible.builtin.raw: "{{ (common_packages + ['curl', 'iproute', 'sudo', 'nc']) | raw_yum_cmd }}"
      register: common_raw_packages
      changed_when: common_raw_packages.stdout | default('') | raw_changed
      failed_when: common_raw_packages.rc | default(0) != 0

    - name: "[COMMON-039] Install optional diagnostic tools (raw)"
      ansible.builtin.raw: "{{ ['htop', 'iotop', 'bat', 'ripgrep'] | raw_yum_cmd(true) }}"
      register: common_raw_optional
      changed_when: common_raw_optional.stdout | default('') | raw_changed
      failed_when: false

    # /etc/sysctl.d is absent on CentOS 6, so both OS versions use sysctl.conf.
    - name: "[COMMON-024] Read current sysctl.conf (raw)"
      ansible.builtin.raw: "{{ '/etc/sysctl.conf' | raw_read_cmd }}"
      register: common_raw_sysctl_current
      changed_when: false
      failed_when: (common_raw_sysctl_current.stdout | default('') | raw_read_extract(true)) is none

    - name: "[COMMON-025] Probe sysctl.conf hash and mode (raw)"
      ansible.builtin.raw: "{{ '/etc/sysctl.conf' | raw_probe_cmd }}"
      register: common_raw_sysctl_probe
      changed_when: false
      failed_when: false

    - name: "[COMMON-026] Apply sysctl kernel tuning via write-temp/validate/move (raw)"
      ansible.builtin.raw: >-
        {{ common_raw_sysctl_content | raw_push_cmd('/etc/sysctl.conf', 'root', 'root', '0644', 'true') }}
      vars:
        common_raw_sysctl_settings: >-
          {{ sysctl_settings
             | combine(sysctl_ipv6_settings if (disable_ipv6 | default(false) | bool) else {})
             | combine(sysctl_extra_settings | default({})) }}
        common_raw_sysctl_content: >-
          {{ (common_raw_sysctl_current.stdout | raw_read_extract(true))
             | raw_set_directives(common_raw_sysctl_settings | raw_sysctl_directives) }}
      register: common_raw_sysctl_push
      changed_when: >-
        (common_raw_sysctl_probe.stdout | default('')) | raw_push_changed(common_raw_sysctl_content, '0644', 'root', 'root')
      failed_when: common_raw_sysctl_push.rc | default(0) != 0
      notify: Apply sysctl (raw)

    # Module `sysctl_set: true` parity: the running kernel value is aligned on
    # every run, not only when sysctl.conf changes.
    - name: "[COMMON-040] Align live sysctl values with the desired settings (raw)"
      ansible.builtin.raw: "{{ common_raw_sysctl_settings | raw_sysctl_live_cmd }}"
      vars:
        common_raw_sysctl_settings: >-
          {{ sysctl_settings
             | combine(sysctl_ipv6_settings if (disable_ipv6 | default(false) | bool) else {})
             | combine(sysctl_extra_settings | default({})) }}
      register: common_raw_sysctl_live
      changed_when: common_raw_sysctl_live.stdout | default('') | raw_changed
      failed_when: common_raw_sysctl_live.rc | default(0) != 0

    - name: "[COMMON-027] Ensure account primary groups exist (raw)"
      ansible.builtin.raw: "{{ item.name | raw_group_cmd(item.gid | default(none)) }}"
      register: common_raw_groups
      changed_when: common_raw_groups.stdout | default('') | raw_changed
      failed_when: common_raw_groups.rc | default(0) != 0
      loop: "{{ accounts | default([]) }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.name is defined
        - item.state | default('present') != 'absent'

    - name: "[COMMON-028] Ensure accounts exist with tier-specific permissions (raw)"
      vars:
        _account_groups: "{{ ( (['wheel'] if (item.sudo | default(item.tier | default('user') == 'admin')) else []) + (item.groups | default([])) ) | unique }}"
      ansible.builtin.raw: >-
        {{ item.name | raw_user_cmd(_account_groups, item.shell | default('/bin/bash'),
        item.comment | default(none), item.uid | default(none), item.state | default('present')) }}
      register: common_raw_users
      changed_when: common_raw_users.stdout | default('') | raw_changed
      failed_when: common_raw_users.rc | default(0) != 0
      loop: "{{ accounts | default([]) }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.name is defined

    - name: "[COMMON-029] Probe sudoers drop-in hash and mode (raw)"
      ansible.builtin.raw: "{{ ('/etc/sudoers.d/90-' ~ item.name) | raw_probe_cmd }}"
      register: common_raw_sudoers_probe
      changed_when: false
      failed_when: false
      loop: "{{ accounts | default([]) }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.name is defined
        - item.state | default('present') != 'absent'
        - item.sudo | default(item.tier | default('user') == 'admin') | bool

    - name: "[COMMON-030] Configure passwordless sudoers via write-temp/validate/move (raw)"
      vars:
        _sudoers_content: "{{ item.name | raw_sudoers_line }}"
        _sudoers_probe: >-
          {{ (common_raw_sudoers_probe.results | selectattr('item.name', 'equalto', item.name) | first).stdout | default('') }}
      ansible.builtin.raw: >-
        {{ _sudoers_content | raw_push_cmd('/etc/sudoers.d/90-' ~ item.name, 'root', 'root', '0440', 'visudo -cf %s') }}
      register: common_raw_sudoers_push
      changed_when: _sudoers_probe | raw_push_changed(_sudoers_content, '0440', 'root', 'root')
      failed_when: common_raw_sudoers_push.rc | default(0) != 0
      loop: "{{ accounts | default([]) }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.name is defined
        - item.state | default('present') != 'absent'
        - item.sudo | default(item.tier | default('user') == 'admin') | bool

    - name: "[COMMON-031] Deploy SSH public keys for accounts (raw)"
      # Same revoked-key exclusion as COMMON-015 (compared by type+blob).
      vars:
        _key_fp: "{{ (item.1.split()[:2] | join(' ')) if (item.1 | trim | length > 0) else '' }}"
        _revoked_fps: >-
          {%- set fps = [] -%}
          {%- for rk in (item.0.revoked_keys | default([])) -%}
            {%- set _ = fps.append(rk.split()[:2] | join(' ')) -%}
          {%- endfor -%}
          {{ fps }}
      ansible.builtin.raw: "{{ item.0.name | raw_authorized_key_cmd(item.1, 'present') }}"
      register: common_raw_keys
      changed_when: common_raw_keys.stdout | default('') | raw_changed
      failed_when: common_raw_keys.rc | default(0) != 0
      loop: "{{ accounts | default([]) | subelements('keys', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.0.name is defined
        - item.0.state | default('present') != 'absent'
        - item.1 | trim | length > 0
        - _key_fp not in _revoked_fps

    - name: "[COMMON-032] Revoke SSH public keys listed in accounts[].revoked_keys (raw)"
      ansible.builtin.raw: "{{ item.0.name | raw_authorized_key_cmd(item.1, 'absent') }}"
      register: common_raw_revoked_keys
      changed_when: common_raw_revoked_keys.stdout | default('') | raw_changed
      failed_when: common_raw_revoked_keys.rc | default(0) != 0
      loop: "{{ accounts | default([]) | subelements('revoked_keys', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.0.name is defined
        - item.0.state | default('present') != 'absent'
        - item.1 | trim | length > 0

    - name: "[COMMON-033] Remove passwordless sudoers drop-in for removed accounts (raw)"
      ansible.builtin.raw: "{{ ('/etc/sudoers.d/90-' ~ item.name) | raw_rm_cmd }}"
      register: common_raw_sudoers_removed
      changed_when: common_raw_sudoers_removed.stdout | default('') | raw_changed
      failed_when: common_raw_sudoers_removed.rc | default(0) != 0
      loop: "{{ accounts | default([]) }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      when:
        - accounts is defined
        - accounts | length > 0
        - item.name is defined
        - item.state | default('present') == 'absent'

    - name: "[COMMON-036] Read current security limits file (raw)"
      ansible.builtin.raw: "{{ '/etc/security/limits.d/99-limits.conf' | raw_read_cmd }}"
      register: common_raw_limits_current
      changed_when: false
      failed_when: (common_raw_limits_current.stdout | default('') | raw_read_extract(true)) is none

    - name: "[COMMON-034] Probe security limits file hash and mode (raw)"
      ansible.builtin.raw: "{{ '/etc/security/limits.d/99-limits.conf' | raw_probe_cmd }}"
      register: common_raw_limits_probe
      changed_when: false
      failed_when: false

    # Merged in place like pam_limits: unrelated lines in the file are kept.
    - name: "[COMMON-035] Configure system security limits via write-temp/validate/move (raw)"
      ansible.builtin.raw: >-
        {{ common_raw_limits_content | raw_push_cmd('/etc/security/limits.d/99-limits.conf', 'root', 'root', '0644', 'true') }}
      vars:
        common_raw_limits_content: >-
          {{ (common_raw_limits_current.stdout | raw_read_extract(true))
             | raw_set_directives(system_limits | raw_limits_directives) }}
      register: common_raw_limits_push
      changed_when: >-
        (common_raw_limits_probe.stdout | default('')) | raw_push_changed(common_raw_limits_content, '0644', 'root', 'root')
      failed_when: common_raw_limits_push.rc | default(0) != 0

# Raw Provisioning Path (ADR-0005), CentOS 6 only: ntpd replaces chrony (COMMON-010
# raw equivalent). The content push uses the probe sentinel and the
# write-temp/validate/move helper; the restart is delegated to `Restart ntpd`.
# CentOS 7 (chrony) is unaffected.
- name: Common raw NTP path, ntpd (CentOS 6)
  when:
    - _raw_path_effective | default(false) | bool
    - ansible_distribution == "CentOS"
    - ansible_distribution_major_version | int == 6
  block:
    - name: "[COMMON-041] Install ntp package (CentOS 6, raw)"
      ansible.builtin.raw: "{{ ['ntp'] | raw_yum_cmd }}"
      register: common_raw_ntp_install
      changed_when: common_raw_ntp_install.stdout | default('') | raw_changed
      failed_when: common_raw_ntp_install.rc | default(0) != 0

    - name: "[COMMON-042] Probe ntp.conf hash and mode (raw)"
      ansible.builtin.raw: "{{ '/etc/ntp.conf' | raw_probe_cmd }}"
      register: common_raw_ntp_probe
      changed_when: false
      failed_when: common_raw_ntp_probe.rc | default(0) != 0

    - name: "[COMMON-043] Configure ntpd servers via write-temp/validate/move (raw)"
      ansible.builtin.raw: >-
        {{ common_raw_ntp_content | raw_push_cmd('/etc/ntp.conf', 'root', 'root', '0644', 'true') }}
      vars:
        common_raw_ntp_content: "{{ lookup('ansible.builtin.template', 'ntp.conf.j2') }}"
      register: common_raw_ntp_push
      changed_when: >-
        (common_raw_ntp_probe.stdout | default('')) | raw_push_changed(common_raw_ntp_content, '0644', 'root', 'root')
      failed_when: common_raw_ntp_push.rc | default(0) != 0
      notify: Restart ntpd

    - name: "[COMMON-044] Ensure ntpd service is running and enabled (raw)"
      ansible.builtin.raw: "{{ 'ntpd' | raw_service_cmd }}"
      register: common_raw_ntp_service
      changed_when: common_raw_ntp_service.stdout | default('') | raw_changed
      failed_when: common_raw_ntp_service.rc | default(0) != 0

# Raw Provisioning Path (ADR-0005), CentOS 7 only: timezone, EPEL, chrony and
# journald retention. CentOS 6 has no chrony/journald (Upstart) and is skipped;
# CentOS 7 is always systemd, so COMMON-017's ansible_service_mgr gate becomes
# the explicit major-version gate of this block. Content pushes use the probe
# sentinel and write-temp/validate/move helper; `Restart chrony` is delegated
# to the raw handler.
- name: Common raw path, CentOS 7 only tasks
  when:
    - _raw_path_effective | default(false) | bool
    - ansible_distribution == "CentOS"
    - ansible_distribution_major_version | int == 7
  block:
    - name: "[COMMON-045] Set timezone (CentOS 7, raw)"
      ansible.builtin.raw: "{{ (timezone | default('Asia/Seoul')) | raw_timezone_cmd }}"
      register: common_raw_timezone
      changed_when: common_raw_timezone.stdout | default('') | raw_changed
      failed_when: common_raw_timezone.rc | default(0) != 0

    - name: "[COMMON-046] Install EPEL repository (CentOS 7, raw)"
      ansible.builtin.raw: "{{ ['epel-release'] | raw_yum_cmd }}"
      register: common_raw_epel
      changed_when: common_raw_epel.stdout | default('') | raw_changed
      failed_when: false

    - name: "[COMMON-047] Probe chrony.conf hash and mode (CentOS 7, raw)"
      ansible.builtin.raw: "{{ '/etc/chrony.conf' | raw_probe_cmd }}"
      register: common_raw_chrony_probe
      changed_when: false
      failed_when: common_raw_chrony_probe.rc | default(0) != 0

    - name: "[COMMON-048] Configure Chrony NTP servers via write-temp/validate/move (CentOS 7, raw)"
      ansible.builtin.raw: >-
        {{ common_raw_chrony_content | raw_push_cmd('/etc/chrony.conf', 'root', 'root', '0644', 'true') }}
      vars:
        common_raw_chrony_content: "{{ lookup('ansible.builtin.template', 'chrony.conf.j2') }}"
      register: common_raw_chrony_push
      changed_when: >-
        (common_raw_chrony_probe.stdout | default('')) | raw_push_changed(common_raw_chrony_content, '0644', 'root', 'root')
      failed_when: common_raw_chrony_push.rc | default(0) != 0
      notify: Restart chrony

    - name: "[COMMON-049] Ensure Chrony service is running and enabled (CentOS 7, raw)"
      ansible.builtin.raw: "{{ 'chronyd' | raw_service_cmd }}"
      register: common_raw_chrony_service
      changed_when: common_raw_chrony_service.stdout | default('') | raw_changed
      failed_when: common_raw_chrony_service.rc | default(0) != 0

    - name: "[COMMON-050] Probe journald retention drop-in hash and mode (CentOS 7, raw)"
      ansible.builtin.raw: "{{ '/etc/systemd/journald.conf.d/99-retention.conf' | raw_probe_cmd }}"
      register: common_raw_journald_probe
      changed_when: false
      failed_when: common_raw_journald_probe.rc | default(0) != 0

    - name: "[COMMON-051] Configure Systemd Journald retention limits via write-temp/validate/move (CentOS 7, raw)"
      ansible.builtin.raw: >-
        mkdir -p /etc/systemd/journald.conf.d && {{ common_raw_journald_content | raw_push_cmd('/etc/systemd/journald.conf.d/99-retention.conf', 'root', 'root', '0644', 'true') }}
      vars:
        common_raw_journald_content: |
          [Journal]
          SystemMaxUse={{ journald_max_use | default('2G') }}
          MaxRetentionSec={{ journald_max_retention | default('1month') }}
      register: common_raw_journald_push
      changed_when: >-
        (common_raw_journald_probe.stdout | default('')) | raw_push_changed(common_raw_journald_content, '0644', 'root', 'root')
      failed_when: false
