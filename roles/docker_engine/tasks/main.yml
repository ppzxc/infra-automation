---
# 1. Purge legacy and conflicting container packages (Podman, Buildah, Skopeo, old Docker)
- name: "[DOC-001] Remove conflicting packages and Podman stack (RedHat/Rocky)"
  ansible.builtin.package:
    name:
      - podman
      - podman-docker
      - podman-plugins
      - buildah
      - skopeo
      - runc
      - containernetworking-plugins
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
    state: absent
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)


- name: "[DOC-002] Remove conflicting packages and old Docker stack (Debian/Ubuntu)"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
  when: ansible_os_family == "Debian"

# 2. Setup Official Docker Repository
- name: "[DOC-003] Install Docker repository prerequisites (RedHat/Rocky)"
  ansible.builtin.package:
    name:
      - dnf-plugins-core
    state: present
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[DOC-004] Configure Docker CE official repository (RedHat/Rocky)"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/centos/docker-ce.repo"
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[DOC-005] Install Docker repository prerequisites (Debian/Ubuntu)"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "[DOC-006] Create keyrings directory for apt (Debian/Ubuntu)"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: "[DOC-007] Download Docker GPG key (Debian/Ubuntu)"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: "[DOC-008] Configure Docker CE repository (Debian/Ubuntu)"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_os_family == "Debian"

# 3. Install Docker CE Engine and Plugins
- name: "[DOC-009] Install latest Docker CE and Compose plugin packages"
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - acl
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# 4. Deploy Hardened Docker daemon.json
- name: "[DOC-010] Create /etc/docker directory"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-011] Deploy hardened Docker daemon configuration"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
  notify: Restart docker

# 5. Enable and Start Docker Service
- name: "[DOC-012] Ensure Docker and containerd services are started and enabled"
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - docker
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# 6. Add Admin & Docker enabled users to docker group
- name: "[DOC-013] Add admin user to docker group"
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - item.state | default('present') != 'absent'
    - item.docker | default(item.tier | default('user') in ['admin', 'operator']) | bool
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# ==============================================================================
# 7. ADR-0002 Account, Directory Layout, and Permission Inheritance Standard
# ==============================================================================
- name: "[DOC-014] Ensure dockermgmt system group exists (GID 2000)"
  ansible.builtin.group:
    name: "{{ docker_mgmt_group }}"
    gid: "{{ docker_mgmt_gid }}"
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-015] Ensure dockersvc system user exists (UID 2000)"
  ansible.builtin.user:
    name: "{{ docker_svc_user }}"
    uid: "{{ docker_svc_uid }}"
    group: "{{ docker_mgmt_group }}"
    groups:
      - "{{ docker_mgmt_group }}"
      - docker
    shell: /sbin/nologin
    create_home: false
    system: true
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-016] Create FHS standard service and data directories (/opt/services, /data, /backup)"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop: "{{ docker_fhs_directories }}"
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-017] Configure POSIX default and access ACLs for docker management"
  ansible.posix.acl:
    path: "{{ item.path }}"
    entity: "{{ docker_mgmt_group }}"
    etype: group
    permissions: "{{ item.perms }}"
    default: "{{ item.default }}"
    state: present
  loop:
    - { path: '/opt/services', perms: 'rwx', default: true }
    - { path: '/opt/services', perms: 'rwx', default: false }
    - { path: '/data', perms: 'rwx', default: true }
    - { path: '/data', perms: 'rwx', default: false }
    - { path: '/backup', perms: 'rwx', default: true }
    - { path: '/backup', perms: 'rwx', default: false }
  when:
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
    - not (ansible_check_mode | default(false))

- name: "[DOC-018] Deploy docker management session umask script (/etc/profile.d/docker_mgmt.sh)"
  ansible.builtin.copy:
    content: |
      # Enforce umask 0002 for dockermgmt group members (ADR-0002)
      if id -Gn 2>/dev/null | grep -qw "{{ docker_mgmt_group }}"; then
          umask 0002
      fi
    dest: /etc/profile.d/docker_mgmt.sh
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-019] Add admin and operator users to dockermgmt group"
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - "{{ docker_mgmt_group }}"
      - docker
    append: true
  loop: "{{ accounts | default([]) }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.name is defined
    - item.state | default('present') != 'absent'
    - item.docker | default(item.tier | default('user') in ['admin', 'operator']) | bool
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-020] Create convenience symlinks in operator home directory"
  ansible.builtin.file:
    src: "{{ item.1.src }}"
    dest: "/home/{{ item.0.name }}/{{ item.1.dest }}"
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    state: link
    force: false
  loop: "{{ accounts | default([]) | product([{'src': '/opt/services', 'dest': 'services'}, {'src': '/data', 'dest': 'data'}]) | list }}"
  when:
    - accounts is defined
    - accounts | length > 0
    - item.0.name is defined
    - item.0.state | default('present') != 'absent'
    - item.0.docker | default(item.0.tier | default('user') in ['admin', 'operator']) | bool
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
