---
# 1. Purge legacy and conflicting container packages (Podman, Buildah, Skopeo, old Docker)
- name: "[DOC-001] Remove conflicting packages and Podman stack (RedHat/Rocky)"
  ansible.builtin.package:
    name:
      - podman
      - podman-docker
      - podman-plugins
      - buildah
      - skopeo
      - runc
      - containernetworking-plugins
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
    state: absent
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)


- name: "[DOC-002] Remove conflicting packages and old Docker stack (Debian/Ubuntu)"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
  when: ansible_os_family == "Debian"

# 2. Setup Official Docker Repository
- name: "[DOC-003] Install Docker repository prerequisites (RedHat/Rocky)"
  ansible.builtin.package:
    name:
      - dnf-plugins-core
    state: present
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[DOC-004] Configure Docker CE official repository (RedHat/Rocky)"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/centos/docker-ce.repo"
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "RedHat" and (ansible_distribution_major_version | int >= 7)

- name: "[DOC-005] Install Docker repository prerequisites (Debian/Ubuntu)"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "[DOC-006] Create keyrings directory for apt (Debian/Ubuntu)"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: "[DOC-007] Download Docker GPG key (Debian/Ubuntu)"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: "[DOC-008] Configure Docker CE repository (Debian/Ubuntu)"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_os_family == "Debian"

# 3. Install Docker CE Engine and Plugins
- name: "[DOC-009] Install latest Docker CE and Compose plugin packages"
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - acl
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# 4. Deploy Hardened Docker daemon.json
- name: "[DOC-010] Create /etc/docker directory"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-011] Deploy hardened Docker daemon configuration"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
  notify: Restart docker

# 5. Enable and Start Docker Service
- name: "[DOC-012] Ensure Docker and containerd services are started and enabled"
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - docker
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# 6. Add Admin User to docker group
- name: "[DOC-013] Add admin user to docker group"
  ansible.builtin.user:
    name: "{{ admin_user | default('ppzxc') }}"
    groups: docker
    append: true
  when:
    - admin_user is defined
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

# ==============================================================================
# 7. ADR-0002 Account, Directory Layout, and Permission Inheritance Standard
# ==============================================================================
- name: "[DOC-014] Ensure dockermgmt system group exists (GID 2000)"
  ansible.builtin.group:
    name: "{{ docker_mgmt_group }}"
    gid: "{{ docker_mgmt_gid }}"
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-015] Ensure dockersvc system user exists (UID 998)"
  ansible.builtin.user:
    name: "{{ docker_svc_user }}"
    uid: "{{ docker_svc_uid }}"
    group: "{{ docker_mgmt_group }}"
    groups: docker
    append: true
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-016] Create FHS standard service and data directories (/opt/services, /data, /backup)"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop: "{{ docker_fhs_directories }}"
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-017] Configure POSIX default and access ACLs for docker management"
  ansible.posix.acl:
    path: "{{ item.0.path }}"
    entity: "{{ docker_mgmt_group }}"
    etype: group
    permissions: rwx
    default: "{{ item.1 }}"
    state: present
  loop: "{{ docker_fhs_directories | product([true, false]) | list }}"
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-018] Deploy docker management session umask script (/etc/profile.d/docker_mgmt.sh)"
  ansible.builtin.copy:
    dest: /etc/profile.d/docker_mgmt.sh
    content: |
      # Managed by Ansible - ADR-0002 docker management session umask
      if id -nG "$USER" 2>/dev/null | grep -qw "dockermgmt"; then
          umask 002
      fi
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-019] Add admin and operator users to dockermgmt group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - "{{ docker_mgmt_group }}"
      - docker
    append: true
  loop: "{{ docker_operators | default([admin_user | default('ppzxc')]) }}"
  when:
    - (docker_operators is defined and docker_operators | length > 0) or admin_user is defined
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

- name: "[DOC-020] Create convenience symlinks in operator home directory"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "/home/{{ item.user }}/{{ item.dest }}"
    state: link
    force: false
  loop:
    - { user: "{{ admin_user | default('ppzxc') }}", src: "/opt/services", dest: "services" }
    - { user: "{{ admin_user | default('ppzxc') }}", src: "/data", dest: "data" }
  when:
    - admin_user is defined
    - ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"
  failed_when: false

