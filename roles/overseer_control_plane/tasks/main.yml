---
# 1. Host Kernel & System Parameter Tuning
- name: "[CP-001] Configure kernel sysctl parameters for Overseer Control Plane"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-overseer.conf
  with_dict: "{{ overseer_sysctl_settings }}"

- name: "[CP-002] Configure security limits for OpenBao memlock and process limits"
  ansible.builtin.template:
    src: limits-overseer.conf.j2
    dest: /etc/security/limits.d/99-overseer.conf
    owner: root
    group: root
    mode: '0644'

# 2. Directory Structure and Volume Permissions
- name: "[CP-003] Create Overseer control plane persistent directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ overseer_directories }}"

# 3. Systemd Service Unit for Automatic Control Plane Orchestration
- name: "[CP-004] Deploy Overseer systemd service unit"
  ansible.builtin.template:
    src: overseer.service.j2
    dest: "/etc/systemd/system/{{ overseer_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  when: overseer_systemd_enabled | bool

- name: "[CP-005] Enable Overseer systemd service"
  ansible.builtin.systemd:
    name: "{{ overseer_service_name }}"
    enabled: true
  when: overseer_systemd_enabled | bool
