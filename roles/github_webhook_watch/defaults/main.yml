---
# ==============================================================================
# GitHub 조직 웹훅 전달 점검 역할 기본값 (docs/github_webhook_watch.md, Spec #399 / Ticket-5, #511 / Ticket-19)
# 공개 저장소이므로 자격·URL·조직명은 두지 않는다. 값은 공용 읽기 지점(lookup 'openbao_doc')으로 읽은 문서 `gww_docs`에서만 온다
# (필수 문서·키는 vars/main.yml의 github_webhook_watch_openbao_required). 대체값은 없다.
# ==============================================================================

# 점검 주기(시간)와 재전송 가능 기간(시간). 재전송 가능 기간은 GitHub 공식 문서의 "최근 3일"이다(Ticket-1).
# 주기는 기간보다 훨씬 짧아야 한다(GWW-001이 주기 < 기간을 검사한다). Semaphore 예약은 `0 */6 * * *`.
gww_check_interval_hours: 6
gww_redelivery_window_hours: 72
# 전달 목록을 따라갈 최대 페이지 수(100건/페이지). 도달하면 하트비트 deliveries_truncated로 알린다.
gww_max_pages: 10

# GitHub 조직 웹훅 API. 토큰은 조직 권한 Webhooks(read, 재전송은 write)만 가진 만료일 있는 값이다.
gww_github_api_url: https://api.github.com
gww_github_token: "{{ gww_docs['secrets/services/github/org_hooks_read'].token }}"
gww_github_org: "{{ gww_docs['inventory/config/github_webhook_watch'].github_org }}"
# 의도한 웹훅의 수신 URL(웹훅 설정의 config.url). 이 값으로 훅을 찾는다. 값은 OpenBao에만 둔다.
gww_hook_url: "{{ gww_docs['inventory/config/github_webhook_watch'].hook_url }}"
gww_validate_certs: true

# 의도한 구독 이벤트(Ticket-1 확정 목록). 공개해도 되는 값이라 역할 기본값이고, 바꾸려면 코드 리뷰를 거친다.
gww_expected_events:
  - meta
  - organization
  - member
  - membership
  - org_block
  - branch_protection_rule
  - deploy_key
  - custom_property
  - repository
  - public
  - team
  - repository_ruleset
  - personal_access_token_request

# 하트비트를 남길 OpenObserve 연결. 스트림은 보안 로그다(service_name=github-webhook-watch).
gww_o2_endpoint: "{{ gww_docs['inventory/services/openobserve'].url }}"
gww_o2_org: "{{ gww_docs['inventory/config/github_webhook_watch'].o2_org }}"
gww_o2_user: "{{ gww_docs['secrets/services/openobserve/ingest'].username }}"
gww_o2_password: "{{ gww_docs['secrets/services/openobserve/ingest'].password }}"
gww_o2_validate_certs: "{{ gww_o2_endpoint is match('^https://') }}"
gww_heartbeat_stream: security_logs
gww_heartbeat_service: github-webhook-watch
