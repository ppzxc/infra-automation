---
# ==============================================================================
# OpenObserve 설정 as code (ADR-0008, Spec #93 / Ticket-2)
# ==============================================================================
# VRL ingest function(sshd/sudo 해석) + security_logs 파이프라인 + 통지 대상(webhook) + 알림 규칙을
# OpenObserve API에 반영한다. 호스트에는 접속하지 않는다(컨트롤러 전용).
# GET으로 현재 상태와 비교해 차이가 있는 객체만 POST/PUT하며, --check에서는 변경 예정 목록만 보여 준다.
# 시크릿(API 계정, webhook URL/토큰)은 OpenBao agents/openobserve에서 조회한다 — Git에 두지 않는다.
#
# Semaphore 템플릿: OpenObserve — Config (localhost, 인벤토리 무관)
# 실행 예시:
#   ansible-playbook playbooks/openobserve_config.yml --check
#   ansible-playbook playbooks/openobserve_config.yml
# ==============================================================================
- name: Apply OpenObserve configuration as code
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - role: openobserve_config
