---
# ==============================================================================
# 정기 유지보수 및 보안 패치 플레이북
# ==============================================================================

- name: Maintenance and Security Updates for Overseer Control Plane
  hosts: overseer
  become: true
  gather_facts: false
  pre_tasks:
    - name: Detect raw provisioning path
      ansible.builtin.import_tasks: common/detect_raw_path.yml
    - name: Gather facts (skipped on raw path, OS facts come from detection)
      ansible.builtin.setup:
      when: not (_raw_path_effective | default(false) | bool)
  roles:
    - role: common
      tags: [common, update]
    - role: security
      tags: [security, audit]
    - role: docker_engine
      tags: [docker]
    - role: monitoring
      tags: [monitoring]

- name: Maintenance and Security Updates for Target Hosts
  hosts: servers
  become: true
  gather_facts: false
  pre_tasks:
    - name: Detect raw provisioning path
      ansible.builtin.import_tasks: common/detect_raw_path.yml
    - name: Gather facts (skipped on raw path, OS facts come from detection)
      ansible.builtin.setup:
      when: not (_raw_path_effective | default(false) | bool)
  roles:
    - role: common
      tags: [common, update]
    - role: security
      tags: [security, audit]
    - role: monitoring
      tags: [monitoring]
