---
# ==============================================================================
# 정기 유지보수 및 보안 패치 플레이북
# ==============================================================================

- name: Maintenance and Security Updates for Overseer Control Plane
  hosts: overseer
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common, update]
    - role: security
      tags: [security, audit]
    - role: docker_engine
      tags: [docker]

- name: Maintenance and Security Updates for Target Hosts
  hosts: servers
  become: true
  gather_facts: false
  pre_tasks:
    - name: Detect raw provisioning path and gather facts
      ansible.builtin.import_tasks: common/detect_raw_path.yml
      tags: [always]
  roles:
    - role: common
      tags: [common, update]
    - role: security
      tags: [security, audit]
