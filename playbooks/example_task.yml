---
# ==============================================================================
# 신규 플레이북 작성 템플릿 예제 (Example Target Host Playbook)
# ==============================================================================
# 사용 목적:
#   OpenBao 자격증명 조회, SSH 키 복호화, 지능형 접속 진단 및 부트스트랩 폴백을
#   자동으로 처리하고 원격 호스트에서 임의의 작업을 안전하게 수행하는 예제 플레이북입니다.
#
# 실행 방법:
#   1) 전체 서버 대상:
#      ansible-playbook -i inventory/hosts.yml playbooks/example_task.yml
#
#   2) 특정 단일 호스트 또는 그룹 대상 (target_hosts 변수 사용):
#      ansible-playbook -i inventory/hosts.yml playbooks/example_task.yml -e "target_hosts=ns0332"
#
#   3) Semaphore UI Task Template 등록 시:
#      - Playbook: playbooks/example_task.yml
#      - Environment / Extra vars: {"target_hosts": "ns0332"} (선택 사항)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1단계: OpenBao 자격증명 조회 및 대상 호스트 연결 자동 해결 (필수)
# ------------------------------------------------------------------------------
- name: Resolve OpenBao Connection and Credentials
  ansible.builtin.import_playbook: common/resolve_connection.yml

# ------------------------------------------------------------------------------
# 2단계: 대상 호스트 작업 실행 (커스텀 태스크 정의)
# ------------------------------------------------------------------------------
- name: Execute Target Host Maintenance or Ad-hoc Tasks
  hosts: "{{ target_hosts | default('servers:loadbalancers') }}"
  become: true
  gather_facts: false

  vars:
    # Docker 컨테이너(Semaphore) 내부의 Python 가상환경 경로 누출 방지 및 원격 python3 강제
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Ensure target python interpreter is strictly /usr/bin/python3
      ansible.builtin.set_fact:
        ansible_python_interpreter: >-
          {{
            ansible_python_interpreter
            if (ansible_python_interpreter is defined and
                ansible_python_interpreter | length > 0 and
                'semaphore' not in (ansible_python_interpreter | string) and
                'venv' not in (ansible_python_interpreter | string) and
                not (ansible_python_interpreter | string).startswith('/tmp/') and
                (ansible_python_interpreter | string) != 'auto_silent')
            else '/usr/bin/python3'
          }}

    - name: Gather facts from target host using remote python3
      ansible.builtin.setup:

  tasks:
    - name: Display connection and host summary
      ansible.builtin.debug:
        msg:
          "호스트명": "{{ inventory_hostname }}"
          "IP 주소": "{{ ansible_host | default('N/A') }}"
          "OS 정보": "{{ ansible_distribution }} {{ ansible_distribution_version }} (커널 {{ ansible_kernel }})"
          "접속 사용자": "{{ ansible_user }} (Sudo 승격: {{ ansible_become | default(true) }})"
          "Python 인터프리터": "{{ ansible_python_interpreter }}"

    - name: Collect system uptime and kernel architecture
      ansible.builtin.command: uname -mrs
      register: _system_info
      changed_when: false

    - name: Check system resource utilization (disk space)
      ansible.builtin.command: df -h /
      register: _disk_info
      changed_when: false

    - name: Output diagnostic result
      ansible.builtin.debug:
        msg:
          "커널 정보": "{{ _system_info.stdout }}"
          "루트 파티션 용량": "{{ _disk_info.stdout_lines | default([]) }}"

# ------------------------------------------------------------------------------
# 3단계: 컨트롤러 임시 키 정리 (필수)
# ------------------------------------------------------------------------------
- name: Cleanup Controller Temporary Credentials
  ansible.builtin.import_playbook: common/cleanup_connection.yml
