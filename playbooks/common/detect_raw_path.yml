---
# ==============================================================================
# Raw Provisioning Path 자동 판별 (ADR-0005 §2.5)
# ==============================================================================
# /etc/redhat-release 메이저 버전이 6/7이면 raw 경로로 진입한다. 명시된 인벤토리
# raw_provisioning_path(true/false)는 자동 판별보다 우선한다. 이 플레이가
# raw_provisioning_path를 직접 읽는 유일한 곳이며, 역할의 게이트/핸들러는
# 결과 fact(_raw_path_effective)만 읽는다.
# import_tasks로 site.yml/maintenance.yml의 pre_tasks에서 포함된다(플레이 인덱스 불변).
# 판별 프로브는 읽기 전용이므로 --check에서도 실행된다(ADR-0005 §2.4 예외).
# ------------------------------------------------------------------------------
# 파일 없음/인식 불가(Rocky, Ubuntu 등)는 실패가 아니라 "raw 아님"이다.
- name: Probe OS release from target host (raw, read-only)
  ansible.builtin.raw: cat /etc/redhat-release 2>/dev/null
  register: raw_os_release
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Resolve effective raw provisioning path (explicit flag wins over detection)
  ansible.builtin.set_fact:
    _raw_path_effective: >-
      {{
        (raw_provisioning_path | bool)
        if (raw_provisioning_path | default('') | string) not in ['', 'None']
        else ((raw_os_release.stdout | default('')) | raw_classify_os_path) != 'modern'
      }}

# raw로 확정된 호스트에서만 엄격 파싱한다. 릴리스 줄이 없으면 플레이가 중단된다.
- name: Parse OS release from raw output
  ansible.builtin.set_fact:
    _raw_os_facts: "{{ raw_os_release.stdout | default('') | raw_parse_os_release }}"
  when: _raw_path_effective | bool

- name: Set OS facts from raw output
  ansible.builtin.set_fact:
    ansible_os_family: RedHat
    ansible_distribution: "{{ _raw_os_facts.distribution }}"
    ansible_distribution_major_version: "{{ _raw_os_facts.major_version }}"
    ansible_distribution_version: "{{ _raw_os_facts.version }}"
  when: _raw_path_effective | bool
