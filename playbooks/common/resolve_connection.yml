---
# ==============================================================================
# OpenBao Connection Resolution Reusable Playbook (Spec #511 / Ticket-12)
# ==============================================================================
# 역할:
#   1. 공용 읽기 지점(lookup openbao_doc)으로 OpenBao 토큰을 플레이당 한 번 받는다
#   2. Asset 문서와 Endpoint·Credential에서 접속 주소·계정·승격·경유(via)를 해석한다
#   3. 관리 계정 공개키(accounts)와 삭제 대상 계정(removed_accounts + target_removed_users)을 만든다
#   4. 키 로그인에 쓸 개인키를 임시 파일로 쓰고(passphrase 해제) 관리 계정으로 접속을 시험(Probe)한다
#   5. 접속 실패 시 access.bootstrap_credential 로 최초 접속(부트스트랩) 모드로 전환한다
#
# 입력(공개 인터페이스는 docs/openbao_integration.md 4절):
#   connection_endpoint_preference  Endpoint 이름 선호 순서 목록(기본 [ssh]). 첫 번째로 등록된 것만 쓴다.
#   connection_requires_access      true면 Asset 문서에 access 절이 없을 때 실패한다(프로비저닝 대상).
#   target_removed_users            이번 실행에서 지울 계정(실행 변수로 남는 유일한 계정 입력).
#   connection_hosts / target_hosts 대상 호스트 패턴.
#
# 네임스페이스·마운트·인증은 lookup_plugins/openbao_doc.py 한 곳에서만 정한다. 이 파일에는 경로 접두사가 없다.
# 대상 호스트: 기본 target_hosts(없으면 servers:loadbalancers). import_playbook의 vars로 connection_hosts를 넘기면 그 패턴이
# 우선한다(host_agents.yml은 "<target_hosts>:&servers"를 넘겨 에이전트 play와 동일한 호스트 집합만 해석한다).
# ==============================================================================

- name: Controller Pre-flight & Dynamic OpenBao Credential Resolution
  hosts: "{{ connection_hosts | default(target_hosts | default('servers:loadbalancers')) }}"
  gather_facts: false
  connection: local
  become: false

  vars:
    _connection_preference: "{{ connection_endpoint_preference | default(['ssh']) }}"

  tasks:
    - name: Ensure controller fact cache directory exists
      ansible.builtin.file:
        path: /tmp/ansible_fact_cache
        state: directory
        mode: '0700'
      run_once: true

    - name: Discover stale controller fact cache entries to purge
      ansible.builtin.find:
        paths: /tmp/ansible_fact_cache
        file_type: any
        hidden: true
      register: _stale_fact_cache_entries
      run_once: true

    - name: Purge stale controller fact cache entries to prevent poisoned cache reuse
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _stale_fact_cache_entries.files }}"
      loop_control:
        label: "{{ item.path }}"
      run_once: true

    - name: Clear cached in-memory facts for target hosts
      ansible.builtin.meta: clear_facts

    # 플레이당 한 번만 로그인한다. 호스트마다 AppRole 로그인을 하지 않도록 토큰을 변수로 넘긴다.
    - name: Acquire the OpenBao client token once for the whole play
      ansible.builtin.set_fact:
        _vault_token: "{{ lookup('openbao_doc', '@token') }}"
      run_once: true
      check_mode: false
      no_log: true

    # 호스트당 해석은 한 번이다: Asset 문서, 관리·부트스트랩 연결, 관리 계정 공개키를 lookup 한 번(같은 읽기 객체)에서 만든다.
    # 같은 문서(Endpoint, Credential, Automation Identity 키)를 여러 번 HTTP로 읽지 않는다. 결과에 비밀이 있어 no_log지만 실패 사유
    # (문서 경로와 HTTP 상태)는 읽기 지점이 따로 표시한다(lookup_plugins/openbao_doc.py). access 절 누락은 프로비저닝 대상(connection_requires_access)이면
    # 연결을 해석하기 전에 [ACCESS-MISSING]으로 실패한다.
    - name: Resolve the Asset document, admin and bootstrap connections and admin accounts in one pass
      ansible.builtin.set_fact:
        _host_res: "{{ lookup('openbao_host_connection', inventory_hostname, preference=_connection_preference, requires_access=(connection_requires_access | default(false) | bool)) }}"
      check_mode: false
      no_log: true

    - name: Select the Asset document and the access clause credential names (admin, bootstrap)
      ansible.builtin.set_fact:
        _asset_doc: "{{ _host_res.asset }}"
        _access: "{{ _host_res.asset.access | default({}, true) }}"
        _admin_credential: "{{ _host_res.admin_credential }}"
        _bootstrap_credential: "{{ _host_res.bootstrap_credential }}"

    - name: Take the admin accounts (access.admin_credentials to accounts input)
      ansible.builtin.set_fact:
        _admin_accounts: "{{ _host_res.admin_accounts }}"
        _normalized_admin_users: "{{ _host_res.admin_accounts | map(attribute='name') | list }}"

    # 비밀 없는 요약: 뒤 태스크와 보고(연결 결정 요약, via 검사)는 이 요약만 쓴다.
    - name: Summarize the admin and bootstrap connections (secret-free)
      ansible.builtin.set_fact:
        _admin_summary: "{{ _host_res.admin | openbao_connection_summary }}"
        _boot_summary: "{{ (_host_res.bootstrap | openbao_connection_summary) if _host_res.bootstrap | length > 0 else {} }}"

    - name: Refuse via hops that are not key logins
      ansible.builtin.assert:
        that:
          - _admin_summary.via | rejectattr('login_mode', 'in', ['identity', 'key']) | list | length == 0
        fail_msg: >-
          [VIA-HOP-LOGIN] '{{ inventory_hostname }}'의 경유지 중 키 로그인이 아닌 것이 있습니다
          ({{ _admin_summary.via | rejectattr('login_mode', 'in', ['identity', 'key']) | map(attribute='asset') | list }}).
          경유지는 identity 또는 ssh_key Credential만 지원합니다(비밀번호는 명령행에 남기지 않기 위해 거부).
        quiet: true

    # _admin_conn·_boot_conn이 묶음의 비밀 사본이므로 묶음은 비워 호스트 변수에 같은 비밀의 사본이 하나만 남게 한다.
    - name: Take the admin connection (Endpoint, login, become, via) and the bootstrap connection (same Endpoint, bootstrap Credential)
      ansible.builtin.set_fact:
        _admin_conn: "{{ _host_res.admin }}"
        _boot_conn: "{{ _host_res.bootstrap }}"
        _host_res: {}
      no_log: true

    # 계정 삭제(Explicit account removal): Asset 문서의 access.removed_accounts와 실행 변수 'target_removed_users'
    # (문자열/리스트/JSON 문자열 모두 허용)를 합집합으로 통합합니다.
    # Semaphore의 extra vars가 set_fact보다 우선하므로 내부 변수 _removed_users에 저장합니다.
    # 두 값 모두 같은 매크로로 정규화합니다: 문자열은 콤마로 분리, 리스트는 문자열 원소만
    # 채택(그 외 타입은 조용히 버림), mapping/그 외 타입은 빈 목록으로 취급합니다 --
    # mapping을 '| list'로 넘기면 키 이름이 계정명으로 오인되는 사고를 막기 위함입니다.
    - name: Resolve accounts to remove (access.removed_accounts + run var, deduped)
      vars:
        _asset_removed_source: "{{ _access.removed_accounts | default([], true) }}"
        _run_removed_source: "{{ (target_removed_users | from_yaml) if (target_removed_users is defined and target_removed_users is string and (target_removed_users | trim).startswith('[')) else (target_removed_users if target_removed_users is defined else []) }}"
        _removed_users_shape_invalid: "{{ (_asset_removed_source is mapping) or (_run_removed_source is mapping) }}"
        _removed_users_detail: >-
          {%- macro _clean_user_list(src) -%}
            {%- if src is mapping -%}
              {{ [] }}
            {%- elif src is string -%}
              {%- set cleaned = [] -%}
              {%- for item in src.replace('[', '').replace(']', '').replace("'", '').replace('"', '').split(',') -%}
                {%- set clean_item = item | trim -%}
                {%- if clean_item | length > 0 -%}
                  {%- set _ = cleaned.append(clean_item) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ cleaned }}
            {%- elif src is sequence -%}
              {{ src | select('string') | map('trim') | select | list }}
            {%- else -%}
              {{ [] }}
            {%- endif -%}
          {%- endmacro -%}
          {%- set asset = _clean_user_list(_asset_removed_source) -%}
          {%- set run = _clean_user_list(_run_removed_source) -%}
          {{ {'from_asset': asset, 'from_run': run, 'union': (asset + run) | unique(case_sensitive=true) | list} }}
      # 태스크 vars는 이 태스크 안에서만 보이므로, 뒤따르는 경고/증적 태스크가 참조하는
      # 값은 호스트 팩트로 함께 승격합니다(그렇지 않으면 'is undefined'로 플레이가 실패).
      ansible.builtin.set_fact:
        _removed_users: "{{ _removed_users_detail.union }}"
        _removed_users_detail: "{{ _removed_users_detail }}"
        _removed_users_shape_invalid: "{{ _removed_users_shape_invalid }}"
        _asset_removed_source: "{{ _asset_removed_source }}"
        _run_removed_source: "{{ _run_removed_source }}"

    - name: Warn when removed accounts have an unsupported shape and were ignored
      ansible.builtin.debug:
        msg: >-
          [WARN] '{{ inventory_hostname }}': Asset 문서 'access.removed_accounts' 또는 run var
          'target_removed_users'가 mapping(객체) 형태입니다. 문자열 목록 또는 JSON
          배열 문자열만 지원하므로 무시되었습니다.
          asset={{ _asset_removed_source }}, run={{ _run_removed_source }}
      when: _removed_users_shape_invalid | bool

    # ISMS 2.5.1 증적: 어떤 계정이, 어느 출처(Asset 문서 / run var)에서 삭제 대상으로
    # 결정됐는지 매 실행마다 남깁니다.
    - name: Log accounts resolved for removal (ISMS 2.5.1 evidence)
      ansible.builtin.debug:
        msg:
          "대상 호스트": "{{ inventory_hostname }}"
          "Asset 문서(access.removed_accounts)에서": "{{ _removed_users_detail.from_asset }}"
          "실행 변수(target_removed_users)에서": "{{ _removed_users_detail.from_run }}"
          "최종 삭제 대상(합집합)": "{{ _removed_users }}"
      when: _removed_users | length > 0

    # 명시적 계정 삭제(ISMS 2.5.1)가 접속 계정, 부트스트랩 계정, 이번 실행에서 선언된 관리 계정을
    # 지우지 못하도록 결정적으로 차단합니다(SSH 프로브 성공 여부와 무관하게 항상 평가).
    - name: Refuse removal of connection, bootstrap or declared admin users
      vars:
        _protected_users: "{{ [_admin_conn.login.username | default('')] + _normalized_admin_users + [_boot_conn.login.username | default('')] }}"
        _removed_conflicts: "{{ _removed_users | default([]) | select('in', _protected_users) | list }}"
      ansible.builtin.assert:
        that:
          - _removed_conflicts | length == 0
        fail_msg: >-
          [REMOVED-USER-CONFLICT] '{{ inventory_hostname }}'에서 삭제 대상으로 지정된 계정 중
          {{ _removed_conflicts }} 은(는) 접속 계정, 부트스트랩 계정 또는 이번 실행에서 선언된
          관리 계정과 겹칩니다. 삭제 대상에서 제외하거나 access 절을 먼저 바꾸세요.

    - name: Build accounts list for common role from OpenBao keys
      ansible.builtin.set_fact:
        accounts: >-
          {%- set acc = _admin_accounts | list -%}
          {%- for ru in _removed_users -%}
            {%- if ru not in _normalized_admin_users -%}
              {%- set _ = acc.append({'name': ru, 'state': 'absent'}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ acc }}

    - name: Apply the selected Endpoint to host facts
      ansible.builtin.set_fact:
        ansible_host: "{{ _admin_conn.address }}"
        ansible_port: "{{ _admin_conn.port | int }}"
        # 관리 IP(`ip`, Host Agents의 host.ip 출처): 인벤토리 ip가 있으면 그 값, 없으면 선택된 Endpoint 주소.
        ip: "{{ ip if (ip is defined and (ip | string | trim | length) > 0) else _admin_conn.address }}"

    - name: Create temporary SSH private key file for admin user if key provided
      ansible.builtin.tempfile:
        state: file
        suffix: "_bao_admin_key"
      register: _admin_key_tempfile
      check_mode: false
      when:
        - (_admin_conn.login.private_key | default('')) | length > 0

    - name: Write admin SSH private key to temporary file
      ansible.builtin.copy:
        content: "{{ _admin_conn.login.private_key }}\n"
        dest: "{{ _admin_key_tempfile.path }}"
        mode: '0600'
      check_mode: false
      no_log: true
      when:
        - _admin_key_tempfile.path is defined
        - (_admin_conn.login.private_key | default('')) | length > 0

    - name: Strip passphrase from temporary admin SSH key if passphrase defined
      ansible.builtin.command: >-
        ssh-keygen -p -f {{ _admin_key_tempfile.path }} -P {{ _admin_conn.login.passphrase | quote }} -N ""
      check_mode: false
      changed_when: true
      no_log: true
      when:
        - _admin_key_tempfile.path is defined
        - (_admin_conn.login.passphrase | default('')) | length > 0

    - name: Create temporary SSH private key file for bootstrap user if key provided
      ansible.builtin.tempfile:
        state: file
        suffix: "_bao_boot_key"
      register: _boot_key_tempfile
      check_mode: false
      when:
        - (_boot_conn.login.private_key | default('')) | length > 0

    - name: Write bootstrap SSH private key to temporary file
      ansible.builtin.copy:
        content: "{{ _boot_conn.login.private_key }}\n"
        dest: "{{ _boot_key_tempfile.path }}"
        mode: '0600'
      check_mode: false
      no_log: true
      when:
        - _boot_key_tempfile.path is defined
        - (_boot_conn.login.private_key | default('')) | length > 0

    - name: Strip passphrase from temporary bootstrap SSH key if passphrase defined
      ansible.builtin.command: >-
        ssh-keygen -p -f {{ _boot_key_tempfile.path }} -P {{ _boot_conn.login.passphrase | quote }} -N ""
      check_mode: false
      changed_when: true
      no_log: true
      when:
        - _boot_key_tempfile.path is defined
        - (_boot_conn.login.passphrase | default('')) | length > 0

    # 경유(via) 체인: 경유지마다 자기 Endpoint의 기본 Credential·identity로 로그인한다. 키 로그인 경유지만 지원한다.
    - name: Create temporary SSH private key files for via hops
      ansible.builtin.tempfile:
        state: file
        suffix: "_bao_hop_key"
      register: _hop_key_tempfiles
      loop: "{{ _admin_conn.via }}"
      loop_control:
        label: "{{ item.asset }}/{{ item.endpoint }}"
      check_mode: false
      no_log: true
      when: (item.login.private_key | default('')) | length > 0

    # 임시 키 경로는 키를 쓰기 전에 기록한다(뒤 단계가 실패해도 cleanup_connection이 지울 수 있게).
    - name: Record the via hop temporary key paths
      ansible.builtin.set_fact:
        _hop_key_paths: "{{ _hop_key_tempfiles.results | map(attribute='path', default='') | list }}"

    - name: Write via hop SSH private keys to temporary files
      ansible.builtin.copy:
        content: "{{ item.0.login.private_key }}\n"
        dest: "{{ item.1.path }}"
        mode: '0600'
      loop: "{{ _admin_conn.via | zip(_hop_key_tempfiles.results) | list }}"
      loop_control:
        label: "{{ item.0.asset }}/{{ item.0.endpoint }}"
      check_mode: false
      no_log: true
      when: item.1.path is defined

    - name: Strip passphrase from temporary via hop SSH keys
      ansible.builtin.command: >-
        ssh-keygen -p -f {{ item.1.path }} -P {{ item.0.login.passphrase | quote }} -N ""
      loop: "{{ _admin_conn.via | zip(_hop_key_tempfiles.results) | list }}"
      loop_control:
        label: "{{ item.0.asset }}/{{ item.0.endpoint }}"
      check_mode: false
      changed_when: true
      no_log: true
      when:
        - item.1.path is defined
        - (item.0.login.passphrase | default('')) | length > 0

    - name: Build the ssh ProxyCommand arguments for the via chain
      ansible.builtin.set_fact:
        _ssh_common_args: "{{ _admin_conn.via | openbao_ssh_common_args(_hop_key_paths, _admin_conn.address, _admin_conn.port) }}"
      no_log: true

    - name: Probe SSH connection using primary admin user credentials
      ansible.builtin.command:
        argv: >-
          {{ ['ssh', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=5', '-o', 'StrictHostKeyChecking=no',
              '-o', 'UserKnownHostsFile=/dev/null', '-o', 'IdentitiesOnly=yes', '-p', ansible_port | string,
              '-i', _admin_key_tempfile.path]
             + (['-o', 'ProxyCommand=' ~ (_admin_conn.via | openbao_ssh_proxy_command(_hop_key_paths, _admin_conn.address, _admin_conn.port))]
                if (_admin_conn.via | length > 0) else [])
             + [_admin_conn.login.username ~ '@' ~ ansible_host, 'echo OK'] }}
      register: _admin_ssh_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _admin_key_tempfile is defined
        - _admin_key_tempfile.path is defined
        - (_admin_conn.login.private_key | default('')) | length > 0

    - name: Set connection mode facts based on admin SSH probe result
      ansible.builtin.set_fact:
        _is_already_provisioned: "{{ (_admin_ssh_probe.rc == 0) if (_admin_ssh_probe is defined and _admin_ssh_probe.rc is defined) else false }}"

    # 관리 계정으로 접속되면 그 연결을, 아니면 부트스트랩 Credential(access.bootstrap_credential)의 연결을 쓴다.
    # 부트스트랩 Credential이 없는 Asset(프로비저닝 대상이 아님)은 선택된 Endpoint의 기본 연결을 그대로 쓴다.
    - name: Select the active connection (admin when provisioned, else bootstrap)
      ansible.builtin.set_fact:
        _active_conn: "{{ _admin_conn if ((_is_already_provisioned | bool) or (_boot_conn | length == 0)) else _boot_conn }}"
        _active_key_path: "{{ (_admin_key_tempfile.path | default('')) if ((_is_already_provisioned | bool) or (_boot_conn | length == 0)) else (_boot_key_tempfile.path | default('')) }}"
      no_log: true

    - name: Configure connection parameters from the active connection
      ansible.builtin.set_fact:
        ansible_user: "{{ _active_conn.login.username | default(omit) }}"
        ansible_password: "{{ _active_conn.login.password | default(omit) }}"
        ansible_ssh_private_key_file: "{{ _active_key_path if (_active_key_path | length > 0) else omit }}"
        ansible_become_method: "{{ _active_conn.become.method | default(omit, true) }}"
        ansible_become_password: "{{ _active_conn.become.password | default(omit, true) }}"
        # 원격 Python은 항상 /usr/bin/python3다. 호스트별 인터프리터 값은 OpenBao에 두지 않는다(스키마에 없음).
        ansible_python_interpreter: /usr/bin/python3
      no_log: true

    - name: Configure the ssh ProxyCommand for the via chain
      ansible.builtin.set_fact:
        ansible_ssh_common_args: "{{ _ssh_common_args }}"
      no_log: true
      when: _ssh_common_args | length > 0

    - name: Publish the secret-free connection summary
      ansible.builtin.set_fact:
        _connection: "{{ _admin_summary if ((_is_already_provisioned | bool) or (_boot_summary | length == 0)) else _boot_summary }}"

    - name: Connection decision summary
      ansible.builtin.debug:
        msg:
          "대상 호스트": "{{ inventory_hostname }} ({{ _connection.endpoint }}: {{ _connection.address }}:{{ _connection.port }})"
          "경유": "{{ _connection.via | map(attribute='asset') | join(' -> ') | default('없음', true) }}"
          "프로비저닝 상태": "{{ '기존 배포 완료됨 (Already Provisioned)' if _is_already_provisioned else '신규 호스트 (부트스트랩 모드 실행)' }}"
          "원격 접속 계정": "{{ _connection.username | default('') }} ({{ _connection.login_mode }})"
          "승격": "{{ _connection.become_method | default('없음', true) }}"
          "비밀번호 접속 예외": "{{ _connection.password_auth_exception }}"
