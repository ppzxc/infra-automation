---
# ==============================================================================
# Cisco IOS Network Switch Configuration Backup Playbook
# ==============================================================================
# 접속 정보(주소·포트·계정·enable·경유)는 OpenBao Endpoint·Credential에서 역할이 읽는다. 인벤토리에는 관리번호만 둔다.
# Execution example:
#   ansible-playbook -i inventory/hosts.yml playbooks/backup_cisco.yml
# ==============================================================================

- name: Backup Cisco IOS Network Switches
  hosts: cisco_switches
  gather_facts: false
  connection: local

  pre_tasks:
    # 플레이당 한 번만 로그인한다. 호스트마다 AppRole 로그인을 하지 않도록 토큰을 변수로 넘긴다.
    - name: Acquire the OpenBao client token once for the whole play
      ansible.builtin.set_fact:
        _vault_token: "{{ lookup('openbao_doc', '@token') }}"
      run_once: true
      check_mode: false
      no_log: true

  roles:
    - role: cisco_backup
      tags: [cisco, backup, network]
