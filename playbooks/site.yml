---
# ==============================================================================
# Infra Automation 마스터 플레이북 (Site Master Playbook)
# 온프레미스 IDC 인프라 통합 프로비저닝 (일반 서버 및 로드밸런서)
# ==============================================================================
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml \
#     -e "bootstrap_user=root target_admin_users=ppzxc"
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: Controller Pre-flight & OpenBao Secret Resolution (공유 플레이북)
# tags: [always] — --tags 실행에서도 호스트별 자격증명 해석이 스킵되지 않도록 강제
# ------------------------------------------------------------------------------
- name: Resolve OpenBao Connection and Credentials
  ansible.builtin.import_playbook: common/resolve_connection.yml
  tags: [always]

# ------------------------------------------------------------------------------
# Play 2: Provision Baseline Target Hosts
# ------------------------------------------------------------------------------
- name: Provision Baseline On-Premise Target Hosts
  hosts: "{{ target_hosts | default('servers:loadbalancers') }}"
  become: true
  gather_facts: false

  vars:
    # 원격 Linux 대상 호스트의 표준 Python3 인터프리터 강제
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Ensure target python interpreter is strictly /usr/bin/python3
      ansible.builtin.set_fact:
        ansible_python_interpreter: >-
          {{
            ansible_python_interpreter
            if (ansible_python_interpreter is defined and
                ansible_python_interpreter | length > 0 and
                'semaphore' not in (ansible_python_interpreter | string) and
                'venv' not in (ansible_python_interpreter | string) and
                not (ansible_python_interpreter | string).startswith('/tmp/') and
                (ansible_python_interpreter | string) != 'auto_silent')
            else '/usr/bin/python3'
          }}

    # Raw 경로 자동 판별 (ADR-0005 §2.5): CentOS 6/7이면 OS fact를 raw로 공급한다.
    - name: Detect raw provisioning path
      ansible.builtin.import_tasks: common/detect_raw_path.yml
      tags: [always]

    - name: Verify connectivity and OS facts
      ansible.builtin.debug:
        msg:
          "진행 단계": "호스트 기본 OS 환경 및 연결 확인 완료"
          "대상 서버": "{{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }} / 커널 {{ ansible_kernel | default('n/a') }})"
          "실행 사용자": "{{ ansible_user }} (Sudo 권한 승격: 활성화)"
          "Python 인터프리터": "{{ ansible_python_interpreter }}"

  roles:
    - role: common
      tags: [common, base]

    - role: docker_engine
      tags: [docker, containers]

    - role: security
      tags: [security, ssh, firewall]

    - role: access_security
      tags: [access, openbao, boundary, security, ssh-ca]

  post_tasks:
    - name: Target host provisioning completion summary
      ansible.builtin.debug:
        msg:
          "결과 상태": "호스트 기본 인프라 및 보안 프로비저닝 성공 완료"
          "대상 서버": "{{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
          "반영 완료 항목":
            - "1. 시스템 기반: 타임존(KST), Chrony NTP 동기화, 시스템 최적화(sysctl, limits) 적용"
            - "2. 계정 및 접근: 관리자 계정({{ _normalized_admin_users | join(', ') }}) 생성, NOPASSWD Sudo 구성, SSH 공개키 등록"
            - "3. 시스템 보안: SSH 보안 강화(Root 로그인 제한), 방화벽(Firewalld/UFW), Fail2ban 보호 활성화"
            - "4. 컨테이너 인프라: Docker Engine 최신 런타임 및 Docker Compose 플러그인 설치"
            - "5. 접근 제어 및 감시: OpenBao SSH CA 신뢰 구성, Boundary 연동 메타데이터, Auditd 감사 규칙 등록"
            - "(관측성/백업 Host Agents는 playbooks/host_agents.yml로 별도 배포합니다)"

# ------------------------------------------------------------------------------
# Play 3: Cleanup temporary controller credentials (공유 플레이북)
# tags: [always] — --tags 실행에서도 임시 개인키 삭제가 스킵되지 않도록 강제
# ------------------------------------------------------------------------------
- name: Cleanup temporary controller credentials
  ansible.builtin.import_playbook: common/cleanup_connection.yml
  tags: [always]

