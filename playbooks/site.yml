---
# ==============================================================================
# Infra Automation 마스터 플레이북 (Site Master Playbook)
# 온프레미스 IDC 인프라 통합 프로비저닝 (일반 서버 및 로드밸런서)
# ==============================================================================
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml \
#     -e "bootstrap_user=root target_admin_users=ppzxc"
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: Controller Pre-flight & OpenBao Secret Resolution
# ------------------------------------------------------------------------------
- name: Controller Pre-flight & Dynamic OpenBao Credential Resolution
  hosts: servers:loadbalancers
  gather_facts: false
  connection: local
  become: false

  vars:
    # OpenBao (Vault) 네임스페이스 및 마운트 경로 설정 (Cisco switch 백업 플레이북과 동일한 패턴 및 변수명 계층 적용)
    openbao_namespace: "{{ (_local_openbao_namespace | default(vault_namespace | default(VAULT_NAMESPACE | default(lookup('ansible.builtin.env', 'VAULT_NAMESPACE') | default(lookup('ansible.builtin.env', 'OPENBAO_NAMESPACE') | default('infra/prod/host/', true), true), true), true), true)) | regex_replace('/+$', '') }}"
    openbao_mount: "{{ _local_openbao_mount | default(vault_mount | default(VAULT_MOUNT | default(lookup('ansible.builtin.env', 'VAULT_MOUNT') | default(lookup('ansible.builtin.env', 'OPENBAO_MOUNT') | default('secret', true), true), true), true), true) }}"
    openbao_hosts_prefix: "{{ (_local_openbao_hosts_prefix | default(lookup('ansible.builtin.env', 'OPENBAO_HOSTS_PREFIX') | default('hosts/', true), true)) | regex_replace('^secret/', '') }}"
    openbao_users_prefix: "{{ (_local_openbao_users_prefix | default(lookup('ansible.builtin.env', 'OPENBAO_USERS_PREFIX') | default('users/', true), true)) | regex_replace('^secret/', '') }}"

    # AppRole 및 Token 인증 자격증명 자동 감지 (Semaphore Secrets / Extra vars / OS Env vars 모두 지원)
    _vault_role_id: "{{ vault_role_id | default(VAULT_ROLE_ID | default(lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | default('', true), true), true) }}"
    _vault_secret_id: "{{ vault_secret_id | default(VAULT_SECRET_ID | default(lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | default('', true), true), true) }}"
    _has_approle: "{{ (_vault_role_id | length > 0) and (_vault_secret_id | length > 0) }}"
    _vault_token: "{{ vault_token | default(VAULT_TOKEN | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true), true) }}"
    _vault_auth_method: "{{ vault_auth_method | default(VAULT_AUTH_METHOD | default(lookup('ansible.builtin.env', 'VAULT_AUTH_METHOD') | default('approle' if _has_approle else ('token' if (_vault_token | length > 0) else omit), true), true), true) }}"
    _vault_addr: "{{ vault_addr | default(VAULT_ADDR | default(lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://openbao:8200', true), true), true) }}"

  tasks:
    - name: Validate mandatory input variables
      ansible.builtin.assert:
        that:
          - bootstrap_user is defined
          - bootstrap_user | length > 0
          - (target_admin_users is defined and target_admin_users | length > 0) or (target_admin_user is defined and target_admin_user | length > 0)
        fail_msg: >-
          [ERROR] 필수 변수 'bootstrap_user' 및 'target_admin_users'(또는 'target_admin_user')가 정의되지 않았습니다!
          Semaphore UI Environment JSON 또는 '-e "bootstrap_user=root target_admin_users=ppzxc"' 형식으로 주입해야 합니다.
      run_once: true

    - name: Normalize target_admin_users list and primary admin user
      vars:
        _admin_source: "{{ (target_admin_users | from_yaml) if (target_admin_users is defined and target_admin_users is string and (target_admin_users | trim).startswith('[')) else (target_admin_users if target_admin_users is defined else target_admin_user) }}"
      ansible.builtin.set_fact:
        _normalized_admin_users: >-
          {%- if _admin_source is iterable and _admin_source is not string and _admin_source is not mapping -%}
            {{ _admin_source | list }}
          {%- elif _admin_source is string -%}
            {%- set cleaned = [] -%}
            {%- set q1 = "'" -%}
            {%- set q2 = '"' -%}
            {%- for item in _admin_source.replace('[', '').replace(']', '').replace(q1, '').replace(q2, '').split(',') -%}
              {%- set clean_item = item | trim -%}
              {%- if clean_item | length > 0 -%}
                {%- set _ = cleaned.append(clean_item) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ cleaned }}
          {%- else -%}
            []
          {%- endif -%}

    - name: Set primary target admin user for connection probing
      ansible.builtin.set_fact:
        _primary_admin_user: "{{ _normalized_admin_users | first }}"

    - name: Run OpenBao direct diagnostic health probe from controller
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/sys/health"
        method: GET
        status_code: [-1, 200, 429, 472, 473, 501, 503]
        timeout: 5
        validate_certs: false
      register: _openbao_health_probe
      ignore_errors: true
      run_once: true
      check_mode: false

    - name: Run OpenBao AppRole login diagnostic probe from controller
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/auth/approle/login"
        method: POST
        headers: "{{ {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {} }}"
        body_format: json
        body:
          role_id: "{{ _vault_role_id }}"
          secret_id: "{{ _vault_secret_id }}"
        status_code: [-1, 200, 400, 401, 403, 404, 500]
        timeout: 5
        validate_certs: false
      register: _openbao_login_probe
      run_once: true
      ignore_errors: true
      check_mode: false
      when: _has_approle

    - name: Register acquired OpenBao client token from AppRole probe
      ansible.builtin.set_fact:
        _vault_token: "{{ _openbao_login_probe.json.auth.client_token }}"
        _vault_auth_method: "token"
      when:
        - _openbao_login_probe.json is defined
        - _openbao_login_probe.json.auth is defined
        - _openbao_login_probe.json.auth.client_token is defined

    - name: Fetch target host KV from OpenBao (hosts/<hostname>)
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/{{ openbao_hosts_prefix }}{{ inventory_hostname }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_host_kv_resp
      ignore_errors: true
      check_mode: false
      when: (_vault_token | default('') | length) > 0

    - name: Fallback fetch target host KV from OpenBao with secret/ prefix if initial lookup 404
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/secret/{{ openbao_hosts_prefix }}{{ inventory_hostname }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_host_kv_resp_fallback
      ignore_errors: true
      check_mode: false
      when:
        - (_vault_token | default('') | length) > 0
        - (_openbao_host_kv_resp.status is not defined) or (_openbao_host_kv_resp.status != 200)

    - name: Merge primary and fallback OpenBao host response
      ansible.builtin.set_fact:
        _effective_host_resp: "{{ _openbao_host_kv_resp if (_openbao_host_kv_resp.status is defined and _openbao_host_kv_resp.status == 200) else (_openbao_host_kv_resp_fallback if (_openbao_host_kv_resp_fallback is defined and _openbao_host_kv_resp_fallback.status is defined and _openbao_host_kv_resp_fallback.status == 200) else _openbao_host_kv_resp) }}"

    - name: Debug direct OpenBao host KV response
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          status: "{{ _effective_host_resp.status | default('UNSET') }}"
          url: "{{ _effective_host_resp.url | default('UNSET') }}"
          msg: "{{ _effective_host_resp.msg | default('N/A') }}"
          json_data_defined: "{{ (_effective_host_resp.json.data.data is defined) if (_effective_host_resp.json is defined and _effective_host_resp.json.data is defined) else false }}"
          keys: "{{ (_effective_host_resp.json.data.data.keys() | list) if (_effective_host_resp.json is defined and _effective_host_resp.json.data is defined and _effective_host_resp.json.data.data is defined and _effective_host_resp.json.data.data is mapping) else [] }}"
      when: _effective_host_resp is defined

    - name: Apply OpenBao and inventory host variables to host facts
      vars:
        _host_raw: "{{ _effective_host_resp.json.data.data if (_effective_host_resp is defined and _effective_host_resp.json is defined and _effective_host_resp.json.data is defined and _effective_host_resp.json.data.data is defined) else {} }}"
        _host_unwrapped: "{{ (_host_raw if _host_raw is not mapping else (_host_raw[inventory_hostname] if inventory_hostname in _host_raw else ((_host_raw.values() | first) if (_host_raw | length > 0 and (_host_raw.values() | first) is mapping) else _host_raw))) }}"
        _host_dict: "{{ (_host_unwrapped | first) if (_host_unwrapped is sequence and _host_unwrapped is not string and _host_unwrapped | length > 0 and (_host_unwrapped | first) is mapping) else (_host_unwrapped if _host_unwrapped is mapping else {}) }}"
        _resolved_bao_host: "{{ _host_dict.ansible_host | default(_host_dict.public_ip | default(_host_dict.ip | default(_host_dict.host | default('', true), true), true), true) }}"
        _resolved_bao_port: "{{ _host_dict.ansible_port | default(_host_dict.port | default('', true), true) }}"
      ansible.builtin.set_fact:
        ansible_host: "{{ (_resolved_bao_host if _resolved_bao_host | length > 0 else (hostvars[inventory_hostname].ansible_host if (hostvars[inventory_hostname] is defined and hostvars[inventory_hostname].ansible_host is defined) else (ansible_host | default(inventory_hostname, true)))) }}"
        ansible_port: "{{ ((_resolved_bao_port if (_resolved_bao_port | string | length > 0) else (hostvars[inventory_hostname].ansible_port if (hostvars[inventory_hostname] is defined and hostvars[inventory_hostname].ansible_port is defined) else (ansible_port | default(22)))) | int) }}"

    - name: Fetch primary admin user credentials from OpenBao (users/<user>)
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/{{ openbao_users_prefix }}{{ _primary_admin_user }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_admin_user_resp
      ignore_errors: true
      check_mode: false
      when: (_vault_token | default('') | length) > 0

    - name: Fallback fetch primary admin user credentials from OpenBao with secret/ prefix if initial lookup 404
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/secret/{{ openbao_users_prefix }}{{ _primary_admin_user }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_admin_user_resp_fallback
      ignore_errors: true
      check_mode: false
      when:
        - (_vault_token | default('') | length) > 0
        - (_openbao_admin_user_resp.status is not defined) or (_openbao_admin_user_resp.status != 200)

    - name: Merge primary and fallback admin user response
      ansible.builtin.set_fact:
        _effective_admin_user_resp: "{{ _openbao_admin_user_resp if (_openbao_admin_user_resp.status is defined and _openbao_admin_user_resp.status == 200) else (_openbao_admin_user_resp_fallback if (_openbao_admin_user_resp_fallback is defined and _openbao_admin_user_resp_fallback.status is defined and _openbao_admin_user_resp_fallback.status == 200) else _openbao_admin_user_resp) }}"

    # --------------------------------------------------------------------------
    # Bootstrap 자격증명 조회: 1) 호스트 전용 (hosts/<hostname>/bootstrap) -> 2) 전역 (users/<bootstrap_user>)
    # --------------------------------------------------------------------------
    - name: Fetch host-specific bootstrap credentials from OpenBao (hosts/<hostname>/bootstrap)
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/{{ openbao_hosts_prefix }}{{ inventory_hostname }}/bootstrap"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_host_bootstrap_resp
      ignore_errors: true
      check_mode: false
      when: (_vault_token | default('') | length) > 0

    - name: Fetch bootstrap user credentials from OpenBao (users/<user>)
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/{{ openbao_users_prefix }}{{ bootstrap_user }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_bootstrap_user_resp
      ignore_errors: true
      check_mode: false
      when:
        - (_vault_token | default('') | length) > 0
        - (_openbao_host_bootstrap_resp.status is not defined) or (_openbao_host_bootstrap_resp.status != 200)

    - name: Fallback fetch bootstrap user credentials from OpenBao with secret/ prefix if initial lookup 404
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/secret/{{ openbao_users_prefix }}{{ bootstrap_user }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_bootstrap_user_resp_fallback
      ignore_errors: true
      check_mode: false
      when:
        - (_vault_token | default('') | length) > 0
        - (_openbao_host_bootstrap_resp.status is not defined) or (_openbao_host_bootstrap_resp.status != 200)
        - (_openbao_bootstrap_user_resp.status is not defined) or (_openbao_bootstrap_user_resp.status != 200)

    - name: Merge primary and fallback bootstrap user response
      ansible.builtin.set_fact:
        _effective_bootstrap_user_resp: "{{ _openbao_host_bootstrap_resp if (_openbao_host_bootstrap_resp.status is defined and _openbao_host_bootstrap_resp.status == 200) else (_openbao_bootstrap_user_resp if (_openbao_bootstrap_user_resp.status is defined and _openbao_bootstrap_user_resp.status == 200) else (_openbao_bootstrap_user_resp_fallback if (_openbao_bootstrap_user_resp_fallback is defined and _openbao_bootstrap_user_resp_fallback.status is defined and _openbao_bootstrap_user_resp_fallback.status == 200) else _openbao_bootstrap_user_resp)) }}"

    - name: Debug OpenBao user secret lookup response
      ansible.builtin.debug:
        msg:
          primary_admin_user: "{{ _primary_admin_user }}"
          admin_status: "{{ _effective_admin_user_resp.status | default('UNSET') }}"
          admin_url: "{{ _effective_admin_user_resp.url | default('UNSET') }}"
          admin_msg: "{{ _effective_admin_user_resp.msg | default('N/A') }}"
          admin_data_keys: "{{ (_effective_admin_user_resp.json.data.data.keys() | list) if (_effective_admin_user_resp.json is defined and _effective_admin_user_resp.json.data is defined and _effective_admin_user_resp.json.data.data is defined and _effective_admin_user_resp.json.data.data is mapping) else [] }}"
          bootstrap_user: "{{ bootstrap_user }}"
          bootstrap_status: "{{ _effective_bootstrap_user_resp.status | default('UNSET') }}"
          bootstrap_url: "{{ _effective_bootstrap_user_resp.url | default('UNSET') }}"
      when: _effective_admin_user_resp is defined

    - name: Parse admin and bootstrap user secrets
      vars:
        _admin_raw: "{{ _effective_admin_user_resp.json.data.data if (_effective_admin_user_resp is defined and _effective_admin_user_resp.json is defined and _effective_admin_user_resp.json.data is defined and _effective_admin_user_resp.json.data.data is defined) else {} }}"
        _admin_unwrapped: "{{ (_admin_raw if _admin_raw is not mapping else (_admin_raw[_primary_admin_user] if (_primary_admin_user in _admin_raw and (_admin_raw[_primary_admin_user] is mapping or (_admin_raw[_primary_admin_user] is sequence and _admin_raw[_primary_admin_user] is not string))) else (_admin_raw if ('ssh_private_key' in _admin_raw or 'username' in _admin_raw or 'type' in _admin_raw or 'password' in _admin_raw) else ((_admin_raw.values() | first) if (_admin_raw | length > 0 and ((_admin_raw.values() | first) is mapping or ((_admin_raw.values() | first) is sequence and (_admin_raw.values() | first) is not string))) else _admin_raw)))) }}"
        _admin_list: "{{ _admin_unwrapped if (_admin_unwrapped is sequence and _admin_unwrapped is not string and _admin_unwrapped is not mapping) else [_admin_unwrapped] }}"
        _admin_ssh_matches: "{{ _admin_list | selectattr('type', 'defined') | selectattr('type', 'equalto', 'SSH') | list }}"
        _raw_admin_entry: "{{ (_admin_ssh_matches | first) if (_admin_ssh_matches | length > 0) else ((_admin_list | first) if (_admin_list | length > 0 and (_admin_list | first) is mapping) else {}) }}"
        _admin_pwd_matches: "{{ _admin_list | selectattr('password', 'defined') | list }}"
        _admin_fallback_pwd: "{{ (_admin_pwd_matches | first).password if (_admin_pwd_matches | length > 0 and (_admin_pwd_matches | first).password is defined) else (_admin_raw.password if (_admin_raw is mapping and 'password' in _admin_raw) else '') }}"
        _resolved_admin_entry: "{{ _raw_admin_entry | combine({'password': _admin_fallback_pwd}) if ((_raw_admin_entry.password is not defined or _raw_admin_entry.password | length == 0) and (_admin_fallback_pwd | length > 0)) else _raw_admin_entry }}"

        _boot_raw: "{{ _effective_bootstrap_user_resp.json.data.data if (_effective_bootstrap_user_resp is defined and _effective_bootstrap_user_resp.json is defined and _effective_bootstrap_user_resp.json.data is defined and _effective_bootstrap_user_resp.json.data.data is defined) else {} }}"
        _boot_unwrapped: "{{ (_boot_raw if _boot_raw is not mapping else (_boot_raw[bootstrap_user] if (bootstrap_user in _boot_raw and (_boot_raw[bootstrap_user] is mapping or (_boot_raw[bootstrap_user] is sequence and _boot_raw[bootstrap_user] is not string))) else (_boot_raw if ('password' in _boot_raw or 'root_password' in _boot_raw or 'username' in _boot_raw or 'type' in _boot_raw or 'ssh_private_key' in _boot_raw) else ((_boot_raw.values() | first) if (_boot_raw | length > 0 and ((_boot_raw.values() | first) is mapping or ((_boot_raw.values() | first) is sequence and (_boot_raw.values() | first) is not string))) else _boot_raw)))) }}"
        _boot_list: "{{ _boot_unwrapped if (_boot_unwrapped is sequence and _boot_unwrapped is not string and _boot_unwrapped is not mapping) else [_boot_unwrapped] }}"
        _boot_pwd_matches: "{{ _boot_list | selectattr('type', 'defined') | selectattr('type', 'equalto', 'PASSWORD') | list }}"
        _boot_ssh_matches: "{{ _boot_list | selectattr('type', 'defined') | selectattr('type', 'equalto', 'SSH') | list }}"
        _raw_boot_entry: "{{ (_boot_pwd_matches | first) if (_boot_pwd_matches | length > 0) else ((_boot_ssh_matches | first) if (_boot_ssh_matches | length > 0) else ((_boot_list | first) if (_boot_list | length > 0 and (_boot_list | first) is mapping) else {})) }}"
        _boot_resolved_pwd: "{{ _raw_boot_entry.password if (_raw_boot_entry.password is defined and _raw_boot_entry.password | length > 0) else (_raw_boot_entry.root_password if (_raw_boot_entry.root_password is defined and _raw_boot_entry.root_password | length > 0) else (_boot_raw.password if (_boot_raw is mapping and 'password' in _boot_raw) else (_boot_raw.root_password if (_boot_raw is mapping and 'root_password' in _boot_raw) else ''))) }}"
        _resolved_boot_entry: "{{ _raw_boot_entry | combine({'password': _boot_resolved_pwd}) if (_boot_resolved_pwd | length > 0) else _raw_boot_entry }}"
      ansible.builtin.set_fact:
        _admin_user_entry: "{{ _resolved_admin_entry }}"
        _bootstrap_user_entry: "{{ _resolved_boot_entry }}"

    - name: Debug resolved user entries
      ansible.builtin.debug:
        msg:
          admin_has_entry: "{{ _admin_user_entry is defined and _admin_user_entry is mapping }}"
          admin_type: "{{ _admin_user_entry.type | default('UNSET') }}"
          admin_has_private_key: "{{ (_admin_user_entry.ssh_private_key is defined) and (_admin_user_entry.ssh_private_key | length > 0) }}"
          admin_has_passphrase: "{{ (_admin_user_entry.ssh_passphrase is defined) and (_admin_user_entry.ssh_passphrase | length > 0) }}"
          admin_has_password: "{{ (_admin_user_entry.password is defined) and (_admin_user_entry.password | length > 0) }}"
          bootstrap_has_entry: "{{ _bootstrap_user_entry is defined and _bootstrap_user_entry is mapping }}"
          bootstrap_type: "{{ _bootstrap_user_entry.type | default('UNSET') }}"
          bootstrap_has_password: "{{ (_bootstrap_user_entry.password is defined) and (_bootstrap_user_entry.password | length > 0) }}"
          bootstrap_has_private_key: "{{ (_bootstrap_user_entry.ssh_private_key is defined) and (_bootstrap_user_entry.ssh_private_key | length > 0) }}"

    - name: Create temporary SSH private key file for admin user if key provided
      ansible.builtin.tempfile:
        state: file
        suffix: "_bao_admin_key"
      register: _admin_key_tempfile
      check_mode: false
      when:
        - (_admin_user_entry.ssh_private_key | default('')) | length > 0

    - name: Write admin SSH private key to temporary file
      ansible.builtin.copy:
        content: "{{ _admin_user_entry.ssh_private_key }}\n"
        dest: "{{ _admin_key_tempfile.path }}"
        mode: '0600'
      check_mode: false
      when:
        - _admin_key_tempfile.path is defined
        - (_admin_user_entry.ssh_private_key | default('')) | length > 0

    - name: Strip passphrase from temporary admin SSH key if passphrase defined
      ansible.builtin.command: >-
        ssh-keygen -p -f {{ _admin_key_tempfile.path }} -P {{ _admin_user_entry.ssh_passphrase | quote }} -N ""
      check_mode: false
      no_log: true
      when:
        - _admin_key_tempfile.path is defined
        - (_admin_user_entry.ssh_passphrase | default('')) | length > 0

    - name: Create temporary SSH private key file for bootstrap user if key provided
      ansible.builtin.tempfile:
        state: file
        suffix: "_bao_boot_key"
      register: _boot_key_tempfile
      check_mode: false
      when:
        - (_bootstrap_user_entry.ssh_private_key | default('')) | length > 0

    - name: Write bootstrap SSH private key to temporary file
      ansible.builtin.copy:
        content: "{{ _bootstrap_user_entry.ssh_private_key }}\n"
        dest: "{{ _boot_key_tempfile.path }}"
        mode: '0600'
      check_mode: false
      when:
        - _boot_key_tempfile.path is defined
        - (_bootstrap_user_entry.ssh_private_key | default('')) | length > 0

    - name: Strip passphrase from temporary bootstrap SSH key if passphrase defined
      ansible.builtin.command: >-
        ssh-keygen -p -f {{ _boot_key_tempfile.path }} -P {{ _bootstrap_user_entry.ssh_passphrase | quote }} -N ""
      check_mode: false
      no_log: true
      when:
        - _boot_key_tempfile.path is defined
        - (_bootstrap_user_entry.ssh_passphrase | default('')) | length > 0

    - name: Debug temporary admin SSH key status
      ansible.builtin.debug:
        msg:
          admin_key_tempfile_created: "{{ _admin_key_tempfile.path is defined }}"
          admin_key_tempfile_path: "{{ _admin_key_tempfile.path | default('NONE') }}"
          boot_key_tempfile_created: "{{ _boot_key_tempfile.path is defined }}"
          boot_key_tempfile_path: "{{ _boot_key_tempfile.path | default('NONE') }}"

    - name: Fetch all target admin users credentials to build accounts structure
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ openbao_mount }}/data/{{ openbao_users_prefix }}{{ item }}"
        method: GET
        headers: >-
          {{
            {
              'X-Vault-Token': _vault_token
            } | combine(
              {'X-Vault-Namespace': openbao_namespace} if (openbao_namespace | length > 0) else {}
            )
          }}
        status_code: [-1, 200, 403, 404]
        timeout: 5
        validate_certs: false
      register: _openbao_all_admins_resp
      loop: "{{ _normalized_admin_users }}"
      ignore_errors: true
      check_mode: false
      when: (_vault_token | default('') | length) > 0

    - name: Build accounts list for common role from OpenBao keys
      ansible.builtin.set_fact:
        accounts: >-
          {%- set dynamic_accs = [] -%}
          {%- for u in _normalized_admin_users -%}
            {%- set ns = namespace(user_key='') -%}
            {%- if _openbao_all_admins_resp.results is defined -%}
              {%- for res in _openbao_all_admins_resp.results -%}
                {%- if res.item == u and res.json is defined and res.json.data is defined and res.json.data.data is defined -%}
                  {%- set raw_data = res.json.data.data -%}
                  {%- if raw_data is mapping and (u in raw_data) and (raw_data[u] is mapping or (raw_data[u] is sequence and raw_data[u] is not string)) -%}
                    {%- set entry_list = raw_data[u] -%}
                  {%- elif raw_data is mapping and ('ssh_public_key' in raw_data or 'username' in raw_data or 'type' in raw_data) -%}
                    {%- set entry_list = raw_data -%}
                  {%- elif raw_data is mapping and (raw_data.values() | length > 0) and ((raw_data.values() | first) is mapping or ((raw_data.values() | first) is sequence and (raw_data.values() | first) is not string)) -%}
                    {%- set entry_list = raw_data.values() | first -%}
                  {%- else -%}
                    {%- set entry_list = raw_data -%}
                  {%- endif -%}
                  {%- set matched_entries = (entry_list | selectattr('type', 'defined') | selectattr('type', 'equalto', 'SSH') | list) if (entry_list is sequence and entry_list is not string and entry_list is not mapping) else [] -%}
                  {%- set entry = (matched_entries | first) if matched_entries | length > 0 else ((entry_list | first) if (entry_list is sequence and entry_list is not string and entry_list is not mapping and entry_list | length > 0) else (entry_list if entry_list is mapping else {})) -%}
                  {%- set ns.user_key = entry.get('ssh_public_key', '') -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set _ = dynamic_accs.append({
                  'name': u,
                  'tier': 'admin',
                  'comment': 'Administrator provisioned via OpenBao',
                  'shell': '/bin/bash',
                  'keys': [ns.user_key] if ns.user_key | length > 0 else []
                }) -%}
          {%- endfor -%}
          {{ dynamic_accs }}

    - name: Verify OpenBao target host metadata is resolved
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host | length > 0
          - ansible_host != inventory_hostname
        fail_msg: >-
          [OPENBAO-HOST-MISSING] Target host IP/metadata not found or invalid in OpenBao for '{{ inventory_hostname }}'.
          Resolved ansible_host='{{ ansible_host | default("UNSET", true) }}'.
          Attempted OpenBao lookup: VAULT_ADDR='{{ _vault_addr }}',
          Mount='{{ openbao_mount }}',
          Path='{{ openbao_hosts_prefix }}{{ inventory_hostname }}',
          Namespace='{{ openbao_namespace }}',
          AuthMethod='{{ _vault_auth_method | default("NONE", true) }}' (has_approle: {{ _has_approle | default(false) }}, has_token: {{ (_vault_token | default('') | length) > 0 }}).
          Please check Semaphore Variable Group (Secrets / Extra vars / Environment):
          1) Set vault_role_id & vault_secret_id (in Secrets or Environment) OR vault_token.
          2) Verify openbao_hosts_prefix matches your OpenBao secret path structure (e.g. 'secret/hosts/' or 'hosts/').
          3) Ensure OpenBao secret at '{{ openbao_hosts_prefix }}{{ inventory_hostname }}' exists and contains 'ansible_host', 'public_ip', or 'ip'.

    - name: Probe SSH connection using primary admin user credentials
      ansible.builtin.command: >-
        ssh -o BatchMode=yes
            -o ConnectTimeout=5
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -p {{ ansible_port | default(22) }}
            {% if _admin_key_tempfile.path is defined %}-i {{ _admin_key_tempfile.path }}{% endif %}
            {{ _primary_admin_user }}@{{ ansible_host | default(inventory_hostname) }} 'echo OK'
      register: _admin_ssh_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _admin_key_tempfile is defined
        - _admin_key_tempfile.path is defined
        - (_admin_user_entry.ssh_private_key | default('')) | length > 0

    - name: Set connection mode facts based on admin SSH probe result
      ansible.builtin.set_fact:
        _is_already_provisioned: "{{ (_admin_ssh_probe.rc == 0) if (_admin_ssh_probe is defined and _admin_ssh_probe.rc is defined) else false }}"

    - name: Configure connection parameters for already provisioned host (Admin SSH Key mode)
      ansible.builtin.set_fact:
        ansible_user: "{{ _primary_admin_user }}"
        ansible_ssh_private_key_file: "{{ _admin_key_tempfile.path | default(omit) }}"
        ansible_become_password: "{{ _admin_user_entry.password | default(omit) }}"
      when: _is_already_provisioned | bool

    - name: Configure connection parameters for unprovisioned host (Bootstrap fallback mode)
      ansible.builtin.set_fact:
        ansible_user: "{{ bootstrap_user }}"
        ansible_password: "{{ _bootstrap_user_entry.password | default(omit) }}"
        ansible_ssh_private_key_file: "{{ _boot_key_tempfile.path | default(omit) }}"
        ansible_become_password: "{{ _bootstrap_user_entry.password | default(omit) }}"
      when: not (_is_already_provisioned | bool)

    - name: Connection decision summary
      ansible.builtin.debug:
        msg:
          "대상 호스트": "{{ inventory_hostname }} (IP: {{ ansible_host | default('UNSET') }})"
          "프로비저닝 상태": "{{ '기존 배포 완료됨 (Already Provisioned)' if _is_already_provisioned else '신규 호스트 (부트스트랩 모드 실행)' }}"
          "원격 접속 계정": "{{ ansible_user }} ({{ 'SSH 개인키 인증' if _is_already_provisioned else '부트스트랩 계정' }})"
          "Sudo 권한 확보": "{{ 'OpenBao 계정 패스워드 로드 완료' if ((ansible_become_password | default('')) | length > 0) else 'NOPASSWD 또는 기본 권한 사용' }}"
          "실행 계획": "{{ '관리자 계정 자격증명으로 원격 구성 및 패키지 갱신을 진행합니다.' if _is_already_provisioned else '초기 관리자 계정 구성 및 루트 권한 통제를 시작합니다.' }}"

# ------------------------------------------------------------------------------
# Play 2: Provision Baseline Target Hosts
# ------------------------------------------------------------------------------
- name: Provision Baseline On-Premise Target Hosts
  hosts: servers:loadbalancers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify connectivity and OS facts
      ansible.builtin.debug:
        msg:
          "진행 단계": "호스트 기본 OS 환경 및 연결 확인 완료"
          "대상 서버": "{{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }} / 커널 {{ ansible_kernel }})"
          "실행 사용자": "{{ ansible_user }} (Sudo 권한 승격: 활성화)"

  roles:
    - role: common
      tags: [common, base]

    - role: docker_engine
      tags: [docker, containers]

    - role: security
      tags: [security, ssh, firewall]

    - role: access_security
      tags: [access, openbao, boundary, security, ssh-ca]

    - role: monitoring
      tags: [monitoring, metrics, otel]

  post_tasks:
    - name: Target host provisioning completion summary
      ansible.builtin.debug:
        msg:
          "결과 상태": "호스트 기본 인프라 및 보안 프로비저닝 성공 완료"
          "대상 서버": "{{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
          "반영 완료 항목":
            - "1. 시스템 기반: 타임존(KST), Chrony NTP 동기화, 시스템 최적화(sysctl, limits) 적용"
            - "2. 계정 및 접근: 관리자 계정({{ _normalized_admin_users | join(', ') }}) 생성, NOPASSWD Sudo 구성, SSH 공개키 등록"
            - "3. 시스템 보안: SSH 보안 강화(Root 로그인 제한), 방화벽(Firewalld/UFW), Fail2ban 보호 활성화"
            - "4. 컨테이너 인프라: Docker Engine 최신 런타임 및 Docker Compose 플러그인 설치"
            - "5. 접근 제어 및 감시: OpenBao SSH CA 신뢰 구성, Boundary 연동 메타데이터, Auditd 감사 규칙 등록"
            - "6. 통합 관측성: OpenTelemetry Collector 배포 및 메트릭 수집 서비스 기동"

# ------------------------------------------------------------------------------
# Play 3: Cleanup temporary controller credentials
# ------------------------------------------------------------------------------
- name: Cleanup temporary controller credentials
  hosts: servers:loadbalancers
  gather_facts: false
  connection: local
  become: false
  tasks:
    - name: Remove temporary admin SSH private key file
      ansible.builtin.file:
        path: "{{ _admin_key_tempfile.path }}"
        state: absent
      check_mode: false
      when:
        - _admin_key_tempfile is defined
        - _admin_key_tempfile.path is defined

    - name: Remove temporary bootstrap SSH private key file
      ansible.builtin.file:
        path: "{{ _boot_key_tempfile.path }}"
        state: absent
      check_mode: false
      when:
        - _boot_key_tempfile is defined
        - _boot_key_tempfile.path is defined
