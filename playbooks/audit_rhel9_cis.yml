---
# ==============================================================================
# Rocky Linux 9 / RHEL 9 CIS Benchmark Audit Pilot Playbook
#
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/audit_rhel9_cis.yml --limit ns0332.nanoit.kr
#
# 주의사항:
#   - 본 플레이북은 시스템 구성을 변경하지 않고 감사 보고서(PASS/FAIL)만 수집하는
#     'audit_only: true' 전용 파일럿 도구입니다.
#   - 기존 Docker 네트워크, Firewalld 존, OpenBao SSH CA와의 충돌을 방지하기 위해
#     관련 규칙들을 안전하게 비활성화/예외 처리합니다.
# ==============================================================================

- name: Audit Rocky Linux 9 Hosts against CIS Benchmark
  hosts: servers
  become: true
  gather_facts: true
  vars:
    # 1. 시스템 무변경 감사 모드 강제 (Remediation 비활성화)
    rhel9_cis_audit_only: true

    # 2. Zero-Trust 및 인프라 아키텍처 충돌 방지를 위한 예외 규칙 설정
    # OpenBao SSH CA / AuthorizedPrincipals 보존
    rhel9_cis_rule_5_2_1: false
    # Docker 브리지 및 firewalld custom zone 보존
    rhel9_cis_rule_3_4_2_1: false
    # Semaphore UI 자동화 및 관리자 sudo NOPASSWD 보존
    rhel9_cis_rule_5_3_4: false

  tasks:
    # 실행 차단: 위 변수 이름(rhel9_cis_audit_only, rhel9_cis_rule_*)은 고정된 role 2.4.0이
    # 읽는 이름(audit_only, rhel9cis_rule_*)과 달라 감사 전용 모드가 켜지지 않고 CIS 교정이
    # 실행된다. Host Audit([Map] #100)이 이 파일럿을 대체할 때까지 어떤 호스트에서도 돌지 않게 한다.
    - name: "Block execution — pilot is disabled (would remediate, not audit)"
      ansible.builtin.fail:
        msg: >-
          audit_rhel9_cis.yml은 비활성화되었습니다. 감사 전용 모드가 적용되지 않아 CIS 교정이
          실행되기 때문입니다. Host Audit(GitHub #100)을 사용하십시오.

    - name: "Verify target OS compatibility (Rocky Linux 9 / RHEL 9)"
      ansible.builtin.debug:
        msg: "Starting CIS Benchmark Audit for {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int == 9

    - name: "Execute ansible-lockdown CIS Audit role"
      ansible.builtin.include_role:
        name: ansible-lockdown.rhel9_cis
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int == 9

    - name: "CIS audit completion summary"
      ansible.builtin.debug:
        msg: "CIS Benchmark Audit finished for {{ inventory_hostname }}. System state remains untouched."
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int == 9
