---
# ==============================================================================
# Host Agents 전용 플레이북 (ADR-0006) — otelcol-contrib 수집 에이전트 + restic/resticprofile 백업 에이전트
# ==============================================================================
# Host Agents를 다루는 유일한 진입점이다. monitoring은 site.yml/maintenance.yml에서 제거되었다.
#
# Semaphore 템플릿:
#   Host Agents — Deploy : 태그 없음 (설치 + 설정 전체)
#   Host Agents — Config : --tags agents_config [--check --diff] (설정 재적용만)
# 보조 태그: agents_install, agents_config, otel, backup
#
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/host_agents.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/host_agents.yml -e target_hosts=ns0266   # 카나리 1대
#
# 신규 호스트는 템플릿을 2회 실행한다: site.yml → Host Agents — Deploy.
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: 연결/자격증명 해석 (공유 플레이북)
# tags: [always] — --tags 실행에서도 자격증명 해석이 스킵되지 않도록 강제
# 에이전트 play와 같은 호스트 집합(target_hosts ∩ servers)만 해석한다.
# ------------------------------------------------------------------------------
- name: Resolve OpenBao Connection and Credentials
  ansible.builtin.import_playbook: common/resolve_connection.yml
  vars:
    connection_hosts: "{{ target_hosts | default('servers') }}:&servers"
  tags: [always]

# ------------------------------------------------------------------------------
# Play 2: Host Agents 적용
# OS 프로브 · 프로비저닝 assert · fact 수집 · OpenBao 입력 검증은 역할 안에서 수행한다.
# ------------------------------------------------------------------------------
- name: Apply Host Agents
  hosts: "{{ target_hosts | default('servers') }}:&servers"
  serial: 25%
  gather_facts: false
  roles:
    - role: monitoring
      become: true
      tags: [otel]
    - role: backup
      become: true
      tags: [backup]

# ------------------------------------------------------------------------------
# Play 3: 임시 개인키 정리 (공유 플레이북)
# tags: [always] — --tags 실행에서도 임시 개인키 삭제가 스킵되지 않도록 강제
# ------------------------------------------------------------------------------
- name: Cleanup temporary controller credentials
  ansible.builtin.import_playbook: common/cleanup_connection.yml
  vars:
    connection_hosts: "{{ target_hosts | default('servers') }}:&servers"
  tags: [always]
