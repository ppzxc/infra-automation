---
# ==============================================================================
# Host Audit 플레이북 (ADR-0009) — 읽기 전용 점검과 A4 통합 보고서
# ==============================================================================
# 관리 호스트(servers · loadbalancers · overseer)를 읽기 전용으로 점검해 러너에
# 호스트별 JSON과 A4 인쇄용 HTML 보고서 1부를 만든다. 호스트를 고치지 않는다.
# Host Agents Exclusion 호스트와 CentOS 6/7 호스트도 점검한다(raw 조회만 사용).
#
# 단계: ① 대상·실행 메타 확정(localhost) → ② 접속 해석(resolve_connection 재사용)
#       → ③ 호스트별 raw 수집 → ④ 임시 키 정리 → ⑤ 보고서 모델 → HTML(localhost)
# 접속에 실패한 호스트는 실행을 멈추지 않고 보고서에 '점검불가'로 남는다.
#
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/host_audit.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/host_audit.yml -e target_hosts=ns0266
# 산출물: ${HOST_AUDIT_OUTPUT_ROOT:-/tmp/host_audit}/<run_id>/{hosts/*.json,run.json,report.html}
# ==============================================================================

- name: Prepare Host Audit run
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Fix run metadata and select targets
      ansible.builtin.include_role:
        name: host_audit
        tasks_from: prepare

- name: Resolve OpenBao Connection and Credentials
  ansible.builtin.import_playbook: common/resolve_connection.yml
  vars:
    connection_hosts: host_audit_targets

- name: Collect host state (read-only)
  hosts: host_audit_targets
  gather_facts: false
  become: false
  roles:
    - role: host_audit

- name: Cleanup temporary controller credentials
  ansible.builtin.import_playbook: common/cleanup_connection.yml
  vars:
    connection_hosts: host_audit_targets

- name: Build Host Audit report
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Build report model and render HTML
      ansible.builtin.include_role:
        name: host_audit
        tasks_from: report
