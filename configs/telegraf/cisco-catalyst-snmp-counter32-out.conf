# Optional per-device fallback for ifHCOutOctets only. Load alongside the base
# config when a targeted walk proves that HC leaf absent, and omit only its
# matching primary Watched Port input. Other metrics remain at their native width.

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_watched_port_interface_legacy"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 20
  stop_on_error = true
  agent_host_tag = "source"
  tagpass = { if_alias = ["Core:*", "Transit:*"] }

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"
    counter_width = "32"

  [[inputs.snmp.table]]
    name = "cisco_watched_port_interface_legacy"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      name = "if_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      name = "if_alias"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.3"
      name = "if_type"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.16"
      name = "if_out_octets"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.15"
      name = "if_high_speed_mbps"
