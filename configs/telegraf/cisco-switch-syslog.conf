# Cisco switch RFC3164/UDP syslog receiver.
# Supply these values outside the repository:
#   TELEGRAF_SYSLOG_SERVER (for example, udp://:6514)
#   TELEGRAF_SYSLOG_ALLOWED_SOURCES (JSON/TOML string array of observed source IPs)
#   TELEGRAF_SYSLOG_HOST_NAME (collection server name)
#   OPENOBSERVE_SYSLOG_JSON_URL (organization/stream _json ingestion endpoint)
#   O2_BASIC_AUTH (base64 of <organization>:<ingest-token>, without the Basic prefix)
# The source allowlist and OpenObserve endpoint contain deployment-specific values.

[[inputs.syslog]]
  server = "${TELEGRAF_SYSLOG_SERVER}"
  syslog_standard = "RFC3164"
  best_effort = true
  allowed_sources = ${TELEGRAF_SYSLOG_ALLOWED_SOURCES}

[[outputs.http]]
  url = "${OPENOBSERVE_SYSLOG_JSON_URL}"
  method = "POST"
  timeout = "10s"
  data_format = "json"
  use_batch_format = true
  namepass = ["syslog"]
  json_transformation = '''metrics.{
    "_timestamp": $fromMillis(timestamp * 1000),
    "service_name": "switch-syslog",
    "host_name": "${TELEGRAF_SYSLOG_HOST_NAME}",
    "severity": 0,
    "body": $lookup({"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"}, $substring($fromMillis(($exists(fields.timestamp) ? $number(fields.timestamp) : timestamp) * 1000), 5, 2)) & " " & $substring($fromMillis(($exists(fields.timestamp) ? $number(fields.timestamp) : timestamp) * 1000), 8, 2) & " " & $substring($fromMillis(($exists(fields.timestamp) ? $number(fields.timestamp) : timestamp) * 1000), 11, 8) & " " & ($exists(tags.source) ? $string(tags.source) : "") & " " & ($exists(tags.hostname) ? $string(tags.hostname) : "") & ": " & ($exists(fields.msg) ? $string(fields.msg) : "")
  }'''

  [outputs.http.headers]
    Authorization = "Basic ${O2_BASIC_AUTH}"
    Content-Type = "application/json"
