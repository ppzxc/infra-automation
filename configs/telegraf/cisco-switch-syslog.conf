# Cisco switch RFC3164/UDP syslog receiver.
# Supply these values outside the repository:
#   TELEGRAF_SYSLOG_SERVER (for example, udp://:6514)
#   TELEGRAF_SYSLOG_ALLOWED_SOURCES (JSON/TOML string array of observed source IPs)
#   TELEGRAF_SYSLOG_HOST_NAME (collection server name)
#   OPENOBSERVE_SYSLOG_JSON_URL (organization/stream _json ingestion endpoint)
#   O2_BASIC_AUTH (base64 of <organization>:<ingest-token>, without the Basic prefix)
# The source allowlist and OpenObserve endpoint contain deployment-specific values.
#
# Why socket_listener and not inputs.syslog: Cisco IOS prints "<PRI>SEQ: HOST: Mmm dd hh:mm:ss.mmm ZONE: %FAC-SEV-MNEM: text".
# The RFC3164 parser of inputs.syslog rejects the sequence number ("expecting a sequence number ... [col 5]"), and best_effort
# then keeps only the receive time and drops the message (observed 2026-11-13 .. 2026-11-16, every record body empty).
# socket_listener takes the raw datagram, grok splits it, and allowed_sources keeps the source allowlist.
# Trade-off: socket_listener does not expose the sender address, so the device is identified by the HOST the switch prints
# (needs `logging origin-id hostname` on the switch). Without HOST the device becomes "unknown".

[[inputs.socket_listener]]
  service_address = "${TELEGRAF_SYSLOG_SERVER}"
  allowed_sources = ${TELEGRAF_SYSLOG_ALLOWED_SOURCES}
  data_format = "grok"
  name_override = "syslog"
  # 1) <PRI>[SEQ: ][HOST: ]MESSAGE   2) anything else is kept whole instead of being dropped
  grok_patterns = [
    '^<%{NUMBER:pri}>(?:%{NUMBER:seq}: )?(?:%{NOTSPACE:hostname}: )?%{GREEDYDATA:msg}$',
    '^%{GREEDYDATA:msg}$',
  ]

[[outputs.http]]
  url = "${OPENOBSERVE_SYSLOG_JSON_URL}"
  method = "POST"
  timeout = "10s"
  data_format = "json"
  use_batch_format = true
  namepass = ["syslog"]
  # body keeps the shape switch_syslog_semantics.vrl expects: "<receive time> <sender> <device>: <message>".
  # The sender token is "-" because the sender address is not available (see the trade-off above).
  json_transformation = '''metrics.{
    "_timestamp": $fromMillis(timestamp * 1000),
    "service_name": "switch-syslog",
    "host_name": "${TELEGRAF_SYSLOG_HOST_NAME}",
    "severity": 0,
    "body": $lookup({"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"}, $substring($fromMillis(timestamp * 1000), 5, 2)) & " " & $substring($fromMillis(timestamp * 1000), 8, 2) & " " & $substring($fromMillis(timestamp * 1000), 11, 8) & " - " & ($exists(fields.hostname) ? $string(fields.hostname) : "unknown") & ": " & ($exists(fields.msg) ? $string(fields.msg) : "")
  }'''

  [outputs.http.headers]
    Authorization = "Basic ${O2_BASIC_AUTH}"
    Content-Type = "application/json"
