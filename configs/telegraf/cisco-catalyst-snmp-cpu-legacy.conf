# Optional per-device CPU fallback. Load alongside the base config only after a
# targeted walk proves both Rev CPU leaves absent; omit only the primary CPU
# input for that device. The base P0 uptime/interface/memory inputs stay active.

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_device_legacy"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = true
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"
    cpu_oid_set = "legacy"

  [[inputs.snmp.table]]
    name = "cisco_device_legacy"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.3"
      name = "cpu_1min_percent"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.4"
      name = "cpu_5min_percent"
