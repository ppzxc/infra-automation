# Optional 300s input. Include only for models that returned these tables in
# the captured SNMP walks (currently Catalyst 3750X and 3850).

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "300s"
  name_override = "cisco_sensor"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = false
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"

  [[inputs.snmp.table]]
    name = "cisco_sensor"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.7"
      name = "physical_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.5"
      name = "physical_class"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.91.1.1.1.1.1"
      name = "sensor_type"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.91.1.1.1.1.2"
      name = "sensor_scale"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.91.1.1.1.1.3"
      name = "sensor_precision"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.91.1.1.1.1.4"
      name = "sensor_value_raw"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.91.1.1.1.1.5"
      name = "sensor_status"

  [[inputs.snmp.table]]
    name = "cisco_fru"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.7"
      name = "physical_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.5"
      name = "physical_class"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.117.1.1.2.1.2"
      name = "fru_power_oper_status"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.117.1.4.1.1.1"
      name = "fan_tray_oper_status"
