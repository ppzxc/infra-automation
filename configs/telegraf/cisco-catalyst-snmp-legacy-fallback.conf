# Enable only for a device whose targeted walk proved the Rev CPU or HC
# Counter64 OID absent. Never load alongside the matching primary input: the
# fallback would double-count and mix counter widths.

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_device_legacy"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = true
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"
    cpu_oid_set = "legacy"

  [[inputs.snmp.table]]
    name = "cisco_device_legacy"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.3"
      name = "cpu_1min_percent"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.4"
      name = "cpu_5min_percent"

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_uplink_interface_legacy"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 20
  stop_on_error = true
  agent_host_tag = "source"
  tagpass = { if_alias = ["Core:*", "Transit:*"] }

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"
    counter_width = "32"

  [[inputs.snmp.table]]
    name = "cisco_uplink_interface_legacy"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      name = "if_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      name = "if_alias"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.3"
      name = "if_type"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.10"
      name = "if_in_octets"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.16"
      name = "if_out_octets"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.15"
      name = "if_high_speed_mbps"
