# Optional per-device fallback for cpmCPUTotal1minRev only. Load alongside the
# base config when a targeted walk proves that Rev leaf absent, and omit only
# its matching primary CPU input. The other CPU window and P0 inputs stay active.

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_device_legacy"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = true
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"
    cpu_oid_set = "legacy"
    cpu_window = "1min"

  [[inputs.snmp.table]]
    name = "cisco_device_legacy"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.3"
      name = "cpu_1min_percent"
