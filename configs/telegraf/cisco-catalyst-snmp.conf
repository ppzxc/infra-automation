# One generated instance per switch. Supply DEVICE_ID and SNMP_AGENT in the
# process environment; keep SNMPv3 credentials in the Docker secret store.
# The OpenTelemetry output is configured by the host's shared Telegraf config.

[[secretstores.docker]]
  id = "switch_snmp"

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_device"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 20
  stop_on_error = true
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"

  # The presence of this successful response is the device poll heartbeat.
  # Alert on its absence; never synthesize a zero for a failed poll.
  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.3.0"
    name = "sys_uptime_ticks"

  [[inputs.snmp.table]]
    name = "cisco_cpu"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.8"
      name = "cpu_1min_percent"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.109.1.1.1.1.9"
      name = "cpu_5min_percent"

  [[inputs.snmp.table]]
    name = "cisco_interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.1"
      name = "if_index"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.3"
      name = "if_type"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      name = "if_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      name = "if_alias"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.7"
      name = "if_admin_status"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.8"
      name = "if_oper_status"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.9"
      name = "if_last_change_ticks"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.13"
      name = "if_in_discards"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.14"
      name = "if_in_errors"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.19"
      name = "if_out_discards"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.20"
      name = "if_out_errors"

[[inputs.snmp]]
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_memory"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = true
  agent_host_tag = "source"
  tagpass = { pool_name = ["Processor", "I/O", "IOS Process stack"] }

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"

  [[inputs.snmp.table]]
    name = "cisco_memory"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.48.1.1.1.2"
      name = "pool_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.48.1.1.1.5"
      name = "pool_used_bytes"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.4.1.9.9.48.1.1.1.6"
      name = "pool_free_bytes"

[[inputs.snmp]]
  # Poll only rows whose configured description marks the link as Core/Transit.
  # The receiver still walks only the two HC octet columns and ifHighSpeed.
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "60s"
  name_override = "cisco_uplink_interface"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 20
  stop_on_error = true
  agent_host_tag = "source"
  tagpass = { if_alias = ["Core:*", "Transit:*"] }

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"

  [[inputs.snmp.table]]
    name = "cisco_uplink_interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.1"
      name = "if_index"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      name = "if_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      name = "if_alias"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.2.2.1.3"
      name = "if_type"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.6"
      name = "if_hc_in_octets"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.10"
      name = "if_hc_out_octets"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.31.1.1.1.15"
      name = "if_high_speed_mbps"

[[inputs.snmp]]
  # Static inventory is polled once daily; avoid repeating text tags every minute.
  agents = ["udp://${SNMP_AGENT}:161"]
  interval = "24h"
  name_override = "cisco_device_info"
  version = 3
  sec_name = "mgmtsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{switch_snmp:snmp_auth_authpriv_aes}"
  priv_protocol = "AES"
  priv_password = "@{switch_snmp:snmp_priv_authpriv_aes}"
  timeout = "2s"
  retries = 1
  max_repetitions = 10
  stop_on_error = true
  agent_host_tag = "source"

  [inputs.snmp.tags]
    device_id = "${DEVICE_ID}"

  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.5.0"
    name = "sys_name"
    is_tag = true

  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.2.0"
    name = "sys_object_id"
    is_tag = true

  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.1.0"
    name = "sys_descr"
    is_tag = true

  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.3.0"
    name = "inventory_poll_success"

  [[inputs.snmp.table]]
    name = "cisco_physical_inventory"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.7"
      name = "physical_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.5"
      name = "physical_class"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.13"
      name = "model_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.47.1.1.1.1.11"
      name = "serial_number"
      is_tag = true
