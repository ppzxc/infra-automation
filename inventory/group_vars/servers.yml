---
# 온프레미스 IDC 서버 그룹 변수 (Standard UTC / Leap Smear 미적용 소스 일원화)
ntp_pools:
  - "kr.pool.ntp.org"

ntp_servers:
  - "time.kriss.re.kr"
  - "time2.kriss.re.kr"
  - "time.cloudflare.com"

# 커널 파라미터 추가 튜닝 (기본값 외 추가 파라미터 필요 시 명시)
# sysctl_extra_settings: {}

# 패키지 업데이트 및 기본 도구
common_packages:
  - curl
  - wget
  - git
  - vim
  - net-tools
  - chrony
  - jq
  - ca-certificates
  - tar
  - gzip


# Host Agents — OpenObserve 연결 (비시크릿, ADR-0006 §2.7). 수집 토큰은 OpenBao hosts/<host>/agents의 o2_ingest_token.
# o2_endpoint는 끝 슬래시 없이 지정해야 한다 (미지정 시 Host Agents 실행이 실패).
# o2_endpoint: "https://openobserve.example.internal:5080"
# o2_org: "default"
# o2_ca_file: "/etc/pki/ca-trust/source/anchors/internal-ca.pem"
