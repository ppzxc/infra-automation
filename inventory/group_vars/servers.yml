---
# 온프레미스 IDC 서버 그룹 변수 (Standard UTC / Leap Smear 미적용 소스 일원화)
ntp_pools:
  - "kr.pool.ntp.org"

ntp_servers:
  - "time.kriss.re.kr"
  - "time2.kriss.re.kr"
  - "time.cloudflare.com"

# 커널 파라미터 추가 튜닝 (기본값 외 추가 파라미터 필요 시 명시)
# sysctl_extra_settings: {}

# 패키지 업데이트 및 기본 도구
common_packages:
  - curl
  - wget
  - git
  - vim
  - net-tools
  - chrony
  - jq
  - ca-certificates
  - tar
  - gzip

# Host Agents — OpenObserve / RustFS 연결 값 (ADR-0006 §2.7, 해석 순서: Extra variables·group_vars > OpenBao > 기본값)
# 이 저장소는 공개(PUBLIC)이므로 내부 도메인을 여기에 적지 않는다. 평상시에는 OpenBao에 넣는다:
#   secret/agents/openobserve : o2_endpoint, o2_org, o2_ca_file   (+ controller_ingest_token)
#   secret/agents/rustfs      : rustfs_endpoint, rustfs_region, rustfs_ca_file (+ maintenance_access_key/secret_key)
#   secret/hosts/<host>/agents: (선택) rustfs_bucket — 미지정이면 규칙 backup_prod_<호스트명>
# 값은 끝 슬래시 없이 지정해야 한다 (미지정 시 Host Agents 실행이 실패). 일회성 재정의는 Semaphore Extra variables(-e)로 준다.
# 사설 CA 경로(o2_ca_file/rustfs_ca_file)는 대상 호스트상의 파일 경로다.
