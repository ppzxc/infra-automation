---
# ==============================================================================
# Cisco IOS Network Switches Group Variables
# ==============================================================================

ansible_network_os: cisco.ios.ios
ansible_connection: network_cli

# OpenBao (Vault) 네임스페이스 및 마운트 경로 설정 (외부 변수 또는 Semaphore Environment 주입 가능)
cisco_openbao_namespace: "{{ _local_cisco_openbao_namespace | default(openbao_namespace | default(lookup('env', 'VAULT_NAMESPACE') | default(omit, true), true), true) }}"

cisco_openbao_mount: "{{ _local_cisco_openbao_mount | default(openbao_mount | default('secret', true), true) }}"
cisco_openbao_secret_prefix: "{{ _local_cisco_openbao_secret_prefix | default(openbao_cisco_prefix | default('switches/', true), true) }}"

# AppRole 인증 자격증명 (Semaphore Variable Group 주입 시 자동 감지)
_vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') | default('', true) }}"
_vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') | default('', true) }}"
_has_approle: "{{ (_vault_role_id | length > 0) and (_vault_secret_id | length > 0) }}"
_vault_auth_method: "{{ 'approle' if _has_approle else (lookup('env', 'VAULT_AUTH_METHOD') | default('token', true)) }}"

# 1. 스위치별 OpenBao 시크릿 조회
_vault_cisco_node_secret: >-
  {{
    lookup(
      'community.hashi_vault.hashi_vault',
      'secret=' + cisco_openbao_secret_prefix + inventory_hostname,
      'engine_mount_point=' + cisco_openbao_mount,
      ('auth_method=' + _vault_auth_method) if _vault_auth_method else omit,
      ('role_id=' + _vault_role_id) if _has_approle else omit,
      ('secret_id=' + _vault_secret_id) if _has_approle else omit,
      ('namespace=' + lookup('env', 'VAULT_NAMESPACE')) if lookup('env', 'VAULT_NAMESPACE') else omit,
      errors='ignore'
    ) | default({}, true)
  }}

# 2. 전역 공통 OpenBao 시크릿 조회
_vault_global_secret: >-
  {{
    lookup(
      'community.hashi_vault.hashi_vault',
      'secret=global/services',
      'engine_mount_point=' + cisco_openbao_mount,
      ('auth_method=' + _vault_auth_method) if _vault_auth_method else omit,
      ('role_id=' + _vault_role_id) if _has_approle else omit,
      ('secret_id=' + _vault_secret_id) if _has_approle else omit,
      ('namespace=' + lookup('env', 'VAULT_NAMESPACE')) if lookup('env', 'VAULT_NAMESPACE') else omit,
      errors='ignore'
    ) | default({}, true)
  }}




# 3. 호스트/시크릿 사전 참조 별칭 (중복 참조 최소화)
_cisco_sec: "{{ _vault_cisco_node_secret | default({}, true) }}"
_host_v: "{{ hostvars[inventory_hostname] | default({}, true) }}"

# 4. 우선순위: OpenBao KV v2 최우선 -> 인벤토리/로컬 폴백 -> 기본값
ansible_host: "{{ _cisco_sec.ansible_host | default(_host_v.ansible_host | default(ip | default(inventory_hostname))) }}"
ansible_port: "{{ (_cisco_sec.ansible_port | default(_host_v.ansible_port | default(22))) | int }}"
connection_type: "{{ _cisco_sec.connection_type | default(_host_v.connection_type | default('ssh')) }}"
bastion_host: "{{ _cisco_sec.bastion_host | default(_host_v.bastion_host | default(omit)) }}"
fqdn: "{{ _cisco_sec.fqdn | default(_host_v.fqdn | default(inventory_hostname)) }}"

ansible_user: "{{ _cisco_sec.ansible_user | default(_host_v.ansible_user | default((_vault_global_secret | default({}, true)).cisco_user | default('ansible-backup'))) }}"
ansible_password: "{{ _cisco_sec.ansible_password | default(_host_v.ansible_password | default((_vault_global_secret | default({}, true)).cisco_password | default(omit))) }}"

ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ _cisco_sec.ansible_become_password | default(_host_v.ansible_become_password | default((_vault_global_secret | default({}, true)).cisco_enable_password | default(ansible_password | default(omit)))) }}"


# 네트워크 CLI SSH 타임아웃
ansible_command_timeout: 60
ansible_connect_timeout: 30

