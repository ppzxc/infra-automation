---
# ==============================================================================
# Cisco IOS Network Switches Group Variables
# ==============================================================================

ansible_network_os: cisco.ios.ios
ansible_connection: network_cli

# OpenBao (Vault) 네임스페이스 및 마운트 경로 설정 (외부 변수 또는 Semaphore Environment 주입 가능)
cisco_openbao_namespace: "{{ _local_cisco_openbao_namespace | default(openbao_namespace | default(vault_namespace | default(VAULT_NAMESPACE | default(lookup('env', 'VAULT_NAMESPACE') | default(lookup('env', 'OPENBAO_NAMESPACE') | default('', true), true), true), true), true), true) }}"

cisco_openbao_mount: "{{ _local_cisco_openbao_mount | default(openbao_mount | default(vault_mount | default(VAULT_MOUNT | default(lookup('env', 'VAULT_MOUNT') | default('secret', true), true), true), true), true) }}"
cisco_openbao_secret_prefix: "{{ _local_cisco_openbao_secret_prefix | default(openbao_cisco_prefix | default(lookup('env', 'OPENBAO_CISCO_PREFIX') | default(lookup('env', 'VAULT_CISCO_PREFIX') | default('switches/', true), true), true), true) }}"

# AppRole 및 Token 인증 자격증명 자동 감지 (Semaphore Secrets / Extra vars / OS Env vars 모두 지원)
_vault_role_id: "{{ vault_role_id | default(VAULT_ROLE_ID | default(lookup('env', 'VAULT_ROLE_ID') | default('', true), true), true) }}"
_vault_secret_id: "{{ vault_secret_id | default(VAULT_SECRET_ID | default(lookup('env', 'VAULT_SECRET_ID') | default('', true), true), true) }}"
_has_approle: "{{ (_vault_role_id | length > 0) and (_vault_secret_id | length > 0) }}"
_vault_token: "{{ vault_token | default(VAULT_TOKEN | default(lookup('env', 'VAULT_TOKEN') | default('', true), true), true) }}"
_vault_auth_method: "{{ vault_auth_method | default(VAULT_AUTH_METHOD | default(lookup('env', 'VAULT_AUTH_METHOD') | default('approle' if _has_approle else ('token' if (_vault_token | length > 0) else omit), true), true), true) }}"

# 1. 스위치별 OpenBao 시크릿 조회
_vault_cisco_node_secret: >-
  {{
    lookup(
      'community.hashi_vault.hashi_vault',
      'secret=' + cisco_openbao_secret_prefix + inventory_hostname,
      'engine_mount_point=' + cisco_openbao_mount,
      ('auth_method=' + _vault_auth_method) if (_vault_auth_method is defined and _vault_auth_method | length > 0) else omit,
      ('role_id=' + _vault_role_id) if _has_approle else omit,
      ('secret_id=' + _vault_secret_id) if _has_approle else omit,
      ('token=' + _vault_token) if (_vault_token | length > 0 and not _has_approle) else omit,
      ('namespace=' + cisco_openbao_namespace) if (cisco_openbao_namespace is defined and cisco_openbao_namespace | length > 0) else omit,
      errors='ignore'
    ) | default({}, true)
  }}

# 2. 전역 공통 OpenBao 시크릿 조회
_vault_global_secret: >-
  {{
    lookup(
      'community.hashi_vault.hashi_vault',
      'secret=global/services',
      'engine_mount_point=' + cisco_openbao_mount,
      ('auth_method=' + _vault_auth_method) if (_vault_auth_method is defined and _vault_auth_method | length > 0) else omit,
      ('role_id=' + _vault_role_id) if _has_approle else omit,
      ('secret_id=' + _vault_secret_id) if _has_approle else omit,
      ('token=' + _vault_token) if (_vault_token | length > 0 and not _has_approle) else omit,
      ('namespace=' + cisco_openbao_namespace) if (cisco_openbao_namespace is defined and cisco_openbao_namespace | length > 0) else omit,
      errors='ignore'
    ) | default({}, true)
  }}




# 3. 호스트/시크릿 사전 참조 별칭 (중복 참조 최소화)
_cisco_sec: "{{ _vault_cisco_node_secret | default({}, true) }}"
_host_v: "{{ hostvars[inventory_hostname] | default({}, true) }}"

# 4. OpenBao KV v2 최우선 -> 로컬/인벤토리 명시 변수 폴백 -> 없으면 빈 값 (short name fallback 금지)
# short name(inventory_hostname)은 OpenBao 조회 키로만 사용되며, ansible_host 등 접속 대상 주소로 fallback 되지 않습니다.
ansible_host: "{{ _cisco_sec.ansible_host | default(_host_v.ansible_host | default('', true), true) }}"
ansible_port: "{{ (_cisco_sec.ansible_port | default(_host_v.ansible_port | default(22))) | int }}"
connection_type: "{{ _cisco_sec.connection_type | default(_host_v.connection_type | default('ssh', true), true) }}"
bastion_host: "{{ _cisco_sec.bastion_host | default(_host_v.bastion_host | default(omit)) }}"
fqdn: "{{ _cisco_sec.fqdn | default(_host_v.fqdn | default('', true), true) }}"

ansible_user: "{{ _cisco_sec.ansible_user | default(_host_v.ansible_user | default('', true), true) }}"
ansible_password: "{{ _cisco_sec.ansible_password | default(_host_v.ansible_password | default(omit)) }}"

ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ _cisco_sec.ansible_become_password | default(_host_v.ansible_become_password | default(ansible_password | default(omit))) }}"


# 네트워크 CLI SSH 타임아웃
ansible_command_timeout: 60
ansible_connect_timeout: 30

# 구형 Cisco IOS 장비 SSH 레거시 알고리즘 호환성 옵션 (KEX / HostKey / Ciphers)
ansible_ssh_common_args: >-
  -o KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
  -o HostKeyAlgorithms=+ssh-rsa,ssh-dss
  -o Ciphers=+aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc


