  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#111; color:#fff; border-radius:999px; padding:6px 10px; display:flex; gap:10px; align-items:center; font:13px system-ui,sans-serif; box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:9; }

  ${HOSTS.map(h=>`<tr><td>${h.id}</td><td>${h.os}${h.eolState==="eol"?" "+tag("EOL","crit"):""}</td><td>${decl(h.purpose)}</td><td>${decl(h.owner)}</td><td>${decl(h.grade)}</td><td class="num">${h.pkgs.count}</td><td>${h.priv.filter(p=>!p.decl).map(p=>p.u).join(", ")||"-"}</td><td>${h.dormant.map(d=>d.u).join(", ")||"-"}</td></tr>`).join("")}</tbody></table>
  <h2 class="pb">3. Configuration Drift <span class="small mute">ISMS 2.9.1</span></h2>
  <table><thead><tr><th>호스트</th><th>SPEC-ID</th><th>태스크</th><th>요약</th><th>상태</th><th>판단(수기)</th></tr></thead><tbody>
  ${HOSTS.flatMap(h=>h.drift===null?[`<tr><td>${h.id}</td><td colspan="5">${tag("점검불가","na")} ${h.driftWhy}</td></tr>`]:h.drift.length?h.drift.map(d=>`<tr><td>${h.id}</td><td>${d.spec}</td><td>${d.task}</td><td>${d.sum}</td><td>${st(d.st)}</td><td style="width:22mm"></td></tr>`):[`<tr><td>${h.id}</td><td colspan="5" class="mute">드리프트 없음</td></tr>`]).join("")}</tbody></table>
  <h2>4. Configuration Vulnerability <span class="small mute">ISMS 2.11.2 · KISA-2026</span></h2>
  <table><thead><tr><th>호스트</th><th>항목</th><th>점검 내용</th><th>결과</th><th>상태</th><th>비고</th></tr></thead><tbody>
  ${HOSTS.flatMap(h=>h.cfg.filter(x=>x.res!=="양호").map(x=>`<tr><td>${h.id}</td><td>${x.code}</td><td>${x.name}</td><td>${resTag(x.res)}</td><td>${st(x.st)}</td><td class="small">${x.ex||""}</td></tr>`)).join("")}</tbody></table>
  <p class="small mute">양호 항목은 호스트별 부록에 수록.</p>
  <h2 class="pb">5. Package Vulnerability <span class="small mute">ISMS 2.10.8 · 2.11.2</span></h2>
  ${svgBars()}
  <table><thead><tr><th>호스트</th><th class="num">긴급</th><th class="num">높음</th><th class="num">중간</th><th class="num">낮음</th><th>비고</th></tr></thead><tbody>
  ${HOSTS.map(h=>`<tr><td>${h.id}</td><td class="num crit">${h.vuln.crit}</td><td class="num high">${h.vuln.high}</td><td class="num">${h.vuln.med}</td><td class="num">${h.vuln.low}</td><td class="small">${h.vuln.noCentosFix?`CentOS 수정본 없음 ${h.vuln.noCentosFix} · Red Hat 미수정(will not fix) ${h.vuln.wontfix} 별도`:""}</td></tr>`).join("")}</tbody></table>
  <h3>긴급·높음 상세</h3>
  <table><thead><tr><th>호스트</th><th>CVE</th><th>패키지</th><th>위험도</th><th>수정 버전</th><th>상태</th></tr></thead><tbody>
  ${HOSTS.flatMap(h=>h.vuln.top.map(v=>`<tr><td>${h.id}</td><td>${v.cve}</td><td>${v.pkg}</td><td>${sev(v.sev)}</td><td class="small">${v.fix}</td><td>${st(v.st)}</td></tr>`)).join("")}</tbody></table>
  <h2 class="pb">부록. 호스트별 상세</h2>
  ${HOSTS.map(hostDetail).join("")}
  ${signOff()}</div>`;
}
// ───────────────────────── B: 호스트 우선 (호스트별 1쪽 카드) ─────────────────────────
function VariantB(){
  const cell=(v,lvl)=>v===null?`<td class="hx">점검불가</td>`:`<td class="h${lvl}">${v}</td>`;
  const lv=n=>n===0?0:n<3?1:n<10?2:3;
  return `<div class="sheet">${cover("B — 호스트 우선")}
  ${eolBanner()}
  <h2>호스트 × 영역 현황</h2>
  <table class="heat"><thead><tr><th style="text-align:left">호스트</th><th>OS</th><th>선언 미지정</th><th>선언 외 특수권한</th><th>드리프트</th><th>설정 취약</th><th>패키지 긴급·높음</th><th>해소</th></tr></thead><tbody>
  ${HOSTS.map(h=>{const miss=[h.purpose,h.dept,h.owner,h.admin,h.grade].filter(x=>!x).length;const pv=h.priv.filter(p=>!p.decl).length;const vh=h.vuln.crit+h.vuln.high;
    return `<tr><td style="text-align:left">${h.id}</td>${h.eolState==="eol"?`<td class="h3">EOL</td>`:`<td class="h0">${h.os.replace("Rocky Linux","Rocky")}</td>`}${cell(miss,lv(miss))}${cell(pv,pv?3:0)}${cell(driftN(h),lv(driftN(h)??0))}${cell(cfgBad(h),cfgBad(h)?3:0)}${cell(vh,lv(vh))}<td class="h0">${h.resolved}</td></tr>`;}).join("")}</tbody></table>
  <p class="small mute">초록 = 없음 · 노랑 = 1~2 · 주황 = 3~9 · 빨강 = 10 이상 또는 즉시 검토. 회색 = 점검불가.</p>
  ${naNote()}
  ${HOSTS.map(h=>`<div class="pb"></div>${hostDetail(h)}
    <h3>Configuration Drift</h3>${h.drift===null?`<p>${tag("점검불가","na")} ${h.driftWhy}</p>`:h.drift.length?`<table><thead><tr><th>SPEC-ID</th><th>태스크</th><th>요약</th><th>상태</th><th>판단(수기)</th></tr></thead><tbody>${h.drift.map(d=>`<tr><td>${d.spec}</td><td>${d.task}</td><td>${d.sum}</td><td>${st(d.st)}</td><td style="width:22mm"></td></tr>`).join("")}</tbody></table>`:`<p class="mute">드리프트 없음</p>`}
    <h3>Configuration Vulnerability (KISA-2026)</h3><table><thead><tr><th>항목</th><th>점검 내용</th><th>결과</th><th>상태</th><th>비고</th></tr></thead><tbody>${h.cfg.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${resTag(x.res)}</td><td>${st(x.st)}</td><td class="small">${x.ex||""}</td></tr>`).join("")}</tbody></table>
    <h3>Package Vulnerability</h3><p>긴급 <b class="crit">${h.vuln.crit}</b> · 높음 <b class="high">${h.vuln.high}</b> · 중간 ${h.vuln.med} · 낮음 ${h.vuln.low}${h.vuln.noCentosFix?` · CentOS 수정본 없음 ${h.vuln.noCentosFix} · will not fix ${h.vuln.wontfix} 별도`:""}</p>
    ${h.vuln.top.length?`<table><thead><tr><th>CVE</th><th>패키지</th><th>위험도</th><th>수정 버전</th><th>상태</th></tr></thead><tbody>${h.vuln.top.map(v=>`<tr><td>${v.cve}</td><td>${v.pkg}</td><td>${sev(v.sev)}</td><td class="small">${v.fix}</td><td>${st(v.st)}</td></tr>`).join("")}</tbody></table>`:""}`).join("")}
  <div class="pb"></div>${signOff()}</div>`;
}
// ───────────────────────── C: 발견사항 우선 (위험 순위 대장) ─────────────────────────
function VariantC(){
  const W={crit:4,high:3,"취약":3,drift:2,priv:3,dormant:2,decl:1,eol:4};
  const sb={new:3,rec:4,per:1};
  const F=[];
  HOSTS.forEach(h=>{
    if(h.eolState==="eol") F.push({w:W.eol+3,h:h.id,kind:"EOS OS",ctl:"2.10.8",what:`${h.os} — EOL ${h.eol}, 대응계획 필요`,st:"per"});
    h.vuln.top.forEach(v=>F.push({w:W[v.sev]+(sb[v.st]||0),h:h.id,kind:"패키지",ctl:"2.10.8",what:`${v.cve} ${v.pkg} (${SEV[v.sev][0]}) → ${v.fix}`,st:v.st}));
    h.cfg.filter(x=>x.res==="취약").forEach(x=>F.push({w:W["취약"]+(sb[x.st]||0),h:h.id,kind:"설정",ctl:"2.11.2",what:`${x.code} ${x.name}`,st:x.st}));
    (h.drift||[]).forEach(d=>F.push({w:W.drift+(sb[d.st]||0),h:h.id,kind:"드리프트",ctl:"2.9.1",what:`${d.spec} ${d.task}: ${d.sum}`,st:d.st}));
    h.priv.filter(p=>!p.decl).forEach(p=>F.push({w:W.priv+1,h:h.id,kind:"특수권한",ctl:"2.5.5",what:`선언 외 특수권한자 ${p.u} (${p.how})`,st:"new"}));
    h.dormant.forEach(d=>F.push({w:W.dormant,h:h.id,kind:"계정",ctl:"2.5.6",what:`${d.u} ${d.days}일 미사용 (마지막 ${d.last})`,st:"per"}));
    const miss=[["용도",h.purpose],["부서",h.dept],["책임자",h.owner],["관리자",h.admin],["등급",h.grade]].filter(x=>!x[1]).map(x=>x[0]);
    if(miss.length) F.push({w:W.decl,h:h.id,kind:"자산 선언",ctl:"1.2.1·2.1.3",what:`미지정: ${miss.join(", ")}`,st:"per"});
  });
  F.sort((a,b)=>b.w-a.w);
  return `<div class="sheet">${cover("C — 발견사항 우선")}
  <h2>판정 요약</h2>
  <div class="tiles"><div class="tile"><b>${F.length}</b><span>조치·검토 대상</span></div><div class="tile"><b class="new">${F.filter(f=>f.st==="new").length}</b><span>신규</span></div><div class="tile"><b class="rec">${F.filter(f=>f.st==="rec").length}</b><span>재발</span></div><div class="tile"><b class="res">${HOSTS.reduce((a,h)=>a+h.resolved,0)}</b><span>해소</span></div></div>
  ${naNote()}
  <h2>조치·검토 대장 <span class="small mute">우선순위 = 위험도 + 재발/신규 가중</span></h2>
  <table><thead><tr><th>#</th><th>호스트</th><th>구분</th><th>ISMS</th><th>내용</th><th>상태</th><th style="width:24mm">조치 의견(수기)</th></tr></thead><tbody>
  ${F.map((f,i)=>`<tr><td class="rank">${i+1}</td><td>${f.h}</td><td>${f.kind}</td><td class="small">${f.ctl}</td><td>${f.what}</td><td>${st(f.st)}</td><td></td></tr>`).join("")}</tbody></table>
  ${signOff()}
  <h2 class="pb">부록 1. Asset Inventory</h2>
  <table class="small"><thead><tr><th>호스트</th><th>IP · 환경</th><th>OS · 커널 · EOL</th><th>HW</th><th>용도 · 부서 · 책임자 · 등급</th><th>패키지</th><th>포트</th></tr></thead><tbody>
  ${HOSTS.map(h=>`<tr><td>${h.id}</td><td>${h.ip}<br>${h.env}</td><td>${h.os}<br>${h.kernel}<br>EOL ${h.eol}</td><td>${h.hw}</td><td>${decl(h.purpose)} · ${decl(h.dept)}<br>${decl(h.owner)} · ${decl(h.grade)}</td><td>${h.pkgs.count}개<br>갱신 ${h.pkgs.lastUpd}</td><td>${h.ports}</td></tr>`).join("")}</tbody></table>
  <h2>부록 2. 영역별 집계</h2>
  <table><thead><tr><th>호스트</th><th class="num">드리프트</th><th class="num">설정 취약</th><th class="num">긴급</th><th class="num">높음</th><th class="num">중간</th><th class="num">낮음</th></tr></thead><tbody>
  ${HOSTS.map(h=>`<tr><td>${h.id}</td><td class="num">${driftN(h)??"점검불가"}</td><td class="num">${cfgBad(h)}</td><td class="num">${h.vuln.crit}</td><td class="num">${h.vuln.high}</td><td class="num">${h.vuln.med}</td><td class="num">${h.vuln.low}</td></tr>`).join("")}</tbody></table>
  </div>`;
}
// ───────────────────────── 전환 막대 ─────────────────────────
const V = [["A","섹션 우선 — ISMS 통제항목별"],["B","호스트 우선 — 호스트별 1쪽"],["C","발견사항 우선 — 조치 대장"]];
const R = {A:VariantA,B:VariantB,C:VariantC};
function show(k){ const p=new URLSearchParams(location.search); p.set("variant",k); history.replaceState(null,"","?"+p);
  document.getElementById("root").innerHTML=R[k](); const v=V.find(x=>x[0]===k); document.getElementById("lbl").textContent=`${v[0]} (${v[1]})`;
  console.log("[prototype] variant",k,{hosts:HOSTS.length,counts:counts()}); }
const cur=()=>new URLSearchParams(location.search).get("variant")||"A";
const step=d=>{const i=V.findIndex(x=>x[0]===cur());show(V[(i+d+V.length)%V.length][0]);};
document.getElementById("prev").onclick=()=>step(-1); document.getElementById("next").onclick=()=>step(1);
addEventListener("keydown",e=>{ if(e.target.closest("input,textarea,[contenteditable]"))return; if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1); });
show(R[cur()]?cur():"A");
</script>
</body>
