name: tests

on:
  pull_request:
  push:
    branches: [main]

# 저장소가 공개라 로그도 공개다. 시크릿을 주입하지 않고 읽기 권한만 쓴다.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python3 scripts/validate-ansible-specs.py

  pytest:
    name: pytest (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: 버전 기록
        run: |
          python3 --version
          ansible --version | head -1
          ansible-galaxy collection list 2>/dev/null | grep -E "^(ansible\.posix|community\.(general|docker|hashi_vault)|cisco\.ios) "
      - name: 시크릿 파일이 없는지 확인
        run: test ! -e .env
      - run: pytest tests/ -n 4 --dist loadgroup --timeout=900 --durations=15 -p no:cacheprovider

  # Molecule Fast Scenario(ADR-0007): 예전에는 로컬 pre-push가 돌렸고, 훅이 6~7분 걸려 연결이 끊기는 문제로 CI로 옮겼다(2026-10-28 개정).
  # run-molecule.sh가 molecule과 무관한 PR은 건너뛴다(origin/main과의 변경 경로 비교). main push는 항상 돌린다.
  molecule:
    name: molecule (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOLECULE_FORCE: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-molecule.txt
      - run: pip install -r requirements-test.txt -r requirements-molecule.txt
      - name: 시크릿 파일이 없는지 확인
        run: test ! -e .env
      - name: "[진단 임시] 컨테이너 부팅 타이밍과 sudo"
        continue-on-error: true
        run: |
          bash scripts/build-test-images.sh rockylinux9
          docker run -d --name diag --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw infra-test-rockylinux9:local
          for t in 1 3 6 10 20 40; do
            sleep "$t"
            st=$(docker exec diag systemctl is-system-running 2>&1 | head -1)
            s=$(docker exec diag sh -c 'sudo -n true 2>&1 | head -1; echo rc=$?' | tr '\n' ' ')
            echo "t+${t}s systemd=[$st] sudo=[$s] faillock=[$(docker exec diag sh -c 'ls -ld /run/faillock 2>&1' | cut -c1-60)]"
          done
          docker exec diag sh -c 'getenforce 2>&1; ls -l /etc/shadow; grep -E "^(account|auth)" /etc/pam.d/sudo; sed -n 1,12p /etc/pam.d/system-auth' 2>&1 | cut -c1-120
          docker rm -f diag
      - run: bash scripts/run-molecule.sh fast
