name: tests

on:
  pull_request:
  push:
    branches: [main]

# 저장소가 공개라 로그도 공개다. 시크릿을 주입하지 않고 읽기 권한만 쓴다.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python3 scripts/validate-ansible-specs.py

  pytest:
    name: pytest (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: 버전 기록
        run: |
          python3 --version
          ansible --version | head -1
          ansible-galaxy collection list 2>/dev/null | grep -E "^(ansible\.posix|community\.(general|docker|hashi_vault)|cisco\.ios) "
      - name: 시크릿 파일이 없는지 확인
        run: test ! -e .env
      - run: pytest tests/ -n 4 --timeout=900 --durations=15 -p no:cacheprovider
