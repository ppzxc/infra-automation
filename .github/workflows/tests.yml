name: tests

on:
  pull_request:
  push:
    branches: [main]

# 저장소가 공개라 로그도 공개다. 시크릿을 주입하지 않고 읽기 권한만 쓴다.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python3 scripts/validate-ansible-specs.py

  # OpenBao 구성 OpenTofu(Spec #511 / Ticket-6): fmt와 validate만 한다. 운영 서버·state 저장소에는 닿지 않는다(-backend=false).
  tofu:
    name: tofu (fmt, validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tofu/openbao
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  pytest:
    name: pytest (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: 버전 기록
        run: |
          python3 --version
          ansible --version | head -1
          ansible-galaxy collection list 2>/dev/null | grep -E "^(ansible\.posix|community\.(general|docker|hashi_vault)|cisco\.ios) "
      - name: 시크릿 파일이 없는지 확인
        run: test ! -e .env
      - run: pytest tests/ -n 4 --dist loadgroup --timeout=900 --durations=15 -p no:cacheprovider

  # Molecule Fast Scenario(ADR-0007): 예전에는 로컬 pre-push가 돌렸고, 훅이 6~7분 걸려 연결이 끊기는 문제로 CI로 옮겼다(2026-10-28 개정).
  # run-molecule.sh가 molecule과 무관한 PR은 건너뛴다(origin/main과의 변경 경로 비교). main push는 항상 돌린다.
  molecule:
    name: molecule (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOLECULE_FORCE: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-molecule.txt
      - run: pip install -r requirements-test.txt -r requirements-molecule.txt
      - name: 시크릿 파일이 없는지 확인
        run: test ! -e .env
      - run: bash scripts/run-molecule.sh fast
