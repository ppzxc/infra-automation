---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Instance names are per-scenario so `make test-full` can run fast and slow
  # side by side on one Docker daemon without colliding.
  - name: dev-rockylinux9
    image: infra-test-rockylinux9:local
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - infra-test-cache-rockylinux9:/var/cache/dnf
    cgroupns_mode: host
    privileged: true
    pre_build_image: true


provisioner:
  name: ansible
  env:
    # Molecule generates its own ephemeral ansible.cfg that does NOT inherit
    # this project's ansible.cfg, so roles_path must be pointed at the real
    # roles/ directory explicitly.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    # Same reason: the project-level filter plugins (host_agents_*, raw_*) are not inherited.
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/filter_plugins"
    SCENARIO_ROLES: "common,security,access_security,docker_engine,monitoring"
    ANSIBLE_CALLBACKS_ENABLED: "ansible.posix.timer,ansible.posix.profile_tasks"
    # Per-task overhead (one `docker exec` + module transfer each) dominates
    # runtime, not any single task. Pipelining sends the module over stdin
    # instead of copying it; pinning the interpreter skips per-host discovery.
    ANSIBLE_PIPELINING: "True"
    ANSIBLE_INTERPRETER_PYTHON: /usr/bin/python3
  inventory:
    # Fixtures (accounts, firewall, sysctl, ...) are shared, not copied, so the
    # scenarios cannot drift apart.
    links:
      group_vars: ../shared/group_vars
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
  options:
    diff: true

scenario:
  # Dev-loop scenario (make test-role): Rocky 9 only, idempotence pass skipped.
  # Selecting roles: MOLECULE_ROLES=common,security. Never a gate -- pre-push
  # and releases use the fast/slow scenarios, which keep idempotence.
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy

verifier:
  name: ansible
