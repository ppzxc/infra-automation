---
# Verifies docker_engine and monitoring (network-dependent roles). Same
# collect-once structure as molecule/fast/verify.yml; assertion semantics are
# unchanged from the former molecule/default/verify.yml.
- name: Verify Target Host Network-Dependent Roles
  hosts: all
  become: true
  gather_facts: true

  vars:
    molecule_roles: "{{ (lookup('env', 'MOLECULE_ROLES') | default(lookup('env', 'SCENARIO_ROLES'), true)).split(',') | map('trim') | list }}"
    otelcol_service_path: "{{ '/etc/systemd/system/otelcol-contrib.service' if ansible_service_mgr == 'systemd' else '/etc/init.d/otelcol-contrib' }}"
    collect_spec:
      stat:
        - /etc/docker/daemon.json
        - /opt/services
        - /data
        - /backup
        - /etc/profile.d/docker_mgmt.sh
        - /usr/local/bin/node_exporter
        - /etc/systemd/system/node_exporter.service
        - /usr/bin/python3
        - /usr/local/bin/otelcol-contrib
        - /etc/otelcol/config.yaml
        - "{{ otelcol_service_path }}"
      read:
        - /etc/otelcol/config.yaml
        - "{{ otelcol_service_path }}"
      group: [dockermgmt, otelcol]
      passwd: [dockersvc, otelcol]

  tasks:
    - name: Collect every verification fact in one remote execution
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../shared/files/collect_facts.py {{ collect_spec | to_json | quote }}"
        executable: "{{ ansible_python_interpreter | default('python3') }}"
      register: collected
      changed_when: false

    - name: Parse collected facts
      ansible.builtin.set_fact:
        f: "{{ collected.stdout | from_json }}"

    # ==========================================================================
    # 4. Docker Engine 검증
    # ==========================================================================
    - name: Verify the docker_engine role
      when: "'docker_engine' in molecule_roles"
      block:
        - name: "[VERIFY-DOC-011] Verify hardened Docker daemon configuration exists"
          ansible.builtin.assert:
            that:
              - f.stat['/etc/docker/daemon.json'].exists
            fail_msg: "Docker daemon configuration /etc/docker/daemon.json is missing."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-014] Verify dockermgmt system group exists"
          ansible.builtin.assert:
            that:
              - f.group['dockermgmt']
            fail_msg: "dockermgmt group does not exist."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-015] Verify dockersvc system user exists"
          ansible.builtin.assert:
            that:
              - f.passwd['dockersvc']
            fail_msg: "dockersvc user does not exist."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-016] Verify FHS standard directories exist"
          ansible.builtin.debug:
            msg: "{{ item }}: {{ f.stat[item] }}"
            verbosity: 1
          loop: [/opt/services, /data, /backup]
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-018] Verify docker management umask script exists"
          ansible.builtin.debug:
            msg: "{{ f.stat['/etc/profile.d/docker_mgmt.sh'] }}"
            verbosity: 1
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

    # ==========================================================================
    # 5. Monitoring Role (OpenTelemetry Hostmetrics & Log Pipeline) 검증
    # ==========================================================================
    - name: Verify the monitoring role
      when: "'monitoring' in molecule_roles"
      block:
        # Host Agents 사전 단계(MON-020~024): 역할이 만든 fact와 같은 프로브를 다시 실행해
        # 실제 플랫폼에서 modern 경로로 분류되고 Ansible fact와 일치하는지 확인한다.
        - name: "[VERIFY-MON-021] Probe OS release and architecture again (raw, read-only)"
          ansible.builtin.raw: "{{ '' | host_agents_os_probe_cmd }}"
          register: _verify_probe
          changed_when: false
          become: false

        - name: "[VERIFY-MON-022] Verify the probe classifies this platform as modern and matches gathered facts"
          vars:
            _p: "{{ _verify_probe.stdout | host_agents_parse_os_probe }}"
          ansible.builtin.assert:
            that:
              - _p.path == 'modern'
              - _p.family == ansible_os_family
              - _p.distribution == ansible_distribution
              - _p.major_version == ansible_distribution_major_version
              - _p.arch == ('amd64' if ansible_architecture == 'x86_64' else 'arm64')
            fail_msg: "OS probe {{ _p }} disagrees with gathered facts."

        - name: "[VERIFY-MON-025] Verify the probe reads this host's real timezone (the RFC3164 time zone)"
          vars:
            _p: "{{ _verify_probe.stdout | host_agents_parse_os_probe }}"
          ansible.builtin.assert:
            that:
              - _p.timezone == '' or _p.timezone is match('^[A-Za-z][A-Za-z0-9_+/-]*$')
              - "'location: \"' ~ (_p.timezone or timezone | default('Asia/Seoul')) ~ '\"' in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "Probe timezone {{ _p.timezone }} is not the one rendered into the Envelope Parsing timestamps."

        - name: "[VERIFY-MON-023] Verify /usr/bin/python3 exists on the modern path"
          ansible.builtin.assert:
            that:
              - f.stat['/usr/bin/python3'].exists
            fail_msg: "/usr/bin/python3 is missing."

        # Host Agents legacy 파일 전달 헬퍼(MON-100~106, #46): 태스크는 legacy 호스트에서만 실행되므로
        # 여기서는 헬퍼가 렌더링하는 명령·sentinel 계약만 정적으로 검증한다(실행 검증은 tests/test_host_agents.py).
        - name: "[VERIFY-MON-100] Verify the probe command reports hash, mode and owner behind the marker"
          ansible.builtin.assert:
            that:
              - "'__RAW_PROBE__' in ('/opt/x' | raw_probe_cmd)"
              - "'sha256sum' in ('/opt/x' | raw_probe_cmd)"

        - name: "[VERIFY-MON-101] Verify the read command is read-only (cat only)"
          ansible.builtin.assert:
            that:
              - "'cat /opt/x' in ('/opt/x' | raw_read_cmd)"
              - "' > ' not in ('/opt/x' | raw_read_cmd)"

        - name: "[VERIFY-MON-102] Verify the check-mode diff shows controller vs remote changes"
          ansible.builtin.assert:
            that:
              - "'+b=2' in ('a=1' | raw_check_diff('b=2', '/x'))"

        - name: "[VERIFY-MON-103] Verify secret files never expose content in the check-mode output"
          ansible.builtin.assert:
            that:
              - "'hunter2' not in ('/x' | raw_secret_notice(true))"
              - "('/x' | raw_secret_notice(true)).endswith('would change')"

        - name: "[VERIFY-MON-104] Verify the scp argv uses the resolved connection values"
          ansible.builtin.assert:
            that:
              - "('/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '/k'))[-1] == 'ops@h:/var/tmp/b'"
              - "'2222' in ('/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '/k'))"
              - "'/k' in ('/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '/k'))"
              - "'-i' in ('/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '/k'))"

        - name: "[VERIFY-MON-109] Verify password-only upload is wrapped in sshpass -e and never carries the password in argv"
          vars:
            _pw_argv: "{{ '/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '', true) }}"
          ansible.builtin.assert:
            that:
              - "_pw_argv[0:3] == ['sshpass', '-e', 'scp']"
              - "'BatchMode=yes' not in _pw_argv"
              - "'-i' not in _pw_argv"

        - name: "[VERIFY-MON-109] Verify a keyless upload without the opt-in password mode is refused with a clear message"
          ansible.builtin.set_fact:
            _keyless_refused: "{{ '/c/b' | raw_scp_argv('/var/tmp/b', 'h', 2222, 'ops', '') }}"
          ignore_errors: true
          register: _keyless

        - name: "[VERIFY-MON-109] Assert the refusal happened and names host_agents_allow_password_auth"
          ansible.builtin.assert:
            that:
              - _keyless is failed
              - "'host_agents_allow_password_auth' in (_keyless.msg | default(''))"

        - name: "[VERIFY-MON-029] Verify the password-auth exception flag is honoured per host only"
          vars:
            _flag: "{{ ({'host_agents_allow_password_auth': 'true'}.host_agents_allow_password_auth | string | lower) in ['true', 'yes', '1'] }}"
          ansible.builtin.assert:
            that:
              - _flag | bool

        - name: "[VERIFY-MON-105] Verify the finalize command compares the pinned hash before the atomic move"
          vars:
            _fin: "{{ '/var/tmp/b' | raw_upload_finalize_cmd('/opt/b', 'root', 'root', '0755', 'abc123') }}"
          ansible.builtin.assert:
            that:
              - "'abc123' in _fin"
              - "_fin.index('abc123') < _fin.index('mv -f')"

        - name: "[VERIFY-MON-106] Verify the small-file sentinel is unchanged only when hash and mode match"
          vars:
            _h: "{{ 'k=v' | hash('sha256') }}"
          ansible.builtin.assert:
            that:
              - "not (('__RAW_PROBE__ ' ~ _h ~ ' 640') | raw_push_changed('k=v', '0640'))"
              - "('__RAW_PROBE__ ' ~ _h ~ ' 600') | raw_push_changed('k=v', '0640')"

        - name: "[VERIFY-MON-107] Verify the helper reports the planned binary upload only in check mode"
          vars:
            _raw_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/tasks/raw_upload.yml') }}"
          ansible.builtin.assert:
            that:
              - "'[MON-107]' in _raw_tasks"
              - "'would upload via scp and install' in _raw_tasks"

        - name: "[VERIFY-MON-108] Verify the helper cleans the staged upload in a rescue that keeps the failure"
          vars:
            _raw_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/tasks/raw_upload.yml') }}"
          ansible.builtin.assert:
            that:
              - "'rescue:' in _raw_tasks"
              - "'[MON-108]' in _raw_tasks"
              - "'failed_when: true' in _raw_tasks"

        - name: "[VERIFY-MON-013] Verify legacy node_exporter binary is absent"
          ansible.builtin.assert:
            that:
              - not f.stat['/usr/local/bin/node_exporter'].exists
            fail_msg: "node_exporter binary should have been removed."

        - name: "[VERIFY-MON-012] Verify legacy node_exporter systemd unit is absent"
          ansible.builtin.assert:
            that:
              - not f.stat['/etc/systemd/system/node_exporter.service'].exists
            fail_msg: "node_exporter systemd service unit file should have been removed."

        - name: "[VERIFY-MON-011] Verify legacy node_exporter service is not active"
          ansible.builtin.command: systemctl is-active node_exporter
          register: _ne_active
          changed_when: false
          failed_when: _ne_active.rc == 0
          when: ansible_service_mgr == "systemd"

        - name: "[VERIFY-MON-014] Verify legacy node_exporter user is absent"
          ansible.builtin.command: getent passwd node_exporter
          register: _ne_user
          changed_when: false
          failed_when: _ne_user.rc == 0

        - name: "[VERIFY-MON-015] Verify legacy node_exporter group is absent"
          ansible.builtin.command: getent group node_exporter
          register: _ne_group
          changed_when: false
          failed_when: _ne_group.rc == 0

        - name: "[VERIFY-MON-001] Verify otelcol system group exists"
          ansible.builtin.assert:
            that:
              - f.group['otelcol']
            fail_msg: "otelcol group does not exist."

        - name: "[VERIFY-MON-002] Verify otelcol system user exists"
          ansible.builtin.assert:
            that:
              - f.passwd['otelcol']
            fail_msg: "otelcol user does not exist."

        - name: Load pinned version and checksum table from the role
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/monitoring/vars/main.yml"
            name: _mon_vars

        - name: "[VERIFY-MON-003] Verify otelcol-contrib binary reports the pinned version"
          ansible.builtin.command: /usr/local/bin/otelcol-contrib --version
          register: _verify_otel_version
          changed_when: false
          failed_when: _mon_vars.host_agents_versions['default'].otelcol_contrib not in _verify_otel_version.stdout

        - name: "[VERIFY-MON-046] Verify the versioned install directory and binary are root-owned 0755"
          ansible.builtin.stat:
            path: "{{ _mon_vars.host_agents_install_root }}/otelcol-contrib/{{ _mon_vars.host_agents_versions['default'].otelcol_contrib }}/otelcol-contrib"
          register: _verify_otel_bin
          failed_when: >-
            not _verify_otel_bin.stat.exists or _verify_otel_bin.stat.pw_name != 'root' or
            _verify_otel_bin.stat.mode != '0755'

        - name: "[VERIFY-MON-051] Verify the install symlink targets the pinned versioned directory"
          ansible.builtin.stat:
            path: /usr/local/bin/otelcol-contrib
            follow: false
          register: _verify_otel_link
          failed_when: >-
            not _verify_otel_link.stat.islnk or
            _verify_otel_link.stat.lnk_source != _mon_vars.host_agents_install_root ~ '/otelcol-contrib/' ~
            _mon_vars.host_agents_versions['default'].otelcol_contrib ~ '/otelcol-contrib'

        - name: "[VERIFY-MON-053] Verify at most the current and previous version directories are kept"
          ansible.builtin.find:
            paths: "{{ _mon_vars.host_agents_install_root }}/otelcol-contrib"
            file_type: directory
          register: _verify_otel_dirs
          failed_when: _verify_otel_dirs.files | length > 2

        - name: "[VERIFY-MON-004] Verify otelcol-contrib configuration file exists"
          ansible.builtin.assert:
            that:
              - f.read['/etc/otelcol/config.yaml'] is not none
              - "'hostmetrics:' in f.read['/etc/otelcol/config.yaml']"
              - "'node_exporter' not in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "otelcol-contrib configuration must contain hostmetrics receiver and not contain node_exporter."

        - name: "[VERIFY-MON-004] Verify Envelope Parsing is rendered (parse errors kept, body not replaced, app_logs untouched)"
          ansible.builtin.assert:
            that:
              - "'on_error: send_quiet' in f.read['/etc/otelcol/config.yaml']"
              - "'log.parse_error' in f.read['/etc/otelcol/config.yaml']"
              - "'process.executable.name' in f.read['/etc/otelcol/config.yaml']"
              - "'preserve_to' not in f.read['/etc/otelcol/config.yaml']"
              - "'filelog/app_logs:' not in f.read['/etc/otelcol/config.yaml'] or 'regex_parser' not in (f.read['/etc/otelcol/config.yaml'] | regex_findall('(?s)filelog/app_logs:.*?retry_on_failure') | join)"

        - name: "[VERIFY-MON-060] Verify the exporter targets <endpoint>/api/<org> without a trailing slash"
          ansible.builtin.assert:
            that:
              - "'endpoint: \"https://openobserve.molecule.invalid:5080/api/default\"' in f.read['/etc/otelcol/config.yaml']"
              - "'otlphttp/security_logs' in f.read['/etc/otelcol/config.yaml']"
              - "'block_on_overflow: true' in f.read['/etc/otelcol/config.yaml']"
              - "'otlp/backend' not in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "otlphttp exporter endpoint/queue settings are wrong or the legacy gRPC exporter remains."

        - name: "[VERIFY-MON-061] Verify the otelcol storage directory exists and is owned by otelcol"
          ansible.builtin.stat:
            path: /var/lib/otelcol/storage
          register: _verify_otel_storage
          failed_when: not _verify_otel_storage.stat.exists or _verify_otel_storage.stat.pw_name != 'otelcol'

        - name: "[VERIFY-MON-062] Verify journald receiver is present only when rsyslog is absent"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: [/usr/sbin/rsyslogd, /sbin/rsyslogd]
          register: _verify_rsyslog
          failed_when: false

        - name: "[VERIFY-MON-062] Verify journald presence mirrors rsyslog absence"
          ansible.builtin.assert:
            that:
              - >-
                ('journald:' in f.read['/etc/otelcol/config.yaml']) ==
                (_verify_rsyslog.results | map(attribute='stat.exists') | select | list | length == 0)

        - name: "[VERIFY-MON-063] Verify the secrets directory is root-owned 0700"
          ansible.builtin.stat:
            path: /etc/otelcol-contrib
          register: _verify_otel_secdir
          failed_when: >-
            not _verify_otel_secdir.stat.exists or _verify_otel_secdir.stat.pw_name != 'root' or
            _verify_otel_secdir.stat.mode != '0700'

        - name: "[VERIFY-MON-064] Verify docker_stats and OTLP receivers are off by default"
          ansible.builtin.assert:
            that:
              - "'docker_stats:' not in f.read['/etc/otelcol/config.yaml']"
              - "'4317' not in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "docker_stats/OTLP receiver must be disabled unless opted in."

        - name: "[VERIFY-MON-067] Verify the collection standard: 60s hostmetrics, stream routing, checkpoints, retry, separate metrics"
          ansible.builtin.assert:
            that:
              - "'collection_interval: 60s' in f.read['/etc/otelcol/config.yaml']"
              - "'routing/logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'logs/security_logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'logs/system_logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'logs/app_logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'storage: file_storage' in f.read['/etc/otelcol/config.yaml']"
              - "'max_elapsed_time: 0' in f.read['/etc/otelcol/config.yaml']"
              - "'otlphttp/metrics' in f.read['/etc/otelcol/config.yaml']"
              - "'on_rebound: true' in f.read['/etc/otelcol/config.yaml']"

        - name: "[VERIFY-MON-036] Verify the resource attributes and per-file-group service.name are rendered"
          ansible.builtin.assert:
            that:
              - "'key: deployment.environment.name' in f.read['/etc/otelcol/config.yaml']"
              - "'value: \"test\"' in f.read['/etc/otelcol/config.yaml']"
              - "'key: host.ip' in f.read['/etc/otelcol/config.yaml']"
              - "'key: host.arch' in f.read['/etc/otelcol/config.yaml']"
              - "'key: os.name' in f.read['/etc/otelcol/config.yaml']"
              - "'resource[\"service.name\"]' in f.read['/etc/otelcol/config.yaml']"
              - "'resource/hostmetrics' in f.read['/etc/otelcol/config.yaml']"
              - "'metrics/host:' in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "resource attributes or service.name operators are missing from the rendered config."

        - name: "[VERIFY-MON-036] Verify the receiver ids stay one per stream (file_storage checkpoint keys)"
          ansible.builtin.assert:
            that:
              - "'filelog/security_logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'filelog/system_logs:' in f.read['/etc/otelcol/config.yaml']"
              - "'filelog/auth:' not in f.read['/etc/otelcol/config.yaml']"

        - name: "[VERIFY-MON-065] Verify secrets.env is root-owned 0600 and the config holds no token"
          ansible.builtin.stat:
            path: /etc/otelcol-contrib/secrets.env
          register: _verify_otel_env
          failed_when: >-
            not _verify_otel_env.stat.exists or _verify_otel_env.stat.pw_name != 'root' or
            _verify_otel_env.stat.mode != '0600' or
            'molecule-fixture-o2-ingest' in f.read['/etc/otelcol/config.yaml']

        - name: "[VERIFY-MON-065] Verify secrets.env carries the basic-auth value"
          ansible.builtin.command: grep -q '^O2_BASIC_AUTH=.\+' /etc/otelcol-contrib/secrets.env
          changed_when: false

        - name: "[VERIFY-MON-066] Verify the unit loads the secrets env file and keeps non-root capabilities"
          ansible.builtin.assert:
            that:
              - "'EnvironmentFile=/etc/otelcol-contrib/secrets.env' in f.read[otelcol_service_path]"
              - "'User=otelcol' in f.read[otelcol_service_path]"
              - "'AmbientCapabilities=CAP_DAC_READ_SEARCH' in f.read[otelcol_service_path]"
          when: ansible_service_mgr == 'systemd'

        - name: "[VERIFY-MON-005] Verify otelcol-contrib service unit or init script"
          ansible.builtin.assert:
            that:
              - f.stat[otelcol_service_path].exists
            fail_msg: "otelcol-contrib service unit/init script is missing."

        - name: "[VERIFY-MON-006] Verify otelcol-contrib service status"
          ansible.builtin.debug:
            msg: "otelcol-contrib hostmetrics verification complete."

    # ==========================================================================
    # 6. Backup Role (restic + resticprofile) 검증
    # ==========================================================================
    - name: Verify the backup role
      when: "'backup' in molecule_roles"
      vars:
        _bak_use_cron: "{{ ansible_distribution_major_version == '8' and ansible_os_family == 'RedHat' }}"
      block:
        - name: Load the pinned versions
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/monitoring/vars/main.yml"
            name: _bak_vars

        - name: "[VERIFY-BAK-003] Verify restic reports the pinned version"
          ansible.builtin.command: /usr/local/bin/restic version
          register: _verify_restic
          changed_when: false
          failed_when: _bak_vars.host_agents_versions['default'].restic not in _verify_restic.stdout

        - name: "[VERIFY-BAK-004] Verify resticprofile reports the pinned version"
          ansible.builtin.command: /usr/local/bin/resticprofile version
          register: _verify_rp
          changed_when: false
          failed_when: _bak_vars.host_agents_versions['default'].resticprofile not in _verify_rp.stdout

        - name: "[VERIFY-BAK-030] Verify both install symlinks target the pinned versioned directories"
          ansible.builtin.stat:
            path: "/usr/local/bin/{{ item.name }}"
            follow: false
          loop:
            - { name: restic, version: "{{ _bak_vars.host_agents_versions['default'].restic }}" }
            - { name: resticprofile, version: "{{ _bak_vars.host_agents_versions['default'].resticprofile }}" }
          register: _verify_bak_links
          failed_when: >-
            not item.stat.islnk or
            item.stat.lnk_source != _bak_vars.host_agents_install_root ~ '/' ~ item.item.name ~ '/' ~ item.item.version ~ '/' ~ item.item.name
          loop_control:
            label: "{{ item.item.name }}"

        - name: "[VERIFY-BAK-020] Verify /etc/restic is root-owned 0700"
          ansible.builtin.stat:
            path: /etc/restic
          register: _verify_bak_dir
          failed_when: not _verify_bak_dir.stat.exists or _verify_bak_dir.stat.pw_name != 'root' or _verify_bak_dir.stat.mode != '0700'

        - name: "[VERIFY-BAK-022] Verify the credential files are root-owned 0600"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: [/etc/restic/env, /etc/restic/password, /etc/restic/profiles.yaml]
          register: _verify_bak_files
          failed_when: not item.stat.exists or item.stat.pw_name != 'root' or item.stat.mode != '0600'

        - name: "[VERIFY-BAK-024] Verify the profile has no secrets, includes mandatory paths and passes resticprofile show"
          ansible.builtin.shell: >-
            ! grep -q 'molecule-fixture' /etc/restic/profiles.yaml &&
            grep -q '/var/spool/cron' /etc/restic/profiles.yaml && grep -q 'retry-lock: 30m' /etc/restic/profiles.yaml &&
            resticprofile -f yaml -c /etc/restic/profiles.yaml -n default show >/dev/null
          changed_when: false

