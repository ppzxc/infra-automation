---
# Verifies docker_engine and monitoring (network-dependent roles). Same
# collect-once structure as molecule/fast/verify.yml; assertion semantics are
# unchanged from the former molecule/default/verify.yml.
- name: Verify Target Host Network-Dependent Roles
  hosts: all
  become: true
  gather_facts: true

  vars:
    molecule_roles: "{{ (lookup('env', 'MOLECULE_ROLES') | default(lookup('env', 'SCENARIO_ROLES'), true)).split(',') | map('trim') | list }}"
    otelcol_service_path: "{{ '/etc/systemd/system/otelcol-contrib.service' if ansible_service_mgr == 'systemd' else '/etc/init.d/otelcol-contrib' }}"
    collect_spec:
      stat:
        - /etc/docker/daemon.json
        - /opt/services
        - /data
        - /backup
        - /etc/profile.d/docker_mgmt.sh
        - /usr/local/bin/node_exporter
        - /etc/systemd/system/node_exporter.service
        - /usr/bin/python3
        - /usr/local/bin/otelcol-contrib
        - /etc/otelcol/config.yaml
        - "{{ otelcol_service_path }}"
      read:
        - /etc/otelcol/config.yaml
      group: [dockermgmt, otelcol]
      passwd: [dockersvc, otelcol]

  tasks:
    - name: Collect every verification fact in one remote execution
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../shared/files/collect_facts.py {{ collect_spec | to_json | quote }}"
        executable: "{{ ansible_python_interpreter | default('python3') }}"
      register: collected
      changed_when: false

    - name: Parse collected facts
      ansible.builtin.set_fact:
        f: "{{ collected.stdout | from_json }}"

    # ==========================================================================
    # 4. Docker Engine 검증
    # ==========================================================================
    - name: Verify the docker_engine role
      when: "'docker_engine' in molecule_roles"
      block:
        - name: "[VERIFY-DOC-011] Verify hardened Docker daemon configuration exists"
          ansible.builtin.assert:
            that:
              - f.stat['/etc/docker/daemon.json'].exists
            fail_msg: "Docker daemon configuration /etc/docker/daemon.json is missing."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-014] Verify dockermgmt system group exists"
          ansible.builtin.assert:
            that:
              - f.group['dockermgmt']
            fail_msg: "dockermgmt group does not exist."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-015] Verify dockersvc system user exists"
          ansible.builtin.assert:
            that:
              - f.passwd['dockersvc']
            fail_msg: "dockersvc user does not exist."
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-016] Verify FHS standard directories exist"
          ansible.builtin.debug:
            msg: "{{ item }}: {{ f.stat[item] }}"
            verbosity: 1
          loop: [/opt/services, /data, /backup]
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

        - name: "[VERIFY-DOC-018] Verify docker management umask script exists"
          ansible.builtin.debug:
            msg: "{{ f.stat['/etc/profile.d/docker_mgmt.sh'] }}"
            verbosity: 1
          when: ansible_distribution_major_version | int >= 7 or ansible_os_family == "Debian"

    # ==========================================================================
    # 5. Monitoring Role (OpenTelemetry Hostmetrics & Log Pipeline) 검증
    # ==========================================================================
    - name: Verify the monitoring role
      when: "'monitoring' in molecule_roles"
      block:
        # Host Agents 사전 단계(MON-020~024): 역할이 만든 fact와 같은 프로브를 다시 실행해
        # 실제 플랫폼에서 modern 경로로 분류되고 Ansible fact와 일치하는지 확인한다.
        - name: "[VERIFY-MON-021] Probe OS release and architecture again (raw, read-only)"
          ansible.builtin.raw: "{{ '' | host_agents_os_probe_cmd }}"
          register: _verify_probe
          changed_when: false
          become: false

        - name: "[VERIFY-MON-022] Verify the probe classifies this platform as modern and matches gathered facts"
          vars:
            _p: "{{ _verify_probe.stdout | host_agents_parse_os_probe }}"
          ansible.builtin.assert:
            that:
              - _p.path == 'modern'
              - _p.family == ansible_os_family
              - _p.distribution == ansible_distribution
              - _p.major_version == ansible_distribution_major_version
              - _p.arch == ('amd64' if ansible_architecture == 'x86_64' else 'arm64')
            fail_msg: "OS probe {{ _p }} disagrees with gathered facts."

        - name: "[VERIFY-MON-023] Verify /usr/bin/python3 exists on the modern path"
          ansible.builtin.assert:
            that:
              - f.stat['/usr/bin/python3'].exists
            fail_msg: "/usr/bin/python3 is missing."

        - name: "[VERIFY-MON-013] Verify legacy node_exporter binary is absent"
          ansible.builtin.assert:
            that:
              - not f.stat['/usr/local/bin/node_exporter'].exists
            fail_msg: "node_exporter binary should have been removed."

        - name: "[VERIFY-MON-012] Verify legacy node_exporter systemd unit is absent"
          ansible.builtin.assert:
            that:
              - not f.stat['/etc/systemd/system/node_exporter.service'].exists
            fail_msg: "node_exporter systemd service unit file should have been removed."

        - name: "[VERIFY-MON-011] Verify legacy node_exporter service is not active"
          ansible.builtin.command: systemctl is-active node_exporter
          register: _ne_active
          changed_when: false
          failed_when: _ne_active.rc == 0
          when: ansible_service_mgr == "systemd"

        - name: "[VERIFY-MON-014] Verify legacy node_exporter user is absent"
          ansible.builtin.command: getent passwd node_exporter
          register: _ne_user
          changed_when: false
          failed_when: _ne_user.rc == 0

        - name: "[VERIFY-MON-015] Verify legacy node_exporter group is absent"
          ansible.builtin.command: getent group node_exporter
          register: _ne_group
          changed_when: false
          failed_when: _ne_group.rc == 0

        - name: "[VERIFY-MON-001] Verify otelcol system group exists"
          ansible.builtin.assert:
            that:
              - f.group['otelcol']
            fail_msg: "otelcol group does not exist."

        - name: "[VERIFY-MON-002] Verify otelcol system user exists"
          ansible.builtin.assert:
            that:
              - f.passwd['otelcol']
            fail_msg: "otelcol user does not exist."

        - name: Load pinned version and checksum table from the role
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/monitoring/vars/main.yml"
            name: _mon_vars

        - name: "[VERIFY-MON-003] Verify otelcol-contrib binary reports the pinned version"
          ansible.builtin.command: /usr/local/bin/otelcol-contrib --version
          register: _verify_otel_version
          changed_when: false
          failed_when: _mon_vars.host_agents_versions['default'].otelcol_contrib not in _verify_otel_version.stdout

        - name: "[VERIFY-MON-046] Verify the versioned install directory and binary are root-owned 0755"
          ansible.builtin.stat:
            path: "{{ _mon_vars.host_agents_install_root }}/otelcol-contrib/{{ _mon_vars.host_agents_versions['default'].otelcol_contrib }}/otelcol-contrib"
          register: _verify_otel_bin
          failed_when: >-
            not _verify_otel_bin.stat.exists or _verify_otel_bin.stat.pw_name != 'root' or
            _verify_otel_bin.stat.mode != '0755'

        - name: "[VERIFY-MON-051] Verify the install symlink targets the pinned versioned directory"
          ansible.builtin.stat:
            path: /usr/local/bin/otelcol-contrib
            follow: false
          register: _verify_otel_link
          failed_when: >-
            not _verify_otel_link.stat.islnk or
            _verify_otel_link.stat.lnk_source != _mon_vars.host_agents_install_root ~ '/otelcol-contrib/' ~
            _mon_vars.host_agents_versions['default'].otelcol_contrib ~ '/otelcol-contrib'

        - name: "[VERIFY-MON-053] Verify at most the current and previous version directories are kept"
          ansible.builtin.find:
            paths: "{{ _mon_vars.host_agents_install_root }}/otelcol-contrib"
            file_type: directory
          register: _verify_otel_dirs
          failed_when: _verify_otel_dirs.files | length > 2

        - name: "[VERIFY-MON-004] Verify otelcol-contrib configuration file exists"
          ansible.builtin.assert:
            that:
              - f.read['/etc/otelcol/config.yaml'] is not none
              - "'hostmetrics:' in f.read['/etc/otelcol/config.yaml']"
              - "'node_exporter' not in f.read['/etc/otelcol/config.yaml']"
            fail_msg: "otelcol-contrib configuration must contain hostmetrics receiver and not contain node_exporter."

        - name: "[VERIFY-MON-005] Verify otelcol-contrib service unit or init script"
          ansible.builtin.assert:
            that:
              - f.stat[otelcol_service_path].exists
            fail_msg: "otelcol-contrib service unit/init script is missing."

        - name: "[VERIFY-MON-006] Verify otelcol-contrib service status"
          ansible.builtin.debug:
            msg: "otelcol-contrib hostmetrics verification complete."
