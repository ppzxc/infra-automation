        # Host Agents legacy_el6(CentOS 6 전용 MON-1xx, #48): CentOS 6 Test Image가 없으므로 렌더링 결과·필터 출력으로
        # 관측 가능한 계약을 검증한다(실행 검증은 tests/test_host_agents_legacy_el6.py, 실제 호스트는 docs/monitoring.md §3-5 런북).
        # 공용 태스크(MON-2xx, BAK-2xx)는 위 legacy_el7 검증이 같은 legacy.yml을 대상으로 함께 다룬다.

        - name: "[VERIFY-MON-110] legacy_el6 expiry raises a real Ansible warning (never a failure) after 2027-12-31"
          ansible.builtin.assert:
            that:
              - (_msg | host_agents_warn) == _msg
              - _consts.host_agents_version_expiry.legacy_el6 == '2027-12-31'
              - ('2027-12-31' > _consts.host_agents_version_expiry.legacy_el6) is false
              - ('2028-01-01' > _consts.host_agents_version_expiry.legacy_el6) is true
              - '"[MON-110]" in _t and "host_agents_warn" in _t and "tags: [always]" in _t'
            quiet: true
          vars:
            _msg: "VERIFY-MON-110: host_agents_warn emits this line as a [WARNING] and returns it unchanged"
            _consts: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/vars/main.yml') | from_yaml }}"
            _t: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/tasks/legacy.yml') }}"
          delegate_to: localhost
          become: false

        - name: "[VERIFY-MON-114] legacy_el6 never enables the journald receiver"
          ansible.builtin.assert:
            that: '"[MON-114]" in _t and "host_agents_journald: false" in _t'
            quiet: true
          vars:
            _t: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/tasks/legacy.yml') }}"
          delegate_to: localhost
          become: false

        - name: "[VERIFY-MON-119] legacy_el6 init script runs as root, loads secrets, registers with chkconfig and detaches stdio"
          ansible.builtin.assert:
            that:
              - "'# chkconfig: 2345 90 10' in _init"
              - "'nohup \"$EXEC\" --config=\"$CONFIG\" >> $LOGFILE 2>&1 </dev/null &' in _init"
              - "'su -s' not in _init and 'USER=' not in _init"
              - "'SECRETS=\"/etc/otelcol-contrib/secrets.env\"' in _init and '. \"$SECRETS\"' in _init"
              - "'LOGFILE=\"/var/log/otelcol-contrib.log\"' in _init"
            quiet: true
          vars:
            _init: >-
              {{ lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/monitoring/templates/otelcol-contrib.init.j2',
                        template_vars={'otelcol_run_as_root': true, 'host_agents_bin_dir': '/usr/local/bin',
                                       'otelcol_config_path': '/etc/otelcol/config.yaml',
                                       'otelcol_secrets_path': '/etc/otelcol-contrib/secrets.env',
                                       'otelcol_sysv_log_path': '/var/log/otelcol-contrib.log'}) }}
          delegate_to: localhost
          become: false

        - name: "[VERIFY-MON-121] legacy_el6 starts and enables the collector with the chkconfig sentinel, never systemctl"
          ansible.builtin.assert:
            that:
              - "'systemctl' not in _cmd"
              - "'chkconfig --list otelcol-contrib 2>/dev/null | grep -q \"3:on\"' in _cmd"
              - "'chkconfig --add otelcol-contrib && chkconfig otelcol-contrib on' in _cmd"
              - "'service otelcol-contrib status' in _cmd and 'service otelcol-contrib start' in _cmd"
            quiet: true
          vars:
            _cmd: "{{ 'otelcol-contrib' | raw_sysv_service_cmd }}"
          delegate_to: localhost
          become: false

        - name: "[VERIFY-MON-122] legacy_el6 rotates the collector log in place (copytruncate) with a 0644 logrotate file"
          ansible.builtin.assert:
            that:
              - "'/var/log/otelcol-contrib.log {' in _rot.splitlines()"
              - "'copytruncate' in _rot.split() and 'missingok' in _rot.split()"
              - _defaults.otelcol_sysv_log_path == '/var/log/otelcol-contrib.log'
              - _defaults.otelcol_logrotate_path == '/etc/logrotate.d/otelcol-contrib'
              - '"[MON-122]" in _t and "_raw_mode: ''0644''" in _t'
            quiet: true
          vars:
            _defaults: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/defaults/main.yml') | from_yaml }}"
            _rot: >-
              {{ lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/monitoring/templates/otelcol-contrib.logrotate.j2',
                        template_vars={'otelcol_sysv_log_path': '/var/log/otelcol-contrib.log', 'otelcol_logrotate_rotate': 4}) }}
            _t: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/monitoring/tasks/legacy.yml') }}"
          delegate_to: localhost
          become: false
