---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: test-centos6
    image: geerlingguy/docker-centos6-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true

  - name: test-centos7
    image: geerlingguy/docker-centos7-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: test-rockylinux8
    image: geerlingguy/docker-rockylinux8-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: test-rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: test-centos-stream10
    image: quay.io/centos/centos:stream10
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: test-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true


provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        timezone: "Asia/Seoul"
        admin_user: "infra-admin"
        admin_ssh_public_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestMoleculeKeyForVerificationAdminUser test@molecule"
        enable_vault_ssh_ca: false
        enable_boundary: false
        firewall_allowed_tcp_ports:
          - 22
  options:
    diff: true

verifier:
  name: ansible
