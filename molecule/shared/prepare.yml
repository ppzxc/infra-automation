---
# Per-run preparation shared by every scenario. The slow, image-level parts
# (openssh-server, host keys, python3.11) live in molecule/images/*.Dockerfile.
# Only state that must be fresh on every run stays here.
- name: Prepare Container Test Environment
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # /run is a tmpfs at container start, so this cannot be baked into the image.
    # Debian's openssh-server postinst normally creates it via systemd-tmpfiles
    # when sshd starts as a service; these containers never start sshd, and
    # `sshd -t` (the security role's `validate:` on [SEC-001]) refuses to run
    # without it: "Missing privilege separation directory: /run/sshd".
    - name: "[PREPARE-003] Ensure /run/sshd privilege separation directory exists (Debian/Ubuntu)"
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    # security 역할은 auditd 패키지를 설치하지 않고 운영 호스트에는 이미 있다. 테스트 이미지에는 없어 규칙 디렉터리만 미리 만들어
    # [SEC-012] 규칙 배포와 [VERIFY-SEC-012]/[VERIFY-SEC-055]/[VERIFY-SEC-056]의 내용 검증이 컨테이너에서도 실제로 돌게 한다.
    - name: "[PREPARE-006] Ensure the audit rules directory exists (RedHat family)"
      ansible.builtin.file:
        path: /etc/audit/rules.d
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: ansible_os_family == "RedHat"

    # Simulates a host that already went through a prior converge where
    # "infra-removed" was a present admin account (COMMON-013/COMMON-014
    # created the user and its NOPASSWD sudoers drop-in). The shared group_vars
    # declare it `state: absent`, so [VERIFY-COMMON-023] can prove the drop-in
    # is actually cleaned up on removal, not merely absent because it was never
    # created. Must stay per-run: baking it into an image would make
    # VERIFY-COMMON-013/023 pass without testing anything.
    - name: "[PREPARE-004] Seed a pre-existing account and stale sudoers drop-in for the removal scenario"
      block:
        - name: "[PREPARE-004-USER] Create the to-be-removed account"
          ansible.builtin.user:
            name: infra-removed
            state: present
        - name: "[PREPARE-004-SUDOERS] Seed its stale passwordless sudoers drop-in"
          ansible.builtin.copy:
            content: "infra-removed ALL=(ALL) NOPASSWD:ALL\n"
            dest: /etc/sudoers.d/90-infra-removed
            owner: root
            group: root
            mode: "0440"
            validate: "visudo -cf %s"

    # funa_env의 keepalived 설정 권한 유지(FUNA-011~014)를 검증하려고 keepalived가 비활성화하는 상태를 미리 만든다.
    - name: "[PREPARE-005] Seed an unsafe keepalived config directory (group writable, SGID) for funa_cluster hosts"
      when: "'funa_cluster' in group_names"
      block:
        - name: "[PREPARE-005-DIR] Create the directory with the unsafe mode"
          ansible.builtin.file:
            path: /opt/services/vrrp/config
            state: directory
            owner: root
            group: root
            mode: "2775"
        - name: "[PREPARE-005-FILES] Create scripts and config with group write"
          ansible.builtin.copy:
            content: "#!/bin/bash\nexit 0\n"
            dest: "/opt/services/vrrp/config/{{ item.name }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - {name: check.sh, mode: "0775"}
            - {name: notify.sh, mode: "0775"}
            - {name: keepalived.conf, mode: "0664"}
          loop_control:
            label: "{{ item.name }}"
