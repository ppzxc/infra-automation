# ==============================================================================
# Lefthook Git Hooks Configuration (infra-automation)
# ==============================================================================
# Pipeline Architecture:
#   1. pre-commit (~5s): Gitleaks secret scan + Spec Validator + Pytest
#   2. pre-push   (Integration, Fast Scenario -- see ADR-0007): common + security +
#      access_security on Rocky 9 (Rocky 8 added when roles/security or
#      roles/common changed), idempotence included. docker_engine/monitoring
#      (Slow Scenario) and Ubuntu run only via `make test-slow` / `make test-full`.
#      CentOS 6/7 and CentOS Stream 10 are not in the matrix (ADR-0005).
#      scripts/run-molecule.sh skips pushes that touch no molecule-relevant
#      path, fails fast on an unresponsive Docker daemon, and serializes runs
#      across worktrees.
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    gitleaks:
      tags: security secrets
      stage_fixed: true
      run: |
        bash scripts/ensure-gitleaks.sh
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose --redact
        elif [ -x ".bin/gitleaks" ]; then
          .bin/gitleaks protect --staged --verbose --redact
        else
          echo "[i] Gitleaks unavailable, running built-in secret scan..."
          bash scripts/pre-commit.sh
        fi

    spec-validator:
      tags: docs specification quality
      run: python3 scripts/validate-ansible-specs.py

    pytest:
      tags: test unit quality
      # 테스트마다 ansible-playbook을 실제로 실행해 직렬로는 40분 넘게 걸린다. pytest-xdist가 있으면 6개 워커로 병렬 실행한다.
      run: |
        if python3 -c "import xdist" 2>/dev/null; then
          pytest tests/ -v -n 6
        else
          echo "[i] pytest-xdist 없음 — 직렬 실행(느림). 'pip install pytest-xdist'로 설치하면 병렬 실행된다."
          pytest tests/ -v
        fi

pre-push:
  parallel: false
  commands:
    molecule:
      tags: integration test container
      run: bash scripts/run-molecule.sh fast
