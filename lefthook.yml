# ==============================================================================
# Lefthook Git Hooks Configuration (node-provisioner)
# ==============================================================================
# Pipeline Architecture:
#   1. pre-commit (Fast ~1s): Gitleaks secret scan + Spec Validator + Pytest
#   2. pre-push   (Integration): Molecule Multi-OS Docker testing (CentOS 6/7, Rocky 8/9, CentOS Stream 10, Ubuntu 22.04)
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    gitleaks:
      tags: security secrets
      stage_fixed: true
      run: |
        bash scripts/ensure-gitleaks.sh
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose --redact
        elif [ -x ".bin/gitleaks" ]; then
          .bin/gitleaks protect --staged --verbose --redact
        else
          echo "[i] Gitleaks unavailable, running built-in secret scan..."
          bash scripts/pre-commit.sh
        fi

    spec-validator:
      tags: docs specification quality
      run: python3 scripts/validate-ansible-specs.py

    pytest:
      tags: test unit quality
      run: pytest tests/ -v

pre-push:
  parallel: false
  commands:
    molecule:
      tags: integration test container
      run: bash scripts/run-molecule.sh
