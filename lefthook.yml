# ==============================================================================
# Lefthook Git Hooks Configuration (node-provisioner)
# ==============================================================================
# Pre-Commit Pipeline:
#   1. Gitleaks: Staged secret leaks detection (auto-downloads to .bin/ if missing)
#   2. Spec Validator: 3-Way Specification & Traceability verification (Docs <-> Code <-> Tests)
#   3. Pytest: Structure & Unit tests suite
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    gitleaks:
      tags: security secrets
      stage_fixed: true
      run: |
        # 1. 바이너리 없으면 다운로드 스크립트 실행 (.bin/gitleaks)
        bash scripts/ensure-gitleaks.sh
        
        # 2. PATH 또는 .bin/gitleaks 실행
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose --redact
        elif [ -x ".bin/gitleaks" ]; then
          .bin/gitleaks protect --staged --verbose --redact
        else
          echo "[i] Gitleaks unavailable, running built-in secret scan..."
          bash scripts/pre-commit.sh
        fi

    spec-validator:
      tags: docs specification quality
      run: python3 scripts/validate-ansible-specs.py

    pytest:
      tags: test unit quality
      run: pytest tests/ -v
